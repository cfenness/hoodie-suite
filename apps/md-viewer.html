<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../suite.css">
<title>Markdown Viewer — Hoodie Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F3F5; --surface:#FFFFFF; --panel:#E8EBEE; --panel-2:#DEE3E7;
    --ink:#2B3138; --ink-soft:#7A828B; --hair:#DDE2E6; --hair-2:#EAEDF0;
    --accent:#4E79A7; --accent-d:#3D6089; --accent-soft:#E5EDF5;
    --good:#2E7D57; --warn:#B8791F; --bad:#B8402B;
    --disp:"Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#14171B; --surface:#1B1F24; --panel:#20252B; --panel-2:#282E35;
    --ink:#E7EAED; --ink-soft:#9199A3; --hair:#2E343B; --hair-2:#262C33;
    --accent:#6B9BCB; --accent-d:#8FB6DC; --accent-soft:#20304A;
    --good:#4FAE7E; --warn:#D6A54A; --bad:#DB6C55;
  }}
  :root[data-theme="light"]{
    --paper:#F1F3F5; --surface:#FFFFFF; --panel:#E8EBEE; --panel-2:#DEE3E7;
    --ink:#2B3138; --ink-soft:#7A828B; --hair:#DDE2E6; --hair-2:#EAEDF0;
    --accent:#4E79A7; --accent-d:#3D6089; --accent-soft:#E5EDF5;
    --good:#2E7D57; --warn:#B8791F; --bad:#B8402B;
  }
  :root[data-theme="dark"]{
    --paper:#14171B; --surface:#1B1F24; --panel:#20252B; --panel-2:#282E35;
    --ink:#E7EAED; --ink-soft:#9199A3; --hair:#2E343B; --hair-2:#262C33;
    --accent:#6B9BCB; --accent-d:#8FB6DC; --accent-soft:#20304A;
    --good:#4FAE7E; --warn:#D6A54A; --bad:#DB6C55;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:var(--paper); color:var(--ink); font-family:var(--disp); font-size:13px; -webkit-font-smoothing:antialiased;}
  #app{display:flex; flex-direction:column; height:100vh;}

  .tb{display:flex; align-items:center; gap:12px; padding:9px 14px; background:var(--surface); border-bottom:1px solid var(--hair); flex:0 0 auto;}
  .tb.hide{display:none;}
  .brand{display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; letter-spacing:-.01em; white-space:nowrap;}
  .brand .logo{display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; background:var(--accent); color:#fff; border-radius:5px; font-size:13px;}
  .fname{color:var(--ink-soft); font-family:var(--mono); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tools{display:flex; align-items:center; gap:8px; margin-left:auto;}
  .btn{font-family:var(--disp); font-size:12.5px; font-weight:500; color:var(--ink); background:var(--surface); border:1px solid var(--hair); border-radius:5px; padding:6px 12px; cursor:pointer; transition:border-color .12s, background .12s; white-space:nowrap;}
  .btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent-d);}
  .btn:disabled{opacity:.45; cursor:default;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{background:var(--accent-d); border-color:var(--accent-d); color:#fff;}
  .sep{width:1px; height:20px; background:var(--hair);}
  .auto{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-soft); cursor:pointer; user-select:none;}
  .auto input{cursor:pointer;} .auto.dim{opacity:.4; cursor:default;}
  .live{display:none; align-items:center; gap:5px; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--good);}
  .live.on{display:inline-flex;}
  .live .dot{width:7px; height:7px; border-radius:50%; background:var(--good); animation:pulse 1.4s ease-in-out infinite;}
  .live .badge{font-size:9.5px; opacity:.75;}
  @keyframes pulse{0%,100%{opacity:.35;} 50%{opacity:1;}}

  .wrap{flex:1 1 auto; position:relative; overflow:hidden;}
  .scroll{position:absolute; inset:0; overflow:auto;}
  .page{max-width:820px; margin:0 auto; padding:38px 46px 80px;}

  /* ---- rendered markdown ---- */
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6{font-weight:600; letter-spacing:-.01em; margin:1.4em 0 .5em; line-height:1.25;}
  .md h1{font-size:1.9em; padding-bottom:.3em; border-bottom:1px solid var(--hair);}
  .md h2{font-size:1.5em; padding-bottom:.25em; border-bottom:1px solid var(--hair-2);}
  .md h3{font-size:1.2em;}
  .md h4{font-size:1.05em;}
  .md h1:first-child,.md h2:first-child,.md h3:first-child{margin-top:0;}
  .md p{margin:.85em 0; line-height:1.65;}
  .md a{color:var(--accent-d); text-decoration:underline; text-underline-offset:2px;}
  .md strong{font-weight:700;}
  .md em{font-style:italic;}
  .md del{color:var(--ink-soft);}
  .md code{font-family:var(--mono); font-size:.9em; background:var(--panel); border:1px solid var(--hair); border-radius:4px; padding:.1em .4em;}
  .md pre{background:var(--panel); border:1px solid var(--hair); border-radius:8px; padding:14px 16px; overflow-x:auto; margin:1em 0;}
  .md pre code{background:none; border:0; padding:0; font-size:.88em; line-height:1.55;}
  .md ul,.md ol{margin:.7em 0; padding-left:1.6em; line-height:1.65;}
  .md li{margin:.25em 0;}
  .md li input[type="checkbox"]{margin-right:.4em;}
  .md blockquote{margin:1em 0; padding:.2em 1.1em; border-left:3px solid var(--accent); color:var(--ink-soft); background:var(--accent-soft); border-radius:0 6px 6px 0;}
  .md blockquote p{margin:.5em 0;}
  .md hr{border:0; border-top:1px solid var(--hair); margin:2em 0;}
  .md table{border-collapse:collapse; margin:1em 0; width:100%; font-size:.95em; overflow-x:auto; display:block;}
  .md th,.md td{border:1px solid var(--hair); padding:6px 10px; text-align:left;}
  .md th{background:var(--panel); font-weight:600;}
  .md img{max-width:100%; border-radius:6px;}

  /* ---- empty / drop state ---- */
  .drop{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--paper); z-index:10;}
  .drop.hide{display:none;}
  .drop.over .dropinner{border-color:var(--accent); background:var(--accent-soft);}
  .dropinner{width:min(560px,86%); text-align:center; padding:46px 34px; border:2px dashed var(--hair); border-radius:14px; background:var(--surface); transition:border-color .15s, background .15s;}
  .bigicon{width:56px; height:56px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; background:var(--accent); color:#fff; border-radius:14px; font-size:26px;}
  .dh{font-size:17px; font-weight:600; margin-bottom:10px;}
  .dsub{font-size:13px; color:var(--ink-soft); line-height:1.55; max-width:44ch; margin:0 auto;}
  .dsub b{color:var(--ink); font-weight:600;}
  .link{font:inherit; color:var(--accent); background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:2px;}
  .err{color:var(--bad); font-size:12px; margin-top:14px; font-family:var(--mono);}
</style>
</head>
<body>
<div id="app">
  <header class="tb" id="tb">
    <div class="brand"><span class="logo">▤</span> Markdown Viewer</div>
    <div class="fname" id="fname"></div>
    <div class="tools">
      <span class="live" id="live"><span class="dot"></span> live <span class="badge" id="updatedAt"></span></span>
      <button class="btn" id="refreshBtn" disabled title="Re-read the file now">↻ Refresh</button>
      <label class="auto dim" id="autoWrap" title="Re-read every 2s and re-render in place"><input type="checkbox" id="autoChk" disabled checked> Auto</label>
      <div class="sep"></div>
      <button class="btn primary" id="openBtn">Open .md…</button>
    </div>
  </header>
  <div class="wrap">
    <div class="scroll" id="scroll">
      <div class="page"><div class="md" id="body"></div></div>
    </div>
    <div class="drop" id="drop">
      <div class="dropinner" id="dropinner">
        <div class="bigicon">▤</div>
        <div class="dh">Drop a Markdown file here, or <button class="link" id="openBtn2">open one</button></div>
        <div class="dsub">Headings, tables, code, checklists, blockquotes — rendered in place. Opened in Chrome or Edge, it holds a live handle so you can <b>watch a file update</b> as a background job (or an AI crew) rewrites it.</div>
        <div class="err" id="err"></div>
      </div>
    </div>
  </div>
</div>
<input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,text/markdown" style="display:none">
<script>
(function(){
  const $ = s => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const embed = params.get('embed') === '1';
  const ticketId = params.get('ticket');

  const tbEl=$("#tb"), fnameEl=$("#fname"), bodyEl=$("#body"), dropEl=$("#drop"), dropinner=$("#dropinner"),
        errEl=$("#err"), openBtn=$("#openBtn"), openBtn2=$("#openBtn2"), fileInput=$("#fileInput"),
        refreshBtn=$("#refreshBtn"), autoChk=$("#autoChk"), autoWrap=$("#autoWrap"), liveEl=$("#live"),
        updatedAtEl=$("#updatedAt"), scrollEl=$("#scroll");

  if (embed) tbEl.classList.add('hide');

  // ---- markdown -> HTML: hand-written, no dependency. Covers what real project docs need
  // (headings, bold/italic/strikethrough, links, images, inline+fenced code, lists incl.
  // checkboxes, blockquotes, tables, hr) — not full CommonMark (no nested lists/footnotes),
  // same tradeoff already validated as sufficient for this repo's own docs.
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function inline(s){
    s = esc(s);
    // Code spans are pulled out to placeholders BEFORE bold/italic run, so a literal `*` inside a
    // code span (e.g. `*args`) can never be mistaken for emphasis markup — the classic double-parse
    // bug in a hand-rolled markdown pass.
    const spans = [];
    s = s.replace(/`([^`]+)`/g, (m,c)=>{ spans.push(c); return '␀'+(spans.length-1)+'␀'; });
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,
      (m,alt,url,title)=>'<img alt="'+alt+'" src="'+url+'"'+(title?' title="'+title+'"':'')+'>');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,
      (m,text,url,title)=>'<a href="'+url+'"'+(title?' title="'+title+'"':'')+' target="_blank" rel="noopener">'+text+'</a>');
    s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
    s = s.replace(/(^|[^\w])_([^_\n]+)_(?!\w)/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    s = s.replace(/␀(\d+)␀/g, (m,i)=>'<code>'+spans[+i]+'</code>');
    return s;
  }

  function listItem(text, ordered){
    if (!ordered){
      const m = text.match(/^\[( |x|X)\]\s+(.*)$/);
      if (m) return '<input type="checkbox" disabled'+(m[1].toLowerCase()==='x'?' checked':'')+'> '+inline(m[2]);
    }
    return inline(text);
  }

  const BLOCK_START = /^(#{1,6}\s|```|>\s?|\s*[-*+]\s|\s*\d+\.\s|\|.*\|\s*$)/;

  function mdToHtml(src){
    const lines = (src||'').replace(/\r\n?/g,'\n').split('\n');
    const out = [];
    let i = 0;
    while (i < lines.length){
      const line = lines[i];

      const fence = line.match(/^```(\S*)\s*$/);
      if (fence){
        const lang = fence[1]; const code = []; i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])){ code.push(lines[i]); i++; }
        i++;
        out.push('<pre><code'+(lang?' class="lang-'+esc(lang)+'"':'')+'>'+esc(code.join('\n'))+'</code></pre>');
        continue;
      }
      if (!line.trim()){ i++; continue; }

      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h){ const lvl=h[1].length; out.push('<h'+lvl+'>'+inline(h[2].trim())+'</h'+lvl+'>'); i++; continue; }

      if (/^([-*_])\1{2,}\s*$/.test(line.trim())){ out.push('<hr>'); i++; continue; }

      if (/^>\s?/.test(line)){
        const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/,'')); i++; }
        out.push('<blockquote>'+mdToHtml(buf.join('\n'))+'</blockquote>');
        continue;
      }

      if (/^\|.*\|\s*$/.test(line) && i+1 < lines.length &&
          /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[i+1])){
        const split = row => row.split('|').map(c=>c.trim()).filter((c,idx,arr)=>
          !(idx===0 && c==='') && !(idx===arr.length-1 && c===''));
        const head = split(line); i += 2;
        const rows = [];
        while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])){ rows.push(split(lines[i])); i++; }
        let t = '<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
        for (const r of rows) t += '<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';
        out.push(t+'</tbody></table>');
        continue;
      }

      if (/^\s*[-*+]\s+/.test(line)){
        const items = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])){
          items.push(lines[i].replace(/^\s*[-*+]\s+/,'')); i++;
        }
        out.push('<ul>'+items.map(it=>'<li>'+listItem(it,false)+'</li>').join('')+'</ul>');
        continue;
      }

      if (/^\s*\d+\.\s+/.test(line)){
        const items = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])){
          items.push(lines[i].replace(/^\s*\d+\.\s+/,'')); i++;
        }
        out.push('<ol>'+items.map(it=>'<li>'+listItem(it,true)+'</li>').join('')+'</ol>');
        continue;
      }

      const buf = [line]; i++;
      while (i < lines.length && lines[i].trim() && !BLOCK_START.test(lines[i])){ buf.push(lines[i]); i++; }
      out.push('<p>'+inline(buf.join(' '))+'</p>');
    }
    return out.join('\n');
  }

  // ---- rendering, with scroll position preserved across a live refresh ----
  let lastText = null;
  function render(text){
    if (text === lastText) return;
    const ratio = scrollEl.scrollHeight > scrollEl.clientHeight
      ? scrollEl.scrollTop / (scrollEl.scrollHeight - scrollEl.clientHeight) : 0;
    bodyEl.innerHTML = mdToHtml(text);
    lastText = text;
    scrollEl.scrollTop = ratio * (scrollEl.scrollHeight - scrollEl.clientHeight);
    dropEl.classList.add('hide');
    updatedAtEl.textContent = 'updated ' + new Date().toLocaleTimeString();
  }

  // ---- source A: a ticket, fetched + polled from the Cockpit's API ----
  let ticketTimer = null;
  async function loadTicket(){
    try{
      const r = await fetch('/api/cockpit/tickets/'+encodeURIComponent(ticketId)+'/raw');
      if (!r.ok) throw new Error('HTTP '+r.status);
      const j = await r.json();
      fnameEl.textContent = ticketId;
      render(j.body_md || '');
      errEl.textContent = '';
    }catch(e){
      errEl.textContent = 'Could not load ticket: '+e.message;
    }
  }
  if (ticketId){
    liveEl.classList.add('on');
    dropEl.classList.add('hide');
    loadTicket();
    ticketTimer = setInterval(loadTicket, 2000);
  }

  // ---- source B: a local file, via the File System Access API where available (Chrome/Edge) ----
  const hasFSA = !!window.showOpenFilePicker;
  let fileHandle = null, autoTimer = null;

  async function loadFromHandle(silent){
    try{
      const f = await fileHandle.getFile();
      const text = await f.text();
      fnameEl.textContent = f.name;
      render(text);
      errEl.textContent = '';
    }catch(e){
      if (!silent) errEl.textContent = 'Could not read file: '+e.message;
    }
  }

  function loadFile(f){
    fnameEl.textContent = f.name;
    const reader = new FileReader();
    reader.onload = () => render(reader.result);
    reader.readAsText(f);
  }

  function setAutoState(){
    refreshBtn.disabled = !fileHandle;
    autoChk.disabled = !fileHandle;
    autoWrap.classList.toggle('dim', !fileHandle);
  }

  openBtn.addEventListener('click', async () => {
    if (hasFSA){
      try{
        const [h] = await window.showOpenFilePicker({types:[{description:'Markdown',
          accept:{'text/markdown':['.md','.markdown','.mdown','.mkd']}}]});
        fileHandle = h; setAutoState();
        await loadFromHandle(false);
        if (autoChk.checked){
          liveEl.classList.add('on');
          autoTimer = setInterval(()=>loadFromHandle(true), 2000);
        }
      }catch(e){ /* user cancelled the picker */ }
    } else {
      fileInput.click();
    }
  });
  openBtn2.addEventListener('click', () => openBtn.click());
  fileInput.addEventListener('change', e => {
    const f = e.target.files[0];
    if (f){ fileHandle = null; setAutoState(); loadFile(f); }
  });
  refreshBtn.addEventListener('click', () => fileHandle && loadFromHandle(false));
  autoChk.addEventListener('change', () => {
    if (autoTimer){ clearInterval(autoTimer); autoTimer = null; liveEl.classList.remove('on'); }
    if (autoChk.checked && fileHandle){
      liveEl.classList.add('on');
      autoTimer = setInterval(()=>loadFromHandle(true), 2000);
    }
  });

  ['dragenter','dragover'].forEach(ev => dropEl.addEventListener(ev, e => {
    e.preventDefault(); dropEl.classList.add('over');
  }));
  ['dragleave','drop'].forEach(ev => dropEl.addEventListener(ev, e => {
    e.preventDefault(); dropEl.classList.remove('over');
  }));
  dropEl.addEventListener('drop', async e => {
    const items = e.dataTransfer.items;
    if (hasFSA && items && items[0] && items[0].getAsFileSystemHandle){
      try{
        const h = await items[0].getAsFileSystemHandle();
        if (h && h.kind === 'file'){ fileHandle = h; setAutoState(); await loadFromHandle(false); return; }
      }catch(_){ /* fall through to plain File API */ }
    }
    const f = e.dataTransfer.files[0];
    if (f){ fileHandle = null; setAutoState(); loadFile(f); }
  });

  if (!hasFSA && !ticketId) autoWrap.title = 'Live auto-refresh needs Chrome or Edge (File System Access API)';
})();
</script>
</body>
</html>

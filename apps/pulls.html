<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../suite.css">
<title>Hoodie Pulls — Run & Evaluate Scrapes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf6ef; --card:#fffdf9; --ink:#241c17; --muted:#8a7c6c; --faint:#b7a994;
    --line:#e8ddcd; --line2:#f1e9db;
    --ok:#3f7d52; --ok-bg:#e7f1e6; --warn:#b06a14; --warn-bg:#f6ecd9;
    --bad:#9a2f2f; --bad-bg:#f3e0dc; --idle:#9a8e7d; --idle-bg:#efe9dd;
    --accent:#5a3d8a; --shadow:0 1px 2px rgba(60,29,26,.05),0 8px 22px rgba(60,29,26,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:980px;margin:0 auto;padding:0 22px;}
  header{background:linear-gradient(115deg,#3a2c54 0%,#4a3568 50%,#5a3d8a 100%);color:#f4eefb;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#caa8f0,#9a6ad0,#6e3fa8,#9a6ad0,#caa8f0)}
  .hd{display:flex;align-items:baseline;gap:14px;padding:24px 0 22px;flex-wrap:wrap}
  .hd h1{font-family:"Fraunces",serif;font-weight:700;font-size:27px;margin:0;letter-spacing:-.01em}
  .hd .sub{font-size:13.5px;color:#d8cdec;max-width:50ch}
  .hd .spacer{flex:1}
  .agent{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#e7ddf6;}
  .agent .dot{width:8px;height:8px;border-radius:50%;background:var(--idle);box-shadow:0 0 0 3px rgba(255,255,255,.08)}
  .agent.live .dot{background:#7fe0a0}
  .agent.live{color:#dff7e6}

  .banner{margin:16px 0 0;padding:11px 14px;border:1px solid var(--line);background:var(--card);border-left:3px solid var(--warn);border-radius:4px;font-size:13.5px;color:var(--ink)}
  .banner b{color:var(--warn)}
  .banner code{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--line2);padding:1px 5px;border-radius:3px}

  .sources{margin:20px 0 30px;display:flex;flex-direction:column;gap:12px}
  .src{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
  .src-top{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:15px 16px;cursor:pointer}
  .src-id{display:flex;align-items:center;gap:11px;min-width:0}
  .badge{width:34px;height:34px;flex:0 0 auto;border-radius:7px;background:#efe6fb;color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12px}
  .src-name{font-family:"Fraunces",serif;font-weight:600;font-size:17px;line-height:1.1}
  .src-kind{font-size:12px;color:var(--muted);margin-top:1px}
  .pill{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .pill.success{color:var(--ok);background:var(--ok-bg)} .pill.degraded,.pill.partial{color:var(--warn);background:var(--warn-bg)}
  .pill.failed{color:var(--bad);background:var(--bad-bg)} .pill.never,.pill.idle{color:var(--idle);background:var(--idle-bg)}
  .run-btn{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 15px;border-radius:6px;cursor:pointer;transition:opacity .12s;display:inline-flex;align-items:center;gap:7px}
  .run-btn:hover{opacity:.88} .run-btn:disabled{opacity:.4;cursor:not-allowed;background:var(--idle);border-color:var(--idle)}
  .run-btn .spin{width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
  .run-btn.running .spin{display:inline-block} .run-btn.running .lbl{opacity:.8}
  @keyframes spin{to{transform:rotate(360deg)}}

  .eval{border-top:1px solid var(--line2);padding:0 16px;max-height:0;overflow:hidden;transition:max-height .25s ease}
  .src.open .eval{max-height:1300px;padding:14px 16px;overflow:auto}
  /* movement stats + record preview */
  .stats-row{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 2px}
  .stat{font-family:"IBM Plex Mono",monospace;font-size:11px;background:#efe6fb;color:var(--accent);border-radius:999px;padding:4px 10px}
  .stat b{font-weight:700} .stat.base{background:var(--idle-bg);color:var(--idle)}
  .rec-cap{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:14px 0 5px}
  .rec-wrap{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:6px}
  table.rec{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
  table.rec th{position:sticky;top:0;background:var(--line2);text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:6px 9px;border-bottom:1px solid var(--line)}
  table.rec td{padding:5px 9px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums;max-width:240px;overflow:hidden;text-overflow:ellipsis}
  table.rec tr:hover td{background:#faf6ef}
  .rec-load{font-size:12px;color:var(--muted);padding:8px 0}
  /* live run console */
  .console-head{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.04em;margin:2px 0 8px;color:var(--accent)}
  .console-head.err{color:#c0392b}
  .console-head .ch-sep{color:var(--muted);font-weight:400}
  .console-head b{font-weight:700}
  .console-head .live-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:cpulse 1.3s infinite}
  @keyframes cpulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .console{background:#15101f;border:1px solid #2c2440;border-radius:8px;padding:10px 12px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.6;color:#cdbce6;max-height:248px;overflow:auto}
  .console .cl{white-space:pre-wrap;word-break:break-word}
  .console .cl-time{color:#6f5d86;margin-right:9px}
  .console .cl-warn{color:#e7b75f}
  .console .cl-err{color:#ef8a7a}
  .rec-dl{float:right;display:inline-flex;gap:6px}
  .rec-dl button{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:#efe6fb;border:1px solid #e0d3f5;border-radius:5px;padding:3px 8px;cursor:pointer}
  .rec-dl button:hover{background:#e6d8fb}
  .eval-meta{display:flex;flex-wrap:wrap;gap:18px;font-size:13px;color:var(--ink);margin-bottom:12px}
  .eval-meta .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);display:block}
  .eval-meta b{font-size:15px}
  table.ex{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
  table.ex th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line)}
  table.ex td{padding:6px 8px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
  table.ex td.delta.pos{color:var(--ok)} table.ex td.delta.neg{color:var(--bad)}
  .warns{margin:10px 0 2px;display:flex;flex-direction:column;gap:6px}
  .warn-row{font-size:13px;padding:8px 11px;border-radius:5px;border-left:3px solid var(--warn);background:var(--warn-bg);color:#6e4710}
  .heal-row{border-left-color:var(--ok);background:var(--ok-bg);color:#2c5638}
  .eval-empty{font-size:13px;color:var(--muted);padding:4px 0 8px}
  .chev{color:var(--faint);font-size:13px;transition:transform .15s} .src.open .chev{transform:rotate(90deg)}
  .foot{font-size:12px;color:var(--muted);text-align:center;padding:8px 0 40px}
  @media(max-width:640px){.src-top{grid-template-columns:1fr;gap:10px}.src-top .pill,.src-top .run-btn{justify-self:start}}
  /* running feedback */
  #runbanner{position:sticky;top:0;z-index:60;background:linear-gradient(90deg,#3a2c54,#5a3d8a);color:#f4eefb;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.03em;padding:10px 22px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;box-shadow:0 2px 10px rgba(60,29,26,.18)}
  #runbanner .rb-dot{width:9px;height:9px;border-radius:50%;background:#ffd98a;display:inline-block;margin-right:8px;animation:rbpulse 1s infinite;vertical-align:middle}
  @keyframes rbpulse{0%,100%{opacity:.3}50%{opacity:1}}
  .src.running{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
  .src.running .src-top{background:#f6f0ff}
  .run-btn.running{background:var(--accent);border-color:var(--accent)}
  #toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
  .toast{background:var(--ink);color:#fff;font-size:13px;line-height:1.35;padding:11px 14px;border-radius:8px;box-shadow:0 8px 24px rgba(60,29,26,.25);max-width:380px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:none}
  .toast.ok{border-left:3px solid var(--ok)} .toast.warn{border-left:3px solid var(--warn)} .toast.err{border-left:3px solid var(--bad)}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <div>
      <h1>Hoodie Pulls</h1>
      <div class="sub">Each scrape, in one place — run it, then read the engine's own verdict on the result.</div>
    </div>
    <span class="spacer"></span>
    <button id="export-btn" title="Export this view as PDF" style="display:none;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#e7ddf6;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:7px 12px;cursor:pointer;margin-right:14px;">↓ Export PDF</button>
    <span class="agent" id="agent" title="Unifyd engine /api status"><span class="dot"></span><span id="agentTxt">checking…</span></span>
  </div>
</header>

<div class="wrap">
  <div class="banner" id="offline" style="display:none">
    <b>Engine offline.</b> Pulls can't run from here. Start it locally with <code>./dev.sh</code>
    (or deploy the backend), then reload. The source list and last-known runs still show below.
  </div>
  <div class="sources" id="sources"></div>
  <div class="foot" id="foot"></div>
</div>

<!-- shared export utility (same one My Dashboard uses) -->
<script src="../suite-export.js"></script>
<!-- ===== Hoodie Spine integration ===== -->
<script src="../spine/spine.js"></script>
<script>
(function(){
  "use strict";
  // The scrapes the engine knows how to run (connId -> label). Mirrors server.py FL_CONN + ttb-cola.
  var SOURCES = [
    {id:"fl-items",   mark:"FI", name:"Florida — Items",   kind:"Florida DBPR/ABT · item master (live CSV)"},
    {id:"fl-outlets", mark:"FO", name:"Florida — Outlets", kind:"Florida DBPR/ABT · outlet master (live CSV)"},
    {id:"ttb-cola",   mark:"TC", name:"TTB — COLA Labels", kind:"TTB public registry · label certificates (scraper)"},
    {id:"abc-fws",    mark:"AB", name:"ABC FWS — Inventory", kind:"abcfws.com · STORE-LEVEL in/out across 133 stores + price (BigCommerce options · polite 10s)"},
    {id:"specs",      mark:"SP", name:"Spec's — Inventory", kind:"specsonline.com · STORE-LEVEL price + in/out across 100+ stores (embedded variants · direct, no Bright Data)"},
    {id:"binnys",     mark:"BY", name:"Binny's — Inventory", kind:"binnys.com · STORE-LEVEL price + unit inventory · directional units sold (Algolia feed)"},
    {id:"shopify-dtc",mark:"HP", name:"Hemp + DTC — Shopify", kind:"DTC brands on Shopify (BRĒZ, Cann, Cornbread…) · price + availability via public /products.json"},
    {id:"instacart",  mark:"IC", name:"Instacart — Store-level", kind:"per-store product + price across the FULL store (all departments) via Bright Data managed dataset · needs API key + dataset id (see docs)"},
  ];
  var STATE = { live:false, runs:[], busy:{}, open:{}, datasets:{}, jobs:{} };

  var fmt = function(n){ return (n==null?"—":Number(n).toLocaleString()); };
  function timeAgo(ms){
    if(!ms) return "never run";
    var d=(window.__now||Date.now()) - ms; if(d<0) d=0;
    var m=Math.floor(d/60000), h=Math.floor(m/60), day=Math.floor(h/24);
    if(day>0) return day+"d ago"; if(h>0) return h+"h ago"; if(m>0) return m+"m ago"; return "just now";
  }
  function whenLabel(ms){ try{ window.__now=Date.now(); }catch(e){} return timeAgo(ms); }
  function latestRun(connId){
    var rs = STATE.runs.filter(function(r){ return r.connId===connId; });
    rs.sort(function(a,b){ return (b.startedAt||0)-(a.startedAt||0); });
    return rs[0] || null;
  }
  function statusOf(run){ if(!run) return "never"; return run.degraded ? "degraded" : (run.status||"never"); }

  function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

  function render(){
    document.getElementById("offline").style.display = STATE.live ? "none" : "";
    var root = document.getElementById("sources");
    root.innerHTML = "";
    SOURCES.forEach(function(s){
      var run = latestRun(s.id), st = statusOf(run), busy = !!STATE.busy[s.id], open = !!STATE.open[s.id];
      var el = document.createElement("div");
      el.className = "src" + (open?" open":"") + (busy?" running":"");
      var subline = busy ? "running…" : (run?whenLabel(run.finishedAt||run.startedAt):"never run");
      var btnTitle = busy ? "Pull in progress…" : (STATE.live ? "Run this scrape now" : "Engine offline — start ./dev.sh, then reload");
      el.innerHTML =
        '<div class="src-top" data-toggle="'+s.id+'">' +
          '<div class="src-id"><span class="badge">'+s.mark+'</span><div><div class="src-name">'+esc(s.name)+
            ' <span class="chev">▸</span></div><div class="src-kind">'+esc(s.kind)+
            ' · '+ subline +'</div></div></div>' +
          '<span class="pill '+(busy?"idle":st)+'">'+ (busy?"running":(st==="never"?"not run":st)) +'</span>' +
          '<button class="run-btn'+(busy?" running":"")+'" data-run="'+s.id+'" title="'+btnTitle+'"'+( (!STATE.live||busy) ? " disabled":"")+'>' +
            '<span class="spin"></span><span class="lbl">'+(busy?"Running…":"Run")+'</span></button>' +
        '</div>' +
        '<div class="eval">'+ ((busy && STATE.jobs[s.id]) ? consoleHtml(s.id, STATE.jobs[s.id]) : evalHtml(run)) +'</div>';
      root.appendChild(el);
    });
    document.querySelectorAll(".console").forEach(function(c){ c.scrollTop = c.scrollHeight; });
    var n = STATE.runs.length;
    document.getElementById("foot").textContent = STATE.live
      ? (n + " run"+(n===1?"":"s")+" on record · engine live")
      : "engine offline — showing the source catalog";
  }

  function evalHtml(run){
    if(!run) return '<div class="eval-empty">No runs yet. Hit <b>Run</b> to execute this scrape; the engine’s verdict appears here.</div>';
    var meta =
      '<div class="eval-meta">' +
        '<div><span class="k">Status</span><b>'+esc(statusOf(run))+'</b></div>' +
        '<div><span class="k">Rows</span><b>'+fmt(run.total)+'</b></div>' +
        '<div><span class="k">Duration</span><b>'+ (run.durationMs!=null? (Math.max(0,run.durationMs)/1000).toFixed(1)+"s":"—") +'</b></div>' +
        '<div><span class="k">Trigger</span><b>'+esc(run.trigger||"—")+'</b></div>' +
        '<div><span class="k">Run ID</span><b>'+esc(run.id||"—")+'</b></div>' +
      '</div>';
    var ex = (run.extracts||[]);
    var tbl = ex.length ? ('<table class="ex"><thead><tr><th>Extract</th><th>Rows</th><th>Δ</th><th>Status</th></tr></thead><tbody>' +
      ex.map(function(e){
        var d=e.delta||0, dc = d>0?"pos":(d<0?"neg":"");
        return '<tr><td>'+esc(e.id)+'</td><td>'+fmt(e.rows)+'</td><td class="delta '+dc+'">'+(d>0?"+":"")+fmt(d)+'</td><td>'+esc(e.status||"—")+'</td></tr>';
      }).join("") + '</tbody></table>') : "";
    var warns = (run.warnings||[]).map(function(w){ return '<div class="warn-row">⚠ '+esc(w)+'</div>'; }).join("");
    var healed = (run.healed||[]).length ? '<div class="warn-row heal-row">✓ self-healed column(s): '+esc((run.healed||[]).join(", "))+'</div>' : "";
    var block = (warns||healed) ? ('<div class="warns">'+healed+warns+'</div>') :
      (statusOf(run)==="success" ? '<div class="eval-empty">✓ Clean run — no drift, no warnings.</div>' : "");
    return meta + tbl + statChips(run.movement) + block + recordsHtml(run.extracts);
  }

  // movement stats the pull already computed (units moved, price moves, OOS, new/dropped, …)
  function statChips(mv){
    if(!mv) return "";
    var n=function(x){ return Array.isArray(x)?x.length : (typeof x==="number"?x:null); };
    var order=[["changed","Δ moved"],["units_moved","units moved"],["restocked","restocked"],
      ["price_moves","price moves"],["went_oos","went OOS"],["new","new"],["dropped","dropped"],
      ["cells","cells"],["brands","brands"]];
    var chips=order.map(function(p){ var v=n(mv[p[0]]); return v==null?"":'<span class="stat"><b>'+fmt(v)+'</b> '+p[1]+'</span>'; }).filter(Boolean).join("");
    var base = (mv.had_prev===false) ? '<span class="stat base">baseline · no prior run to diff</span>' : "";
    return (chips||base) ? '<div class="stats-row">'+base+chips+'</div>' : "";
  }

  // the actual records pulled (sampled), from /api/datasets keyed by extract id
  function recordsHtml(extracts){
    return (extracts||[]).map(function(e){
      var ds=STATE.datasets[e.id];
      if(ds===undefined) return "";                                  // not requested yet
      if(ds===null) return '<div class="rec-load">loading '+esc(e.id)+' records…</div>';
      var hdr=ds.header||[], rows=ds.rows||[];
      if(!hdr.length || !rows.length) return "";
      var cols=hdr.slice(0,8), more=hdr.length-cols.length, show=rows.slice(0,12);
      var thead='<tr>'+cols.map(function(h){return '<th>'+esc(h)+'</th>';}).join("")+(more>0?'<th>+'+more+'</th>':"")+'</tr>';
      var body=show.map(function(r){ return '<tr>'+cols.map(function(h,ci){return '<td>'+esc(r[ci])+'</td>';}).join("")+(more>0?'<td>…</td>':"")+'</tr>'; }).join("");
      return '<div class="rec-cap">'+esc(e.id)+' · showing '+show.length+' of '+fmt(ds.total||rows.length)+' records'+
               '<span class="rec-dl"><button data-dl="csv" data-ds="'+esc(e.id)+'" title="download all '+fmt(ds.total||rows.length)+' rows as CSV">⬇ CSV</button>'+
               '<button data-dl="json" data-ds="'+esc(e.id)+'" title="download all '+fmt(ds.total||rows.length)+' rows as JSON">⬇ JSON</button></span></div>'+
             '<div class="rec-wrap"><table class="rec"><thead>'+thead+'</thead><tbody>'+body+'</tbody></table></div>';
    }).join("");
  }

  // fetch the sampled records for a source's extracts (scoped query keeps it light)
  function loadDatasets(connId, force){
    var run=latestRun(connId); if(!run || !STATE.live) return;
    (run.extracts||[]).forEach(function(e){
      if(!e.id) return;
      if(force) delete STATE.datasets[e.id];
      if(STATE.datasets[e.id]!==undefined) return;                   // cached / loading
      STATE.datasets[e.id]=null;                                     // mark loading
      fetch("/api/datasets?dataset="+encodeURIComponent(e.id),{cache:"no-store"})
        .then(function(r){ return r.ok?r.json():{}; })
        .then(function(d){ STATE.datasets[e.id]=(d&&d[e.id])?d[e.id]:{}; render(); })
        .catch(function(){ STATE.datasets[e.id]={}; render(); });
    });
  }

  // ---- data ----
  function refresh(){
    return fetch("/api/health",{cache:"no-store"}).then(function(r){ return r.ok?r.json():Promise.reject(); })
      .then(function(h){
        STATE.live = !!(h&&h.ok);
        var ag=document.getElementById("agent");
        ag.className = "agent"+(STATE.live?" live":"");
        document.getElementById("agentTxt").textContent = STATE.live
          ? ("engine live · "+(h.state||"")) : "engine offline";
        return fetch("/api/runs",{cache:"no-store"}).then(function(r){ return r.ok?r.json():[]; });
      })
      .then(function(runs){ if(Array.isArray(runs)) STATE.runs = runs; render(); })
      .catch(function(){ STATE.live=false; document.getElementById("agent").className="agent";
        document.getElementById("agentTxt").textContent="engine offline"; render(); });
  }

  // export the loaded records (the agent's sampled rows) as CSV or JSON
  function csvCell(v){ v=v==null?"":String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
  function exportDataset(id, fmt){
    if(!id) return;
    fmt = (fmt==="json") ? "json" : "csv";
    // engine live → download the COMPLETE pull from the agent (all rows, not the UI sample)
    if(STATE.live){
      var ax=document.createElement("a");
      ax.href="/api/datasets/download?dataset="+encodeURIComponent(id)+"&format="+fmt;
      ax.download=""; document.body.appendChild(ax); ax.click();
      setTimeout(function(){ try{ ax.remove(); }catch(_){} }, 150);
      return;
    }
    // offline → export whatever sample is loaded client-side
    var ds=STATE.datasets[id]; if(!ds||!ds.header) return;
    var content, ext, mime;
    if(fmt==="json"){
      content=JSON.stringify((ds.rows||[]).map(function(r){ var o={}; ds.header.forEach(function(h,i){o[h]=r[i];}); return o; }), null, 2);
      ext="json"; mime="application/json";
    } else {
      content=[ds.header.map(csvCell).join(",")].concat((ds.rows||[]).map(function(r){
        return ds.header.map(function(h,i){return csvCell(r[i]);}).join(","); })).join("\n");
      ext="csv"; mime="text/csv";
    }
    var url=URL.createObjectURL(new Blob([content],{type:mime+";charset=utf-8"})), a=document.createElement("a");
    a.href=url; a.download=id+"."+ext; document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ URL.revokeObjectURL(url); a.remove(); }catch(_){} }, 150);
  }

  function labelOf(connId){ var s=SOURCES.filter(function(x){return x.id===connId;})[0]; return s?s.name:connId; }
  function mmss(sec){ var m=Math.floor(sec/60); return m+":"+("0"+(sec%60)).slice(-2); }

  function toast(msg, kind){
    var box=document.getElementById("toasts");
    if(!box){ box=document.createElement("div"); box.id="toasts"; document.body.appendChild(box); }
    var t=document.createElement("div"); t.className="toast "+(kind||""); t.textContent=msg; box.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add("show"); });
    setTimeout(function(){ t.classList.remove("show"); setTimeout(function(){ t.remove(); }, 250); }, 7000);
  }

  function runningBanner(){
    var ids=Object.keys(STATE.busy);
    var el=document.getElementById("runbanner");
    if(!ids.length){ if(el) el.remove(); return; }
    if(!el){ el=document.createElement("div"); el.id="runbanner"; document.body.insertBefore(el, document.body.firstChild); }
    el.innerHTML = ids.map(function(id){
      var sec=Math.max(0, Math.floor((Date.now()-STATE.busy[id])/1000));
      return '<span><span class="rb-dot"></span>Running <b>'+esc(labelOf(id))+'</b> · '+mmss(sec)+'</span>';
    }).join("");
  }


  // ---- the on-theme live console (real run progress, streamed from the agent) ----
  function hms(ms){ var d=new Date(ms); function p(x){return ("0"+x).slice(-2);} return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds()); }
  // best-effort live metrics parsed from the REAL log lines (never invented)
  function consoleStats(job){
    var elapsed=Math.floor((Date.now()-job.startedAt)/1000), eta=null, count=null;
    (job.log||[]).forEach(function(L){
      var m=L.msg||"";
      var e=m.match(/~\s*(\d+)\s*s\b/);            if(e) eta=Math.max(0, parseInt(e[1],10)-elapsed);
      var pg=m.match(/page\s+(\d+)\s*\/\s*(\d+)/i); if(pg){ var fr=parseInt(pg[1],10)/Math.max(1,parseInt(pg[2],10)); if(fr>0) eta=Math.max(0, Math.round(elapsed/fr-elapsed)); }
      var c=m.match(/([\d,]+)\s+(records|products|cells|rows)\b/i); if(c) count=parseInt(c[1].replace(/,/g,""),10);
    });
    if(job.run && job.run.total!=null) count=job.run.total;
    return {elapsed:elapsed, eta:eta, count:count};
  }
  function consoleHtml(connId, job){
    var s=consoleStats(job), running=(job.status==="running"), err=(job.status==="error");
    var head='<div class="console-head '+(err?"err":(running?"live":"ok"))+'">'+
      (running?'<span class="live-dot"></span>LIVE':(err?'✗ ERROR':'✓ DONE'))+
      '<span class="ch-sep">·</span><span>'+mmss(s.elapsed)+'</span>'+
      (s.count!=null?'<span class="ch-sep">·</span><span><b>'+fmt(s.count)+'</b> records</span>':'')+
      (running&&s.eta!=null?'<span class="ch-sep">·</span><span>ETA ~'+mmss(s.eta)+'</span>':'')+
      '</div>';
    var L=(job.log||[]);
    var body=L.length ? L.map(function(x){
      var cls=x.lvl==="WARNING"?"cl-warn":((x.lvl==="ERROR"||x.lvl==="CRITICAL")?"cl-err":"");
      return '<div class="cl"><span class="cl-time">'+hms(x.t)+'</span><span class="'+cls+'">'+esc(x.msg)+'</span></div>';
    }).join("") : '<div class="cl"><span class="cl-time">connecting to the agent…</span></div>';
    if(job.error) body+='<div class="cl"><span class="cl-err">'+esc(job.error)+'</span></div>';
    return head+'<div class="console">'+body+'</div>';
  }
  // patch just the running source's console (cheap — avoids a full re-render each tick)
  function updateConsole(connId){
    var job=STATE.jobs[connId]; if(!job) return;
    var top=document.querySelector('.src-top[data-toggle="'+connId+'"]');
    var ev=top && top.parentNode.querySelector(".eval");
    if(ev){ ev.innerHTML=consoleHtml(connId, job); var c=ev.querySelector(".console"); if(c) c.scrollTop=c.scrollHeight; }
  }

  function finalize(connId, rec, errMsg){
    delete STATE.busy[connId]; delete STATE.jobs[connId];
    if(rec && rec.id){
      if(!STATE.runs.some(function(r){return r.id===rec.id;})) STATE.runs.unshift(rec);
      var st=rec.degraded?"degraded":(rec.status||"done");
      var n=rec.total!=null?(" · "+Number(rec.total).toLocaleString()+" rows"):"";
      var d=rec.extracts&&rec.extracts[0]&&rec.extracts[0].delta!=null?(" · Δ"+rec.extracts[0].delta):"";
      toast((st==="failed"?"✗ ":st==="success"?"✓ ":"⚠ ")+labelOf(connId)+" — "+st+n+d,
            st==="failed"?"err":st==="success"?"ok":"warn");
    } else {
      toast("✗ "+labelOf(connId)+" — "+(errMsg||"run failed (check the engine logs)"), "err");
    }
    render(); runningBanner(); refresh(); loadDatasets(connId, true);
  }

  function pollProgress(connId, jobId){
    var job=STATE.jobs[connId];
    if(!job || job.jobId!==jobId) return;                              // superseded / cleared
    if(Date.now()-job.startedAt > 30*60*1000){ finalize(connId, job.run, "timed out after 30 min"); return; }
    fetch("/api/run/progress?id="+encodeURIComponent(jobId),{cache:"no-store"})
      .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status)); })
      .then(function(p){
        var j=STATE.jobs[connId]; if(!j || j.jobId!==jobId) return;
        j.log=p.log||j.log; j.status=p.status; j.run=p.run; j.error=p.error;
        if(p.status==="running"){ updateConsole(connId); setTimeout(function(){ pollProgress(connId, jobId); }, 1000); }
        else { updateConsole(connId); setTimeout(function(){ finalize(connId, p.run, p.error); }, 600); }  // let the final line land
      })
      .catch(function(){ if(STATE.jobs[connId] && STATE.jobs[connId].jobId===jobId) setTimeout(function(){ pollProgress(connId, jobId); }, 2000); });
  }

  function run(connId){
    if(STATE.busy[connId]!==undefined || !STATE.live) return;
    STATE.busy[connId]=Date.now(); STATE.open[connId]=true;
    STATE.jobs[connId]={ jobId:null, startedAt:Date.now(), log:[], status:"running", run:null, error:null };
    render(); runningBanner();
    fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({connId:connId, trigger:"manual", stream:true})})
      .then(function(r){ return (r.ok||r.status===202) ? r.json() : Promise.reject(new Error("HTTP "+r.status)); })
      .then(function(p){
        if(p && p.jobId){                                  // async live console (current agent)
          if(STATE.jobs[connId]) STATE.jobs[connId].jobId=p.jobId;
          updateConsole(connId); pollProgress(connId, p.jobId);
        } else {                                           // older agent answered synchronously
          finalize(connId, (p && p.id) ? p : null, p && p.error);
        }
      })
      .catch(function(e){ finalize(connId, null, e.message); });
  }

  document.getElementById("sources").addEventListener("click", function(e){
    var dl=e.target.closest("[data-dl]"); if(dl){ e.stopPropagation(); exportDataset(dl.getAttribute("data-ds"), dl.getAttribute("data-dl")); return; }
    var rb=e.target.closest("[data-run]"); if(rb){ e.stopPropagation(); run(rb.getAttribute("data-run")); return; }
    var tg=e.target.closest("[data-toggle]"); if(tg){ var id=tg.getAttribute("data-toggle"); var willOpen=!STATE.open[id]; STATE.open[id]=willOpen; if(willOpen) loadDatasets(id); render(); }
  });

  // Export the current view to PDF via the shared suite utility (same one My Dashboard uses).
  (function(){
    var btn=document.getElementById("export-btn"); if(!btn) return;
    btn.addEventListener("click", function(){
      if(!window.HoodieExport){ return; }
      var lbl=btn.textContent; btn.disabled=true; btn.textContent="Exporting…";
      var done=function(){ btn.disabled=false; btn.textContent=lbl; };
      HoodieExport.toPDF(document.getElementById("sources"), {
        filename:"hoodie-pulls-"+new Date().toISOString().slice(0,10),
        ondone:done,
        onerror:function(){ done(); alert("Export needs internet to load the export library — check your connection and retry."); }
      });
    });
  })();

  render();
  refresh();
  setInterval(function(){ if(!Object.keys(STATE.busy).length) refresh(); }, 15000);
  setInterval(runningBanner, 1000);   // live elapsed timer on the running banner

  // spine membership (context not used to filter, but keeps the app on the bus)
  if(typeof HoodieSpine!=="undefined"){
    try{ HoodieSpine.connect({name:"Hoodie Pulls", onContext:function(){}}); }catch(e){}
  }
})();
</script>

<script src="../suite-header.js" data-id="pulls" data-mark="PL" data-name="Hoodie Pulls" data-status="beta"></script>

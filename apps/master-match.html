<meta charset="utf-8">
<title>Hoodie MDM · Master — Matching Workbench</title>
<script>if(new URLSearchParams(location.search).has("embed"))document.documentElement.setAttribute("data-embed","1");</script>
<style>
:root[data-embed] .top{display:none}
:root{
  --paper:#EEF1F4; --panel:#FFFFFF; --panel-2:#F6F8FA; --inset:#F1F4F7;
  --ink:#22282E; --ink-2:#3C444C; --muted:#727C86; --faint:#9AA3AC; --line:#E1E6EB; --line-2:#EDF0F3;
  --accent:#4E79A7; --accent-soft:#E9F0F7; --accent-line:#CBDCEC;
  --auto:#3E8E6B; --auto-soft:#E6F2EC; --claude:#4E79A7; --claude-soft:#E9F0F7;
  --analyst:#9A7100; --analyst-soft:#F6EEDD; --senior:#2E8B8B; --senior-soft:#E1F0EF;
  --steward:#6B5AA6; --steward-soft:#ECEAF6; --conflict:#BE5540; --conflict-soft:#F6E7E2;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#14171B; --panel:#1D2126; --panel-2:#23282F; --inset:#191D22;
  --ink:#E7EBEF; --ink-2:#C4CBD2; --muted:#8A939C; --faint:#6B747D; --line:#2B313A; --line-2:#242A31;
  --accent:#6E9AC8; --accent-soft:#213042; --accent-line:#33465C;
  --auto:#5FB088; --auto-soft:#1B2C25; --claude:#6E9AC8; --claude-soft:#213042;
  --analyst:#C9A24A; --analyst-soft:#2E2718; --senior:#4FB0AC; --senior-soft:#123130;
  --steward:#9B8AD0; --steward-soft:#262038; --conflict:#D9745C; --conflict-soft:#31211D;
}}
:root[data-theme="dark"]{
  --paper:#14171B; --panel:#1D2126; --panel-2:#23282F; --inset:#191D22;
  --ink:#E7EBEF; --ink-2:#C4CBD2; --muted:#8A939C; --faint:#6B747D; --line:#2B313A; --line-2:#242A31;
  --accent:#6E9AC8; --accent-soft:#213042; --accent-line:#33465C;
  --auto:#5FB088; --auto-soft:#1B2C25; --claude:#6E9AC8; --claude-soft:#213042;
  --analyst:#C9A24A; --analyst-soft:#2E2718; --senior:#4FB0AC; --senior-soft:#123130;
  --steward:#9B8AD0; --steward-soft:#262038; --conflict:#D9745C; --conflict-soft:#31211D;
}
:root[data-theme="light"]{
  --paper:#EEF1F4; --panel:#FFFFFF; --panel-2:#F6F8FA; --inset:#F1F4F7;
  --ink:#22282E; --ink-2:#3C444C; --muted:#727C86; --faint:#9AA3AC; --line:#E1E6EB; --line-2:#EDF0F3;
  --accent:#4E79A7; --accent-soft:#E9F0F7; --accent-line:#CBDCEC;
  --auto:#3E8E6B; --auto-soft:#E6F2EC; --claude:#4E79A7; --claude-soft:#E9F0F7;
  --analyst:#9A7100; --analyst-soft:#F6EEDD; --senior:#2E8B8B; --senior-soft:#E1F0EF;
  --steward:#6B5AA6; --steward-soft:#ECEAF6; --conflict:#BE5540; --conflict-soft:#F6E7E2;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}

.top{flex:none;display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.crumb .logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#3a5f86);display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px}
.crumb b{color:var(--ink);font-weight:700} .crumb .sep{color:var(--faint)}
.top .grow{flex:1}
.themebtn{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600}
.themebtn:hover{color:var(--ink);border-color:var(--accent-line)}

/* app shell: frozen header (title + funnel), then two independently-scrolling columns */
.shell{flex:1;min-height:0;width:100%;max-width:1520px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;overflow:hidden}
.hd{flex:none;display:flex;align-items:baseline;gap:12px;padding:14px 2px 9px;flex-wrap:wrap}
.hd h1{font-size:18px}
.hd .sub{color:var(--muted);font-size:12.5px}
.hd .run{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:12px}
.hd .run b{color:var(--ink);font-weight:650}
.role{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--analyst-soft);background:var(--analyst-soft);color:var(--analyst);border-radius:20px;padding:3px 10px;font-size:11.5px;font-weight:700}

/* funnel — ONE compact line, frozen (part of the non-scrolling header) */
.funnel{flex:none;display:flex;gap:7px;overflow-x:auto;padding:0 0 13px;scrollbar-width:thin}
.stage{flex:1 0 128px;min-width:128px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px 7px;text-align:left;transition:.12s;overflow:hidden}
.stage:hover{border-color:var(--accent-line)}
.stage.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stage .lab{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.stage .n{font-size:18px;font-weight:750;letter-spacing:-.02em;margin-top:2px}
.stage .pct{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .bar{height:3px;border-radius:3px;margin-top:6px;background:var(--line-2);overflow:hidden}
.stage .bar i{display:block;height:100%;border-radius:3px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.auto{background:var(--auto)} .dot.claude{background:var(--claude)} .dot.analyst{background:var(--analyst)}
.dot.senior{background:var(--senior)} .dot.steward{background:var(--steward)} .dot.conflict{background:var(--conflict)}
.dot.cand{background:var(--faint)} .dot.confirmed{background:var(--accent)}
.stage.s-auto .bar i{background:var(--auto)} .stage.s-claude .bar i{background:var(--claude)}
.stage.s-analyst .bar i{background:var(--analyst)} .stage.s-senior .bar i{background:var(--senior)}
.stage.s-steward .bar i{background:var(--steward)} .stage.s-all .bar i{background:var(--faint)} .stage.s-confirmed .bar i{background:var(--accent)}

.work{flex:1;min-height:0;display:grid;grid-template-columns:344px 1fr;gap:16px;padding-bottom:14px}

/* queue — independent scroll */
.queue{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.qhead{flex:none;padding:13px 15px 11px;border-bottom:1px solid var(--line)}
.qhead .t{display:flex;align-items:center;justify-content:space-between}
.qhead h3{font-size:14px}
.qhead .cnt{font-size:12px;color:var(--muted)} .qhead .cnt b{color:var(--ink);font-weight:700}
.search{margin-top:10px;width:100%;border:1px solid var(--line);background:var(--inset);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--ink)}
.search::placeholder{color:var(--faint)} .search:focus{outline:none;border-color:var(--accent)}
.tabs{flex:none;display:flex;gap:5px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:650}
.tab:hover{color:var(--ink)} .tab.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.qlist{flex:1;min-height:0;overflow-y:auto}
.qempty{padding:26px 16px;text-align:center;color:var(--faint);font-size:13px}
.qitem{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-2);border-left:3px solid transparent;padding:12px 15px 12px 13px;display:block;transition:.1s}
.qitem:hover{background:var(--panel-2)}
.qitem.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.qitem .r1{display:flex;align-items:center;gap:8px}
.qitem .nm{font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .r2{display:flex;align-items:center;gap:8px;margin-top:5px;color:var(--muted);font-size:11.5px}
.grain{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:5px;background:var(--inset);color:var(--muted);flex:none}
.grain.sku{background:var(--accent-soft);color:var(--accent)} .grain.item{background:var(--auto-soft);color:var(--auto)}
.grain.product{background:var(--analyst-soft);color:var(--analyst)} .grain.outlet{background:var(--steward-soft);color:var(--steward)}
.pill{font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;flex:none}
.pill.auto{background:var(--auto-soft);color:var(--auto)} .pill.claude{background:var(--claude-soft);color:var(--claude)}
.pill.analyst{background:var(--analyst-soft);color:var(--analyst)} .pill.senior{background:var(--senior-soft);color:var(--senior)}
.pill.steward{background:var(--steward-soft);color:var(--steward)} .pill.review{background:var(--analyst-soft);color:var(--analyst)}
.pill.conflict{background:var(--conflict-soft);color:var(--conflict)} .pill.confirmed{background:var(--accent-soft);color:var(--accent)}
.conf{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;flex:none}

/* detail — independent scroll */
.detail{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow-y:auto;min-height:0}
.dtop{padding:17px 22px 15px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel-2),var(--panel))}
.dtop .kick{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.dtop h2{font-size:21px;letter-spacing:-.02em;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.dtop .meta{display:flex;align-items:center;gap:16px;margin-top:11px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.dtop .meta .kv{display:flex;align-items:center;gap:6px} .dtop .meta .kv b{color:var(--ink-2);font-weight:600}
.keychip{font-family:var(--mono);font-size:12px;background:var(--inset);border:1px solid var(--line);border-radius:7px;padding:3px 9px;color:var(--ink-2)}

.verdict{display:flex;align-items:center;gap:13px;margin:16px 22px 0;padding:12px 16px;border-radius:11px;border:1px solid}
.verdict .vico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.verdict .vt{font-weight:750;font-size:14.5px} .verdict .vn{font-size:12.5px;margin-top:1px}
.verdict.high,.verdict.clear{background:var(--auto-soft);border-color:color-mix(in srgb,var(--auto) 35%,var(--line))}
.verdict.high .vt,.verdict.clear .vt{color:var(--auto)} .verdict.high .vico,.verdict.clear .vico{background:var(--auto);color:#fff}
.verdict.high .vn,.verdict.clear .vn{color:color-mix(in srgb,var(--auto) 78%,var(--ink))}
.verdict.ambiguous{background:var(--analyst-soft);border-color:color-mix(in srgb,var(--analyst) 35%,var(--line))}
.verdict.ambiguous .vt{color:var(--analyst)} .verdict.ambiguous .vico{background:var(--analyst);color:#fff}
.verdict.ambiguous .vn{color:color-mix(in srgb,var(--analyst) 72%,var(--ink))}
.verdict .rule{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;flex:none}

.cands{display:flex;flex-direction:column;gap:0}
.cand{border:1px solid var(--line);border-radius:11px;background:var(--panel-2);overflow:hidden}
.cand.win{border-color:color-mix(in srgb,var(--auto) 45%,var(--line));background:var(--panel)}
.cand summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:26px 1fr 168px auto;gap:13px;align-items:center;padding:12px 15px}
.cand summary::-webkit-details-marker{display:none} .cand summary:hover{background:var(--panel-2)}
.rank{font-family:var(--mono);font-weight:750;color:var(--faint);font-size:14px;text-align:center} .cand.win .rank{color:var(--auto)}
.cand .cn{min-width:0}
.cand .cn .nm{font-weight:650;font-size:14px;display:flex;align-items:center;gap:9px}
.cand .cn .tb{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px}
.wintag{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--auto);background:var(--auto-soft);border-radius:5px;padding:2px 6px}
.cbarwrap{display:flex;align-items:center}
.cbar{height:7px;border-radius:4px;background:var(--line-2);position:relative;overflow:hidden;flex:1}
.cbar i{display:block;height:100%;border-radius:4px;background:var(--faint)} .cand.win .cbar i{background:var(--auto)}
.cbar .thr{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--conflict);opacity:.7}
.cscore{font-family:var(--mono);font-weight:700;font-size:13px;min-width:34px;text-align:right}
.cjust{padding:2px 16px 14px 39px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink-2);line-height:1.55}
.cjust .jk{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0}
.cjust .jchip{font-family:var(--mono);font-size:11px;background:var(--inset);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--ink-2)}
.cjust .use{margin-top:11px;font-size:12px;font-weight:650;color:var(--accent);border:1px solid var(--accent-line);background:var(--panel);border-radius:8px;padding:6px 12px}
.gapdiv{display:flex;align-items:center;gap:9px;margin:7px 0 7px 39px;font-size:11px;color:var(--muted)}
.gapdiv .gl{flex:none;font-weight:650} .gapdiv.big .gl{color:var(--auto)} .gapdiv.small .gl{color:var(--analyst)}
.gapdiv .seg{height:1px;background:var(--line);flex:1}

.roll{display:flex;align-items:stretch;gap:0;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--inset);overflow-x:auto}
.rnode{flex:1;min-width:120px;display:flex;flex-direction:column;gap:3px;padding:0 16px;position:relative}
.rnode + .rnode::before{content:"›";position:absolute;left:-7px;top:11px;color:var(--faint);font-size:16px}
.rnode .rg{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.rnode .rn{font-weight:650;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rnode .rc{font-size:11px;color:var(--muted)} .rnode.here .rn{color:var(--accent)} .rnode.here{background:var(--accent-soft);border-radius:9px}

.sec{padding:16px 22px} .sec + .sec{border-top:1px solid var(--line)}
.sec h3{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sec h3 .c{font-family:var(--mono);color:var(--faint);font-weight:600;letter-spacing:0}
.sec h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600;font-size:11.5px}

.recs{display:flex;flex-direction:column;gap:8px}
.rec{border:1px solid var(--line);border-left-width:3px;border-radius:10px;padding:11px 14px;background:var(--panel-2);display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.rec.match{border-left-color:var(--auto)} .rec.claude{border-left-color:var(--claude)}
.rec.review{border-left-color:var(--analyst)} .rec.conflict{border-left-color:var(--conflict)}
.rec .src{display:flex;align-items:center;gap:9px;min-width:0}
.rec .srcn{font-weight:650;font-size:13px;white-space:nowrap}
.rec .raw{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .rid{font-family:var(--mono);font-size:11px;color:var(--faint)}
.rec .ev{display:flex;align-items:center;gap:10px;flex:none}
.rec .via{font-size:11px;color:var(--muted)} .rec .via .k{font-family:var(--mono);color:var(--ink-2)}
.rec .fields{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.fchip{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;background:var(--panel)}
.fchip b{color:var(--ink-2);font-weight:600}
.fchip.agree{border-color:color-mix(in srgb,var(--auto) 40%,var(--line));background:var(--auto-soft);color:var(--auto)}
.fchip.diff{border-color:color-mix(in srgb,var(--conflict) 45%,var(--line));background:var(--conflict-soft);color:var(--conflict)}

.evid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ecard{border:1px solid var(--line);border-radius:11px;padding:13px 15px;background:var(--panel-2)}
.ecard .et{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.ecard.det .et{color:var(--auto)} .ecard.ai .et{color:var(--claude)}
.ecard p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.ecard .krow{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--line)}
.ecard .krow:last-child{border-bottom:0} .ecard .krow span:first-child{color:var(--muted)} .ecard .krow .mono{color:var(--ink)}
.scoretag{margin-left:auto;font-family:var(--mono);font-weight:700}

.flags{display:flex;flex-direction:column;gap:8px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-radius:9px;border:1px solid var(--analyst-soft);background:var(--analyst-soft);font-size:12.5px;color:var(--ink-2)}
.flag.conf{border-color:var(--conflict-soft);background:var(--conflict-soft)}
.flag .fdot{width:7px;height:7px;border-radius:50%;background:var(--analyst);margin-top:6px;flex:none} .flag.conf .fdot{background:var(--conflict)}
.flag .act{margin-left:auto;font-size:11.5px;font-weight:650;color:var(--accent);white-space:nowrap;border:1px solid var(--accent-line);background:var(--panel);border-radius:7px;padding:4px 9px}

.actions{display:flex;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:var(--panel-2);position:sticky;bottom:0;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:9px 16px;font-size:13.5px;font-weight:650;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent-line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{filter:brightness(1.07)}
.btn.escalate{color:var(--senior)} .btn.escalate:hover{border-color:var(--senior);background:var(--senior-soft)}
.btn:disabled{opacity:.5;cursor:default}
.actions .spacer{flex:1}
.actions .hint{font-size:11.5px;color:var(--muted)}
.actions kbd{font-family:var(--mono);font-size:10.5px;background:var(--inset);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted)}

/* narrow screens: fall back to normal document scroll, single column */
@media (max-width:1024px){
  body{height:auto;overflow:auto} .shell{overflow:visible;max-width:none}
  .work{grid-template-columns:1fr} .queue{min-height:0} .qlist{max-height:360px} .detail{height:auto;overflow:visible}
  .funnel{padding-bottom:12px} .evid{grid-template-columns:1fr}
}
</style>

<div class="top">
  <div class="crumb"><span class="logo">H</span><span>Hoodie · Suite</span><span class="sep">/</span><b>Hoodie MDM</b><span class="sep">/</span><b style="color:var(--accent)">Master</b></div>
  <div class="grow"></div>
  <button class="themebtn" id="theme">◐ Theme</button>
</div>

<div class="shell">
  <div class="hd">
    <h1>Matching workbench</h1>
    <span class="sub">Rank the possible clusters, read the justification, decide — or step it up. <span id="ptier" style="color:var(--muted)"></span></span>
    <span class="run"><span class="role"><span class="dot analyst"></span>Reviewing as Analyst</span><span>Run <b>latest</b> · <b class="num" id="runcand">—</b> candidates</span></span>
  </div>

  <div class="funnel" id="funnel">
    <button class="stage s-all" data-stage="all"><div class="lab"><span class="dot cand"></span>Candidates</div><div class="n num">—</div><div class="pct">raw in</div><div class="bar"><i style="width:0%"></i></div></button>
    <button class="stage s-auto" data-stage="auto"><div class="lab"><span class="dot auto"></span>Auto</div><div class="n num">—</div><div class="pct">exact key</div><div class="bar"><i style="width:0%"></i></div></button>
    <button class="stage s-claude" data-stage="claude"><div class="lab"><span class="dot claude"></span>Claude</div><div class="n num">—</div><div class="pct">adjudicated</div><div class="bar"><i style="width:0%"></i></div></button>
    <button class="stage s-analyst on" data-stage="analyst"><div class="lab"><span class="dot analyst"></span>Analyst</div><div class="n num">—</div><div class="pct">your queue</div><div class="bar"><i style="width:0%"></i></div></button>
    <button class="stage s-senior" data-stage="senior"><div class="lab"><span class="dot senior"></span>Sr Analyst</div><div class="n num">—</div><div class="pct">escalated</div><div class="bar"><i style="width:0%"></i></div></button>
    <button class="stage s-steward" data-stage="steward"><div class="lab"><span class="dot steward"></span>Steward</div><div class="n num">—</div><div class="pct">final authority</div><div class="bar"><i style="width:0%"></i></div></button>
    <button class="stage s-confirmed" data-stage="confirmed"><div class="lab"><span class="dot confirmed"></span>Confirmed</div><div class="n num">—</div><div class="pct">to master</div><div class="bar"><i style="width:0%"></i></div></button>
  </div>

  <div class="work">
    <aside class="queue">
      <div class="qhead">
        <div class="t"><h3 id="qtitle">Analyst queue</h3><span class="cnt"><b id="qn">0</b> of <span id="qtot">0</span></span></div>
        <input class="search" placeholder="Filter by name, brand, source…">
      </div>
      <div class="tabs" id="tabs">
        <button class="tab on" data-f="all">All</button>
        <button class="tab" data-f="ambiguous">Ambiguous</button>
        <button class="tab" data-f="corroborated">Corroborated</button>
        <button class="tab" data-f="noupc">No UPC</button>
      </div>
      <div class="qlist" id="qlist"></div>
    </aside>
    <main class="detail" id="detail"></main>
  </div>
</div>

<script>
const API="/api/master/workbench";
const HI_CONF=0.95, BIG_GAP=0.20;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const stageLabel={auto:"Auto",claude:"Claude",analyst:"Analyst",senior:"Sr Analyst",steward:"Steward",confirmed:"Confirmed",review:"Analyst",conflict:"Conflict",match:"Auto"};
const TIER_LABEL={senior:"senior analyst", steward:"steward"};
const STAGE_TITLE={all:"All candidates",candidates:"All candidates",auto:"Auto-matched",claude:"Claude-adjudicated",analyst:"Analyst queue",senior:"Senior-analyst queue",steward:"Steward queue",confirmed:"Confirmed to master"};
let STUBS=[], STAGES={}, FILT={stage:"analyst",facet:"all",q:""};

function titlecase(s){ return String(s||"").replace(/\w\S*/g,t=>t.charAt(0).toUpperCase()+t.slice(1)); }

// verdict from the ranked candidates. #1 is the proposed home (its match confidence); alternatives are
// same-brand clusters scored by name overlap. A same-brand cluster scoring as high = a likely duplicate.
function verdictOf(cands){
  const base=cands[0].conf, alts=cands.slice(1);
  const topAlt=alts.length?Math.max.apply(null,alts.map(a=>a.conf)):0;
  if(alts.length && topAlt>=base) return {kind:"ambiguous",label:"Possible duplicate cluster",note:`A same-brand cluster scores ${topAlt.toFixed(2)} — as high as the proposed home. Likely a duplicate to merge.`};
  if(base>=HI_CONF) return {kind:"high",label:"High-confidence match",note:`Proposed cluster ${base.toFixed(2)} clears the ${HI_CONF} bar — auto-eligible.`};
  if(!alts.length) return {kind:"clear",label:"No competing cluster",note:`No other cluster shares this brand + name — the proposed home stands alone.`};
  const gap=+(base-topAlt).toFixed(2);
  if(gap>=BIG_GAP) return {kind:"clear",label:"Clear winner",note:`+${gap.toFixed(2)} over the nearest same-brand cluster — low ambiguity.`};
  return {kind:"ambiguous",label:"Ambiguous — a human decides",note:`Only +${gap.toFixed(2)} over a same-brand cluster — too close to call automatically.`};
}

function stubFrom(row, stage){
  return {id:row.cluster_id, name:titlecase(row.candidate_name||row.brand||row.cluster_id), grain:"sku", stage,
          note:((row.match_kind||"partial")+" · "+(row.corroborated_by||"no source")), conf:row.confidence||0,
          ambiguous:(row.confidence||0)<0.6, corroborated:(row.sources||0)>=2, noupc:!row.upc, brand:(row.brand||"")};
}

// stages that carry a live "NN% ·" prefix on their descriptor (their share of raw candidates)
const PCT_STAGES={auto:"2+ sources",claude:"adjudicated"};
function setFunnel(st){
  STAGES=st||{};
  const map={all:"candidates",candidates:"candidates",auto:"auto",claude:"claude",analyst:"analyst",senior:"senior",steward:"steward",confirmed:"confirmed"};
  const cand=Number(st.candidates||0);
  document.querySelectorAll(".stage").forEach(el=>{
    const key=map[el.dataset.stage], n=st[key];
    if(n==null) return;
    const nn=el.querySelector(".n"); if(nn) nn.textContent=Number(n).toLocaleString();
    const pct=cand?Math.round(n/cand*100):0;
    const bar=el.querySelector(".bar > i"); if(bar) bar.style.width=Math.min(100,pct)+"%";
    if(PCT_STAGES[key]){ const pe=el.querySelector(".pct"); if(pe) pe.textContent=pct+"% · "+PCT_STAGES[key]; }
  });
}

async function boot(){
  try{
    const [s,rv,ms]=await Promise.all([
      fetch(API+"/summary").then(r=>r.json()),
      fetch(API+"/review").then(r=>r.json()),
      fetch(API+"/master").then(r=>r.json())
    ]);
    setFunnel(s.stages||{});
    const pt=s.product_tier; const pe=$("#ptier");
    if(pt&&pe){ pe.innerHTML="· <b>"+Number(pt.corroborated||0).toLocaleString()+"</b> products corroborated"
      +(pt.ttb_corroborated?" ("+Number(pt.ttb_corroborated).toLocaleString()+" registered <i>and</i> sold — TTB↔retail)":""); }
    const cand=(s.stages&&s.stages.candidates)||0;
    // Candidates are distinct products; note how many raw source rows they collapsed from (so the
    // 196,535→76,618 dedup is visible without breaking the funnel's single (product) grain).
    if(s.source_rows){ const el=document.querySelector(".stage.s-all .pct");
      if(el) el.textContent="from "+Number(s.source_rows).toLocaleString()+" rows"; }
    const runEl=$("#runcand"); if(runEl) runEl.textContent=Number(cand).toLocaleString();
    const stubs=[];
    (rv.items||[]).forEach(r=>stubs.push(stubFrom(r, r.review_tier || "analyst")));
    (ms.items||[]).forEach(r=>stubs.push(stubFrom(r, r.matched_by==="claude"?"claude":(r.matched_by==="manual"?"confirmed":"auto"))));
    STUBS=stubs;
  }catch(e){
    $("#qlist").innerHTML='<div class="qempty">Couldn’t reach the matching engine.</div>';
    $("#detail").innerHTML='<div style="padding:44px 24px;color:var(--muted);font-size:13.5px">The matching engine isn’t reachable. Start the agent and reload — this page reads <b>/api/master/workbench/*</b> (real ttb_master / ttb_review clusters).</div>';
    return;
  }
  renderQueue();
}

function currentRows(){
  const t=FILT.q.trim().toLowerCase();
  return STUBS.filter(s=>{
    if(FILT.stage!=="all" && FILT.stage!=="candidates" && s.stage!==FILT.stage) return false;
    if(FILT.facet==="ambiguous" && !s.ambiguous) return false;
    if(FILT.facet==="corroborated" && !s.corroborated) return false;
    if(FILT.facet==="noupc" && !s.noupc) return false;
    if(t && !(s.name.toLowerCase().includes(t) || s.note.toLowerCase().includes(t) || s.brand.toLowerCase().includes(t))) return false;
    return true;
  });
}

function renderQueue(){
  const rows=currentRows();
  $("#qtitle").textContent=STAGE_TITLE[FILT.stage]||"Queue";
  $("#qn").textContent=rows.length.toLocaleString();
  $("#qtot").textContent=Number(STAGES[FILT.stage==="all"?"candidates":FILT.stage]||rows.length).toLocaleString();
  if(!rows.length){ $("#qlist").innerHTML='<div class="qempty">Nothing in this view — try another stage or filter.</div>'; $("#detail").innerHTML=""; return; }
  const show=rows.slice(0,300);
  $("#qlist").innerHTML=show.map((s,i)=>`
    <button class="qitem${i===0?' sel':''}" data-ref="${esc(s.id)}" data-stage="${esc(s.stage)}">
      <div class="r1"><span class="grain ${s.grain}">${s.grain}</span><span class="nm">${esc(s.name)}</span></div>
      <div class="r2"><span class="pill ${s.stage}"><span class="dot ${s.stage}"></span>${stageLabel[s.stage]}</span>
        <span>${esc(s.note)}</span><span class="conf">${s.conf.toFixed(2)}</span></div>
    </button>`).join("");
  document.querySelectorAll(".qitem").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".qitem").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); selectCluster(b.dataset.ref, b.dataset.stage);
  });
  selectCluster(show[0].id, show[0].stage);
}

async function selectCluster(id, stage){
  $("#detail").innerHTML='<div style="padding:44px 24px;color:var(--faint);font-size:13px">Loading cluster…</div>';
  let item, cand;
  try{
    [item,cand]=await Promise.all([
      fetch(API+"/item/"+encodeURIComponent(id)).then(r=>r.json()),
      fetch(API+"/candidates/"+encodeURIComponent(id)).then(r=>r.json())
    ]);
  }catch(e){ $("#detail").innerHTML='<div style="padding:44px 24px;color:var(--conflict)">Couldn’t load this cluster.</div>'; return; }
  renderDetail(adapt(item, cand, stage));
}

function adapt(itemResp, candResp, stage){
  const m=(itemResp&&itemResp.item)||{}, filings=(itemResp&&itemResp.filings)||[];
  let cands=(candResp&&candResp.candidates)||[];
  if(!cands.length) cands=[{name:titlecase(m.candidate_name||m.brand||m.cluster_id),grain:"sku",table:(m.tier===1?"ttb_master":"ttb_review"),conf:m.confidence||0,win:true,why:"Proposed cluster.",keys:[]}];
  cands=cands.map(c=>Object.assign({},c,{name:titlecase(c.name)}));
  const recs=filings.map(f=>({src:f.source||"source", id:"", raw:(f.name||f.brand||"").trim()||"(no name)",
    by:"auto", key:f.source||"source", conf:1.0, status:"match",
    fields:[["brand",(f.brand||"—")],["category",(f.category||"—")]]}));
  const alts=cands.slice(1);
  const dup=alts.length && Math.max.apply(null,alts.map(a=>a.conf))>=cands[0].conf;
  const flags=[];
  if(dup) flags.push({t:"A same-brand product scores as high — this may be a duplicate that should merge.",act:"Review merge",kind:"conflict"});
  if(!m.upc) flags.push({t:"No UPC on the master product — matched on brand + name only.",act:"Find UPC",kind:"review"});
  if(m.tier===0) flags.push({t:"Single-source — needs an independent source to corroborate before it can be fully trusted.",act:"Corroborate",kind:"review"});
  return {
    id:m.cluster_id, grain:"sku", stage:stage||(m.tier===1?"confirmed":"analyst"),
    subject:{label:titlecase(m.candidate_name||m.brand||m.cluster_id), src:(m.corroborated_by||"no source"), id:m.cluster_id},
    table:(m.upc?("UPC "+m.upc):(m.tier===1?"dim_sku · corroborated":"dim_sku · single-source")),
    meta:[["UPC",m.upc||"— none —"],["Sources",String(m.sources||recs.length||"—")],["Size",m.size_ml?(m.size_ml>=1000?(m.size_ml/1000)+"L":m.size_ml+"ml"):"—"],["Source rows",String(m.member_count||recs.length)]],
    candidates:cands,
    hierarchy:[{g:"Brand",n:titlecase(m.brand)||"—",c:"dim_brand"},{g:"Product",n:titlecase(m.candidate_name)||"—",c:"dim_product"},{g:"SKU",n:(m.upc?("UPC "+m.upc):titlecase(m.candidate_name)),c:(m.sources||recs.length)+" source"+((m.sources||recs.length)===1?"":"s"),here:true},{g:"UPC",n:(m.upc||"— none —"),c:"identity"}],
    records:recs,
    evidence:{det:[["Confidence",(m.confidence||0).toFixed(2)],["Match kind",m.match_kind||"—"],["UPC",m.upc||"— none —"],["Corroborated by",m.corroborated_by||"— none —"]], fuzzy:(m.confidence||0),
      claude:`${(m.match_kind||"single-source")} SKU; ${m.upc?("UPC-identified ("+m.upc+")"):"no UPC yet"}; ${m.corroborated_by?("seen in "+m.corroborated_by):"no independent source has confirmed it yet"}.${dup?" A duplicate SKU exists — consider merging.":""}`},
    flags:flags
  };
}

function renderDetail(c){
  const v=verdictOf(c.candidates);
  const win=c.candidates.find(x=>x.win)||c.candidates[0];
  const cands=c.candidates.map((cd,i)=>{
    const gapRow= i===0 && c.candidates[1] ? (()=>{ const g=+(c.candidates[0].conf-c.candidates[1].conf).toFixed(2);
      return `<div class="gapdiv ${g>=BIG_GAP?'big':'small'}"><span class="gl">${g>=BIG_GAP?'▲ +'+g.toFixed(2)+' gap':(g<0?'▼ '+g.toFixed(2)+' — a stronger match':'≈ +'+g.toFixed(2)+' — near tie')}</span><span class="seg"></span></div>`; })() : "";
    return `<details class="cand ${cd.win?'win':''}" ${cd.win?'open':''}>
      <summary>
        <span class="rank">#${i+1}</span>
        <span class="cn"><span class="nm">${esc(cd.name)} <span class="grain ${cd.grain||'sku'}">${cd.grain||'sku'}</span>${cd.win?'<span class="wintag">proposed</span>':''}</span><span class="tb">${esc(cd.table||'')}</span></span>
        <span class="cbarwrap"><span class="cbar"><i style="width:${Math.round((cd.conf||0)*100)}%"></i><span class="thr" style="left:${HI_CONF*100}%"></span></span></span>
        <span class="cscore">${(cd.conf||0).toFixed(2)}</span>
        <button class="skux" data-sku="${esc(cd.cluster_id||cd.id||'')}" title="Expand — all data attached to this SKU">⤢</button>
      </summary>
      <div class="cjust">${esc(cd.why||"")}<div class="jk">${(cd.keys||[]).map(k=>`<span class="jchip">${esc(k)}</span>`).join("")}</div>${cd.win?"":'<button class="use">Use this match instead →</button>'}</div>
    </details>${gapRow}`;
  }).join("");
  const roll=c.hierarchy.map(h=>`<div class="rnode ${h.here?'here':''}"><span class="rg">${esc(h.g)}</span><span class="rn">${esc(h.n)}</span><span class="rc">${esc(h.c)}</span></div>`).join("");
  const byPill={match:"auto",auto:"auto",claude:"claude",review:"review",conflict:"conflict"};
  const byLabel={match:"Auto",auto:"Auto",claude:"Claude",review:"Analyst",conflict:"Conflict"};
  const recs=c.records.length? c.records.map(r=>`
    <div class="rec ${r.status}">
      <div class="src"><span class="pill ${byPill[r.status]}"><span class="dot ${byPill[r.status]}"></span>${byLabel[r.status]}</span>
        <span class="srcn">${esc(r.src)}</span><span class="rid">${esc(r.id)}</span><span class="raw">“${esc(r.raw)}”</span></div>
      <div class="ev"><span class="via">via <span class="k">${esc(r.key)}</span></span><span class="conf">${r.conf.toFixed(2)}</span></div>
      <div class="fields">${r.fields.map(f=>`<span class="fchip">${esc(f[0])} <b>${esc(f[1])}</b></span>`).join("")}</div>
    </div>`).join("") : '<div class="qempty">No source records returned.</div>';
  const det=c.evidence.det.map(k=>`<div class="krow"><span>${esc(k[0])}</span><span class="mono">${esc(k[1])}</span></div>`).join("");
  const flags=c.flags.length? c.flags.map(f=>`<div class="flag ${f.kind==='conflict'?'conf':''}"><span class="fdot"></span><span>${esc(f.t)}</span><button class="act">${esc(f.act)}</button></div>`).join("")
    : '<div class="flag" style="border-color:var(--line);background:var(--panel-2)"><span class="fdot" style="background:var(--auto)"></span><span>Nothing flagged — clean cluster.</span></div>';
  const upTgt=c.stage==="steward"?null:(c.stage==="senior"?"steward":"senior");
  const escBtn=upTgt?`<button class="btn escalate act-escalate">↑ Escalate to ${TIER_LABEL[upTgt]}</button>`:`<button class="btn escalate" disabled>Steward — final tier</button>`;
  $("#detail").innerHTML=`
    <div class="dtop">
      <div class="kick"><span class="dot ${c.stage}"></span>Resolving · ${esc(c.subject.src)} · cluster ${esc(c.subject.id)} · ${stageLabel[c.stage]} tier</div>
      <h2>“${esc(c.subject.label)}” <span class="grain ${c.grain}">${c.grain}</span></h2>
      <div class="meta"><span class="kv">winning cluster <span class="keychip">${esc(win.name)}</span></span>${c.meta.map(m=>`<span class="kv">${esc(m[0])} <b>${esc(m[1])}</b></span>`).join("")}</div>
    </div>
    <div class="verdict ${v.kind}"><span class="vico">${v.kind==='ambiguous'?'?':'✓'}</span>
      <div><div class="vt">${v.label}</div><div class="vn">${esc(v.note)}</div></div>
      <div class="rule">rule: conf ≥ ${HI_CONF}<br>OR gap ≥ ${BIG_GAP}</div></div>
    <div class="sec"><h3>Possible clusters <span class="c">${c.candidates.length}</span><span class="r">ranked by confidence · expand for the justification</span></h3><div class="cands">${cands}</div></div>
    <div class="roll">${roll}</div>
    <div class="sec"><h3>Source catalogs <span class="c">${c.records.length}</span><span class="r">the sources this SKU was found in (price/distribution comparands)</span></h3><div class="recs">${recs}</div></div>
    <div class="sec"><h3>Match evidence</h3><div class="evid">
      <div class="ecard det"><div class="et"><span class="dot auto"></span>Deterministic <span class="scoretag" style="color:var(--auto)">keys</span></div>${det}</div>
      <div class="ecard ai"><div class="et"><span class="dot claude"></span>Cascade <span class="scoretag" style="color:var(--claude)">${c.evidence.fuzzy.toFixed(2)}</span></div><p>${esc(c.evidence.claude)}</p></div></div></div>
    <div class="sec"><h3>To resolve <span class="c">${c.flags.length}</span></h3><div class="flags">${flags}</div></div>
    <div class="actions">
      <button class="btn primary act-confirm">✓ Confirm #1 to master</button>
      <button class="btn" disabled title="coming next">⑃ Split</button>
      <button class="btn" disabled title="coming next">⋈ Merge…</button>
      ${escBtn}
      <div class="spacer"></div>
      <span class="hint">writes live · <kbd>J</kbd>/<kbd>K</kbd> next</span>
    </div>`;
  const dnode=$("#detail");
  const cb=dnode.querySelector(".act-confirm"); if(cb) cb.onclick=()=>doAction(c.id,"confirm",null,win.name);
  const eb=dnode.querySelector(".act-escalate"); if(eb) eb.onclick=()=>doAction(c.id,"escalate",upTgt);
}

async function doAction(cid, action, tier, matched_name){
  const det=$("#detail");
  det.querySelectorAll(".actions .btn").forEach(b=>b.disabled=true);
  try{
    const r=await (await fetch(API+"/match",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({cluster_id:cid, action, tier:tier||"", matched_name:matched_name||""})})).json();
    if(!r.ok){ alert(r.error||"action failed"); det.querySelectorAll(".actions .btn").forEach(b=>b.disabled=false); return; }
    boot();   // refresh funnel counts + queue + detail from live state
  }catch(e){ alert("couldn’t reach the matching engine"); det.querySelectorAll(".actions .btn").forEach(b=>b.disabled=false); }
}

document.querySelectorAll(".stage").forEach(s=>s.onclick=()=>{
  document.querySelectorAll(".stage").forEach(x=>x.classList.remove("on")); s.classList.add("on");
  FILT.stage=s.dataset.stage; renderQueue();
});
document.querySelectorAll("#tabs .tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll("#tabs .tab").forEach(x=>x.classList.remove("on")); t.classList.add("on");
  FILT.facet=t.dataset.f; renderQueue();
});
$(".search").addEventListener("input", e=>{ FILT.q=e.target.value; renderQueue(); });
$("#theme").onclick=()=>{ const r=document.documentElement;
  const cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  r.setAttribute("data-theme", cur==="dark"?"light":"dark"); };

// ── SKU expand modal — all data attached to a SKU (from any cluster) + image + on-demand label-vision ──
(function(){
  const css=`
  .skux{margin-left:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:6px;
    cursor:pointer;font-size:12px;padding:0 6px;flex:none} .skux:hover{border-color:var(--accent);color:var(--accent)}
  .mback{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:5vh 20px}
  .mback.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .mhead{display:flex;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
  .mimg{width:92px;height:92px;flex:none;border-radius:9px;background:var(--inset);object-fit:contain;border:1px solid var(--line)}
  .mh-t h2{margin:0;font-size:17px} .mh-t .mb{color:var(--muted);font-size:12.5px;margin-top:4px}
  .mx{margin-left:auto;border:none;background:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;align-self:flex-start}
  .mbody{padding:16px 20px}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
  .fcell{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .fcell .fk{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
  .fcell .fv{font-size:13.5px;margin-top:2px;word-break:break-word} .fcell .fv.empty{color:var(--faint)}
  .msec{margin-top:16px} .msec h4{margin:0 0 8px;font-size:12.5px;color:var(--muted);font-weight:650}
  .vbtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px}
  .vbtn:disabled{opacity:.6;cursor:default} .vrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .vres .fcell .fv{color:var(--good)}`;
  const s=document.createElement("style"); s.textContent=css; document.head.appendChild(s);
  const back=document.createElement("div"); back.className="mback"; back.id="skuback";
  back.innerHTML='<div class="modal" id="skumodal"></div>';
  back.onclick=e=>{ if(e.target===back) close(); };
  document.body.appendChild(back);
  function close(){ back.classList.remove("on"); }
  window._closeSku=close;
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") close(); });
  const size=ml=>ml?(ml>=1000?(ml/1000)+"L":ml+"ml"):"";
  const cell=(k,v)=>`<div class="fcell"><div class="fk">${esc(k)}</div><div class="fv ${v?'':'empty'}">${esc(v||"—")}</div></div>`;
  window.openSkuModal=async function(sku){
    if(!sku) return;
    const m=document.getElementById("skumodal");
    m.innerHTML='<div class="mbody" style="padding:44px;color:var(--muted)">Loading…</div>'; back.classList.add("on");
    let d; try{ d=await fetch(API+"/item/"+encodeURIComponent(sku)).then(r=>r.json()); }catch(e){ m.innerHTML='<div class="mbody">Couldn’t load.</div>'; return; }
    if(!d||!d.ok){ m.innerHTML='<div class="mbody">Not found.</div>'; return; }
    const it=d.item, fields=[["Product",it.candidate_name],["Brand",it.brand],["UPC",it.upc],["Size",size(it.size_ml)],
      ["Origin (source)",it.origin],["Bottled in",it.bottled_in],["Region",it.region],["Sub-region",it.sub_region],
      ["Appellation",it.appellation],["Varietal",it.varietal],["ABV",it.abv],["Category",it.category],
      ["Pack",it.pack],["Sources",it.sources],["Vintages",(it.vintages||[]).join(", ")]];
    m.innerHTML=`<div class="mhead">
        ${it.image?`<img class="mimg" src="${esc(it.image)}" onerror="this.style.visibility='hidden'">`:'<div class="mimg"></div>'}
        <div class="mh-t"><h2>${esc(it.candidate_name||"SKU")}</h2>
          <div class="mb">${esc(it.brand||"")} · ${it.upc?("UPC "+esc(it.upc)):"no UPC"} · ${it.sources} source${it.sources===1?"":"s"}</div></div>
        <button class="mx" onclick="_closeSku()">×</button></div>
      <div class="mbody"><div class="fgrid">${fields.map(f=>cell(f[0],f[1])).join("")}</div>
        <div class="msec"><h4>Seen in · ${esc(it.corroborated_by||"—")}</h4></div>
        <div class="msec"><div class="vrow"><button class="vbtn" id="vbtn" ${it.image?"":"disabled"}>◉ Read the label with vision</button>
          <span style="color:var(--faint);font-size:12px">${it.image?"reads COO / appellation / varietal / abv off the image":"no image on this SKU"}</span></div>
          <div id="vres"></div></div></div>`;
    const vb=m.querySelector("#vbtn");
    if(vb) vb.onclick=()=>runVision(it.cluster_id, vb, m.querySelector("#vres"));
  };
  async function runVision(sku, btn, res){
    btn.disabled=true; btn.textContent="◉ Reading the label…";
    let d; try{ d=await fetch(API+"/vision/"+encodeURIComponent(sku),{method:"POST"}).then(r=>r.json()); }
    catch(e){ res.innerHTML='<div style="color:var(--bad);font-size:12.5px">vision unreachable</div>'; btn.disabled=false; btn.textContent="◉ Read the label with vision"; return; }
    btn.disabled=false; btn.textContent="◉ Read again";
    if(!d||!d.ok){ res.innerHTML=`<div style="color:var(--bad);font-size:12.5px">${esc((d&&d.error)||"failed")}</div>`; return; }
    const f=d.fields||{}, show=[["Origin (source)",f.origin],["Bottled in",f.bottled_in],["Region",f.region],["Sub-region",f.sub_region],
      ["Appellation",f.appellation],["Varietal",f.varietal],["ABV",f.abv],["UPC",f.upc],["Vintage",f.vintage],["Net contents",f.net_contents],["Gov warning",f.gov_warning]].filter(x=>x[1]!=null&&x[1]!=="");
    res.innerHTML=`<h4 style="margin:12px 0 8px;color:var(--good);font-size:12.5px">What the label says</h4>
      <div class="fgrid vres">${show.length?show.map(x=>cell(x[0],x[1])).join(""):'<div class="fcell"><div class="fv empty">nothing legible on this image</div></div>'}</div>`;
  }
  document.addEventListener("click", e=>{
    const b=e.target.closest(".skux"); if(!b) return;
    e.preventDefault(); e.stopPropagation(); openSkuModal(b.dataset.sku);
  });
})();

boot();

</script>

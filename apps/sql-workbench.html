<style>
  :root{
    --bg:#0f1216;--panel:#161b22;--panel2:#1c2230;--line:#252c38;--ink:#e6edf3;--mut:#8b98a9;
    --accent:#4E79A7;--good:#5bb86e;--warn:#d99a3f;--bad:#e5636b;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--sans:Inter,system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme:light){:root{--bg:#f4f6f9;--panel:#fff;--panel2:#eef2f7;--line:#dfe5ec;--ink:#161b22;--mut:#5b6675}}
  :root[data-theme="light"]{--bg:#f4f6f9;--panel:#fff;--panel2:#eef2f7;--line:#dfe5ec;--ink:#161b22;--mut:#5b6675}
  :root[data-theme="dark"]{--bg:#0f1216;--panel:#161b22;--panel2:#1c2230;--line:#252c38;--ink:#e6edf3;--mut:#8b98a9}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
       display:flex;flex-direction:column;overflow:hidden}
  button,select,input{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;
       padding:6px 10px;font-family:var(--sans);font-size:13px}
  button{cursor:pointer}button:hover{border-color:var(--accent)}
  button.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
  button.go:hover{filter:brightness(1.12)}
  button:disabled{opacity:.5;cursor:default}

  .bar{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line);
       background:var(--panel);flex:0 0 auto}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  .spacer{flex:1}
  .stamp{font-family:var(--mono);font-size:11px;color:var(--mut)}
  .wh{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:6px;font-weight:600}
  .wh.prod{background:rgba(91,184,110,.14);color:var(--good);border:1px solid rgba(91,184,110,.4)}
  .wh.local{background:rgba(229,99,107,.14);color:var(--bad);border:1px solid rgba(229,99,107,.5)}

  .wrap{flex:1;display:flex;min-height:0}
  /* ── left: the table book ─────────────────────────────────────────── */
  aside{width:264px;flex:0 0 264px;border-right:1px solid var(--line);background:var(--panel);
        display:flex;flex-direction:column;min-height:0}
  aside .find{padding:9px 10px;border-bottom:1px solid var(--line)}
  aside .find input{width:100%}
  .tlist{flex:1;overflow:auto;padding:4px 0}
  .t{padding:6px 12px;cursor:pointer;border-left:2px solid transparent}
  .t:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .t.open{border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .t .n{font-family:var(--mono);font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t .r{font-family:var(--mono);font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums}
  .t .p{font-size:9px;color:var(--accent);margin-left:5px;letter-spacing:.4px}
  .cols{padding:2px 0 8px 14px;border-left:2px solid var(--accent);margin-left:10px}
  .col{display:flex;gap:8px;padding:2.5px 8px;font-family:var(--mono);font-size:10.5px;cursor:pointer;border-radius:4px}
  .col:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .col .ty{color:var(--mut);margin-left:auto;font-size:9.5px}

  /* ── right: editor over results ───────────────────────────────────── */
  main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .ed{flex:0 0 auto;position:relative;border-bottom:1px solid var(--line);background:var(--panel)}
  textarea{width:100%;height:150px;resize:vertical;display:block;background:transparent;color:var(--ink);
       border:0;outline:none;padding:12px 14px;font-family:var(--mono);font-size:13px;line-height:1.55;tab-size:2}
  .run{display:flex;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--line);background:var(--panel2)}
  .hint{font-size:11px;color:var(--mut)}
  kbd{font-family:var(--mono);font-size:10px;background:var(--panel);border:1px solid var(--line);
      border-bottom-width:2px;border-radius:4px;padding:1px 5px}

  .msg{padding:10px 14px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;display:none;line-height:1.5}
  .msg.show{display:block}
  .msg.err{background:rgba(229,99,107,.12);color:var(--bad);border-bottom:1px solid rgba(229,99,107,.35)}
  .msg.warn{background:rgba(217,154,63,.12);color:var(--warn);border-bottom:1px solid rgba(217,154,63,.35)}

  .tabs{display:none;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);
        overflow-x:auto;flex:0 0 auto}
  .rtab{padding:7px 12px;font-family:var(--mono);font-size:11px;color:var(--mut);cursor:pointer;
        border-bottom:2px solid transparent;white-space:nowrap}
  .rtab.on{color:var(--ink);border-bottom-color:var(--accent)}
  .rtab.bad{color:var(--bad)}
  /* ── visual join builder ─────────────────────────────────────────── */
  .mode{display:flex;gap:2px;margin-right:4px}
  .mode button{border-radius:7px;padding:5px 11px;font-size:12px}
  .mode button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
  .canvas{flex:1;overflow:auto;min-height:0;padding:16px;display:none;
          background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/22px 22px}
  .canvas.on{display:block}
  .cards{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:236px;
        max-height:340px;display:flex;flex-direction:column;overflow:hidden}
  .card h3{margin:0;padding:8px 11px;font-family:var(--mono);font-size:11.5px;font-weight:650;
           border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;background:var(--panel2)}
  .card h3 .x{margin-left:auto;cursor:pointer;color:var(--mut);font-size:13px}
  .card h3 .x:hover{color:var(--bad)}
  .card .fl{overflow:auto;padding:3px 0}
  .card label{display:flex;align-items:center;gap:6px;padding:2.5px 11px;font-family:var(--mono);
              font-size:10.5px;cursor:pointer}
  .card label:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
  .card label input{width:auto;padding:0;margin:0}
  .card label .k{color:var(--accent);font-size:8.5px;letter-spacing:.4px;margin-left:auto}
  .join{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;
        margin:10px 0;font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .join code{font-family:var(--mono);font-size:11px;color:var(--ink)}
  .join .basis{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:20px;font-weight:700}
  .basis.declared{background:rgba(91,184,110,.16);color:var(--good)}
  .basis.identity{background:rgba(78,121,167,.2);color:var(--accent)}
  .basis.shared{background:rgba(217,154,63,.16);color:var(--warn)}
  .join .why{flex-basis:100%;font-size:11px;color:var(--mut);line-height:1.45}
  .join .measured{font-family:var(--mono);font-size:11px}
  .drop{outline:2px dashed var(--accent);outline-offset:-6px}
  .t.sel{background:color-mix(in srgb,var(--accent) 22%,transparent)}
  .joinable{padding:5px 12px;font-size:10.5px;color:var(--accent);border-bottom:1px solid var(--line);
            display:none;align-items:center;gap:6px;cursor:pointer}
  .joinable.on{display:flex}
  .grid{flex:1;overflow:auto;min-height:0}
  table{border-collapse:collapse;font-family:var(--mono);font-size:12px}
  thead th{position:sticky;top:0;background:var(--panel2);color:var(--mut);text-align:left;padding:7px 11px;
       border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;font-weight:600;
       font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;z-index:2}
  tbody td{padding:5px 11px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
       white-space:pre;font-variant-numeric:tabular-nums;max-width:460px;overflow:hidden;text-overflow:ellipsis}
  tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 42%,transparent)}
  tbody tr:hover td{background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
  td.null{color:var(--mut);font-style:italic}
  td.num{text-align:right}
  .rn{color:var(--mut);text-align:right;font-size:10.5px;user-select:none;background:var(--panel)!important}

  .foot{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:6px 14px;border-top:1px solid var(--line);
        background:var(--panel);font-family:var(--mono);font-size:11px;color:var(--mut)}
  .empty{padding:40px 22px;color:var(--mut);max-width:720px;line-height:1.65}
  .empty h2{font-size:13px;color:var(--ink);margin:0 0 8px;font-weight:650}
  .rec{display:block;width:100%;text-align:left;font-family:var(--mono);font-size:11.5px;margin:5px 0;
       padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:7px;color:var(--ink);
       white-space:pre-wrap;line-height:1.5}
  .rec:hover{border-color:var(--accent)}
  .rec b{color:var(--mut);font-weight:500;display:block;font-family:var(--sans);font-size:10.5px;margin-bottom:3px}
  .hist{max-height:260px;overflow:auto}
</style>

<div class="bar">
  <h1>Hoodie SQL</h1>
  <span class="wh" id="wh">…</span>
  <span class="spacer"></span>
  <span class="mode">
    <button id="mSql" class="on">SQL</button>
    <button id="mJoin">Visual join</button>
  </span>
  <span class="stamp" id="stamp"></span>
  <button id="csv" disabled>Download CSV</button>
</div>

<div class="wrap">
  <aside>
    <div class="find"><input id="find" placeholder="find a table…" autocomplete="off"></div>
    <div class="joinable" id="joinable"></div>
    <div class="tlist" id="tlist"><div class="empty" style="padding:18px 12px">loading tables…</div></div>
  </aside>

  <main>
    <div class="ed">
      <textarea id="sql" spellcheck="false" placeholder="SELECT * FROM binnys_products LIMIT 20"></textarea>
      <div class="run">
        <button class="go" id="go">Run</button>
        <button id="runall">Run all</button>
        <span class="hint"><kbd>⌘</kbd>+<kbd>↵</kbd> this one · <kbd>⌘</kbd>+<kbd>⇧</kbd>+<kbd>↵</kbd> all · read-only</span>
        <span class="hint" id="which" style="color:var(--accent)"></span>
        <label class="hint" style="display:flex;align-items:center;gap:5px;cursor:pointer">
          <input type="checkbox" id="allparts" style="width:auto;padding:0"> all parts
        </label>
        <span class="spacer"></span>
        <select id="hist"><option value="">history…</option></select>
      </div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="tabs" id="tabs"></div>
    <div class="canvas" id="canvas">
      <div class="cards" id="cards"></div>
      <div id="joins"></div>
      <div id="gensql" style="margin-top:14px"></div>
    </div>
    <div class="grid" id="grid">
      <div class="empty" id="welcome">
        <h2>The warehouse, unfiltered.</h2>
        Every table on the left is real Parquet — the same files the pipeline writes and the decks read.
        Name one in a query and it binds itself; no setup, no attach. Reads only.
        <div style="margin-top:16px" id="recs"></div>
      </div>
    </div>
    <div class="foot"><span id="foot">ready</span><span class="spacer"></span><span id="bound"></span></div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const num = n => n == null ? '—' : Number(n).toLocaleString();
let TABLES = [], LAST = null, OPEN = null, RESULTS = [], SHOWN = 0, JOIN_FILTER = true;

const RECIPES = [
  ['what is actually in a table', 'SELECT * FROM binnys_products LIMIT 25'],
  ['how full is every column (nulls are the story)', 'SUMMARIZE SELECT * FROM binnys_products'],
  ['rows per source, biggest first', "SELECT source, count(*) n FROM retail_observations\nGROUP BY 1 ORDER BY n DESC"],
  ['what we derived vs what the source stated', "SELECT _derived, count(*) n FROM _stage_product\nGROUP BY 1 ORDER BY n DESC LIMIT 20"],
  ['find a product across every source', "SELECT _source, brand, product_name, size_ml, price\nFROM _stage_product WHERE product_name ILIKE '%buffalo trace%'\nLIMIT 50"]
];

/* ── boot ─────────────────────────────────────────────────────────── */
(async function boot(){
  $('#recs').innerHTML = RECIPES.map(([t, q]) =>
    `<button class="rec" data-q="${esc(q)}"><b>${esc(t)}</b>${esc(q)}</button>`).join('');
  $('#recs').addEventListener('click', e => {
    const b = e.target.closest('.rec'); if (!b) return;
    const ta = $('#sql'), cur = ta.value.trim();
    ta.value = cur ? cur.replace(/;?\s*$/, ';') + '\n\n' + b.dataset.q : b.dataset.q;
    ta.selectionStart = ta.selectionEnd = ta.value.length;
    markCurrent(); runCurrent();
  });
  renderHistory();
  try {
    const m = await (await fetch('/api/monitor')).json();
    const w = m.warehouse || {};
    const prod = /hoodie-suite-wareho/.test(w.uri || w.bucket || '') || w.remote;
    $('#wh').className = 'wh ' + (prod ? 'prod' : 'local');
    $('#wh').textContent = w.bucket || w.uri || (prod ? 'warehouse' : 'local');
  } catch (e) { $('#wh').textContent = 'warehouse'; }
  await loadTables();
  refreshJoinable();
})();

async function loadTables(){
  try {
    const r = await (await fetch('/api/sql/tables')).json();
    TABLES = r.tables || [];
    $('#stamp').textContent = TABLES.length + ' tables · ' +
      num(TABLES.reduce((a, t) => a + (t.rows || 0), 0)) + ' rows';
    drawTables();
  } catch (e) {
    $('#tlist').innerHTML = '<div class="empty" style="padding:18px 12px">could not list tables — is the agent running?</div>';
  }
}

function drawTables(){
  const rows = visible();
  $('#tlist').innerHTML = rows.length ? rows.map(t => `
    <div class="t ${OPEN === t.name ? 'open' : ''} ${SEL.includes(t.name) ? 'sel' : ''}"
         draggable="true" data-n="${esc(t.name)}">
      <span class="n">${esc(t.name)}${t.partitioned ? '<span class="p">parts</span>' : ''}</span>
      <span class="r">${num(t.rows)} rows</span>
    </div>${OPEN === t.name ? '<div class="cols" id="cols"><div class="col">loading…</div></div>' : ''}`).join('')
    : `<div class="empty" style="padding:18px 12px">${JOINABLE ? 'nothing else joins to what you have — '
        + 'click the bar above to show all tables' : 'no table matches'}</div>`;
}

$('#find').addEventListener('input', drawTables);

[['#sql', names => dropOnEditor(names)], ['#canvas', names => addToCanvas(names)]].forEach(([sel, fn]) => {
  const el = document.querySelector(sel);
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drop'); });
  el.addEventListener('dragleave', () => el.classList.remove('drop'));
  el.addEventListener('drop', e => {
    e.preventDefault(); el.classList.remove('drop');
    const raw = e.dataTransfer.getData('text/hoodie-tables');
    if (raw) fn(JSON.parse(raw));
  });
});

// the joinable filter follows what you have written, debounced so typing stays smooth
let _jt;
$('#sql').addEventListener('input', () => { clearTimeout(_jt); _jt = setTimeout(refreshJoinable, 500); });

$('#tlist').addEventListener('dragstart', e => {
  const t = e.target.closest('.t'); if (!t) return;
  // Dragging an unselected row drags just that row — the selection is a convenience, never a trap
  // that carries tables you forgot were highlighted.
  const names = SEL.includes(t.dataset.n) ? SEL : [t.dataset.n];
  e.dataTransfer.setData('text/hoodie-tables', JSON.stringify(names));
  e.dataTransfer.setData('text/plain', names.join(', '));
});

$('#tlist').addEventListener('click', async e => {
  const col = e.target.closest('.col');
  if (col) { insert(col.dataset.c); return; }
  const t = e.target.closest('.t'); if (!t) return;
  const name = t.dataset.n;
  pick(name, e);
  if (OPEN === name) { OPEN = null; drawTables(); return; }
  OPEN = name; drawTables();
  // Clicking a table is a QUESTION ("what's in here?"), so answer it: seed the editor with a read.
  // Clicking a table appends rather than overwrites — the scratchpad is the point, and losing what you
  // already wrote to look at a column list would make the sidebar hostile.
  const ta = $('#sql'), cur = ta.value.trim();
  ta.value = cur ? cur.replace(/;?\s*$/, ';') + `\n\nSELECT * FROM ${name} LIMIT 25` : `SELECT * FROM ${name} LIMIT 25`;
  ta.selectionStart = ta.selectionEnd = ta.value.length;
  markCurrent();
  try {
    const r = await (await fetch('/api/sql/columns?name=' + encodeURIComponent(name))).json();
    const box = $('#cols'); if (!box) return;
    box.innerHTML = (r.columns || []).length
      ? r.columns.map(c => `<div class="col" data-c="${esc(c.name)}">${esc(c.name)}<span class="ty">${esc(c.type)}</span></div>`).join('')
      : `<div class="col">${esc(r.error || 'no columns')}</div>`;
  } catch (err) {}
});

function insert(text){
  const ta = $('#sql'), s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
  ta.focus(); ta.selectionStart = ta.selectionEnd = s + text.length;
}


/* ── the sidebar becomes a source, not just a list ─────────────────
   Multi-select (click, ⇧ for a range, ⌘ to add) and drag. Dropped on the editor it writes SQL;
   dropped on the canvas it becomes a card. Same gesture, two destinations.                        */
let SEL = [], ANCHOR = null;

function visible(){
  const q = $('#find').value.trim().toLowerCase();
  let rows = TABLES.filter(t => !q || t.name.toLowerCase().includes(q));
  if (JOINABLE) rows = rows.filter(t => JOINABLE.has(t.name));
  return rows;
}

function pick(name, e){
  const rows = visible().map(t => t.name);
  if (e.shiftKey && ANCHOR != null){
    const a = rows.indexOf(ANCHOR), b = rows.indexOf(name);
    if (a >= 0 && b >= 0) SEL = rows.slice(Math.min(a,b), Math.max(a,b) + 1);
  } else if (e.metaKey || e.ctrlKey){
    SEL = SEL.includes(name) ? SEL.filter(n => n !== name) : SEL.concat(name);
    ANCHOR = name;
  } else { SEL = [name]; ANCHOR = name; }
  drawTables();
}

/* Dropping tables on the EDITOR writes SQL rather than pasting names: one table is a SELECT, several
   are a join if we know how they relate. Anything we cannot link is left as a comment naming itself,
   because a silent omission is how you end up querying two of the three tables you dragged. */
async function dropOnEditor(names){
  const ta = $('#sql');
  let sql;
  if (names.length === 1){
    sql = `SELECT * FROM ${names[0]} LIMIT 25`;
  } else {
    const g = await graph(names);
    const spec = {tables: names, joins: g.links, limit: 200,
                  select: names.flatMap(n => ((g.tables.find(t => t.name === n) || {}).columns || [])
                                              .slice(0, 4).map(c => ({table: n, column: c})))};
    const r = await (await fetch('/api/sql/compose', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(spec)})).json();
    sql = r.ok ? r.sql : `-- ${r.error}\nSELECT * FROM ${names[0]} LIMIT 25`;
  }
  const cur = ta.value.trim();
  ta.value = cur ? cur.replace(/;?\s*$/, ';') + '\n\n' + sql : sql;
  ta.selectionStart = ta.selectionEnd = ta.value.length;
  ta.focus(); markCurrent();
}

/* ── joinable filter: the sidebar answers "what can I add next?" ───
   Reading the tables already in your statement and hiding everything that cannot attach to them turns
   292 tables into the handful that are actually reachable. It is a FILTER, never a fact — the chip
   says how many were hidden and clicking it takes you back to all of them.                          */
let JOINABLE = null;

async function refreshJoinable(){
  if (!JOIN_FILTER){ JOINABLE = null; $('#joinable').className = 'joinable'; drawTables(); return; }
  const known = new Set(TABLES.map(t => t.name));
  const inSql = [...new Set((($('#sql').value.match(/[a-zA-Z_][a-zA-Z_0-9]*/g)) || [])
                  .filter(w => known.has(w)))];
  if (!inSql.length){ JOINABLE = null; $('#joinable').className = 'joinable'; drawTables(); return; }
  const cand = TABLES.map(t => t.name).filter(n => !inSql.includes(n));
  // Ask in ONE call: the graph over (what you have + everything else) and keep whatever linked.
  const g = await graph(inSql.concat(cand));
  const ok = new Set(inSql);
  (g.links || []).forEach(l => {
    if (inSql.includes(l.left)) ok.add(l.right);
    if (inSql.includes(l.right)) ok.add(l.left);
  });
  JOINABLE = ok;
  $('#joinable').className = 'joinable on';
  $('#joinable').innerHTML = `joins to ${esc(inSql.join(', '))} — ${TABLES.length - ok.size} hidden · show all ✕`;
  drawTables();
}
$('#joinable').addEventListener('click', () => { JOIN_FILTER = false; refreshJoinable(); });

/* ── the canvas ────────────────────────────────────────────────── */
let CANVAS = [], FIELDS = {}, GRAPH = {tables: [], links: []}, LINKS = [], PROBES = {};

async function graph(names){
  try {
    return await (await fetch('/api/sql/graph', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({tables: names})})).json();
  } catch (e) { return {tables: [], links: []}; }
}

async function addToCanvas(names){
  names.forEach(n => { if (!CANVAS.includes(n)) CANVAS.push(n); });
  GRAPH = await graph(CANVAS);
  LINKS = (GRAPH.links || []).map(l => ({...l, type: 'inner', on: l.on}));
  drawCanvas();
}

function drawCanvas(){
  $('#cards').innerHTML = CANVAS.map(n => {
    const t = (GRAPH.tables || []).find(x => x.name === n) || {columns: [], keys: []};
    const keys = new Set(t.keys || []);
    return `<div class="card"><h3>${esc(n)}<span class="x" data-drop="${esc(n)}">✕</span></h3>
      <div class="fl">${(t.columns || []).map(c =>
        `<label><input type="checkbox" data-t="${esc(n)}" data-c="${esc(c)}"${
          (FIELDS[n] || []).includes(c) ? ' checked' : ''}>${esc(c)}${
          keys.has(c) ? '<span class="k">key</span>' : ''}</label>`).join('')}</div></div>`;
  }).join('') || '<div class="empty">Drag tables here from the left. Select several with ⇧ or ⌘.</div>';

  $('#joins').innerHTML = !LINKS.length ? (CANVAS.length > 1
    ? '<div class="join"><span class="basis shared">no link</span><span class="why">These tables share no '
      + 'column we can join on. Adding one that links them — or writing the ON clause yourself in SQL mode — '
      + 'is the way forward; a join we cannot justify is one you should not run.</span></div>' : '')
    : LINKS.map((l, i) => {
      const p = PROBES[i];
      return `<div class="join">
        <span class="basis ${l.basis}">${l.basis}</span>
        <code>${esc(l.left)} ${l.type.toUpperCase()} JOIN ${esc(l.right)} ON ${
          l.on.map(o => `${l.left}.${o[0]} = ${l.right}.${o[1]}`).join(' AND ')}</code>
        <select data-j="${i}" style="padding:3px 7px;font-size:11px">
          <option value="inner"${l.type === 'inner' ? ' selected' : ''}>inner</option>
          <option value="left"${l.type === 'left' ? ' selected' : ''}>left</option>
        </select>
        <button data-probe="${i}" style="padding:3px 9px;font-size:11px">Verify</button>
        ${p ? `<span class="measured" style="color:${p.ok && p.match_pct >= 50 ? 'var(--good)' : 'var(--warn)'}">${
          p.ok ? `${p.match_pct}% of sampled keys match (${num(p.matched)}/${num(p.left_keys)}, sample)`
               : esc(p.error || 'probe failed')}</span>` : ''}
        <span class="why">${esc(l.why)}</span></div>`;
    }).join('');
  compose();
}

$('#cards').addEventListener('change', e => {
  const cb = e.target.closest('input[type=checkbox]'); if (!cb) return;
  const t = cb.dataset.t, c = cb.dataset.c;
  FIELDS[t] = FIELDS[t] || [];
  FIELDS[t] = cb.checked ? FIELDS[t].concat(c) : FIELDS[t].filter(x => x !== c);
  compose();
});
$('#cards').addEventListener('click', async e => {
  const x = e.target.closest('.x'); if (!x) return;
  CANVAS = CANVAS.filter(n => n !== x.dataset.drop);
  delete FIELDS[x.dataset.drop]; PROBES = {};
  GRAPH = await graph(CANVAS);
  LINKS = (GRAPH.links || []).map(l => ({...l, type: 'inner'}));
  drawCanvas();
});
$('#joins').addEventListener('change', e => {
  const sel = e.target.closest('select[data-j]'); if (!sel) return;
  LINKS[+sel.dataset.j].type = sel.value; drawCanvas();
});
$('#joins').addEventListener('click', async e => {
  const b = e.target.closest('button[data-probe]'); if (!b) return;
  const i = +b.dataset.probe, l = LINKS[i];
  b.disabled = true; b.textContent = 'Measuring…';
  try {
    PROBES[i] = await (await fetch('/api/sql/probe', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({left: l.left, right: l.right, on: l.on})})).json();
  } catch (err) { PROBES[i] = {ok:false, error:'probe failed'}; }
  drawCanvas();
});

async function compose(){
  const select = Object.entries(FIELDS).flatMap(([t, cs]) => cs.map(c => ({table: t, column: c})));
  if (!CANVAS.length || !select.length){
    $('#gensql').innerHTML = CANVAS.length
      ? '<div class="empty" style="padding:14px 0">Tick the fields you want and the SQL writes itself.</div>' : '';
    return;
  }
  const r = await (await fetch('/api/sql/compose', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({tables: CANVAS, select, joins: LINKS, limit: 200})})).json();
  $('#gensql').innerHTML = r.ok
    ? `<div class="rec" style="cursor:default">${esc(r.sql)}</div>
       <button class="go" id="useit">Run this</button>
       <button id="toed">Send to SQL</button>`
    : `<div class="join"><span class="basis shared">can't build</span><span class="why">${esc(r.error)}</span></div>`;
  if (r.ok){
    $('#useit').onclick = () => { toEditor(r.sql); mode('sql'); runCurrent(); };
    $('#toed').onclick = () => { toEditor(r.sql); mode('sql'); };
  }
}

function toEditor(sql){
  const ta = $('#sql'), cur = ta.value.trim();
  ta.value = cur ? cur.replace(/;?\s*$/, ';') + '\n\n' + sql : sql;
  ta.selectionStart = ta.selectionEnd = ta.value.length; markCurrent();
}

/* ── mode ──────────────────────────────────────────────────────── */
function mode(m){
  const join = m === 'join';
  $('#mJoin').className = join ? 'on' : '';
  $('#mSql').className = join ? '' : 'on';
  $('#canvas').className = join ? 'canvas on' : 'canvas';
  $('#grid').style.display = join ? 'none' : '';
  document.querySelector('.ed').style.display = join ? 'none' : '';
  document.querySelector('.foot').style.display = join ? 'none' : '';
}
$('#mSql').addEventListener('click', () => mode('sql'));
$('#mJoin').addEventListener('click', () => mode('join'));

/* ── the workspace: many statements in one editor ──────────────────
   A scratchpad is how anyone actually uses SQL — you keep the last five things you asked next to the
   one you're asking now. So the editor holds as many statements as you like and ⌘+↵ runs THE ONE YOUR
   CURSOR IS IN, leaving the rest untouched. Run all executes them top to bottom, one result per tab.

   The SERVER still accepts exactly one statement per request — that guard is what stops a read from
   carrying a write, and it does not get relaxed for convenience. Splitting happens here, and each
   statement goes over the wire on its own.                                                          */
function statements(sql){
  // Same literal/comment handling as the server's _strip: a ';' inside a string or a comment is not a
  // separator. Getting this wrong would split `WHERE note = 'a; b'` into two broken statements.
  const out = []; let start = 0, i = 0;
  while (i < sql.length){
    const c = sql[i];
    if (c === '-' && sql.slice(i, i+2) === '--'){ const j = sql.indexOf('\n', i); i = j < 0 ? sql.length : j; }
    else if (c === '/' && sql.slice(i, i+2) === '/*'){ const j = sql.indexOf('*/', i+2); i = j < 0 ? sql.length : j+2; }
    else if (c === "'" || c === '"'){
      const q = c; i++;
      while (i < sql.length){
        if (sql[i] === q){ if (sql[i+1] === q){ i += 2; continue; } i++; break; }
        if (sql[i] === '\\' && q === "'"){ i += 2; continue; }
        i++;
      }
    }
    else if (c === ';'){ out.push({start, end: i, sql: sql.slice(start, i)}); i++; start = i; }
    else i++;
  }
  if (sql.slice(start).trim()) out.push({start, end: sql.length, sql: sql.slice(start)});
  return out.filter(s => s.sql.trim());
}

function current(){
  const ta = $('#sql'), pos = ta.selectionStart, all = statements(ta.value);
  if (!all.length) return null;
  // The cursor sitting just past a ';' belongs to the statement you just finished typing, not the
  // empty space after it — so bias to the last statement that starts at or before the caret.
  for (let i = all.length - 1; i >= 0; i--) if (all[i].start <= pos) return all[i];
  return all[0];
}

$('#go').addEventListener('click', () => runCurrent());
$('#runall').addEventListener('click', () => runAll());
$('#sql').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
    e.preventDefault();
    e.shiftKey ? runAll() : runCurrent();
  }
});
$('#sql').addEventListener('keyup', markCurrent);
$('#sql').addEventListener('click', markCurrent);

function markCurrent(){
  const all = statements($('#sql').value);
  const cur = current();
  $('#which').textContent = all.length > 1 && cur
    ? `statement ${all.indexOf(all.find(s => s.start === cur.start)) + 1} of ${all.length}` : '';
}

async function one(sql){
  try {
    return await (await fetch('/api/sql', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({sql, all_parts: $('#allparts').checked})})).json();
  } catch (e) { return {ok:false, error:'request failed: ' + e}; }
}

async function runCurrent(){
  const c = current(); if (!c) return;
  await execute([c.sql]);
}

async function runAll(){
  const all = statements($('#sql').value);
  if (!all.length) return;
  await execute(all.map(s => s.sql));
}

async function execute(list){
  $('#go').disabled = $('#runall').disabled = true;
  $('#go').textContent = 'Running…';
  $('#msg').className = 'msg'; $('#bound').textContent = ''; RESULTS = [];
  for (let i = 0; i < list.length; i++){
    $('#foot').textContent = list.length > 1
      ? `running ${i + 1} of ${list.length}…` : 'running…';
    const r = await one(list[i]);
    RESULTS.push({sql: list[i], r});
    if (r.ok) remember(list[i]);
    drawTabs(); show(i);
    // Stop on the first failure rather than plough on: statement 3 usually depends on statement 2,
    // and a wall of errors caused by one broken statement tells you nothing about which broke.
    if (!r.ok && list.length > 1){
      $('#foot').textContent = `stopped at statement ${i + 1} of ${list.length} — it failed`;
      break;
    }
  }
  $('#go').disabled = $('#runall').disabled = false;
  $('#go').textContent = 'Run';
}

function drawTabs(){
  const bar = $('#tabs');
  if (RESULTS.length < 2){ bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  bar.innerHTML = RESULTS.map((x, i) =>
    `<div class="rtab ${i === SHOWN ? 'on' : ''} ${x.r.ok ? '' : 'bad'}" data-i="${i}">${i + 1}. ${
      esc(x.sql.replace(/\s+/g, ' ').trim().slice(0, 34))}${x.sql.length > 34 ? '…' : ''}</div>`).join('');
}
$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('.rtab'); if (t) show(+t.dataset.i);
});

function show(i){
  SHOWN = i; drawTabs();
  const {sql, r} = RESULTS[i];
  if (!r.ok){
    $('#msg').className = 'msg show err';
    $('#msg').textContent = (r.refused ? '' : 'error: ') + r.error;
    $('#grid').innerHTML = '<div class="empty">no result — the statement above failed.</div>';
    $('#foot').textContent = 'failed';
    $('#csv').disabled = true;
    return;
  }
  LAST = r;
  const notes = [];
  // A SCOPED bind is the most misleading thing this console can do — a 30-day answer that looks
  // all-time. It gets said first, in full, every time, with the way to turn it off.
  (r.scopes || []).forEach(s => notes.push(
    `${s.table} is partitioned into ${num(s.total_parts)} parts — too many to open at once, so this ` +
    `query read the most recent ${s.days} day(s) only (${s.from} → ${s.to}, ${num(s.bound_parts)} parts). ` +
    `Every number below covers that window, not all time. Tick "all parts" to scan everything (slow).`));
  // Truncation is stated, never implied — a capped result that looks complete is the whole reason
  // people stop trusting a console.
  if (r.truncated) notes.push(
    `showing the first ${num(r.row_count)} rows — there are more. Add a LIMIT, an aggregate, or a tighter WHERE to see the whole answer.`);
  $('#msg').className = notes.length ? 'msg show warn' : 'msg';
  $('#msg').textContent = notes.join('\n\n');
  draw(r);
  $('#foot').textContent = `${num(r.row_count)}${r.truncated ? '+' : ''} rows · ${r.elapsed_s}s`;
  const sc = (r.scopes || []).map(s => `${s.table}: last ${s.days}d of ${num(s.total_parts)} parts`);
  $('#bound').textContent = sc.length ? '⚠ ' + sc.join(' · ')
    : (r.bound && r.bound.length ? 'bound: ' + r.bound.join(', ') : '');
  $('#bound').style.color = sc.length ? 'var(--warn)' : '';
  $('#csv').disabled = false;
}

function draw(r){
  const w = $('#welcome'); if (w) w.remove();
  if (!r.rows.length) {
    $('#grid').innerHTML = '<div class="empty">0 rows. The query ran — the warehouse has nothing matching it.</div>';
    return;
  }
  const isNum = r.columns.map((_, i) => r.rows.every(row => row[i] == null || typeof row[i] === 'number'));
  const head = '<tr><th class="rn"></th>' + r.columns.map(c => `<th>${esc(c)}</th>`).join('') + '</tr>';
  const body = r.rows.map((row, i) => '<tr><td class="rn">' + (i + 1) + '</td>' + row.map((v, j) =>
    v == null ? '<td class="null">null</td>'
              : `<td class="${isNum[j] ? 'num' : ''}">${esc(v)}</td>`).join('') + '</tr>').join('');
  $('#grid').innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

/* ── CSV: the result leaves as data, not as a screenshot ──────────── */
$('#csv').addEventListener('click', () => {
  if (!LAST) return;
  const q = v => v == null ? '' : /[",\n]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const csv = [LAST.columns.map(q).join(',')].concat(LAST.rows.map(r => r.map(q).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = 'hoodie-sql-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '') + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
});

/* ── history: local only, so a half-written query survives a reload ─ */
const HKEY = 'hoodie.sql.history';
function remember(sql){
  let h = []; try { h = JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) {}
  h = [sql].concat(h.filter(x => x !== sql)).slice(0, 40);
  localStorage.setItem(HKEY, JSON.stringify(h));
  renderHistory();
}
function renderHistory(){
  let h = []; try { h = JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) {}
  $('#hist').innerHTML = '<option value="">history…</option>' +
    h.map((s, i) => `<option value="${i}">${esc(s.replace(/\s+/g, ' ').slice(0, 70))}</option>`).join('');
  $('#hist').onchange = e => {
    if (e.target.value === '') return;
    $('#sql').value = h[+e.target.value]; e.target.value = ''; $('#sql').focus();
  };
}
$('#sql').addEventListener('input', () => sessionStorage.setItem('hoodie.sql.draft', $('#sql').value));
$('#sql').value = sessionStorage.getItem('hoodie.sql.draft') || '';
markCurrent();
</script>

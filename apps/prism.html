<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prism</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="prism.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prism">
<link rel="apple-touch-icon" href="prism-icon-180.png">
<link rel="icon" href="prism-icon-192.png">
<style>
  /* Tableau-style theme: cool neutral chrome, restrained palette, crisp data tables. */
  :root{
    --bg:#F1F3F5; --card:#FFFFFF; --chrome:#FFFFFF;
    --line:#E4E7EB; --line-2:#D3D8DE; --grid:#EDF0F2;
    --text:#2B3138; --text-2:#4A525B; --muted:#7A828B;
    --blue:#4E79A7; --blue-ink:#3B5F86;
    --up:#4E9A5A; --up-bg:rgba(78,154,90,.10); --down:#D8544F; --down-bg:rgba(216,84,79,.10);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --font:"Trebuchet MS","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    --num:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);overscroll-behavior:none}
  body{font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased}
  .num{font-family:var(--num);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .app{display:flex;flex-direction:column;height:100dvh;max-width:540px;margin:0 auto;
    background:var(--bg);position:relative;overflow:hidden}

  /* ---- app bar ---- */
  .appbar{flex:0 0 auto;background:var(--chrome);color:var(--text);
    padding:calc(var(--safe-t) + 10px) 15px 10px;display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line)}
  .appbar .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit}
  .appbar .glyph{width:25px;height:25px;flex:0 0 auto}
  .appbar .wm{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .appbar .nm{font-weight:700;font-size:16px;letter-spacing:.01em;margin-left:-3px;color:var(--text)}
  .measbtn{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--card);
    color:var(--blue-ink);border:1px solid var(--line-2);border-radius:6px;
    padding:7px 11px;font-family:var(--font);font-size:12.5px;font-weight:700;cursor:pointer}
  .measbtn svg{width:11px;height:11px;color:var(--muted)}
  .instbtn{margin-left:8px;display:flex;align-items:center;justify-content:center;width:34px;height:32px;
    background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:6px;cursor:pointer;padding:0}
  .instbtn svg{width:16px;height:16px}
  .instbtn[hidden]{display:none}

  /* ---- views ---- */
  .views{flex:1 1 auto;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 13px calc(94px + var(--safe-b));display:none}
  .view.active{display:block;animation:vin .2s ease}
  @keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .vhead{display:flex;align-items:baseline;gap:8px;margin:2px 2px 13px}
  .vhead h1{font-size:21px;font-weight:700;letter-spacing:.005em;margin:0}
  .vhead .sub{font-size:12.5px;color:var(--muted);font-weight:600}
  .src{margin-left:auto;display:inline-flex;align-items:center;gap:5px;
    font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .src .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .src.live .dot{background:var(--up)} .src.live{color:var(--up)}

  /* ---- pulse feed ---- */
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:13px 14px;
    margin-bottom:9px;cursor:pointer;transition:border-color .12s ease}
  .pcard:active{border-color:var(--line-2)}
  .pcard .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .pcard .dimtag{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .pcard .arw{margin-left:auto;font-size:12px}
  .arw.up{color:var(--up)} .arw.down{color:var(--down)}
  .pcard .mid{display:flex;align-items:baseline;gap:12px}
  .pcard .member{font-size:17px;font-weight:700;letter-spacing:.005em;flex:1 1 auto;line-height:1.15}
  .pcard .big{font-size:23px;font-weight:700;letter-spacing:-.01em}
  .big.up{color:var(--up)} .big.down{color:var(--down)} .big.neu{color:var(--text)}
  .pcard .spark{margin:9px 0 7px}
  .pcard .say{font-size:13px;line-height:1.42;color:var(--text-2)}

  /* ---- measure chips (cuts) ---- */
  .mrow{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding:1px 2px 12px;margin:0 -2px;scrollbar-width:none}
  .mrow::-webkit-scrollbar{display:none}
  .mchip{flex:0 0 auto;background:var(--card);border:1px solid var(--line-2);border-radius:6px;
    padding:7px 12px;font-size:12px;font-weight:700;color:var(--text-2);cursor:pointer;white-space:nowrap}
  .mchip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

  /* ---- cut cards = crisp data tables ---- */
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:7px;
    margin-bottom:11px;overflow:hidden}
  .ccard .chead{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;
    border-bottom:1px solid var(--line)}
  .ccard .chead h2{font-size:14px;font-weight:700;letter-spacing:.01em;margin:0}
  .ccard .chead .cn{font-size:10px;color:var(--muted);font-weight:700;
    background:var(--grid);padding:2px 6px;border-radius:4px}
  .ccard .chead .chev{margin-left:auto;color:var(--muted);transition:transform .2s ease;display:flex}
  .ccard.open .chev{transform:rotate(180deg)}
  /* aligned grid: member | sparkline | value | delta */
  .cth,.crow{display:grid;grid-template-columns:1fr 56px 62px 46px;align-items:center;
    column-gap:10px;padding:0 14px}
  .cth{height:26px;border-bottom:1px solid var(--line)}
  .cth span{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .cth .r{text-align:right}
  .crow{min-height:40px;border-bottom:1px solid var(--grid);cursor:pointer}
  .crow:last-of-type{border-bottom:0}
  .crow:active{background:var(--grid)}
  .crow .rn{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .crow .rspark{display:flex;justify-content:flex-end}
  .crow .rv{font-size:13.5px;font-weight:700;text-align:right}
  .crow .rd{font-size:11.5px;font-weight:700;text-align:right}
  .rv.up,.rd.up{color:var(--up)} .rv.down,.rd.down{color:var(--down)} .rv.neu{color:var(--text)}
  .crow.hidden{display:none}
  .cmore{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;font-weight:700;
    color:var(--blue);cursor:pointer;text-align:center;letter-spacing:.01em}

  /* ---- bottom nav ---- */
  .tabbar{flex:0 0 auto;display:flex;background:var(--chrome);
    padding:7px 0 calc(7px + var(--safe-b));border-top:1px solid var(--line)}
  .tab{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;
    align-items:center;gap:3px;font-family:var(--font);font-size:10.5px;font-weight:700;cursor:pointer;
    letter-spacing:.01em}
  .tab svg{width:21px;height:21px}
  .tab.on{color:var(--blue)}

  /* ---- bottom sheet ---- */
  .sheet-bd{position:absolute;inset:0;background:rgba(43,49,56,.42);opacity:0;pointer-events:none;
    transition:opacity .2s ease;z-index:20}
  .sheet-bd.show{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);z-index:21;
    border-radius:12px 12px 0 0;transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
    max-height:86%;overflow-y:auto;padding:8px 18px calc(22px + var(--safe-b));
    box-shadow:0 -6px 26px rgba(43,49,56,.16);border:1px solid var(--line);border-bottom:0}
  .sheet.show{transform:none}
  .grab{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:8px auto 8px}
  .sheet h3{font-size:19px;font-weight:700;letter-spacing:.005em;margin:6px 0 2px}
  .sheet .sdim{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .drillbig{display:flex;align-items:baseline;gap:10px;margin:12px 0 2px}
  .drillbig .n{font-size:38px;font-weight:700;letter-spacing:-.015em}
  .n.up{color:var(--up)} .n.down{color:var(--down)} .n.neu{color:var(--text)}
  .drillbig .lb{font-size:12px;color:var(--muted);font-weight:600}
  .drilld{font-size:13px;font-weight:700;margin-bottom:4px}
  .drilld.up{color:var(--up)} .drilld.down{color:var(--down)}
  .cap{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:15px 0 6px}
  .note{background:var(--grid);border:1px solid var(--line);border-radius:7px;
    padding:11px 13px;font-size:12.5px;line-height:1.45;color:var(--text-2);margin-top:16px}
  .note a{color:var(--blue);font-weight:700;text-decoration:none}
  .mlist{margin:8px 0 0}
  .mopt{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);
    font-size:15px;font-weight:600;cursor:pointer;color:var(--text-2)}
  .mopt .tick{margin-left:auto;color:var(--blue);font-weight:800;opacity:0}
  .mopt.on .tick{opacity:1} .mopt.on{color:var(--text)}
  .mopt .k{font-size:9px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);background:var(--grid);padding:3px 7px;border-radius:4px;font-weight:700}

  .ihint{position:absolute;left:12px;right:12px;bottom:calc(82px + var(--safe-b));z-index:15;
    background:var(--text);color:#fff;border-radius:8px;padding:11px 13px;display:none;
    align-items:center;gap:10px;font-size:12.5px;box-shadow:0 5px 20px rgba(43,49,56,.24)}
  .ihint.show{display:flex}
  .ihint b{color:#9DC3E6} .ihint .x{margin-left:auto;opacity:.7;font-size:18px;padding:2px 4px}

  .toast{position:absolute;left:50%;transform:translateX(-50%) translateY(18px);
    bottom:calc(94px + var(--safe-b));background:var(--text);color:#fff;font-size:12.5px;
    padding:9px 15px;border-radius:6px;opacity:0;transition:all .2s ease;z-index:30;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

  <div class="toast" id="toast"></div>

  <div class="sheet-bd" id="sheetbd"></div>
  <div class="sheet" id="sheet"></div>
</div>

(function(){
  var STATE = { measure:'vol_growth', data:PRISM_FALLBACK, source:'offline', open:{}, tab:'pulse' };
  var $ = function(s,r){ return (r||document).querySelector(s); };
  var CUP='#4E9A5A', CDN='#D8544F', CBLUE='#4E79A7';
  function measByKey(k){ return (STATE.data.measures||[]).find(function(m){return m.key===k;}) || {unit:'pct',kind:'growth',label:k}; }
  function isGrowth(m){ return m.kind!=='level'; }

  function fmt(v, unit, signed){
    var s = signed && v>=0 ? '+' : '';
    if(unit==='pct') return s + v.toFixed(1) + '%';
    if(unit==='idx') return s + Math.round(v);
    return s + v.toFixed(1);
  }
  // the headline value shown on pulse/drill/leaderboard = the measure's own value
  function valDisp(item, meas){
    var g = isGrowth(meas);
    return { n: fmt(item.value, meas.unit, g), cls: g ? (item.value>=0?'up':'down') : 'neu' };
  }

  function spark(vals, w, h, color){
    if(!vals || !vals.length) return '';
    var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), rng=(mx-mn)||1, pad=2.5;
    var pts = vals.map(function(v,i){
      var x = pad + i*(w-2*pad)/(vals.length-1);
      var y = pad + (h-2*pad)*(1-(v-mn)/rng);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    var lastY = pad + (h-2*pad)*(1-(vals[vals.length-1]-mn)/rng);
    return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" fill="none" style="display:block">'
      + '<polyline points="'+pts+'" stroke="'+color+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'
      + '<circle cx="'+(w-pad).toFixed(1)+'" cy="'+lastY.toFixed(1)+'" r="1.9" fill="'+color+'"/></svg>';
  }

  /* ---------- render: pulse ---------- */
  function renderPulse(){
    var meas = measByKey(STATE.measure), d = STATE.data;
    var h = '<div class="vhead"><h1>Pulse</h1><span class="sub">'+esc(meas.label)+'</span>'
      + '<span class="src '+(STATE.source==='live'?'live':'')+'"><span class="dot"></span>'
      + (STATE.source==='live'?'Live':'Modeled')+'</span></div>';
    (d.pulse||[]).forEach(function(p,i){
      var col = p.up?CUP:CDN, vd = valDisp(p, meas);
      h += '<div class="pcard" data-kind="pulse" data-i="'+i+'">'
        + '<div class="top"><span class="dimtag">'+esc(p.dim_label)+'</span>'
        +   '<span class="arw '+(p.up?'up':'down')+'">'+(p.up?'▲':'▼')+'</span></div>'
        + '<div class="mid"><span class="member">'+esc(p.member)+'</span>'
        +   '<span class="big num '+(p.up?'up':'down')+'">'+vd.n+'</span></div>'
        + spark(p.spark, 320, 38, col)
        + '<div class="say">'+esc(p.text)+'</div></div>';
    });
    h += '<div class="note">'+esc(d.provenance||'')+'</div>';
    $('#view-pulse').innerHTML = h;
  }

  /* ---------- render: cuts (crisp tables) ---------- */
  function renderCuts(){
    var meas = measByKey(STATE.measure), d = STATE.data, g = isGrowth(meas);
    var h = '<div class="vhead"><h1>Cuts</h1><span class="sub">'+esc(meas.label)+'</span>'
      + '<span class="src '+(STATE.source==='live'?'live':'')+'"><span class="dot"></span>'
      + (STATE.source==='live'?'Live':'Modeled')+'</span></div>';
    h += '<div class="mrow">';
    (d.measures||[]).forEach(function(m){
      h += '<button class="mchip '+(m.key===STATE.measure?'on':'')+'" data-meas="'+m.key+'">'+esc(m.label)+'</button>';
    });
    h += '</div>';
    (d.cuts||[]).forEach(function(c){
      var openC = !!STATE.open[c.dim];
      h += '<div class="ccard'+(openC?' open':'')+'" data-dim="'+c.dim+'">'
        + '<div class="chead" data-toggle="'+c.dim+'"><h2>'+esc(c.label)+'</h2>'
        +   '<span class="cn num">'+c.rows.length+'</span>'
        +   '<span class="chev"><svg width="13" height="13" viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>'
        + '<div class="cth"><span>'+esc(c.label)+'</span><span class="r">12&#8209;mo</span><span class="r">Value</span><span class="r">&#916;</span></div>';
      c.rows.forEach(function(r,ri){
        var vd = valDisp(r, meas), scol = g ? (r.value>=0?CUP:CDN) : CBLUE;
        var dcls = r.delta>=0?'up':'down', dtxt = (r.delta>=0?'+':'')+r.delta.toFixed(1);
        var hide = (!openC && ri>=4) ? ' hidden' : '';
        h += '<div class="crow'+hide+'" data-kind="cut" data-dim="'+c.dim+'" data-ri="'+ri+'">'
          + '<span class="rn">'+esc(r.name)+'</span>'
          + '<span class="rspark">'+spark(r.spark, 54, 20, scol)+'</span>'
          + '<span class="rv num '+vd.cls+'">'+vd.n+'</span>'
          + '<span class="rd num '+dcls+'">'+dtxt+'</span></div>';
      });
      if(c.rows.length>4) h += '<div class="cmore" data-toggle="'+c.dim+'">'+(openC?'Show less':'Show all '+c.rows.length)+'</div>';
      h += '</div>';
    });
    $('#view-cuts').innerHTML = h;
  }

  function renderMeasureLabel(){ $('#measlbl').textContent = measByKey(STATE.measure).label; }
  function renderAll(){ renderMeasureLabel(); renderPulse(); renderCuts(); }

  /* ---------- drill sheet ---------- */
  function openDrill(item, dimLabel){
    var meas = measByKey(STATE.measure), vd = valDisp(item, meas);
    var scol = isGrowth(meas) ? (item.value>=0?CUP:CDN) : CBLUE;
    var pct = Math.round((item.weight||0)*100);
    var h = '<div class="grab"></div>'
      + '<div class="sdim">'+esc(dimLabel)+'</div><h3>'+esc(item.name || item.member)+'</h3>'
      + '<div class="drillbig"><span class="n num '+vd.cls+'">'+vd.n+'</span>'
      +   '<span class="lb">'+esc(meas.label)+'</span></div>'
      + '<div class="drilld '+(item.delta>=0?'up':'down')+'">'+(item.delta>=0?'▲':'▼')+' '
      +   fmt(item.delta,'dec',true)+' vs prior period</div>'
      + '<div class="cap">Trailing 12 months</div>'
      + spark(item.spark, 320, 60, scol)
      + '<div class="cap">Materiality</div>'
      + '<div class="num" style="font-size:14px;font-weight:700">'+pct+'% of the '+esc(dimLabel.toLowerCase())+' book</div>'
      + '<div class="note">Filters, secondary break-downs and report-building live in '
      +   '<a href="../index.html#dashboard">Hoodie Intelligence</a> on the desktop.</div>';
    $('#sheet').innerHTML = h;
    showSheet();
  }

  /* ---------- measure sheet ---------- */
  function openMeasureSheet(){
    var h = '<div class="grab"></div><h3>Measure</h3><div class="mlist">';
    (STATE.data.measures||[]).forEach(function(m){
      h += '<div class="mopt '+(m.key===STATE.measure?'on':'')+'" data-pick="'+m.key+'">'
        + '<span>'+esc(m.label)+'</span><span class="k">'+esc(m.unit)+'</span>'
        + '<span class="tick">✓</span></div>';
    });
    h += '</div>';
    $('#sheet').innerHTML = h;
    showSheet();
  }

  function showSheet(){ $('#sheetbd').classList.add('show'); $('#sheet').classList.add('show'); }
  function hideSheet(){ $('#sheetbd').classList.remove('show'); $('#sheet').classList.remove('show'); }

  /* ---------- data ---------- */
  function load(measure){
    return fetch('/api/prism?measure='+encodeURIComponent(measure), {headers:{'Accept':'application/json'}})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ STATE.data=j; STATE.source='live'; return true; })
      .catch(function(){
        if(STATE.data.measure!==measure) toast("Couldn't reach live data");
        STATE.source = (STATE.data.measure===measure) ? STATE.source : 'offline';
        return false;
      });
  }

  var _tt;
  function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(_tt); _tt=setTimeout(function(){ t.classList.remove('show'); }, 1900); }

  /* ---------- interactions ---------- */
  document.addEventListener('click', function(e){
    var t = e.target;
    var tabBtn = t.closest('.tab');
    if(tabBtn){ setTab(tabBtn.dataset.tab); return; }
    if(t.closest('#measbtn')){ openMeasureSheet(); return; }
    var pick = t.closest('[data-pick]'), chip = t.closest('[data-meas]');
    var mk = pick ? pick.dataset.pick : (chip ? chip.dataset.meas : null);
    if(mk){ pickMeasure(mk); return; }
    var tog = t.closest('[data-toggle]');
    if(tog){ var dk=tog.dataset.toggle; STATE.open[dk]=!STATE.open[dk]; renderCuts(); return; }
    var pc = t.closest('.pcard[data-kind="pulse"]');
    if(pc){ var p = STATE.data.pulse[+pc.dataset.i]; openDrill(p, p.dim_label); return; }
    var cr = t.closest('.crow[data-kind="cut"]');
    if(cr){
      var cut = (STATE.data.cuts||[]).find(function(c){return c.dim===cr.dataset.dim;});
      if(cut){ openDrill(cut.rows[+cr.dataset.ri], cut.label); } return;
    }
    if(t.closest('#instbtn')){ onInstall(); return; }
    if(t.closest('#ihintopen')){ $('#ihint').classList.remove('show'); openInstallSheet(); return; }
    if(t.closest('#sheetbd')){ hideSheet(); return; }
    if(t.id==='ihintx'){ $('#ihint').classList.remove('show'); try{localStorage.setItem('prism.ihint','1');}catch(_){} }
  });

  /* ---------- install / add to home screen ---------- */
  var deferredPrompt = null, standalone = false;
  try{ standalone = window.navigator.standalone===true || matchMedia('(display-mode: standalone)').matches; }catch(_){}
  function onInstall(){
    if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(function(){ deferredPrompt=null; }); return; }
    openInstallSheet();
  }
  function openInstallSheet(){
    var ua = navigator.userAgent, iOS = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
    var safari = /safari/i.test(ua) && !/crios|fxios|edgios|android/i.test(ua);
    var steps;
    if(iOS && safari){
      steps = 'Tap the <b>Share</b> icon — the square with an ↑ arrow, at the bottom of Safari — then scroll down and tap <b>Add to Home Screen</b>.';
    } else if(iOS){
      steps = 'On iPhone, Add to Home Screen only works in <b>Safari</b>. If you opened this from another app, tap its menu and choose <b>Open in Safari</b> — then use <b>Share → Add to Home Screen</b>.';
    } else {
      steps = 'Open your browser menu (<b>⋮</b>) and tap <b>Install app</b> or <b>Add to Home screen</b>.';
    }
    $('#sheet').innerHTML = '<div class="grab"></div><h3>Add to Home Screen</h3>'
      + '<div class="note" style="margin-top:12px">'+steps+'</div>'
      + '<div class="cap" style="margin-top:16px">Why</div>'
      + '<div style="font-size:13px;color:var(--text-2);line-height:1.5">Installing launches Prism full-screen with its own icon — a tap away, no browser chrome.</div>';
    showSheet();
  }
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt=e; if(!standalone) $('#instbtn').hidden=false; });
  window.addEventListener('appinstalled', function(){ $('#instbtn').hidden=true; deferredPrompt=null; });
  if(!standalone) $('#instbtn').hidden=false;   // iOS never fires beforeinstallprompt — show the button anyway

  function setTab(tab){
    STATE.tab = tab;
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===tab); });
    $('#view-pulse').classList.toggle('active', tab==='pulse');
    $('#view-cuts').classList.toggle('active', tab==='cuts');
    var v = $('#view-'+tab); if(v) v.scrollTop = 0;
  }

  function pickMeasure(mk){
    if(mk===STATE.measure){ hideSheet(); return; }
    STATE.measure = mk;
    renderMeasureLabel(); hideSheet();
    load(mk).then(renderAll);
  }

  /* ---------- boot ---------- */
  renderAll();
  load(STATE.measure).then(renderAll);

  try{
    var isStandalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if(isIOS && !isStandalone && !localStorage.getItem('prism.ihint')){
      setTimeout(function(){ $('#ihint').classList.add('show'); }, 1600);
    }
  }catch(_){}

  if('serviceWorker' in navigator && window.self===window.top){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('prism-sw.js').catch(function(){}); });
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
})();

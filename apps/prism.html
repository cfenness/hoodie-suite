<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prism</title>
<meta name="theme-color" content="#1B1A17">
<link rel="manifest" href="prism.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prism">
<link rel="apple-touch-icon" href="prism-icon-180.png">
<link rel="icon" href="prism-icon-192.png">
<style>
  :root{
    --ink:#1B1A17; --paper:#F4F2EC; --card:#FFFFFF; --amber:#B07012; --amber-br:#DCA138;
    --up:#1F7A4D; --up-bg:rgba(31,122,77,.10); --down:#B8402B; --down-bg:rgba(184,64,43,.10);
    --muted:#8A857B; --line:rgba(27,26,23,.10); --bar:56px;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--ink);overscroll-behavior:none}
  body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
  .app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;
    background:var(--paper);position:relative;overflow:hidden}

  /* ---- app bar ---- */
  .appbar{flex:0 0 auto;background:var(--ink);color:var(--paper);
    padding:calc(var(--safe-t) + 9px) 16px 9px;display:flex;align-items:center;gap:10px}
  .appbar .brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit}
  .appbar .glyph{width:26px;height:26px;flex:0 0 auto}
  .appbar .wm{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#C9C2B4}
  .appbar .nm{font-weight:700;font-size:16px;letter-spacing:-.01em;margin-left:-3px}
  .measbtn{margin-left:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);
    color:var(--paper);border:1px solid rgba(255,255,255,.14);border-radius:999px;
    padding:7px 12px;font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer}
  .measbtn .cv{color:var(--amber-br)}
  .measbtn svg{width:12px;height:12px}

  /* ---- views ---- */
  .views{flex:1 1 auto;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 13px calc(96px + var(--safe-b));display:none}
  .view.active{display:block;animation:vin .24s cubic-bezier(.2,.7,.3,1)}
  @keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .vhead{display:flex;align-items:baseline;gap:8px;margin:4px 3px 12px}
  .vhead h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
  .vhead .sub{font-size:12.5px;color:var(--muted);font-weight:600}
  .src{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);
    font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .src .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .src.live .dot{background:var(--up)} .src.live{color:var(--up)}

  /* ---- pulse feed ---- */
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;
    margin-bottom:11px;box-shadow:0 1px 2px rgba(27,26,23,.04);cursor:pointer;
    transition:transform .12s ease}
  .pcard:active{transform:scale(.985)}
  .pcard .top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .pcard .dimtag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted)}
  .pcard .arw{margin-left:auto;font-size:15px;font-weight:800}
  .arw.up{color:var(--up)} .arw.down{color:var(--down)}
  .pcard .mid{display:flex;align-items:flex-end;gap:12px}
  .pcard .member{font-size:19px;font-weight:800;letter-spacing:-.01em;flex:1 1 auto;line-height:1.1}
  .pcard .big{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .big.up{color:var(--up)} .big.down{color:var(--down)}
  .pcard .spark{margin:10px 0 8px}
  .pcard .say{font-size:13.5px;line-height:1.4;color:#3a382f}

  /* ---- measure chips (cuts) ---- */
  .mrow{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding:2px 3px 12px;margin:0 -3px;scrollbar-width:none}
  .mrow::-webkit-scrollbar{display:none}
  .mchip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;font-size:12.5px;font-weight:700;color:#57544c;cursor:pointer;white-space:nowrap}
  .mchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* ---- cut cards ---- */
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:16px;
    margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(27,26,23,.04)}
  .ccard .chead{display:flex;align-items:center;gap:8px;padding:13px 15px 11px;cursor:pointer}
  .ccard .chead h2{font-size:15.5px;font-weight:800;letter-spacing:-.01em;margin:0}
  .ccard .chead .cn{font-family:var(--mono);font-size:10px;color:var(--muted)}
  .ccard .chead .chev{margin-left:auto;color:var(--muted);transition:transform .2s ease}
  .ccard.open .chev{transform:rotate(180deg)}
  .crow{display:flex;align-items:center;gap:11px;padding:10px 15px;border-top:1px solid var(--line);
    cursor:pointer}
  .crow:active{background:rgba(27,26,23,.03)}
  .crow .rn{font-size:14px;font-weight:600;flex:1 1 auto;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .crow .rspark{flex:0 0 auto}
  .crow .rv{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums;
    min-width:56px;text-align:right}
  .rv.up{color:var(--up)} .rv.down{color:var(--down)}
  .crow.hidden{display:none}
  .cmore{padding:10px 15px;border-top:1px solid var(--line);font-size:12.5px;font-weight:700;
    color:var(--amber);cursor:pointer;text-align:center}

  /* ---- bottom nav ---- */
  .tabbar{flex:0 0 auto;display:flex;background:var(--ink);
    padding:8px 0 calc(8px + var(--safe-b));border-top:1px solid rgba(0,0,0,.3)}
  .tab{flex:1;background:none;border:0;color:#8f887c;display:flex;flex-direction:column;
    align-items:center;gap:3px;font-family:var(--font);font-size:10.5px;font-weight:700;cursor:pointer;
    letter-spacing:.02em}
  .tab svg{width:22px;height:22px}
  .tab.on{color:var(--amber-br)}

  /* ---- bottom sheet ---- */
  .sheet-bd{position:absolute;inset:0;background:rgba(20,19,16,.5);opacity:0;pointer-events:none;
    transition:opacity .22s ease;z-index:20}
  .sheet-bd.show{opacity:1;pointer-events:auto}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);z-index:21;
    border-radius:20px 20px 0 0;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
    max-height:86%;overflow-y:auto;padding:8px 18px calc(22px + var(--safe-b));
    box-shadow:0 -8px 30px rgba(0,0,0,.22)}
  .sheet.show{transform:none}
  .grab{width:38px;height:4px;border-radius:2px;background:rgba(27,26,23,.18);margin:8px auto 6px}
  .sheet h3{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
  .sheet .sdim{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .drillbig{display:flex;align-items:baseline;gap:10px;margin:12px 0 2px}
  .drillbig .n{font-size:40px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .n.up{color:var(--up)} .n.down{color:var(--down)}
  .drillbig .lb{font-size:12.5px;color:var(--muted);font-weight:600}
  .drilld{font-size:13px;font-weight:700;margin-bottom:4px}
  .drilld.up{color:var(--up)} .drilld.down{color:var(--down)}
  .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:14px 0 6px}
  .note{background:rgba(27,26,23,.04);border:1px solid var(--line);border-radius:12px;
    padding:12px 13px;font-size:12.5px;line-height:1.45;color:#57544c;margin-top:16px}
  .note a{color:var(--amber);font-weight:700;text-decoration:none}
  /* measure sheet list */
  .mlist{margin:8px 0 0}
  .mopt{display:flex;align-items:center;gap:10px;padding:13px 4px;border-top:1px solid var(--line);
    font-size:15px;font-weight:600;cursor:pointer}
  .mopt:first-child{border-top:0}
  .mopt .tick{margin-left:auto;color:var(--amber);font-weight:800;opacity:0}
  .mopt.on .tick{opacity:1} .mopt.on{color:var(--ink)}
  .mopt .k{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);background:rgba(27,26,23,.05);padding:3px 7px;border-radius:6px}

  /* install hint (iOS) */
  .ihint{position:absolute;left:12px;right:12px;bottom:calc(84px + var(--safe-b));z-index:15;
    background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 14px;display:none;
    align-items:center;gap:10px;font-size:12.5px;box-shadow:0 6px 22px rgba(0,0,0,.28)}
  .ihint.show{display:flex}
  .ihint b{color:var(--amber-br)} .ihint .x{margin-left:auto;opacity:.7;font-size:18px;padding:2px 4px}

  .toast{position:absolute;left:50%;transform:translateX(-50%) translateY(20px);
    bottom:calc(96px + var(--safe-b));background:var(--ink);color:var(--paper);font-size:12.5px;
    padding:9px 15px;border-radius:999px;opacity:0;transition:all .22s ease;z-index:30;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

</div>

(function(){
  var STATE = { measure:'vol_growth', data:PRISM_FALLBACK, source:'offline', open:{}, tab:'pulse' };
  var $ = function(s,r){ return (r||document).querySelector(s); };
  function measByKey(k){ return (STATE.data.measures||[]).find(function(m){return m.key===k;}) || {unit:'pct',kind:'growth',label:k}; }

  function fmt(v, unit, signed){
    var s = signed && v>=0 ? '+' : '';
    if(unit==='pct') return s + v.toFixed(1) + '%';
    if(unit==='idx') return s + Math.round(v);
    return s + v.toFixed(1);
  }
  // pulse/drill headline: growth -> the value; level -> the delta vs PY
  function headline(item, meas){
    if(meas.kind==='level') return { n:fmt(item.delta,'pct',true), lb:'vs PY', up:item.delta>=0 };
    return { n:fmt(item.value,meas.unit,true), lb:meas.label.toLowerCase(), up:item.value>=0 };
  }

  function spark(vals, w, h, color){
    if(!vals || !vals.length) return '';
    var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), rng=(mx-mn)||1, pad=2;
    var pts = vals.map(function(v,i){
      var x = pad + i*(w-2*pad)/(vals.length-1);
      var y = pad + (h-2*pad)*(1-(v-mn)/rng);
      return x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
    var lastY = pad + (h-2*pad)*(1-(vals[vals.length-1]-mn)/rng);
    return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" fill="none" style="display:block">'
      + '<polyline points="'+pts+'" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
      + '<circle cx="'+(w-pad).toFixed(1)+'" cy="'+lastY.toFixed(1)+'" r="2.1" fill="'+color+'"/></svg>';
  }
  var CUP='#1F7A4D', CDN='#B8402B';

  /* ---------- render: pulse ---------- */
  function renderPulse(){
    var meas = measByKey(STATE.measure), d = STATE.data;
    var h = '<div class="vhead"><h1>Pulse</h1><span class="sub">'+esc(meas.label)+'</span>'
      + '<span class="src '+(STATE.source==='live'?'live':'')+'"><span class="dot"></span>'
      + (STATE.source==='live'?'Live':'Modeled')+'</span></div>';
    (d.pulse||[]).forEach(function(p,i){
      var col = p.up?CUP:CDN, hd = headline(p, meas);
      h += '<div class="pcard" data-kind="pulse" data-i="'+i+'">'
        + '<div class="top"><span class="dimtag">'+esc(p.dim_label)+'</span>'
        +   '<span class="arw '+(p.up?'up':'down')+'">'+(p.up?'▲':'▼')+'</span></div>'
        + '<div class="mid"><span class="member">'+esc(p.member)+'</span>'
        +   '<span class="big '+(p.up?'up':'down')+'">'+hd.n+'</span></div>'
        + spark(p.spark, 300, 40, col)
        + '<div class="say">'+esc(p.text)+'</div></div>';
    });
    h += '<div class="note">'+esc(d.provenance||'')+'</div>';
    $('#view-pulse').innerHTML = h;
  }

  /* ---------- render: cuts ---------- */
  function renderCuts(){
    var meas = measByKey(STATE.measure), d = STATE.data;
    var h = '<div class="vhead"><h1>Cuts</h1><span class="sub">'+esc(meas.label)+'</span>'
      + '<span class="src '+(STATE.source==='live'?'live':'')+'"><span class="dot"></span>'
      + (STATE.source==='live'?'Live':'Modeled')+'</span></div>';
    // measure chip row
    h += '<div class="mrow">';
    (d.measures||[]).forEach(function(m){
      h += '<button class="mchip '+(m.key===STATE.measure?'on':'')+'" data-meas="'+m.key+'">'+esc(m.label)+'</button>';
    });
    h += '</div>';
    (d.cuts||[]).forEach(function(c){
      var openC = !!STATE.open[c.dim];
      h += '<div class="ccard'+(openC?' open':'')+'" data-dim="'+c.dim+'">'
        + '<div class="chead" data-toggle="'+c.dim+'"><h2>'+esc(c.label)+'</h2>'
        +   '<span class="cn">'+c.rows.length+'</span>'
        +   '<span class="chev"><svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>';
      c.rows.forEach(function(r,ri){
        var hd = headline(r, meas), col = hd.up?CUP:CDN;
        var hide = (!openC && ri>=3) ? ' hidden' : '';
        h += '<div class="crow'+hide+'" data-kind="cut" data-dim="'+c.dim+'" data-ri="'+ri+'">'
          + '<span class="rn">'+esc(r.name)+'</span>'
          + '<span class="rspark">'+spark(r.spark, 54, 20, col)+'</span>'
          + '<span class="rv '+(hd.up?'up':'down')+'">'+hd.n+'</span></div>';
      });
      if(c.rows.length>3) h += '<div class="cmore" data-toggle="'+c.dim+'">'+(openC?'Show less':'Show all '+c.rows.length)+'</div>';
      h += '</div>';
    });
    $('#view-cuts').innerHTML = h;
  }

  function renderMeasureLabel(){ $('#measlbl').textContent = measByKey(STATE.measure).label; }
  function renderAll(){ renderMeasureLabel(); renderPulse(); renderCuts(); }

  /* ---------- drill sheet ---------- */
  function openDrill(item, dimLabel){
    var meas = measByKey(STATE.measure), hd = headline(item, meas), col = hd.up?CUP:CDN;
    var pct = Math.round((item.weight||0)*100);
    var h = '<div class="grab"></div>'
      + '<div class="sdim">'+esc(dimLabel)+'</div><h3>'+esc(item.name || item.member)+'</h3>'
      + '<div class="drillbig"><span class="n '+(hd.up?'up':'down')+'">'+hd.n+'</span>'
      +   '<span class="lb">'+esc(meas.label)+'</span></div>'
      + '<div class="drilld '+(item.delta>=0?'up':'down')+'">'+(item.delta>=0?'▲':'▼')+' '
      +   fmt(item.delta,'pct',true)+' vs prior period</div>'
      + '<div class="cap">Trailing 12 months</div>'
      + spark(item.spark, 320, 64, col)
      + '<div class="cap">Materiality</div>'
      + '<div style="font-size:14px;font-weight:600">'+pct+'% of the '+esc(dimLabel.toLowerCase())+' book</div>'
      + '<div class="note">Filters, secondary break-downs and report-building live in '
      +   '<a href="../index.html#dashboard">Hoodie Intelligence</a> on the desktop.</div>';
    $('#sheet').innerHTML = h;
    showSheet();
  }

  /* ---------- measure sheet ---------- */
  function openMeasureSheet(){
    var h = '<div class="grab"></div><h3>Measure</h3><div class="mlist">';
    (STATE.data.measures||[]).forEach(function(m){
      h += '<div class="mopt '+(m.key===STATE.measure?'on':'')+'" data-pick="'+m.key+'">'
        + '<span>'+esc(m.label)+'</span><span class="k">'+esc(m.unit)+'</span>'
        + '<span class="tick">✓</span></div>';
    });
    h += '</div>';
    $('#sheet').innerHTML = h;
    showSheet();
  }

  function showSheet(){ $('#sheetbd').classList.add('show'); $('#sheet').classList.add('show'); }
  function hideSheet(){ $('#sheetbd').classList.remove('show'); $('#sheet').classList.remove('show'); }

  /* ---------- data ---------- */
  function load(measure){
    return fetch('/api/prism?measure='+encodeURIComponent(measure), {headers:{'Accept':'application/json'}})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ STATE.data=j; STATE.source='live'; return true; })
      .catch(function(){
        // keep whatever we have; only mark offline if we couldn't get this measure
        if(STATE.data.measure!==measure) toast("Couldn't reach live data");
        STATE.source = (STATE.data.measure===measure) ? STATE.source : 'offline';
        return false;
      });
  }

  var _tt;
  function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(_tt); _tt=setTimeout(function(){ t.classList.remove('show'); }, 1900); }

  /* ---------- interactions ---------- */
  document.addEventListener('click', function(e){
    var t = e.target;
    // tab switch
    var tabBtn = t.closest('.tab');
    if(tabBtn){ setTab(tabBtn.dataset.tab); return; }
    // measure button
    if(t.closest('#measbtn')){ openMeasureSheet(); return; }
    // measure pick (sheet) or chip (cuts)
    var pick = t.closest('[data-pick]'), chip = t.closest('[data-meas]');
    var mk = pick ? pick.dataset.pick : (chip ? chip.dataset.meas : null);
    if(mk){ pickMeasure(mk); return; }
    // toggle a cut card open/closed
    var tog = t.closest('[data-toggle]');
    if(tog){ var dk=tog.dataset.toggle; STATE.open[dk]=!STATE.open[dk]; renderCuts(); return; }
    // open drill from a pulse card
    var pc = t.closest('.pcard[data-kind="pulse"]');
    if(pc){ var p = STATE.data.pulse[+pc.dataset.i]; openDrill(p, p.dim_label); return; }
    // open drill from a cut row
    var cr = t.closest('.crow[data-kind="cut"]');
    if(cr){
      var cut = (STATE.data.cuts||[]).find(function(c){return c.dim===cr.dataset.dim;});
      if(cut){ openDrill(cut.rows[+cr.dataset.ri], cut.label); } return;
    }
    // dismiss sheet / install hint
    if(t.closest('#sheetbd')){ hideSheet(); return; }
    if(t.id==='ihintx'){ $('#ihint').classList.remove('show'); try{localStorage.setItem('prism.ihint','1');}catch(_){} }
  });

  function setTab(tab){
    STATE.tab = tab;
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===tab); });
    $('#view-pulse').classList.toggle('active', tab==='pulse');
    $('#view-cuts').classList.toggle('active', tab==='cuts');
    var v = $('#view-'+tab); if(v) v.scrollTop = 0;
  }

  function pickMeasure(mk){
    if(mk===STATE.measure){ hideSheet(); return; }
    STATE.measure = mk;
    renderMeasureLabel(); hideSheet();
    load(mk).then(renderAll);
  }

  /* ---------- boot ---------- */
  renderAll();                                   // paint immediately from fallback
  load(STATE.measure).then(renderAll);           // then upgrade to live

  // iOS install hint (only when not already installed/standalone)
  try{
    var isStandalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if(isIOS && !isStandalone && !localStorage.getItem('prism.ihint')){
      setTimeout(function(){ $('#ihint').classList.add('show'); }, 1600);
    }
  }catch(_){}

  // service worker — only at top level (not inside the desktop launcher iframe)
  if('serviceWorker' in navigator && window.self===window.top){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('prism-sw.js').catch(function(){}); });
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
})();
</script>

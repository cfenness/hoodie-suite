<style>
  /* Carolina blue is Hoodie Collect's section colour — it identifies the whole Collect bucket, so it
     deliberately overrides the suite's default slate accent rather than inheriting it. */
  :root{
    --bg:#0f1216;--panel:#161b22;--panel2:#1c2230;--line:#252c38;--ink:#e6edf3;--mut:#8b98a9;
    --accent:#4B9CD3;--good:#5bb86e;--warn:#d99a3f;--bad:#e5636b;--derived:#6f7d90;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--sans:Inter,system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme:light){:root{--bg:#f4f6f9;--panel:#fff;--panel2:#eef2f7;--line:#dfe5ec;--ink:#161b22;--mut:#5b6675;}}
  :root[data-theme="light"]{--bg:#f4f6f9;--panel:#fff;--panel2:#eef2f7;--line:#dfe5ec;--ink:#161b22;--mut:#5b6675;}
  :root[data-theme="dark"]{--bg:#0f1216;--panel:#161b22;--panel2:#1c2230;--line:#252c38;--ink:#e6edf3;--mut:#8b98a9;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .bar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 2.4s infinite}
  .dot.off{background:var(--bad);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,184,110,.5)}70%{box-shadow:0 0 0 6px rgba(91,184,110,0)}100%{box-shadow:0 0 0 0 rgba(91,184,110,0)}}
  .spacer{flex:1}
  button,select,input{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-family:var(--sans);font-size:13px}
  button{cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.danger{border-color:var(--bad);color:var(--bad)}
  .wh{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:6px;display:flex;align-items:center;gap:6px;font-weight:600}
  .wh.prod{background:rgba(91,184,110,.14);color:var(--good);border:1px solid rgba(91,184,110,.4)}
  .wh.local{background:rgba(229,99,107,.14);color:var(--bad);border:1px solid rgba(229,99,107,.5)}
  .asof{font-family:var(--mono);font-size:11px;color:var(--mut)}

  /* ── two-pane shell ─────────────────────────────────────────────────────── */
  .wrap{flex:1;display:flex;min-height:0}
  .side{width:330px;flex:0 0 auto;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .sfilter{padding:9px 11px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
  .sfilter input{flex:1;min-width:120px;font-size:12.5px}
  .slist{overflow:auto;flex:1}
  .srow{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:9px}
  .srow:hover{background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
  .srow.on{background:color-mix(in srgb,var(--accent) 16%,var(--panel));box-shadow:inset 3px 0 0 var(--accent)}
  .srow .nm{flex:1;min-width:0}
  .srow .nm b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .srow .nm span{font-family:var(--mono);font-size:10.5px;color:var(--mut)}
  .sq{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .grphead{padding:6px 12px;background:var(--panel2);font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:700;position:sticky;top:0;z-index:2}

  .main{flex:1;overflow:auto;min-width:0;padding:16px 20px}
  .sec{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink);margin:20px 0 9px;font-weight:700;display:flex;align-items:center;gap:8px}
  .sec::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--accent)}
  .sec:first-child{margin-top:0}

  .stat-pill{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12px}
  thead th{background:var(--panel2);color:var(--mut);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
  thead th.num,tbody td.num{text-align:right}
  tbody td{padding:6px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top}
  tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
  .dpos{color:var(--good)}.dneg{color:var(--bad)}.dzero{color:var(--mut)}
  .mut{color:var(--mut)}
  .mono{font-family:var(--mono)}

  /* claimed-vs-observed: disagreement is the finding, so it gets its own colour */
  .disagree{background:color-mix(in srgb,var(--bad) 13%,transparent)!important}
  .disagree td:first-child::before{content:"\26A0\FE0E";color:var(--bad);margin-right:6px}

  /* completeness meter */
  .meter{height:9px;border-radius:5px;background:var(--panel2);overflow:hidden;border:1px solid var(--line);min-width:120px}
  .meter i{display:block;height:100%;background:var(--good)}
  .meter i.partial{background:var(--warn)}
  .meter i.bad{background:var(--bad)}
  .cov{display:flex;gap:20px;flex-wrap:wrap}
  .cov .c{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 15px;min-width:210px}
  .cov .c b{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
  .cov .c span{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:600}
  .cov .c small{display:block;font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:5px}

  /* run controls */
  .runbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  .winbox{display:flex;gap:6px;align-items:center;padding-left:12px;border-left:1px solid var(--line)}
  .winbox input{width:74px;font-family:var(--mono)}
  .warnbox{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid var(--warn);color:var(--ink);border-radius:9px;padding:9px 12px;font-size:12.5px;margin-top:9px}

  /* console */
  .console{background:#0a0d11;color:#cfe3f5;font-family:var(--mono);font-size:11.5px;line-height:1.5;border:1px solid var(--line);
           border-radius:10px;padding:11px 13px;height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word}
  :root[data-theme="light"] .console{background:#11161c;color:#cfe3f5}
  .console .err{color:#ff9aa2}
  .console .ok{color:#8fe0a0}
  .console .warnl{color:#f0c274}
  .runhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .runhead .k{font-family:var(--mono);font-size:11.5px;color:var(--mut)}
  .runhead .k b{color:var(--ink)}
  .msg{padding:44px;color:var(--mut);text-align:center}
  .note{font-size:12px;color:var(--mut);margin:6px 0 0;line-height:1.5}
  /* MANUAL-ONLY — nothing auto-dispatches; every job is a human pressing Run now. Shown in the top
     bar because it changes what the whole page means: no green source is being kept fresh by itself. */
  /* Mirroring to Snowflake is a PIPELINE action, not a per-source one — it belongs beside the global
     controls, not buried as one row among 74. It is also the manual stand-in for the auto-trampoline,
     so it should sit where you would reach for that. */
  .sf{font-family:var(--mono);font-size:11px;font-weight:700;border-color:var(--accent);
      background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .sf.busy{opacity:.6;cursor:progress}
  .sf.bad{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
  .mode{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;cursor:pointer;
        border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--ink)}
  .mode.auto{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
  .tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--mut)}
  /* CONFIRMED — a human watched this run in the bench and vouched for it. Deliberately a different
     visual language from the derived status pill: one is measured, the other is an opinion. */
  .conf{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;font-weight:700;
        padding:1px 7px;border-radius:20px;background:rgba(91,184,110,.18);color:var(--good);
        border:1px solid rgba(91,184,110,.55);white-space:nowrap}
  .srow.arch{opacity:.5}
  .srow.arch .nm b{text-decoration:line-through}
  /* field fill — an empty column is the failure a row count cannot show */
  .fill{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
  .fp{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);
      background:color-mix(in srgb,var(--good) 12%,transparent);color:var(--ink);white-space:nowrap}
  .fp.lo{background:color-mix(in srgb,var(--warn) 18%,transparent);border-color:var(--warn)}

  .dtbl{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:9px}

  .dtbl td{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>

<div class="bar" id="chrome">
  <h1><span class="dot" id="dot"></span> Hoodie Collect</h1>
  <span class="wh" id="wh">…</span>
  <span class="spacer"></span>
  <span class="asof" id="asof"></span>
  <span id="modepill"></span>
  <button id="sfbtn" class="sf" onclick="mirrorToSnowflake()" title="Mirror the warehouse to Snowflake">
    \u2912 Snowflake</button>
  <button onclick="loadAll(true)">Refresh</button>
</div>

<div class="wrap">
  <div class="side">
    <div class="sfilter">
      <input id="q" placeholder="filter sources…" oninput="renderList()">
      <select id="fstatus" onchange="renderList()">
        <option value="">all states</option>
        <option value="bad">needs attention</option>
        <option value="ok">healthy</option>
        <option value="off">disabled</option>
        <option value="confirmed">confirmed</option>
        <option value="archived">archived</option>
        <option value="builds">derived builds</option>
        <option value="scrapes">scrapes only</option>
      </select>
    </div>
    <div class="slist" id="slist"><div class="msg">loading…</div></div>
  </div>
  <div class="main" id="main"><div class="msg">Select a source.</div></div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────────────────────
   Hoodie Collect — the scrape workbench.

   ONE rule governs this page: nothing here renders a CLAIM as a FACT. The registry
   declares what a source writes, how often, and how big its universe is; the
   warehouse and the run ledger say what actually happened. Where those disagree,
   the disagreement is the finding and gets rendered as such — it is never smoothed
   over into a single reassuring number. (Kroger reported "fine" for 9 consecutive
   runs that landed zero rows into a table that does not exist.)
   ───────────────────────────────────────────────────────────────────────────── */
const EMBED = new URLSearchParams(location.search).get('embed') === '1';
if (EMBED) document.getElementById('chrome').style.display = 'none';

let SRC = [];            // registry-declared sources (+ coverage) from /api/registry/sources
let TABLES = {};         // observed table -> rows, from /api/monitor
let LAST = {};           // source id -> its most recent ledger run
let STREAK = {};         // source id -> consecutive most-recent runs that landed nothing
let HIST = {};           // source id -> recent ledger history (loaded on select)
let STATE = {confirmed:{}, archived:{}};  // human opinion, kept apart from derived status
let SAMPLE = {};         // source id -> inbound-data sample (refreshed while a run is live)
let SHOW_ARCHIVED = false;
let TICKS = 0;
let MANUAL = false, MANUAL_LOCKED = false;
let LIVE = {};           // source id -> its IN-FLIGHT journal (outranks the ledger, which lags a run)
let ORDER = [], ORDER_KEY = '';   // frozen row order — recomputed on membership change, not on status
let GEN = 0;             // load generation: a late response must never overwrite a newer one
let INFLIGHT = 0;        // ms timestamp of the in-flight poll (0 = idle); expires so it can't wedge
let FEED_STALE = {};     // feed -> true when its last fetch failed (shown, never silently blanked)
let SEL = null;          // selected source id
let POLL = null;         // journal poll timer
let ACTIVE_RUN = null;   // run_id currently being watched

const fmt = n => (n === null || n === undefined) ? '—' : Number(n).toLocaleString();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ago(ts){
  if (!ts) return 'never';
  const s = Date.now()/1000 - ts;
  if (s < 90) return Math.round(s)+'s ago';
  if (s < 5400) return Math.round(s/60)+'m ago';
  if (s < 172800) return (s/3600).toFixed(1)+'h ago';
  return (s/86400).toFixed(1)+'d ago';
}

// EVERY request is bounded. A fetch with no timeout can stay pending forever, and since loadAll holds
// an INFLIGHT lock while it waits, one hung request would freeze the whole bench — permanently, and
// silently, because the last good data stays on screen looking healthy. A stuck page that looks fine is
// worse than one that flickers, so nothing here is allowed to wait without end.
async function jget(u, ms){
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms || 20000);
  try {
    const r = await fetch(u, {signal: ac.signal});
    if(!r.ok) throw new Error(u+' → '+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

/* ── the verdict ─────────────────────────────────────────────────────────────
   Derived HERE from observed data, deliberately NOT taken from the ledger's own
   status string. `empty` in the ledger means "ran, landed nothing" and reads as
   benign; if the target table also doesn't exist and the streak is long, that is
   a source that has NEVER worked and it must say so. */
function verdict(s){
  // A LIVE run outranks everything below. The ledger only gains a row when a run FINISHES, so during a
  // run it still describes the PREVIOUS one — which is how this page came to show "timeout · 22.8h ago"
  // beside a console streaming "running · heartbeat 14s ago". A stale claim next to live evidence is the
  // exact failure this page exists to remove, so the live journal wins.
  const lv = LIVE[s.id];
  if (lv) return {k:'live', c:'var(--accent)', live:true,
                  t: lv.pct != null ? ('running ' + lv.pct + '%') : 'running'};
  const tabs = (s.tables || []).map(t => ({ name: t, rows: TABLES[t] }));
  const known = tabs.filter(t => t.rows !== undefined);
  const anyMissing = tabs.some(t => TABLES[t.name] === undefined);
  const total = known.reduce((a,t) => a + (t.rows || 0), 0);
  const last = LAST[s.id];

  if (!s.enabled)                       return {k:'off',   c:'var(--derived)', t:'disabled'};
  if ((s.missing_creds||[]).length)     return {k:'nocreds',c:'var(--derived)',t:'no creds'};
  if (!last)                            return {k:'unknown',c:'var(--mut)',   t:'never run'};
  if (last.status === 'failed')         return {k:'fail',  c:'var(--bad)',    t:'failed'};
  if (last.status === 'timeout')        return {k:'fail',  c:'var(--bad)',    t:'timeout'};
  // `incomplete` = it ran, but landed only SOME of the outlets/items. Holding part of a catalog is a
  // defective product, so it reads as a failure — with the shortfall shown, not a bare red light.
  if (last.status === 'incomplete')     return {k:'incomplete', c:'var(--bad)', t:'incomplete'};
  // the machine vanished mid-run and never wrote a terminal status — not "still running"
  if (last.status === 'lost')           return {k:'fail', c:'var(--bad)', t:'lost (no heartbeat)'};
  // the kroger shape: nothing landed AND there is nothing there to have landed into. The ledger calls
  // this `empty` with no error text, which reads as benign; with a long zero streak it is a source that
  // has never once worked, and that distinction is the whole point of this page.
  const streak = STREAK[s.id] || 0;
  if (total === 0 && (anyMissing || known.length))
                                        return {k:'never', c:'var(--bad)',
                                                t: streak > 1 ? `never landed ×${streak}` : 'never landed'};
  // The ledger says nothing landed while the warehouse says the table is full — that is a broken counter,
  // not a stalled source, and calling it "stalled" would be inventing a diagnosis from a bad instrument.
  if (Number(last.rows_after) === 0 && total > 0)
                                        return {k:'unmeas', c:'var(--warn)',  t:'unmeasured'};
  if (streak >= 3)                      return {k:'stalled',c:'var(--warn)',  t:`no new rows ×${streak}`};
  if (last.status === 'degraded')       return {k:'degr',  c:'var(--warn)',   t:'degraded'};
  const cov = s.coverage || {};
  if (cov.items?.verdict === 'partial' || cov.stores?.verdict === 'partial')
                                        return {k:'partial',c:'var(--warn)',  t:'partial'};
  const iv = s.interval_h || (s.cadence === 'weekly' ? 168 : 24);
  if (last.ts_start && (Date.now()/1000 - last.ts_start) > iv*3600*1.5)
                                        return {k:'stale', c:'var(--warn)',   t:'overdue'};
  return {k:'ok', c:'var(--good)', t:'healthy'};
}

/* ── is this source's landing verification even working? ─────────────────────
   run_sources verifies a run landed by diffing warehouse.row_count_strict() before and after. That
   counter reads a single-file Parquet footer and returns 0 for a PARTITIONED table — retail_observations
   holds 15.1M rows and counts as 0. A source writing a partitioned table therefore records
   before=0/after=0/delta=0 on every run forever, which forces its status to `empty` no matter how much
   it really landed. The bench reads partition-aware counts, so it can see the contradiction the ledger
   cannot: ledger says the table is empty, the warehouse says it isn't. That contradiction IS the bug. */
function brokenVerify(s, last){
  if (!last) return '';
  const observed = (s.tables || []).map(t => TABLES[t]).filter(n => typeof n === 'number');
  const obsTotal = observed.reduce((a,b) => a + b, 0);
  if (!(Number(last.rows_after) === 0 && obsTotal > 0)) return '';
  return `<div class="warnbox" style="border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)">
    <b>Landing verification is not working for this source.</b>
    The last run recorded <span class="mono">rows_after = 0</span>, but the warehouse holds
    <span class="mono">${fmt(obsTotal)}</span> rows across ${esc((s.tables||[]).join(', '))}.
    The verifier counts a single-file Parquet footer and reads a <b>partitioned</b> table as 0, so this
    source's <span class="mono">delta</span> is always 0 and its status is forced to
    <span class="mono">empty</span> regardless of what it actually landed.
    Treat its run history as <b>unmeasured</b>, not as evidence of failure.</div>`;
}

/* ── left rail ───────────────────────────────────────────────────────────── */
function renderList(){
  const q = (document.getElementById('q').value || '').toLowerCase();
  const f = document.getElementById('fstatus').value;
  const rows = SRC.filter(s => {
    // ARCHIVED is out of sight by default — that is the whole point of the dedupe action. Still
    // reachable via the filter, because hiding something forever is how it gets silently forgotten.
    if (STATE.archived[s.id] && !SHOW_ARCHIVED && f !== 'archived') return false;
    if (q && !(s.id+' '+(s.label||'')).toLowerCase().includes(q)) return false;
    const v = verdict(s);
    if (f === 'bad') return ['fail','never','incomplete','unmeas','stalled','degr','partial','stale'].includes(v.k);
    if (f === 'ok')  return v.k === 'ok';
    if (f === 'off') return ['off','nocreds'].includes(v.k);
    if (f === 'builds') return s.kind === 'build';
    if (f === 'scrapes') return s.kind !== 'build';
    if (f === 'confirmed') return !!STATE.confirmed[s.id];
    if (f === 'archived')  return !!STATE.archived[s.id];
    return true;
  });
  // needs-attention first — the bench should open on what's broken, not alphabetically.
  // BUT the order is FROZEN between renders. Sorting by a live verdict on every 15s poll makes rows
  // leap around as statuses change under you: a source you were reading jumps three positions and
  // reads as "disappeared". Position is recomputed only when the SET of visible ids changes (filter,
  // archive, a new source) — not when a status does. Same information, no motion.
  const rank = {live:-1, fail:0, never:1, incomplete:2, unmeas:3, stalled:4, degr:5, partial:6, stale:7, unknown:8, ok:9, nocreds:10, off:11};
  const key = rows.map(s => s.id).sort().join(',');
  if (key !== ORDER_KEY){
    rows.sort((a,b) => (rank[verdict(a).k] - rank[verdict(b).k]) || a.id.localeCompare(b.id));
    ORDER_KEY = key; ORDER = rows.map(s => s.id);
  } else {
    const pos = {}; ORDER.forEach((id,i) => pos[id] = i);
    rows.sort((a,b) => (pos[a.id] ?? 1e6) - (pos[b.id] ?? 1e6));
  }
  const el = document.getElementById('slist');
  if (!rows.length){ el.innerHTML = '<div class="msg">no sources match</div>'; return; }
  const html = rows.map(s => {
    const v = verdict(s);
    const last = LAST[s.id];
    const cf = STATE.confirmed[s.id];
    const ar = STATE.archived[s.id];
    return `<div class="srow ${s.id===SEL?'on':''} ${ar?'arch':''}" onclick="select('${esc(s.id)}')">
      <span class="sq" style="background:${v.c}"></span>
      <span class="nm"><b>${esc(s.label || s.id)}</b><span>${esc(v.t)} · ${
        v.live ? ('heartbeat ' + (LIVE[s.id].heartbeat_age_s ?? 0) + 's') : ago(last?.ts_start)}</span></span>
      ${cf ? '<span class="conf" title="confirmed '+esc(cf.by||'')+' '+ago(cf.at)+'">\u2713 CONF</span>' : ''}
    </div>`;
  }).join('');
  // Repaint ONLY on change. Reassigning innerHTML every poll rebuilds every node even when the markup
  // is byte-identical — which drops hover, collapses selection, and flickers. Nothing moves unless
  // something actually became different.
  if (el.__sig === html) return;
  el.__sig = html;
  el.innerHTML = html;
}

/* Coverage is fetched PER SOURCE, on selection — assessing all 62 up front measured >400s, which is
   what made the old registry endpoint unusable as a page load. COV caches per id for the session. */
const COV = {};
async function select(id){
  SEL = id;
  stopPoll();
  // Mark BOTH as pending before the first paint. Otherwise the initial render sees "not fetched yet" and
  // shows "no coverage assessment for this source" — asserting an absence that is really a pending request.
  // Saying "none" while you are still looking is the same failure mode this whole page exists to prevent.
  const needCov = !(id in COV), needHist = !(id in HIST);
  if (needCov) COV[id] = null;
  renderList();
  renderDetail();
  loadSample();
  await Promise.all([
    needHist && jget('/api/collect/status?id=' + encodeURIComponent(id))
      .then(d => { HIST[id] = d.history || []; })
      .catch(() => { HIST[id] = []; })
      .then(() => { if (SEL === id) renderDetail(); }),
    needCov && jget('/api/collect/coverage?id=' + encodeURIComponent(id))
      .then(d => { COV[id] = d.ok ? d.coverage : {error: d.error}; })
      .catch(e => { COV[id] = {error: e.message}; })
      .then(() => { if (SEL === id) renderDetail(); }),
  ].filter(Boolean));
}

/* ── detail ──────────────────────────────────────────────────────────────── */
function renderDetail(){
  const s = SRC.find(x => x.id === SEL);
  const el = document.getElementById('main');
  if (!s){ el.innerHTML = '<div class="msg">Select a source.</div>'; return; }
  const v = verdict(s);
  const last = LAST[s.id];
  const win = s.window;

  // claimed vs observed — the trust panel
  const tabRows = (s.tables || []).map(t => {
    const obs = TABLES[t];
    const missing = obs === undefined;
    const empty = obs === 0;
    return `<tr class="${missing||empty?'disagree':''}">
      <td>${esc(t)}</td>
      <td class="num">${missing ? '<span class="dneg">does not exist</span>' : fmt(obs)}</td>
      <td>${missing ? '<span class="dneg">registry claims this table; the warehouse has no such object</span>'
                    : empty ? '<span class="dneg">exists but holds zero rows</span>'
                    : '<span class="dzero">present</span>'}</td>
    </tr>`;
  }).join('');

  const cov = COV[s.id] || s.coverage || {};
  const covPending = (s.id in COV) && COV[s.id] === null;
  const covCard = (label, d) => {
    if (!d || d.verdict === 'n/a') return '';
    // `unknown` (nothing expected AND nothing landed) is a red state, not a quiet one — it means we
    // have no evidence this source has ever captured anything. `baseline` means it landed something
    // and is establishing its own high-water mark, which is genuinely fine.
    if (d.verdict === 'unknown') return `<div class="c" style="border-color:var(--bad)">
      <span>${label}</span><b style="color:var(--bad)">none</b>
      <small>nothing landed and no declared universe — there is no evidence this source has ever
      captured ${esc(label)}. Declare <span class="mono">expected_${esc(label)}</span> to get a real target.</small></div>`;
    if (!d.expected) return `<div class="c"><span>${label}</span><b>${fmt(d.landed)}</b>
      <small>landed, but no declared universe — percent collected is UNKNOWN, not 100%</small></div>`;
    const pct = d.pct ?? 0;
    const cls = pct >= 80 ? '' : (pct >= 40 ? 'partial' : 'bad');
    return `<div class="c"><span>${label}</span><b>${pct}%</b>
      <div class="meter"><i class="${cls}" style="width:${Math.min(100,pct)}%"></i></div>
      <small>${fmt(d.landed)} of ${fmt(d.expected)} · basis ${esc(cov.basis||'?')}</small></div>`;
  };

  el.innerHTML = `
    <div class="runhead">
      <h2 style="margin:0;font-size:16px">${esc(s.label || s.id)}</h2>
      <span class="stat-pill" style="background:${v.c}22;color:${v.c};border:1px solid ${v.c}66">${esc(v.t)}</span>
      ${s.kind === 'build' ? '<span class="tag" style="border-color:var(--accent);color:var(--accent)">BUILD</span>' : ''}
      <span class="tag">${esc(s.klass)}</span>
      <span class="tag">${esc(s.cadence)}</span>
      <span class="tag">${esc(s.cost_class||'')}</span>
      <span class="k">${v.live
        ? 'running now <b>' + ago(LIVE[s.id].started_at) + '</b> · prior run ' + esc(last?.status || '—') + ' ' + ago(last?.ts_start)
        : 'last run <b>' + ago(last?.ts_start) + '</b>'}</span>
      ${STATE.confirmed[s.id] ? `<span class="conf">\u2713 CONFIRMED ${esc(STATE.confirmed[s.id].by||'')} · ${ago(STATE.confirmed[s.id].at)}</span>` : ''}
      ${STATE.archived[s.id] ? `<span class="stat-pill" style="background:var(--derived)22;color:var(--derived);border:1px solid var(--derived)">archived</span>` : ''}
    </div>
    ${STATE.archived[s.id] ? `<div class="warnbox">Archived by ${esc(STATE.archived[s.id].by||'?')} ${ago(STATE.archived[s.id].at)}${STATE.archived[s.id].reason ? ' — ' + esc(STATE.archived[s.id].reason) : ''}${STATE.archived[s.id].superseded_by ? '. Superseded by <b>'+esc(STATE.archived[s.id].superseded_by)+'</b>' : ''}.
      <br>It is hidden from the bench <b>and off the active list</b> — the dispatcher no longer schedules it.
      No data is deleted and <span class="mono">source_registry.py</span> is unchanged, so this is fully
      reversible; retiring it permanently is still a code change (repoint the registry, <span class="mono">git mv</span>
      the module to <span class="mono">_archive/</span>).</div>` : ''}

    <div class="sec">Run</div>
    <div class="runbar">
      <button class="primary" id="btnrun" onclick="startRun()">Run now</button>
      ${win ? `<div class="winbox">
          <label class="mut" style="font-size:12px">window</label>
          <select id="winmode" onchange="onWin()">
            <option value="default">default (${win.default} ${esc(win.unit||'days')})</option>
            <option value="7">last 7 days</option>
            <option value="custom">custom…</option>
            <option value="all">all history</option>
          </select>
          <input id="windays" type="number" min="1" value="7" style="display:none">
        </div>` :
        `<span class="mut" style="font-size:12px">not time-bound — this source declares no window</span>`}
      ${s.id === 'ubereats' || s.id === 'postmates' ? `<div class="winbox">
          <label class="mut" style="font-size:12px">shards</label>
          <select id="shards">
            <option value="1">1 (single machine)</option>
            <option value="4">4</option>
            <option value="8" selected>8</option>
            <option value="16">16</option>
          </select>
        </div>` : ''}
      <span class="spacer"></span>
      <span class="mut mono" style="font-size:11px">runs on its own ephemeral Fly machine</span>
    </div>
    <div class="runbar" style="margin-top:9px">
      <button onclick="confirmSource(${STATE.confirmed[s.id] ? 'true' : 'false'})">
        ${STATE.confirmed[s.id] ? 'Un-confirm' : '\u2713 Confirm this source'}</button>
      <span class="mut" style="font-size:12px">${STATE.confirmed[s.id]
        ? esc(STATE.confirmed[s.id].note || 'confirmed through the bench')
        : 'mark it verified once you have watched a run land correct data'}</span>
      <span class="spacer"></span>
      <button onclick="diagnose()">\u2699 Diagnose</button>
      <button class="danger" onclick="archiveSource(${STATE.archived[s.id] ? 'true' : 'false'})">
        ${STATE.archived[s.id] ? 'Restore' : 'Archive scrape'}</button>
    </div>
    <div id="winwarn"></div>
    ${(s.missing_creds||[]).length ? `<div class="warnbox">Missing credentials: <b>${s.missing_creds.map(esc).join(', ')}</b> —
       this source will report an honest <span class="mono">no-creds</span> skip rather than run and fail.</div>` : ''}

    <div id="diag"></div>

    <div class="sec">Console</div>
    <div id="runmeta" class="runhead"><span class="k mut">no run being watched — press Run now, or pick one from history</span></div>
    <div class="console" id="console">—</div>

    <div class="sec">Inbound data
      <button style="padding:2px 8px;font-size:11px" onclick="loadSample(true)">reload</button></div>
    <div id="sample">${renderSample(s)}</div>

    ${brokenVerify(s, last)}

    <div class="sec">Claimed vs observed</div>
    <table><thead><tr><th>table the registry claims</th><th class="num">rows observed</th><th>reading</th></tr></thead>
      <tbody>${tabRows || '<tr><td colspan="3" class="mut">registry declares no tables for this source</td></tr>'}</tbody></table>
    ${s.shared_tables?.length ? `<p class="note">⚠︎ <b>${s.shared_tables.map(esc).join(', ')}</b> is written by more than one
      source, so this source's row delta is not attributable to it alone.</p>` : ''}

    <div class="sec">Expected completeness</div>
    <div class="cov">
      ${covPending ? '<p class="note">assessing coverage…</p>' : ''}
      ${covCard('items', cov.items) || ''}
      ${covCard('stores', cov.stores) || ''}
      ${(!covPending && !cov.items && !cov.stores)
        ? `<p class="note">No coverage assessment for this source${cov.error ? ' — ' + esc(cov.error) : ''}.</p>` : ''}
    </div>
    ${cov.basis === 'high-water-mark' ? `<p class="note">Basis is <b>high-water-mark</b>, not a known universe —
       "expected" is the most this source has ever captured, so a run that never worked reads as 0 of 0.
       Declare <span class="mono">expected_items</span>/<span class="mono">expected_stores</span> in the registry
       to get a real percentage.</p>` : ''}

    <div class="sec">Recent runs (ledger)</div>
    <table><thead><tr><th>when</th><th>status</th><th class="num">delta</th><th class="num">rows after</th><th>measured against</th><th>error</th></tr></thead>
      <tbody>${(HIST[s.id]||[]).slice(0,12).map(r => `
        <tr><td>${ago(r.ts_start)}</td>
            <td><span class="stat-pill" style="background:${r.status==='ok'?'var(--good)':(r.status==='failed'||r.status==='empty'||r.status==='incomplete')?'var(--bad)':'var(--warn)'}22">${esc(r.status)}</span></td>
            <td class="num ${r.delta>0?'dpos':r.delta<0?'dneg':'dzero'}">${r.delta>0?'+':''}${fmt(r.delta)}</td>
            <td class="num">${fmt(r.rows_after)}</td>
            <td class="mut">${esc(r.tables||'—')}</td>
            <td class="mut">${esc((r.error||'').slice(0,90))}</td></tr>`).join('')
        || `<tr><td colspan="6" class="mut">${(s.id in HIST) ? 'no runs in the ledger for this source' : 'loading history…'}</td></tr>`}
      </tbody></table>
    <p class="note">"measured against" is the table list the run recorded at the time. A source whose
      <span class="mono">tables</span> was edited has history measured against different objects — those deltas are
      not comparable to today's.</p>
  `;
}

function onWin(){
  const m = document.getElementById('winmode').value;
  document.getElementById('windays').style.display = m === 'custom' ? '' : 'none';
  const s = SRC.find(x => x.id === SEL);
  const w = document.getElementById('winwarn');
  w.innerHTML = (m === 'all' && s?.window?.note)
    ? `<div class="warnbox"><b>All history.</b> ${esc(s.window.note)}</div>` : '';
}

/* ── inbound data ────────────────────────────────────────────────────────────
   Real rows, not a row count. A count can be right while the contents are junk — nulls where a price
   should be, a store column that never varies, a name that is really a category header. Watching the
   actual rows arrive is the only way to confirm a scrape at the moment it lands. */
function renderSample(s){
  const d = SAMPLE[s.id];
  if (d === undefined) return '<p class="note">not loaded yet.</p>';
  if (d === null)      return '<p class="note">reading…</p>';
  if (d.error)         return `<p class="note">could not read: ${esc(d.error)}</p>`;
  return (d.tables || []).map(t => {
    const cols = t.columns || [];
    return `<div style="margin-bottom:12px">
      <div class="mono" style="font-size:11.5px;margin-bottom:5px">
        <b>${esc(t.table)}</b>${t.partition ? ' <span class="mut">· ' + esc(t.partition) + '</span>' : ''}
        <span class="mut">— ${esc(t.note || '')}</span></div>
      ${t.fill_pct ? `<div class="fill">${cols.map(c => {
          const p = t.fill_pct[c];
          if (p === null || p === undefined) return '';
          const cls = p === 0 ? 'z' : p < 50 ? 'lo' : '';
          return `<span class="fp ${cls}" title="${esc(c)}: ${p}% of ${fmt(t.fill_basis_rows)} rows populated">${esc(c)} ${p}%</span>`;
        }).join('')}</div>
        <p class="note">Field fill across the whole partition (${fmt(t.fill_basis_rows)} rows). Empty string
        counts as unfilled — a scraper writing "" is no more useful than writing null.</p>` : ''}
      ${cols.length ? `<div class="dtbl"><table>
        <thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${(t.rows||[]).map(r => `<tr>${cols.map(c =>
          `<td class="${r[c] === null || r[c] === undefined ? 'mut' : ''}">${
            r[c] === null || r[c] === undefined ? '∅' : esc(String(r[c]).slice(0,120))}</td>`).join('')}</tr>`).join('')}
        </tbody></table></div>` : '<p class="note">no rows returned.</p>'}
    </div>`;
  }).join('') || '<p class="note">this source declares no tables.</p>';
}

async function loadSample(force){
  const id = SEL;
  if (!id) return;
  if (!force && SAMPLE[id] !== undefined) return;
  SAMPLE[id] = null;
  const el = document.getElementById('sample');
  if (el) el.innerHTML = renderSample(SRC.find(x => x.id === id) || {});
  try {
    const d = await jget('/api/collect/sample?id=' + encodeURIComponent(id));
    SAMPLE[id] = d.ok ? d : {error: d.error};
  } catch(e){ SAMPLE[id] = {error: e.message}; }
  if (SEL === id){
    const e2 = document.getElementById('sample');
    if (e2) e2.innerHTML = renderSample(SRC.find(x => x.id === id) || {});
  }
}

/* ── confirm / archive — the two human judgements the bench records ────────── */
async function confirmSource(undo){
  const s = SRC.find(x => x.id === SEL); if (!s) return;
  let note = '';
  if (!undo){
    note = prompt('Confirm "' + (s.label || s.id) + '".\n\nWhat did you verify? (optional)', '') ?? null;
    if (note === null) return;                       // cancelled — do not record a confirmation
  }
  try {
    const r = await fetch('/api/collect/confirm', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: s.id, note, undo: !!undo, run_id: ACTIVE_RUN})});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'refused');
    await loadState();
  } catch(e){ alert('could not record: ' + e.message); }
}

async function archiveSource(undo){
  const s = SRC.find(x => x.id === SEL); if (!s) return;
  let reason = '', sup = null;
  if (!undo){
    reason = prompt('Archive "' + (s.label || s.id) + '" (dedupe).\n\n'
      + 'It goes out of sight AND off the active list — the dispatcher stops scheduling it.\n'
      + 'No data is deleted and the registry is unchanged, so this is reversible.\n\n'
      + 'Why are you archiving it?', '') ?? null;
    if (reason === null) return;
    sup = prompt('Superseded by which source id? (optional)', '') || null;
  }
  try {
    const r = await fetch('/api/collect/archive', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: s.id, reason, superseded_by: sup, undo: !!undo})});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'refused');
    await loadState();
  } catch(e){ alert('could not record: ' + e.message); }
}

async function loadState(){
  try {
    const d = await jget('/api/collect/state?fresh=1');
    STATE = {confirmed: d.confirmed || {}, archived: d.archived || {}};
  } catch(e){ /* keep whatever we had — an unreadable opinion store must not blank the bench */ }
  renderList();
  if (SEL) renderDetail();
}

async function toggleManual(){
  if (MANUAL_LOCKED){
    alert('COLLECT_MANUAL_ONLY is set in the environment and overrides this toggle.');
    return;
  }
  const to = !MANUAL;
  if (!confirm(to
      ? 'Switch to MANUAL ONLY?\n\nNothing will auto-dispatch. Every job becomes you pressing Run now.'
      : 'Re-enable AUTO-DISPATCH?\n\nThe dispatcher will run due sources on their cadence again.')) return;
  try {
    const r = await fetch('/api/collect/manual-only', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({enabled: to})});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'refused');
    await loadAll(false);
  } catch(e){ alert('could not change mode: ' + e.message); }
}

async function diagnose(){
  const id = SEL; if (!id) return;
  const el = document.getElementById('diag');
  el.innerHTML = '<p class="note">diagnosing…</p>';
  try {
    const r = await jget('/api/collect/diagnose?id=' + encodeURIComponent(id));
    const d = r.diagnosis || {};
    const tabs = (d.tables || []).map(t => `<tr class="${t.exists ? '' : 'disagree'}">
        <td>${esc(t.table)}</td><td class="num">${t.rows == null ? '—' : fmt(t.rows)}</td>
        <td class="num">${t.partitions || 0}</td>
        <td>${t.exists ? 'present' : '<span class="dneg">absent</span>'}${
          t.read_error ? ' <span class="dneg">' + esc(t.read_error) + '</span>' : ''}</td></tr>`).join('');
    const reqs = Object.entries(d.requires || {}).map(([k, v]) =>
      `<span class="fp ${v ? '' : 'z'}">${esc(k)} ${v ? 'set' : 'MISSING'}</span>`).join('');
    const heal = d.heal || {};
    const runningNow = Array.isArray(d.running_machines) ? d.running_machines : [];
    el.innerHTML = `
      <div class="sec">Diagnosis</div>
      ${runningNow.length ? `<div class="warnbox">Already running on ${runningNow.length} machine(s):
        ${runningNow.map(m => esc(m.machine)).join(', ')} — starting another would double-crawl.</div>` : ''}
      ${d.resume_checkpoint ? `<div class="warnbox">Resume checkpoint for today holds
        <b>${fmt(d.resume_checkpoint.done)}</b> completed items — the next run RESUMES, it is not a full pass.
        Clear it if you want a clean sweep.</div>` : ''}
      ${heal.story ? `<p class="note"><b>${esc(heal.klass || 'failure')}</b> \u00d7${heal.consecutive_failures}
        — ${esc(heal.story)}${heal.auto === false ? ' <b>Will NOT auto-retry; needs a fix.</b>' : ''}</p>` : ''}
      ${reqs ? `<div class="fill">${reqs}</div>` : ''}
      <table><thead><tr><th>table</th><th class="num">rows</th><th class="num">parts</th><th>state</th></tr></thead>
        <tbody>${tabs || '<tr><td colspan="4" class="mut">declares no tables</td></tr>'}</tbody></table>
      <p class="note mono" style="font-size:11px">${esc(d.code || '')}</p>
      <div class="sec">Recent ledger</div>
      <table><thead><tr><th>when</th><th>status</th><th>class</th><th class="num">delta</th><th>error</th></tr></thead>
        <tbody>${(d.history || []).map(h => `<tr><td>${ago(h.ts_start)}</td><td>${esc(h.status)}</td>
          <td>${esc(h.fail_class || '')}</td><td class="num">${fmt(h.delta)}</td>
          <td class="mut">${esc((h.error || '').slice(0, 110))}</td></tr>`).join('')
          || '<tr><td colspan="5" class="mut">no ledger history</td></tr>'}</tbody></table>`;
  } catch(e){ el.innerHTML = '<p class="note">diagnose failed: ' + esc(e.message) + '</p>'; }
}

/* ── mirror to Snowflake — the global pipeline action ─────────────────────────────────────────
   Kicks the same snowflake-load BUILD the row does; this is purely a shortcut to the thing you
   actually want after a scrape lands, and the stand-in for the trampoline until that exists. */
const SF_ID = 'snowflake-load';

function sfLabel(){
  const btn = document.getElementById('sfbtn'); if (!btn) return;
  const live = LIVE[SF_ID], last = LAST[SF_ID];
  btn.className = 'sf' + (live ? ' busy' : (last && ['failed','timeout','empty','incomplete'].includes(last.status) ? ' bad' : ''));
  btn.textContent = live
    ? '\u2912 mirroring' + (live.pct != null ? ' ' + live.pct + '%' : '\u2026')
    : '\u2912 Snowflake' + (last ? ' \u00b7 ' + ago(last.ts_start) : '');
  btn.title = live ? 'A mirror is running — click to open it'
    : (last ? 'Last mirror: ' + last.status + ' ' + ago(last.ts_start) + '. Click to mirror now.'
            : 'Mirror the warehouse to Snowflake');
}

async function mirrorToSnowflake(){
  if (LIVE[SF_ID]) { await select(SF_ID); return; }        // already running → just go watch it
  if (!confirm('Mirror the warehouse to Snowflake?\n\nRuns the snowflake-load build on its own '
             + 'machine and uploads every table that changed since the last successful load.')) return;
  try {
    const r = await fetch('/api/collect/run', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: SF_ID, trigger: 'manual'})});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'refused');
    await select(SF_ID);                                    // open it so the console is right there
    watch(j.run_id);
  } catch(e){ alert('could not start the mirror: ' + e.message); }
}

/* ── run + watch ─────────────────────────────────────────────────────────── */
async function startRun(){
  const s = SRC.find(x => x.id === SEL);
  if (!s) return;
  const btn = document.getElementById('btnrun');
  btn.disabled = true; btn.textContent = 'starting…';
  const body = { id: s.id, trigger: 'manual' };
  const sh = document.getElementById('shards');
  if (sh && +sh.value > 1) body.shards = +sh.value;   // fleet: N machines, one deterministic slice each
  const wm = document.getElementById('winmode');
  if (wm){
    if (wm.value === 'all') body.all = true;
    else if (wm.value === '7') body.days = 7;
    else if (wm.value === 'custom') body.days = parseInt(document.getElementById('windays').value || '7', 10);
  }
  try {
    const r = await fetch('/api/collect/run', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'run refused');
    if (j.fleet) alert('Launched ' + j.launched.length + ' of ' + j.shards + ' shards.\n\n'
      + j.launched.map(l => '  shard ' + l.shard + ' -> ' + l.machine).join('\n')
      + '\n\nEach shard journals separately; watching the first.');
    watch(j.run_id);
  } catch(e){
    document.getElementById('console').innerHTML = '<span class="err">could not start run: '+esc(e.message)+'</span>';
  } finally {
    btn.disabled = false; btn.textContent = 'Run now';
  }
}

function stopPoll(){ if (POLL) { clearInterval(POLL); POLL = null; } ACTIVE_RUN = null; }

function watch(runId){
  stopPoll();
  ACTIVE_RUN = runId;
  const tick = async () => {
    let d;
    try { d = await jget('/api/collect/run?id=' + encodeURIComponent(runId)); }
    catch(e){ return; }
    if (!d || !d.ok) return;
    renderRun(d.run);
    if (++TICKS % 4 === 0) loadSample(true);        // ~every 12s while the run is in flight
    const done = ['ok','failed','timeout','empty','no-change','current','degraded','no-creds','done',
                  'lost','incomplete'].includes(d.run?.status);
    if (done){ stopPoll(); loadSample(true); loadAll(); }
  };
  tick();
  POLL = setInterval(tick, 3000);
}

function renderRun(r){
  if (!r) return;
  const meta = document.getElementById('runmeta');
  const landed = Object.entries(r.rows_landed || {}).map(([t,n]) => `${t} ${fmt(n)}`).join(' · ');
  meta.innerHTML = `
    <span class="k">status <b>${esc(r.status)}</b></span>
    ${r.stage ? `<span class="k">stage <b>${esc(r.stage)}</b></span>` : ''}
    <span class="k">seen <b>${r.rows_seen == null ? '—' : fmt(r.rows_seen)}</b></span>
    <span class="k">landed <b>${landed || '—'}</b></span>
    <span class="k">lines <b>${fmt(r.log_lines_total)}</b></span>
    <span class="k">heartbeat <b>${r.heartbeat_age_s == null ? '—' : r.heartbeat_age_s + 's ago'}</b></span>
    <span class="k">${esc(r.trigger||'')} · ${r.machine_id ? 'machine '+esc(r.machine_id) : ''}</span>
    ${(r.warnings||[]).length ? `<span class="k" style="color:var(--warn)">⚠ ${esc(r.warnings.join('; '))}</span>` : ''}
    ${r.stale ? `<span class="k" style="color:var(--bad)">✕ ${esc(r.error||'no heartbeat')}</span>` : ''}`;
  const c = document.getElementById('console');
  const stick = c.scrollTop + c.clientHeight >= c.scrollHeight - 40;
  c.innerHTML = (r.log || []).map(l => {
    const cls = /error|traceback|denied|403|refus|fail/i.test(l) ? 'err'
              : /warn|degrad/i.test(l) ? 'warnl'
              : /\bok\b|landed|wrote|\+\d+/i.test(l) ? 'ok' : '';
    return cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l);
  }).join('\n') || '(no output yet)';
  if (stick) c.scrollTop = c.scrollHeight;
}

/* ── load ────────────────────────────────────────────────────────────────── */
async function loadAll(force){
  // MERGE, NEVER REPLACE. Every feed here used to degrade to an EMPTY object on failure
  // (`.catch(() => ({last:{}}))`), and the result was assigned straight over global state. So one slow
  // or failed /api/collect/status set LAST = {} and every source instantly read "never run" — then the
  // next tick restored it. That is the data blinking in and out: absence of an ANSWER was being
  // rendered as absence of DATA. A failed read now changes nothing except a staleness flag.
  // The lock EXPIRES. Every request above is already bounded, but a lock with no upper bound is a
  // single-point freeze waiting to happen: any future code path that can hang would stop the bench
  // updating for the rest of the session with no visible symptom. Belt and braces, deliberately.
  if (INFLIGHT && (Date.now() - INFLIGHT) < 45000) return;
  INFLIGHT = Date.now();
  const gen = ++GEN;
  try {
    // Run history comes from the shared LEDGER (/api/collect/status), not /api/runs — the latter is this
    // process's in-memory list, which is empty on a freshly-booted machine and makes every source read
    // "never run" while the ledger holds the real history.
    const r = await Promise.allSettled([
      jget('/api/registry/sources'),
      jget('/api/monitor' + (force ? '?fresh=1' : '')),
      jget('/api/collect/status' + (force ? '?fresh=1' : '')),
      jget('/api/collect/state'),
      jget('/api/collect/runs?active=1&limit=25'),
    ]);
    if (gen !== GEN) return;               // a newer load already landed; this one is stale by definition
    const [reg, mon, led, st, act] = r;
    const ok = x => x.status === 'fulfilled' ? x.value : null;
    let anyFail = false;
    const take = (res, name, apply) => {
      const v = ok(res);
      if (v){ FEED_STALE[name] = false; apply(v); }
      else { FEED_STALE[name] = true; anyFail = true; }   // KEEP what we had
    };

    take(reg, 'reg', v => { if (v.sources && v.sources.length) SRC = v.sources; });
    // Partial /api/monitor responses (it returns a subset while its cache rebuilds) must MERGE into the
    // known counts, not replace them — otherwise row counts vanish for whatever is missing this tick.
    take(mon, 'mon', v => (v.sources || []).forEach(x => { TABLES[x.name] = x.rows; }));
    take(led, 'led', v => { LAST = v.last || LAST; STREAK = v.zero_streak || STREAK;
                            MANUAL = !!v.manual_only; MANUAL_LOCKED = !!v.manual_only_locked; });
    take(st,  'state', v => { STATE = {confirmed: v.confirmed || {}, archived: v.archived || {}}; });
    // LIVE is the exception that must still clear: a run that ENDED has to leave the live list, or the
    // bench shows a finished job as forever in-flight. Only rebuild it when the fetch actually answered.
    take(act, 'runs', v => { LIVE = {}; (v.runs || []).forEach(x => { if (x && x.source) LIVE[x.source] = x; }); });

    document.getElementById('dot').className = 'dot' + (anyFail ? ' warn' : '');
    const m = ok(mon);
    if (m){
      const prod = m.warehouse?.remote ?? (ok(reg) || {}).remote;
      document.getElementById('wh').className = 'wh ' + (prod ? 'prod' : 'local');
      document.getElementById('wh').textContent = prod ? 'warehouse: remote' : 'warehouse: LOCAL';
    }
    const mp = document.getElementById('modepill');
    mp.className = 'mode' + (MANUAL ? '' : ' auto');
    mp.textContent = MANUAL ? 'MANUAL ONLY' : 'AUTO-DISPATCH ON';
    mp.title = MANUAL
      ? 'Nothing runs on its own — every job is you pressing Run now. Click to re-enable the scheduler.'
      : 'The dispatcher runs due sources on their cadence. Click to switch to manual-only.';
    mp.onclick = toggleManual;
    const nconf = Object.keys(STATE.confirmed).length, narch = Object.keys(STATE.archived).length;
    const stale = Object.keys(FEED_STALE).filter(k => FEED_STALE[k]);
    document.getElementById('asof').textContent =
      `${SRC.length} sources · ${nconf} confirmed · ${narch} archived · counts ${m ? (m.cached ? m.cache_age_s + 's old' : 'live') : 'held'}${m && m.building ? ' · building…' : ''}`
      + (stale.length ? ` · ${stale.join('/')} unreachable — showing last known` : '');
    sfLabel();
    renderList();
    if (SEL) renderDetail();
  } catch(e){
    // Only a genuine render crash lands here now. Say so WITHOUT destroying the list that is on screen.
    document.getElementById('dot').className = 'dot off';
    const a = document.getElementById('asof');
    if (a) a.textContent = 'refresh failed: ' + e.message + ' — showing last known';
  } finally { INFLIGHT = 0; }
}

loadAll();
// ONE timer. Two overlapping intervals (60s + 15s) both called loadAll with no guard, so a slow
// response could land after a fast one and overwrite fresh state with stale — values visibly jumping
// backwards. The single loop polls faster only while something is actually live.
setInterval(() => {
  if (ACTIVE_RUN) return;                        // the run poller owns the screen during a run
  if (Object.keys(LIVE).length || (++TICKS % 4) === 0) loadAll();
}, 15000);
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --teal:#3fb8a3; --teal-d:#1E5F55; --ink:#0e1613; --paper:#e9f2ef; --muted:#8aa39d; --line:#22322e;
         --disp:"Fraunces",Georgia,serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--body)}
  #stage{position:fixed;inset:0}
  canvas{display:block}
  .lbl{font-family:var(--mono);font-size:11px;color:#cfe6df;letter-spacing:.02em;pointer-events:none;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.8);transition:opacity .3s}
  .lbl.ent{font-family:var(--body);font-weight:700;font-size:12.5px;color:#eafaf5;text-align:center}
  .lbl.ent .en{display:block}
  .lbl.ent .pk{display:block;font-family:var(--mono);font-weight:500;font-size:8.5px;letter-spacing:.02em;color:#d9b03f;margin-top:1px;opacity:.92}
  .lbl.planned{color:#6f938a}
  .lbl.dim{opacity:.1}
  .card svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.75))}
  .card{opacity:.85;transition:opacity .3s} .card.dim{opacity:.06}
  .hud{position:fixed;pointer-events:none;z-index:5}
  .top{top:0;left:0;right:0;padding:18px 22px;display:flex;align-items:flex-start;gap:14px;background:linear-gradient(180deg,rgba(14,22,19,.85),rgba(14,22,19,0))}
  .brand .ey{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#6f938a}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:20px;margin:3px 0 0;color:#eafaf5}
  .hint{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:#6f938a;text-align:right;line-height:1.7}
  .hint b{color:#a9c9c0;font-weight:600}
  /* live indicator */
  .live{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:#a9c9c0;background:rgba(18,28,25,.8);border:1px solid var(--line);border-radius:20px;padding:5px 13px;cursor:pointer;transition:border-color .15s}
  .live:hover{border-color:var(--teal)}
  .live .dot{width:7px;height:7px;border-radius:50%;background:#5bb86e;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,184,110,.5)}70%{box-shadow:0 0 0 7px rgba(91,184,110,0)}100%{box-shadow:0 0 0 0 rgba(91,184,110,0)}}
  .live.stale .dot{background:#d99a3f;animation:none}
  .live.off .dot{background:#6f7f7a;animation:none}
  .live.warn{border-color:#d9584f;color:#e79a92} .live.warn .dot{background:#d9584f}
  .sel{position:fixed;left:22px;bottom:22px;width:294px;max-height:calc(100vh - 44px);overflow:auto;background:rgba(18,28,25,.93);border:1px solid var(--line);border-radius:13px;padding:15px 17px;z-index:6;backdrop-filter:blur(6px);transform:translateY(14px);opacity:0;transition:.25s;pointer-events:auto}
  .sel.show{transform:none;opacity:1}
  .sel .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#6f938a}
  .sel .nm{font-family:var(--disp);font-weight:600;font-size:19px;margin:2px 0 2px;color:#eafaf5}
  .sel .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
  .sel .keyed{margin:2px 0 4px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .sel .keyed .pkline{font-family:var(--mono);font-size:10px;color:#d9b03f;font-weight:600;width:100%}
  .sel .keyed .attr{font-family:var(--mono);font-size:10px;color:#a9c9c0;background:rgba(63,184,163,.1);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
  .sel .cxh{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#6f938a;margin:8px 0 6px}
  .sel .cx{display:flex;flex-direction:column;gap:5px}
  .sel .cxrow{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .sel .road{font-family:var(--mono);font-size:8.5px;color:#0e1613;background:var(--teal);padding:1px 6px;border-radius:20px;font-weight:600}
  .sel .to{color:#dcefe9}
  .sel .none{font-size:12px;color:#c98a4a;font-style:italic}
  .sel .reset{margin-top:12px;font-family:var(--mono);font-size:11px;color:#a9c9c0;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
  .sel .reset:hover{border-color:var(--teal);color:#eafaf5}
  .sel .qwrap{margin-top:12px;border-top:1px solid var(--line);padding-top:11px}
  .sel .qhead{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#6f938a;margin-bottom:7px}
  .sel .qrow{display:flex;gap:6px;align-items:center}
  .sel select{flex:1;min-width:0;background:#0e1613;color:#dcefe9;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-family:var(--mono);font-size:11px;outline:none}
  .sel select#qop{flex:0 0 78px}
  .sel .qgo{flex:0 0 auto;background:var(--teal);color:#0e1613;border:none;border-radius:7px;padding:6px 11px;font-family:var(--mono);font-size:12px;font-weight:700;cursor:pointer}
  .sel .qout{margin-top:9px;max-height:168px;overflow:auto}
  .sel .qout .qv{display:inline-block;background:rgba(63,184,163,.14);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin:0 4px 4px 0;font-family:var(--mono);font-size:11px;color:#cfe6df}
  .sel .qmeta{font-family:var(--mono);font-size:9.5px;color:#6f938a;margin-top:5px;display:block}
  .legend{position:fixed;right:22px;bottom:22px;z-index:5;font-family:var(--mono);font-size:10px;color:#6f938a;text-align:right;line-height:1.9;pointer-events:none}
  .legend .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:7px;vertical-align:middle}
  .legend .di{display:inline-block;width:8px;height:8px;margin-left:7px;vertical-align:middle;transform:rotate(45deg)}
  .legend .cf{color:#9ec7bd;font-family:var(--mono)}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;font-family:var(--mono);font-size:12px;color:#6f938a;background:var(--ink)}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

</head>
<body>
  <div id="stage"></div>
  <div class="loading" id="loading">reading the estate…</div>
  <div class="live off" id="live" title="Live read from the engine · click to refresh"><span class="dot"></span><span id="livetx">connecting…</span></div>
  <div class="hud top">
    <div class="brand"><div class="ey">Hoodie Suite · Estate</div><h1>The Estate, as an object</h1></div>
    <div class="hint"><b>drag</b> to spin · <b>scroll</b> to zoom · <b>click a node</b> to focus<br>a node lights only what it touches — the rest drops out</div>
  </div>
  <div class="sel" id="sel"></div>
  <div class="legend">entity ●<span class="sw" style="background:#3fb8a3"></span> · feed ◆<span class="di" style="background:#5bb86e"></span><br>live<span class="sw" style="background:#5bb86e"></span> · planned<span class="sw" style="background:#5f7a72"></span> · drifting<span class="sw" style="background:#d99a3f"></span> · broke<span class="sw" style="background:#d9584f"></span><br><span class="cf">|—&lt; one‑to‑many</span> · 🔑 key</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── canonical entities (the schema spine) — fixed geography ────────────────────────
const ENT=[ {id:'portfolio',label:'Portfolio',p:[4,40,-14]}, {id:'brand',label:'Brand',p:[-30,22,8]},
  {id:'item',label:'Item',p:[0,2,0]}, {id:'sku',label:'SKU',p:[-40,-14,28]},
  {id:'outlet',label:'Outlet',p:[46,-8,-16]}, {id:'account',label:'Account',p:[72,-28,-30]} ];
const ENT_POS={}; ENT.forEach(e=>ENT_POS[e.id]=new THREE.Vector3(...e.p));
// canonical relationships — [a, b, verb, cardinality@a, cardinality@b] (crow's-foot: one | many)
const CANON=[
  ['portfolio','brand','has','one','many'],
  ['brand','item','has','one','many'],
  ['item','sku','has','one','many'],
  ['outlet','account','operated-by','many','one'],
  ['item','outlet','sell-out','many','many'] ];
// each entity is a keyed "table": primary key + the key attributes an ERD would list
const ENTMETA={
  portfolio:{pk:'portfolio_id',attrs:['name','owner']},
  brand:{pk:'brand_id',attrs:['name','portfolio_id']},
  item:{pk:'item_id',attrs:['name','brand_id','upc']},
  sku:{pk:'sku_id',attrs:['item_id','size','pack','gtin']},
  outlet:{pk:'outlet_id',attrs:['license#','address','geo']},
  account:{pk:'account_id',attrs:['licensee','dba','license#']} };
const ROADCOL={ upc:'#3fb8a3', variant:'#57c9b3', brand:'#3fb8a3', price:'#4a90d9', availability:'#4a90d9',
  'license#':'#d99a3f', owner:'#d9b03f', address:'#5bb86e', depletion:'#8a6fd0', name:'#7a7f9a',
  'sell-out':'#8aa39d', 'is-a':'#3fb8a3', has:'#3fb8a3', 'operated-by':'#d99a3f' };
const STCOL={ proven:'#5bb86e', live:'#5bb86e', candidate:'#3fb8a3', ready:'#3fb8a3', drifting:'#d99a3f',
  building:'#4a90d9', broken:'#d9584f', data:'#5bb86e', planned:'#5f7a72', paused:'#6f7f7a' };
const SEED=[
  {nm:"Florida — Outlets",foot:"FL DBPR/ABT licensees",fields:[],tier:"Spine & Master",status:"Ready"},
  {nm:"TTB — COLA Labels",foot:"TTB registry",fields:["UPC"],tier:"Spine & Master",status:"Ready"},
  {nm:"Binny's — Inventory",foot:"IL",fields:["Availability","Price","Units"],tier:"Specialty Bev-Alc",status:"Live"},
  {nm:"Total Wine & More",foot:"National",fields:["Availability","Price","Promo"],tier:"Specialty Bev-Alc",status:"Live"},
  {nm:"NABCA depletions",foot:"Control states",fields:["Units"],tier:"Control States",status:"Planned"},
  {nm:"Outback — Locations",foot:"National",fields:["Location","Address","Phone"],tier:"On-Premise Accounts",status:"Ready",plat:"Yext locator"},
];

// map real column / field names → (entity, road)
function roadsFromCols(cols, hints){
  const c=(cols||[]).map(x=>String(x).toLowerCase()), any=re=>c.some(x=>re.test(x)), es=[];
  if(any(/(^|_| )upc($|_| )|gtin|barcode/)) es.push(['item','upc']);
  if(any(/sku|variant|itemsize|\bsize\b|\bpack\b/)) es.push(['sku','variant']);
  if(any(/brand/)) es.push(['brand','brand']);
  if(any(/price|amount|\bcost\b|strike/)) es.push(['item','price']);
  if(any(/avail|stock|inventory|instock/)) es.push(['item','availability']);
  if(any(/licens|permit|\babt\b|dbpr/)) { es.push(['outlet','license#']); es.push(['account','license#']); }
  if(any(/owner|\bdba\b|business|licensee/)) es.push(['account','owner']);
  if(any(/address|\bcity\b|\bzip\b|\bstate\b|\blat\b|\blng\b|longitude|latitude|store|location|premise|phone/)) es.push(['outlet','address']);
  if(any(/deplet|movement/)) es.push(['brand','depletion']);
  // tier / name hints when columns are sparse
  const h=(hints||'').toLowerCase();
  if(!es.length && /on-premise|locator|yext|location/.test(h)) es.push(['outlet','address']);
  if(!es.length && /dbpr|abt|licens|outlet/.test(h)) { es.push(['outlet','license#']); es.push(['account','license#']); }
  if(!es.length && /nabca|deplet|control/.test(h)) es.push(['brand','depletion']);
  if(!es.length) es.push(['item','name']);
  const seen=new Set(); return es.filter(e=> !seen.has(e[0]) && seen.add(e[0]));
}
// a self-contained crow's-foot connector for a relationship: [a-end]——[b-end], always horizontal
// (billboarded, no per-frame rotation) — one = a single bar, many = the three-pronged foot
function cardSVG(ca,cb){
  const barL='<line x1="10" y1="1.5" x2="10" y2="12.5"/>', barR='<line x1="43" y1="1.5" x2="43" y2="12.5"/>';
  const footL='<path d="M15 7 L3 1.5 M15 7 L3 7 M15 7 L3 12.5"/>', footR='<path d="M38 7 L50 1.5 M38 7 L50 7 M38 7 L50 12.5"/>';
  return '<svg width="53" height="14" viewBox="0 0 53 14" fill="none" stroke="#9ec7bd" stroke-width="1.3" stroke-linecap="round">'
    +'<line x1="12" y1="7" x2="41" y2="7"/>'+(ca==='many'?footL:barL)+(cb==='many'?footR:barR)+'</svg>';
}
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function friendly(nm){ return String(nm||'source').replace(/\s*—.*$/,'').replace(/\s*\([^)]*\)\s*$/,'').slice(0,26); }
function dsName(k){ const M={bd4008lic:'FL · Item master',bd4011lic:'FL · Registrants',abtbrands:'FL · Brand renewals',bd4006lic:'FL · Retail outlets',bd4005lic:'FL · Wholesale',bd400revok:'FL · Revoked',bd4002lic:'FL · Permits',abc_store_cells:'ABC · store cells'}; return M[k]||('dataset · '+k); }
// deterministic position by name → stable geography across refreshes
function stablePos(name, connEnts){
  let h=2166136261; for(let i=0;i<name.length;i++){ h^=name.charCodeAt(i); h=Math.imul(h,16777619); }
  const u=((h>>>0)%100000)/100000, v=(((h>>>7)>>>0)%100000)/100000;
  const ang=u*Math.PI*2, rad=Math.acos(1-2*v);
  const dir=new THREE.Vector3(Math.cos(ang)*Math.sin(rad), Math.cos(rad), Math.sin(ang)*Math.sin(rad));
  const mean=new THREE.Vector3(); (connEnts||[]).forEach(e=> ENT_POS[e]&&mean.add(ENT_POS[e]));
  if(connEnts&&connEnts.length) mean.multiplyScalar(1/connEnts.length);
  return dir.multiplyScalar(128).lerp(mean.clone().multiplyScalar(1.6), 0.28);
}

// ── live read ──────────────────────────────────────────────────────────────────────
async function loadLive(){
  const get=u=>fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
  const [recs,dsets,hls]=await Promise.all([get('/api/recipes'),get('/api/datasets'),get('/api/highlights')]);
  return { recipes:(recs&&recs.recipes)||[], datasets:dsets||{}, highlights:(hls&&hls.highlights)||[], online:!!(recs||dsets) };
}
// build the graph model from the live read (+ catalog for the familiar estate)
function buildModel(live){
  const nodes=[], edges=[], byId={};
  ENT.forEach(e=>{ const n={id:e.id,label:e.label,kind:'ent',pos:ENT_POS[e.id].clone()}; nodes.push(n); byId[e.id]=n; });
  CANON.forEach(([a,b,road,ca,cb])=>edges.push({a,b,road:road||'is-a',card:true,ca:ca||null,cb:cb||null}));

  const recByHost={}; (live.recipes||[]).forEach(r=>{ recByHost[r.host]=r; });
  const seen={};   // dedupe by display name
  function addSource(key,disp,status,sub,cols,hints,liveFlag,dataset,host){
    const dn=disp.toLowerCase(); if(seen[dn]) return; seen[dn]=1;
    const rs=roadsFromCols(cols,hints), ents=rs.map(r=>r[0]);
    const n={id:key,label:friendly(disp),full:disp,kind:'src',status:(status||'planned').toLowerCase(),
             sub:sub,live:liveFlag,cols:(cols||[]),dataset:dataset||null,host:host||null,pos:stablePos(disp,ents)};
    nodes.push(n); byId[key]=n; rs.forEach(([e,road])=>edges.push({a:key,b:e,road}));
  }

  // 1) the familiar estate — catalog names, with LIVE status/cols overlaid from the backend
  let cat=[]; try{ cat=JSON.parse(localStorage.getItem('hoodie.pulls.tracker.v2')||'[]')||[]; }catch(e){}
  if(!cat.length && !live.online) cat=SEED;
  cat.forEach((s,i)=>{
    const rec=recByHost[hostOf(s.url)];
    const cols=rec?Object.keys((rec.config&&rec.config.field_map)||{}).concat((rec.config&&rec.config.fields)||[]):(s.fields||[]);
    const status=rec?rec.status:(s.status||'Planned');
    const liveFlag=!!rec || /live/i.test(s.status||'');
    const sub=(rec?('recipe · '+rec.status):(s.tier||'')) + (s.foot?(' · '+s.foot):'');
    addSource('c'+i, s.nm||('source '+i), status, sub, cols, (s.tier||'')+' '+(s.nm||''), liveFlag, null, hostOf(s.url));
  });
  // 2) owned datasets pulled by the engine — real data, real columns
  Object.entries(live.datasets||{}).forEach(([k,v])=>{
    const cols=(v&&v.header)||[]; const rows=(v&&(v.total||(v.rows&&v.rows.length)))||'';
    addSource('d:'+k, dsName(k), 'data', 'owned dataset'+(rows?(' · '+rows+' rows'):''), cols, k, true, k);
  });
  // 3) any proven/analyzed recipe not already shown (new backend sources appear on their own)
  (live.recipes||[]).forEach((r,i)=>{
    const cols=Object.keys((r.config&&r.config.field_map)||{}).concat((r.config&&r.config.fields)||[]);
    addSource('r'+i, r.host, r.status, 'recipe · '+(r.platform||'')+' · '+r.status, cols, r.host, true, null, r.host);
  });

  const adj={}; nodes.forEach(n=>adj[n.id]=new Set());
  edges.forEach(e=>{ if(byId[e.a]&&byId[e.b]){ adj[e.a].add(e.b); adj[e.b].add(e.a); } });
  return {nodes,edges:edges.filter(e=>byId[e.a]&&byId[e.b]),byId,adj};
}

// ── scene (built once) ───────────────────────────────────────────────────────────
const stage=document.getElementById('stage');
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x0e1613,0.0026);
const camera=new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.5, 3000); camera.position.set(120,72,196);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(2,devicePixelRatio)); stage.appendChild(renderer.domElement);
const lr=new CSS2DRenderer(); lr.setSize(innerWidth,innerHeight); lr.domElement.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:4'; document.body.appendChild(lr.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=.08; controls.rotateSpeed=.7; controls.minDistance=18; controls.maxDistance=640;
controls.zoomToCursor=true;   // scroll zooms toward the mouse, not the pivot
scene.add(new THREE.AmbientLight(0xffffff,.78)); const dl=new THREE.DirectionalLight(0xdff5ee,.7); dl.position.set(60,120,80); scene.add(dl);
// no ground grid — it reads as a floor and makes orbit feel like the scene sways; this is an
// object you spin in space. a faint far starfield gives just enough spatial reference.
(function(){ const g=new THREE.BufferGeometry(), P=[]; let s=99173;
  for(let i=0;i<420;i++){ s=(s*1103515245+12345)&0x7fffffff; const u=(s%1000)/1000; s=(s*1103515245+12345)&0x7fffffff; const v=(s%1000)/1000;
    const th=u*6.283, ph=Math.acos(2*v-1), R=620; P.push(R*Math.sin(ph)*Math.cos(th),R*Math.sin(ph)*Math.sin(th),R*Math.cos(ph)); }
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x2b423c,size:1.6,sizeAttenuation:false}))); })();
const esph=new THREE.SphereGeometry(1,24,24);           // canonical entity = round core
const soct=new THREE.OctahedronGeometry(1,0);           // source/feed = faceted gem (a distinct "system" glyph)
const pulseGeo=new THREE.SphereGeometry(2.6,12,12);
const graph=new THREE.Group(); scene.add(graph);

// ── graph state + (re)build ─────────────────────────────────────────────────────
let nodes=[], edges=[], byId={}, adj={}, meshes=[], selected=null, fly=null, homeT=null, framed=false, pulses=[], cardMarks=[];
function disposeGraph(){
  nodes.forEach(n=>{ if(n.lo){ n.lo.remove(); } });
  cardMarks.forEach(o=>{ if(o.element&&o.element.remove)o.element.remove(); }); cardMarks=[];
  pulses.forEach(p=>{ if(p.mesh&&p.mesh.material)p.mesh.material.dispose(); }); pulses=[];
  while(graph.children.length){ const c=graph.children.pop();
    if(c.geometry && c.geometry!==esph && c.geometry!==soct && c.geometry!==pulseGeo) c.geometry.dispose();   // keep shared geos
    if(c.material)c.material.dispose(); }
}
function buildGraph(model){
  disposeGraph();
  nodes=model.nodes; edges=model.edges; byId=model.byId; adj=model.adj; selected=null;
  nodes.forEach(n=>{
    const ent=n.kind==='ent';
    const col=ent?0x3fb8a3:new THREE.Color(STCOL[n.status]||(n.live?0x5bb86e:0x5f7a72)).getHex();
    const mat=new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:ent?.5:(n.live?.3:.12),roughness:.5,metalness:.1,transparent:true,opacity:1,flatShading:!ent});
    const m=new THREE.Mesh(ent?esph:soct,mat); m.scale.setScalar(ent?7.6:(n.live?4.9:3.8)); m.position.copy(n.pos); m.userData=n; graph.add(m); n.mesh=m; n.mat=mat;
    const d=document.createElement('div'); d.className='lbl'+(ent?' ent':(n.live?'':' planned'));
    if(ent){ const meta=ENTMETA[n.id]; d.innerHTML='<span class="en">'+n.label+'</span>'+(meta?'<span class="pk">🔑 '+meta.pk+'</span>':''); }
    else d.textContent=n.label;
    const lo=new CSS2DObject(d); lo.position.set(0,ent?12:6.5,0); m.add(lo); n.lo=d;
  });
  edges.forEach(e=>{
    const na=byId[e.a], nb=byId[e.b];
    // road health: a source whose recipe broke → RED (the flow didn't make it); drifting/degraded → amber
    const src=na.kind==='src'?na:(nb.kind==='src'?nb:null), st=src?src.status:'';
    e.broken=/broke|fail|block/.test(st); e.warn=/drift|degrad|partial/.test(st);
    const col=e.broken?0xd9584f:(e.warn?0xd99a3f:(ROADCOL[e.road]||0x2a3a36));
    e._base=e.broken?.72:(e.warn?.5:.32);
    const mat=new THREE.LineBasicMaterial({color:new THREE.Color(col),transparent:true,opacity:e._base});
    const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([na.pos,nb.pos]),mat); graph.add(l); e.line=l; e.mat=mat;
  });
  // crow's-foot cardinality at the midpoint of each canonical relationship — the model reads like an ERD
  edges.forEach(e=>{ if(!e.card||!e.ca) return; const na=byId[e.a], nb=byId[e.b];
    const d=document.createElement('div'); d.className='card'; d.innerHTML=cardSVG(e.ca,e.cb);
    const o=new CSS2DObject(d); o.position.copy(na.pos.clone().lerp(nb.pos,0.5)); graph.add(o);
    e.badge=d; cardMarks.push(o); });
  meshes=nodes.map(n=>n.mesh);
  // frame + pivot on the bounding-box CENTER so orbit feels centered and the cloud fills the view
  const box=new THREE.Box3(); nodes.forEach(n=>box.expandByPoint(n.pos));
  const c=box.getCenter(new THREE.Vector3()), size=box.getSize(new THREE.Vector3());
  homeT=c;
  if(!framed){ controls.target.copy(c);
    const radius=Math.max(size.x,size.y,size.z)*0.55, dist=radius/Math.tan(camera.fov*Math.PI/360)*1.32;
    camera.position.set(c.x+dist*0.12, c.y+dist*0.09, c.z+dist);   // near head-on, slight lift for depth
    framed=true; }
}

// ── interaction ─────────────────────────────────────────────────────────────────
const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2(); let down=[0,0];
const selEl=document.getElementById('sel');
function setFocus(n){
  selected=n;
  if(!n){ nodes.forEach(x=>{x.mat.opacity=1;x.lo.classList.remove('dim');x.mesh.scale.setScalar(x.kind==='ent'?7.6:(x.live?4.9:3.8));}); edges.forEach(e=>{e.mat.opacity=.32; if(e.badge)e.badge.classList.remove('dim');}); selEl.classList.remove('show');
    if(homeT){ const off=camera.position.clone().sub(controls.target); fly={toT:homeT.clone(),toC:homeT.clone().add(off),t:0,fromT:controls.target.clone(),fromC:camera.position.clone()}; }  // re-center the pivot
    return; }
  const keep=new Set([n.id,...adj[n.id]]);
  nodes.forEach(x=>{ const on=keep.has(x.id); x.mat.opacity=on?1:.05; x.lo.classList.toggle('dim',!on); x.mesh.scale.setScalar((x.kind==='ent'?7.6:(x.live?4.9:3.8))*(x.id===n.id?1.35:1)); });
  edges.forEach(e=>{ const on=(e.a===n.id||e.b===n.id); e.mat.opacity=on?.92:.02; if(e.badge)e.badge.classList.toggle('dim',!on); });
  showSel(n); flyTo(n);
}
function flyTo(n){ const off=camera.position.clone().sub(controls.target).normalize().multiplyScalar(n.kind==='ent'?72:54);
  fly={toT:n.pos.clone(),toC:n.pos.clone().add(off),t:0,fromT:controls.target.clone(),fromC:camera.position.clone()}; }
function showSel(n){
  const conns=edges.filter(e=>e.a===n.id||e.b===n.id).map(e=>{ const o=byId[e.a===n.id?e.b:e.a]; return {to:o.label,road:e.road}; });
  // queryable fields: a dataset node's own columns, or (for an entity) the columns of its connected datasets
  const colMap={};
  if(n.dataset){ (n.cols||[]).forEach(c=>{ colMap[c]=n.dataset; }); }
  else if(n.kind==='ent'){ [...adj[n.id]].map(id=>byId[id]).filter(x=>x&&x.dataset).forEach(x=>(x.cols||[]).forEach(c=>{ if(!colMap[c]) colMap[c]=x.dataset; })); }
  const qfields=Object.keys(colMap);
  const qhtml = qfields.length ? ('<div class="qwrap"><div class="qhead">Ask from here</div>'
    +'<div class="qrow"><select id="qf">'+qfields.map(f=>'<option>'+esc(f)+'</option>').join('')+'</select>'
    +'<select id="qop"><option value="distinct">distinct</option><option value="top">top 10</option><option value="count">count</option></select>'
    +'<button class="qgo" id="qgo">▸</button></div><div class="qout" id="qout"></div></div>') : '';
  const meta=n.kind==='ent'?ENTMETA[n.id]:null;
  const km = meta ? ('<div class="keyed"><span class="pkline">🔑 '+esc(meta.pk)+'</span>'
    +meta.attrs.map(a=>'<span class="attr">'+esc(a)+'</span>').join('')+'</div>') : '';
  selEl.innerHTML='<div class="k">'+(n.kind==='ent'?'Canonical entity':((n.live?'Live source · ':'Planned · ')+(n.status||'')))+'</div>'
    +'<div class="nm">'+(n.full||n.label)+'</div>'+(n.sub?'<div class="meta">'+n.sub+'</div>':'')+km
    +'<div class="cxh">'+(n.kind==='ent'?'Relationships':'Feeds · join keys')+'</div><div class="cx">'
    +(conns.length?conns.map(c=>'<div class="cxrow"><span class="road">'+c.road+'</span><span class="to">'+c.to+'</span></div>').join(''):'<div class="none">Nothing yet — an orphan (a road worth building).</div>')
    +'</div>'+qhtml+'<button class="reset" id="rst">✕ clear focus</button>';
  selEl.classList.add('show'); document.getElementById('rst').onclick=()=>setFocus(null);
  const qgo=document.getElementById('qgo'); if(qgo) qgo.onclick=()=>runQ(colMap);
}
function runQ(colMap){
  const field=document.getElementById('qf').value, op=document.getElementById('qop').value, dataset=colMap[field];
  const out=document.getElementById('qout'); out.innerHTML='<span class="qmeta">running…</span>';
  fetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dataset,field,op,limit:60})})
    .then(r=>r.json()).then(d=>{
      if(d.error){ out.innerHTML='<span class="qmeta">'+esc(d.error)+'</span>'; return; }
      let body='';
      if(d.op==='count') body='<b style="font-size:16px;color:#eafaf5">'+d.result+'</b> <span class="qmeta">non-empty</span>';
      else if(d.op==='top') body=(d.items||[]).map(i=>'<span class="qv">'+esc(i.value)+' · '+i.n+'</span>').join('');
      else body=(d.values||[]).map(v=>'<span class="qv">'+esc(v)+'</span>').join('')+(d.truncated?' <span class="qmeta">+more</span>':'');
      out.innerHTML=body+'<div class="qmeta">'+(d.op==='distinct'?(d.distinct+' distinct · '):'')+'from '+d.sampled+' of '+(d.total||d.sampled)+' rows</div>';
    }).catch(()=>{ out.innerHTML='<span class="qmeta">query failed — engine reachable?</span>'; });
}
addEventListener('pointerdown',ev=>{ down=[ev.clientX,ev.clientY]; });
addEventListener('pointerup',ev=>{
  if(Math.hypot(ev.clientX-down[0],ev.clientY-down[1])>5) return;
  mouse.x=(ev.clientX/innerWidth)*2-1; mouse.y=-(ev.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera); const hit=ray.intersectObjects(meshes)[0];
  let node=hit?hit.object.userData:null;
  if(!node){ let best=null,bd=1e9; const v=new THREE.Vector3();
    nodes.forEach(n=>{ v.copy(n.pos).project(camera); if(v.z>1)return; const d=Math.hypot((v.x*.5+.5)*innerWidth-ev.clientX,(-v.y*.5+.5)*innerHeight-ev.clientY); if(d<bd){bd=d;best=n;} });
    if(bd<46) node=best; }
  setFocus(node);
});

// ── refresh (live read) ─────────────────────────────────────────────────────────
// a pull fired → send a glow travelling down each of that source's roads to the entities it feeds
function spawnPulse(node){
  if(!node) return;
  node._glow=performance.now()+2600;
  edges.filter(e=>e.a===node.id||e.b===node.id).forEach(e=>{
    const other=byId[e.a===node.id?e.b:e.a]; if(!other) return;
    const col=new THREE.Color(ROADCOL[e.road]||0x5bb86e);
    const m=new THREE.Mesh(pulseGeo,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:1}));
    graph.add(m); pulses.push({mesh:m,from:node.pos.clone(),to:other.pos.clone(),t:0});
    if(e._pre==null) e._pre=e.mat.opacity; e._flash=performance.now()+1600;   // light the road
  });
}
const liveEl=document.getElementById('live'), liveTx=document.getElementById('livetx');
let lastRead=0, lastSig='', seenTs=0, issuesCount=0;
const RE_ISSUE=/broke|fail|block|drift|degrad|partial/;   // real problems only — 'paused' is intentional, stays neutral
async function refresh(){
  const live=await loadLive();
  const model=buildModel(live);
  // only rebuild the scene when the estate actually changed (else the poll would flicker + reset focus)
  const sig=model.nodes.map(n=>n.id+':'+n.status).sort().join('|');
  if(sig!==lastSig){ const selId=selected&&selected.id; buildGraph(model); lastSig=sig; if(selId&&byId[selId]) setFocus(byId[selId]); }
  // real pull activity → pulse the source that just ran (highlights carry host + ts)
  const hs=live.highlights||[], mx=hs.reduce((m,h)=>Math.max(m,h.ts||0),0);
  if(!seenTs){ seenTs=mx; }   // first read: adopt the backlog, don't pulse it
  else { hs.forEach(h=>{ if((h.ts||0)>seenTs){ const nd=nodes.find(n=>n.kind==='src'&&n.host&&n.host===h.host); if(nd) spawnPulse(nd); } }); seenTs=Math.max(seenTs,mx); }
  lastRead=Date.now();
  issuesCount=nodes.filter(n=>n.kind==='src'&&RE_ISSUE.test(n.status)).length;
  liveEl.className='live'+(live.online?'':' off')+(issuesCount?' warn':'');
  liveTx.textContent=live.online?('live · '+nodes.filter(n=>n.kind==='src'&&n.live).length+' connected'+(issuesCount?(' · ⚠ '+issuesCount+' need attention'):'')):'offline · catalog view';
  const L=document.getElementById('loading'); if(L)L.remove();
}
function tickLive(){ if(!lastRead)return; const age=(Date.now()-lastRead)/1000;
  if(liveEl.classList.contains('off'))return;
  liveEl.classList.toggle('stale',age>75);
  const suf=issuesCount?(' · ⚠ '+issuesCount+' need attention'):'';
  liveTx.textContent = (age<60 ? ('live · '+nodes.filter(n=>n.kind==='src'&&n.live).length+' connected') : ('updated '+Math.floor(age/60)+'m ago · refresh'))+suf; }
liveEl.onclick=refresh;

// ── loop ─────────────────────────────────────────────────────────────────────────
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); lr.setSize(innerWidth,innerHeight); });
function tick(){ requestAnimationFrame(tick);
  if(fly){ fly.t=Math.min(1,fly.t+.045); const e=1-Math.pow(1-fly.t,3); controls.target.lerpVectors(fly.fromT,fly.toT,e); camera.position.lerpVectors(fly.fromC,fly.toC,e); if(fly.t>=1)fly=null; }
  const t=performance.now()*0.001, now=performance.now();
  nodes.forEach(n=>{ if(n.kind==='ent'&&n.mat) n.mat.emissiveIntensity=.42+Math.sin(t*1.6+n.pos.x)*.1;
    if(n.kind==='src'&&n.mesh) n.mesh.rotation.y+=0.0045;   // feed gems turn slowly — a distinct life from the still spine
    if(n.kind==='src'&&n.mat&&/broke|fail|block/.test(n.status)) n.mat.emissiveIntensity=.35+.4*Math.abs(Math.sin(now*0.004));   // failing node breathes red
    if(n._glow){ if(n._glow>now){ if(n.mat){ n.mat.emissiveIntensity=.9; } if(n.lo)n.lo.style.color='#eafaf5'; } else { n._glow=0; if(n.lo)n.lo.style.color=''; } } });
  edges.forEach(e=>{ if(e._flash){ if(e._flash>now){ e.mat.opacity=.5+0.45*Math.abs(Math.sin(now*0.006)); } else { e._flash=0; e.mat.opacity=(e._pre!=null?e._pre:(e._base||.32)); e._pre=null; } }
    else if(e.broken&&!selected){ e.mat.opacity=.58+.4*Math.abs(Math.sin(now*0.004)); } });   // a broken road pulses red so it shows itself
  for(let i=pulses.length-1;i>=0;i--){ const p=pulses[i]; p.t+=.011; p.mesh.position.lerpVectors(p.from,p.to,p.t);
    p.mesh.material.opacity=Math.max(0,1-Math.abs(p.t-.45)*1.6); p.mesh.scale.setScalar(1+Math.sin(p.t*Math.PI)*0.8);
    if(p.t>=1){ graph.remove(p.mesh); p.mesh.material.dispose(); pulses.splice(i,1); } }
  controls.update(); renderer.render(scene,camera); lr.render(scene,camera);
}
refresh(); setInterval(refresh,60000); setInterval(tickLive,5000); tick();
</script>

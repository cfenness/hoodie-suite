<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../suite.css">
<title>Unifyd · Master Data Control Plane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Hoodie Suite palette (teal / paper / ink) */
    --ink:#F4F6F5; --ink-2:#FFFFFF; --ink-3:#F4F6F5; --ink-4:#EEF2F0;
    --line:#D7DDDB; --line-soft:#EAEEED;
    --text:#243330; --text-2:#5E6B68; --text-3:#8A9490;
    --stamp:#4E79A7; --stamp-dim:#7BA79D; --stamp-glow:#4E79A712;
    --ok:#15803d; --run:#4E79A7; --warn:#b45309; --fail:#b4232a; --idle:#9AA4A0;
    --r:8px; --r-sm:6px;
    --sh:0 1px 2px rgba(30,40,38,.07),0 1px 1px rgba(30,40,38,.04);
    --sh-md:0 2px 10px rgba(30,40,38,.10);
    --mono:'JetBrains Mono',monospace; --disp:'Fraunces',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;overflow:hidden}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#D3D8D6;border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:#BEC6C2}
  ::-webkit-scrollbar-track{background:transparent}
  a{color:inherit}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- Rail ---------- */
  .rail{width:226px;flex:0 0 226px;height:100vh;background:var(--ink-2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;border-bottom:1px solid var(--line-soft);margin-bottom:4px}
  .brand .mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(155deg,#4E79A7,#3D6089);display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:16px;box-shadow:var(--sh)}
  .brand .nm{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.2px;color:var(--text)}
  .brand .sub{font-family:var(--mono);font-size:9px;color:var(--text-3);letter-spacing:1.4px;text-transform:uppercase;margin-top:1px}
  .nav-grp{margin-top:4px}
  .nav-grp .lbl{font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--text-3);padding:14px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r-sm);color:var(--text-2);font-size:13.5px;font-weight:500;position:relative;transition:.13s;width:100%;text-align:left}
  .nav-item svg{width:16px;height:16px;flex:0 0 16px;stroke-width:1.7}
  .nav-item:hover{background:var(--ink-3);color:var(--text)}
  .nav-item.on{background:#E8EEF5;color:#3D6089}
  .nav-item.on::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--stamp)}
  .nav-item .ph{margin-left:auto;font-family:var(--mono);font-size:8px;letter-spacing:.4px;color:var(--stamp);border:1px solid #CDDDEC;background:#E8EEF5;padding:1px 5px;border-radius:20px;text-transform:uppercase}
  .rail .foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line-soft)}
  .rail .foot .ev{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text-2)}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .dot.live{background:var(--ok);box-shadow:0 0 0 3px #59a14f26}

  /* ---------- Main ---------- */
  .main{flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column;background:var(--ink)}
  .top{position:sticky;top:0;z-index:20;background:#ffffffe6;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:15px 30px;display:flex;align-items:flex-end;gap:18px}
  .top h1{font-family:var(--disp);font-weight:600;font-size:20px;margin:0;letter-spacing:.1px}
  .top .crumb{font-family:var(--disp);font-weight:600;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--text-3);margin-bottom:3px}
  .top .spacer{flex:1}
  .top .clock{font-family:var(--mono);font-size:11px;color:var(--text-2);text-align:right}
  .top .clock b{color:var(--text);font-weight:500}
  .btn{font-family:var(--body);font-weight:600;font-size:13px;padding:8px 14px;border-radius:var(--r-sm);background:var(--ink-2);border:1px solid var(--line);color:var(--text);display:inline-flex;align-items:center;gap:7px;transition:.13s;box-shadow:var(--sh)}
  .btn:hover{border-color:#CDD6D3;background:var(--ink-3)}
  .btn svg{width:14px;height:14px;stroke-width:2}
  .btn.gold{background:var(--stamp);color:#fff;border-color:#3D6089}
  .btn.gold:hover{background:#4E79A733;background:#4E79A7;filter:none}
  .btn:disabled{opacity:.5;cursor:default;box-shadow:none}
  .wrap{padding:22px 30px 60px;max-width:1180px}

  /* ---------- Summary strip ---------- */
  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  .stat{background:var(--ink-2);padding:15px 17px;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stamp);opacity:.85}
  .stat:nth-child(2)::before{background:var(--ok)}
  .stat:nth-child(3)::before{background:var(--warn)}
  .stat:nth-child(4)::before{background:var(--idle)}
  .stat .k{font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--text-3);display:flex;align-items:center;gap:6px}
  .stat .v{font-family:var(--disp);font-weight:700;font-size:27px;margin-top:6px;letter-spacing:.2px;font-variant-numeric:tabular-nums;color:var(--text)}
  .stat .v small{font-size:13px;color:var(--text-2);font-weight:500;margin-left:3px}
  .stat .meta{font-family:var(--mono);font-size:10.5px;color:var(--text-2);margin-top:3px}

  /* ---------- Section heads ---------- */
  .sec-h{display:flex;align-items:baseline;gap:12px;margin:6px 0 12px}
  .sec-h h2{font-family:var(--disp);font-weight:600;font-size:15px;margin:0;color:var(--text)}
  .sec-h .ct{font-family:var(--mono);font-size:11px;color:var(--text-3)}
  .sec-h .rt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}

  /* ---------- Connection cards ---------- */
  .conn{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;transition:.16s;box-shadow:var(--sh)}
  .conn:hover{border-color:#CDD6D3;box-shadow:var(--sh-md)}
  .conn.running{border-color:var(--run)}
  .conn-head{display:flex;align-items:center;gap:16px;padding:15px 18px;cursor:pointer}
  .conn-id{display:flex;align-items:center;gap:13px;min-width:262px}
  .badge{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:12px;flex:0 0 38px}
  .badge.item{background:#E8EEF5;color:#4E79A7;border:1px solid #D2E8E4}
  .badge.outlet{background:#E7F2F0;color:#45867F;border:1px solid #D2E8E4}
  .conn-id .nm{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--text)}
  .conn-id .auth{font-family:var(--mono);font-size:10.5px;color:var(--text-3);margin-top:1px}
  .col{display:flex;flex-direction:column;gap:3px}
  .col .cl{font-family:var(--disp);font-weight:600;font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3)}
  .col .cv{font-family:var(--mono);font-size:13px;color:var(--text);font-variant-numeric:tabular-nums}
  .col.recs{min-width:108px}
  .col.fresh{min-width:96px}
  .col.next{min-width:118px}
  .stchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:600;font-size:11px;padding:4px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;border:1px solid}
  .stchip .d{width:6px;height:6px;border-radius:50%}
  .st-success{color:#477E3F;border-color:#CDE3C9;background:#F0F7EE}.st-success .d{background:var(--ok)}
  .st-running{color:#4E79A7;border-color:#CDDDEC;background:#E8EEF5}.st-running .d{background:var(--run);animation:pulse 1s infinite}
  .st-partial{color:#B86C1F;border-color:#F6DBBC;background:#FDF3E8}.st-partial .d{background:var(--warn)}
  .st-failed{color:#B5423F;border-color:#F2CBCB;background:#FCEDED}.st-failed .d{background:var(--fail)}
  .st-idle{color:#7E8884;border-color:#E0E4E2;background:#F1F4F3}.st-idle .d{background:var(--idle)}
  .st-queued{color:#4E79A7;border-color:#CDDDEC;background:#E8EEF5}.st-queued .d{background:var(--stamp);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .conn-head .acts{margin-left:auto;display:flex;align-items:center;gap:9px}
  .icon-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--ink-2);display:grid;place-items:center;transition:.13s;color:var(--text-2)}
  .icon-btn:hover{border-color:#BCDCD3;color:var(--stamp);background:#F1F6F4}
  .icon-btn svg{width:15px;height:15px;stroke-width:1.8}
  .chev{transition:.2s;color:var(--text-3)}
  .conn.open .chev{transform:rotate(90deg)}

  .prog{height:2px;background:#E3E7E5;position:relative;overflow:hidden;display:none}
  .conn.running .prog{display:block}
  .prog .bar{position:absolute;inset:0;width:30%;background:linear-gradient(90deg,transparent,var(--run),transparent);animation:scan 1.1s infinite linear}
  @keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(430%)}}

  .extracts{border-top:1px solid var(--line);background:#F8FAF9;display:none}
  .conn.open .extracts{display:block}
  .extract{display:grid;grid-template-columns:16px 1fr 150px 120px 96px;gap:14px;align-items:center;padding:11px 20px 11px 22px;border-bottom:1px solid #EEF2F0;font-size:13px}
  .extract:last-child{border-bottom:none}
  .extract .lbl b{font-weight:600;color:var(--text)}
  .extract .lbl .role{font-family:var(--mono);font-size:10px;color:var(--text-3);margin-top:1px}
  .extract .rows{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--text)}
  .extract .delta{font-family:var(--mono);font-size:11px;text-align:right}
  .delta.up{color:var(--ok)} .delta.down{color:var(--fail)} .delta.flat{color:var(--text-3)}
  .extract .tgt{font-family:var(--mono);font-size:10px;color:var(--stamp-dim);text-align:right}
  .marker{width:8px;height:8px;border-radius:2px;justify-self:center}

  .drawer-foot{padding:11px 20px;display:flex;align-items:center;gap:14px;background:#F4F6F8;border-top:1px solid var(--line)}
  .drawer-foot .lg{font-family:var(--mono);font-size:11px;color:var(--text-2);flex:1}
  .drawer-foot .lg b{color:var(--text);font-weight:500}

  /* ---------- Jobs ledger ---------- */
  .ledger{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
  .ledger .row{display:grid;grid-template-columns:128px 150px 1fr 110px 96px 110px;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line-soft);font-size:13px}
  .ledger .row.hd{background:#F4F6F8;font-family:var(--disp);font-weight:600;font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--text-3)}
  .ledger .row:last-child{border-bottom:none}
  .ledger .row:not(.hd):hover{background:#F8FAF9}
  .ledger .row .runid{font-family:var(--mono);font-size:11px;color:var(--stamp-dim)}
  .ledger .row .when{font-family:var(--disp);font-weight:500;font-size:12.5px;color:var(--text)}
  .ledger .row .rr{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
  .ledger .row .tg{font-family:var(--mono);font-size:11px;color:var(--text-3)}
  .trigchip{font-family:var(--disp);font-weight:600;font-size:10px;padding:2px 8px;border-radius:5px;border:1px solid var(--line);color:var(--text-2);text-transform:uppercase;letter-spacing:.4px;justify-self:start;background:var(--ink-3)}

  /* ---------- Framework pages ---------- */
  .frame-note{display:flex;gap:13px;align-items:flex-start;background:#E8EEF5;border:1px solid #CDDDEC;border-radius:var(--r);padding:13px 16px;margin-bottom:22px}
  .frame-note svg{width:18px;height:18px;flex:0 0 18px;color:var(--stamp);margin-top:1px}
  .frame-note .t{font-weight:600;font-size:13.5px;color:var(--text)}
  .frame-note .d{color:var(--text-2);font-size:13px;margin-top:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .panel{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--sh)}
  .panel h3{font-family:var(--disp);font-weight:600;font-size:14px;margin:0 0 4px;display:flex;align-items:center;gap:9px;color:var(--text)}
  .panel .ph{font-family:var(--mono);font-size:8px;letter-spacing:.4px;color:var(--stamp);border:1px solid #CDDDEC;background:#E8EEF5;padding:1px 6px;border-radius:20px;text-transform:uppercase;margin-left:auto}
  .panel p.desc{color:var(--text-2);font-size:13px;margin:2px 0 12px}
  .ent{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-soft)}
  .ent:first-of-type{border-top:none}
  .ent .nm{font-weight:600;font-size:13.5px;color:var(--text)}
  .ent .pth{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
  .ent .ct{margin-left:auto;font-family:var(--disp);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;color:var(--stamp);text-align:right}
  .ent .ct small{color:var(--text-3);font-size:10px;display:block;text-align:right;font-weight:500}
  .rule{font-family:var(--mono);font-size:12px;color:var(--text-2);padding:9px 0;border-top:1px solid var(--line-soft);display:flex;gap:8px}
  .rule:first-of-type{border-top:none}
  .rule .key{color:var(--stamp);min-width:78px;font-weight:500}
  .rule .arr{color:var(--text-3)}

  /* ---------- Modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(45,52,60,.38);backdrop-filter:blur(2px);z-index:60;display:none;align-items:center;justify-content:center}
  .scrim.on{display:flex}
  .modal{width:440px;max-width:92vw;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 60px rgba(20,28,38,.28);overflow:hidden}
  .modal .mh{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
  .modal .mh .nm{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--text)}
  .modal .mh .sb{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-top:2px}
  .modal .mb{padding:18px 20px}
  .modal .lbl{font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--text-3);margin-bottom:9px}
  .cad{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .cad button{padding:11px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--ink-2);text-align:left;transition:.12s}
  .cad button:hover{border-color:#BCDCD3;background:#F4F8F6}
  .cad button.sel{border-color:var(--stamp);background:#E8EEF5}
  .cad button .h{font-weight:600;font-size:12.5px;color:var(--text)}
  .cad button.sel .h{color:#3D6089}
  .cad button .s{font-size:10.5px;color:var(--text-3);margin-top:2px;font-family:var(--mono)}
  .timewrap{display:flex;align-items:center;gap:9px;margin-bottom:18px}
  .timewrap input{font-family:var(--mono);background:var(--ink-2);border:1px solid var(--line);color:var(--text);border-radius:var(--r-sm);padding:8px 11px;font-size:13px;width:120px}
  .timewrap label{font-family:var(--disp);font-weight:600;font-size:11px;color:var(--text-2)}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#F8FAF9}

  .empty{text-align:center;padding:50px 20px;color:var(--text-3)}
  .empty .big{font-family:var(--disp);font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:4px}
  .hide{display:none!important}
  @media(max-width:920px){
    .rail{display:none}.strip{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}
    .conn-id{min-width:auto}.col.next,.col.fresh{display:none}.wrap{padding:18px}
    .ledger .row{grid-template-columns:1fr 1fr;font-size:12px}.ledger .row .tg,.ledger .row .when{display:none}
  }

  /* ---------- Explore ---------- */
  .explore{display:grid;grid-template-columns:228px 1fr;gap:16px}
  .ds-rail{border:1px solid var(--line);border-radius:var(--r);background:var(--ink-2);padding:8px;box-shadow:var(--sh);height:fit-content;position:sticky;top:78px}
  .dsgrp{margin-bottom:4px}
  .dsgrp-h{font-family:var(--disp);font-weight:600;font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);padding:8px 8px 4px}
  .dspill{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:var(--r-sm);text-align:left;transition:.12s}
  .dspill:hover{background:var(--ink-3)}
  .dspill.on{background:#E8EEF5}
  .dspill.on .dsl{color:#3D6089;font-weight:600}
  .dspill .dot{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
  .dspill .dot.item{background:var(--stamp)} .dspill .dot.outlet{background:#45867F}
  .dspill .dsl{flex:1;font-size:12.5px;color:var(--text)}
  .dspill .dsn{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
  .ds-note{font-size:11px;color:var(--text-3);padding:10px 8px 4px;line-height:1.45;border-top:1px solid var(--line-soft);margin-top:6px}
  .ds-main{min-width:0}
  .ds-bar{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
  .ds-title{display:flex;align-items:center;gap:11px}
  .ds-title .t{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--text)}
  .ds-title .s{font-size:10.5px;color:var(--text-3);margin-top:1px}
  .ds-tools{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .srch{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;background:var(--ink-2);box-shadow:var(--sh)}
  .srch svg{width:14px;height:14px;color:var(--text-3);stroke-width:2}
  .srch input{border:none;outline:none;font-family:var(--body);font-size:12.5px;width:160px;color:var(--text);background:transparent}
  .seg{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--sh)}
  .seg button{padding:6px 11px;font-family:var(--disp);font-weight:600;font-size:11.5px;color:var(--text-2);background:var(--ink-2)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:#E8EEF5;color:#3D6089}
  .ds-meta{font-size:11px;color:var(--text-2);margin-bottom:10px}
  .ds-meta b{color:var(--text);font-weight:600}
  .grid-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 248px);background:var(--ink-2);box-shadow:var(--sh)}
  table.dgrid{border-collapse:collapse;width:100%;font-size:12.5px}
  table.dgrid th{position:sticky;top:0;background:#F4F6F8;text-align:left;font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.3px;text-transform:uppercase;color:var(--text-2);padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
  table.dgrid td{padding:8px 11px;border-bottom:1px solid var(--line-soft);white-space:nowrap;color:var(--text);max-width:300px;overflow:hidden;text-overflow:ellipsis}
  table.dgrid td.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--text-2);font-size:11.5px}
  table.dgrid tbody tr:hover td{background:#F4F8F6}
  td .muted{color:var(--text-3)}
  .cellchip{display:inline-flex;align-items:center;gap:5px;font-family:var(--disp);font-weight:600;font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid}
  .cellchip i{font-family:var(--mono);font-style:normal;font-size:9.5px;opacity:.65}
  .tone-ok{color:#477E3F;border-color:#CDE3C9;background:#F0F7EE}
  .tone-warn{color:#B86C1F;border-color:#F6DBBC;background:#FDF3E8}
  .tone-fail{color:#B5423F;border-color:#F2CBCB;background:#FCEDED}
  .tone-idle{color:#7E8884;border-color:#E0E4E2;background:#F1F4F3}
  .fields-panel{border:1px solid var(--line);border-radius:var(--r);background:var(--ink-2);padding:4px 0;margin-bottom:12px;box-shadow:var(--sh);max-height:264px;overflow:auto}
  .fld{display:grid;grid-template-columns:52px 196px 152px 1fr;gap:12px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--line-soft);font-size:12px}
  .fld:last-child{border-bottom:none}
  .ft{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.3px;padding:2px 0;border-radius:4px;text-align:center}
  .ft-text{background:#E8EEF5;color:#4E79A7} .ft-id{background:#F1EAF5;color:#8A66A0} .ft-date{background:#E7F2F0;color:#45867F}
  .fld .fn{font-weight:600;color:var(--text)}
  .fld .fd{font-family:var(--mono);font-size:11px;color:var(--text-3)}
  .fld .ftop{font-family:var(--mono);font-size:10.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fld .ftop i{font-style:normal;color:var(--stamp);font-weight:600}
  @media(max-width:920px){.explore{grid-template-columns:1fr}.ds-rail{position:static}.ds-tools{width:100%}}

  /* ---------- Target Sources ---------- */
  .seqwrap{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
  .seq{display:flex;align-items:center;gap:12px;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;box-shadow:var(--sh)}
  .seql{font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);width:88px;flex:0 0 88px}
  .seqs{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .seqchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:500;font-size:12px;color:var(--text);background:var(--ink-3);border:1px solid var(--line);padding:4px 9px;border-radius:20px}
  .seqchip .sd{width:7px;height:7px;border-radius:2px}
  .seq .arr{color:var(--text-3);font-size:12px}
  .srctbl{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
  .srow{display:grid;grid-template-columns:2.1fr 1.2fr .9fr .9fr .9fr .7fr 1fr;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-soft)}
  .srow.hd{background:#F4F6F8;font-family:var(--disp);font-weight:600;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--text-3);padding:10px 16px}
  .srow.hd .sortable{cursor:pointer;user-select:none}
  .srow.hd .sortable:hover{color:var(--stamp)}
  .srow:not(.hd){cursor:pointer;transition:.12s}
  .srow:not(.hd):hover{background:#F8FAF9}
  .srow.op{background:#F4F8F6}
  .sc{min-width:0}
  .sc.nm{display:flex;align-items:center;gap:10px}
  .chev2{color:var(--text-3);font-size:11px;transition:.18s;flex:0 0 10px}
  .srow.op .chev2{transform:rotate(90deg);color:var(--stamp)}
  .sn{font-family:var(--disp);font-weight:600;font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sa{font-family:var(--mono);font-size:10px;color:var(--text-3);margin-top:1px}
  .domtag{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-weight:500;font-size:11.5px;color:var(--text-2)}
  .domtag .sd{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
  .meter{display:inline-flex;gap:3px}
  .meter i{width:9px;height:9px;border-radius:2px;background:#E5E9E7}
  .meter i.f.mv{background:var(--stamp)} .meter i.f.mq{background:var(--ok)} .meter i.f.me{background:var(--warn)}
  .eff{font-family:var(--disp);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:5px;border:1px solid}
  .eff-low{color:#477E3F;border-color:#CDE3C9;background:#F0F7EE}
  .eff-med{color:#B86C1F;border-color:#F6DBBC;background:#FDF3E8}
  .eff-high{color:#B5423F;border-color:#F2CBCB;background:#FCEDED}
  .sdetail{display:none;border-bottom:1px solid var(--line-soft);background:#F8FAF9}
  .sdetail.op{display:block}
  .sd-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px 22px;padding:16px 18px 18px 42px}
  .sd-grid .sdh{font-family:var(--disp);font-weight:600;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--text-3);margin-bottom:3px}
  .sd-grid .sdt{font-size:12.5px;color:var(--text-2);line-height:1.5}
  .sd-move{grid-column:1 / -1;border-top:1px solid var(--line-soft);padding-top:12px}
  .sd-move .sdt{color:var(--text);font-weight:500}
  .sd-move .sdh{color:var(--stamp)}
  .srcfoot{font-family:var(--mono);font-size:10.5px;color:var(--text-3);margin-top:10px;padding-left:2px}
  @media(max-width:920px){
    .srow{grid-template-columns:1.6fr .8fr .8fr;gap:8px}
    .srow .sc:nth-child(4),.srow .sc:nth-child(5),.srow .sc:nth-child(6){display:none}
    .sd-grid{grid-template-columns:1fr;padding-left:18px}.seql{width:64px;flex:0 0 64px}
  }

  .preview-banner{font-size:12px;color:var(--text-2);background:#FBF7F0;border:1px solid #F2DFC2;border-radius:var(--r-sm);padding:8px 12px;margin-bottom:16px;line-height:1.5}
  .preview-banner b{color:var(--text);font-weight:600}
  .preview-banner.ok{background:#F0F7EE;border-color:#CDE3C9;color:#3E6E38}
  .dspill.pend{opacity:.85} .dspill.pend .dsn{color:var(--warn)}
  .pending{display:flex;flex-direction:column;align-items:flex-start;gap:9px;border:1px dashed #D0D6D3;border-radius:var(--r);background:#F8FAF9;padding:30px 28px;margin-top:2px}
  .pending .pi{font-size:22px}
  .pending .ph2{font-family:var(--disp);font-weight:600;font-size:16px;color:var(--text)}
  .pending .pp{font-size:13px;color:var(--text-2);max-width:580px;line-height:1.6}
  .pending .pp b{color:var(--text);font-family:var(--mono);font-size:12px}
  /* embedded as an MDM section (?embed=1): drop the standalone 'Unifyd' branding (sidebar
     logo + header clock) so the sub-nav reads as a panel of the one MDM app. Sub-nav +
     controls stay. */
  html.embed .brand{display:none}
  html.embed .clock{display:none}
  /* Embedded in the one MDM console: Master is MASTERING only. The owned-pipeline
     launchers (Connections / Target Sources / Jobs & Runs) live in the Pulls tab now,
     so they're dropped here — and the vertical rail becomes a horizontal sub-nav so
     there's no second stacked sidebar (one rail = the launcher rail). */
  html.embed body{flex-direction:column;height:100vh}
  /* display:flex here also beats the narrow-screen `.rail{display:none}` breakpoint —
     embedded we always want the horizontal strip, however narrow the panel gets. */
  html.embed .rail{display:flex;width:100%;flex:0 0 auto;height:auto;flex-direction:row;align-items:center;
    border-right:0;border-bottom:1px solid var(--line);padding:7px 16px;overflow-x:auto}
  html.embed .rail .foot{display:none}
  html.embed .nav-grp{margin:0;padding:0;display:flex;align-items:center;gap:4px}
  html.embed .nav-grp .lbl{display:none}
  html.embed .nav-item{width:auto;padding:7px 12px;font-size:13px;white-space:nowrap}
  html.embed .nav-item.on::before{display:none}
  html.embed .nav-item[data-view="connections"],
  html.embed .nav-item[data-view="sources"],
  html.embed .nav-item[data-view="jobs"]{display:none}
  html.embed .main{height:auto;flex:1 1 auto;min-height:0}
</style>
<script>if(location.search.indexOf("embed")>=0)document.documentElement.classList.add("embed");</script>

/* =================================================================
   RUN EXECUTION
   In this preview the pull is simulated with realistic per-extract
   counts + variance. Swap the marked block for the real allowlisted
   pull (fetch CSV -> parse -> upsert) and the rest of the platform
   is unchanged.
================================================================= */
function simulatePull(ex, prev){
  // === REAL BACKEND HOOK ====================================
  //   const csv  = await fetch(`${BASE}/${ex.id}.csv`);
  //   const rows = parseAndNormalize(await csv.text(), ex.target);
  //   return { rows: rows.length, status: 'success' };
  // ==========================================================
  const drift = ex.expected ? Math.round(ex.expected*(Math.random()*0.012-0.004)) : 0;
  const base = prev?.rows ?? ex.expected ?? 0;
  const rows = Math.max(0, (ex.expected?ex.expected:base) + drift + Math.round(Math.random()*30-10));
  const roll = Math.random();
  const status = roll>0.97 ? "failed" : roll>0.90 ? "partial" : "success";
  return { rows: status==="failed"? (prev?.rows??0) : rows, status };
}

async function executeRun(connId, trigger){
  if(BACKEND) return executeRunBackend(connId,trigger);
  const c=CMAP[connId]; if(!c||LIVE[connId]?.status==="running") return;
  LIVE[connId]={status:"running",total:0};
  if(currentView==="connections") render(); 
  const startedAt=now();
  const prev=lastRun(connId);
  const prevMap=Object.fromEntries((prev?.extracts||[]).map(e=>[e.id,e]));
  const results=[];
  for(const ex of c.extracts){
    await sleep(280+Math.random()*420);                  // pull latency
    const out=simulatePull(ex, prevMap[ex.id]);
    const delta=out.rows-(prevMap[ex.id]?.rows ?? out.rows);
    results.push({id:ex.id,label:ex.label,role:ex.role,target:ex.target,rows:out.rows,delta,status:out.status});
    LIVE[connId].total=results.reduce((s,r)=>s+r.rows,0);
    LIVE[connId].progress=results.length/c.extracts.length;
    if(currentView==="connections") paintLive(connId);
  }
  const anyFail=results.some(r=>r.status==="failed");
  const anyPartial=results.some(r=>r.status==="partial");
  const status=anyFail?"failed":anyPartial?"partial":"success";
  const finishedAt=now();
  const run={id:rid(),connId,startedAt,finishedAt,durationMs:finishedAt-startedAt,
    status,trigger,total:results.reduce((s,r)=>s+r.rows,0),extracts:results};
  RUNS.unshift(run); RUNS=RUNS.slice(0,200); await sSet(KEY_RUNS,RUNS);
  delete LIVE[connId];
  if(currentView==="connections"||currentView==="jobs"||currentView==="entities") render();
  return run;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* =================================================================
   SCHEDULER  — real in-browser tick. Evaluates cadence per connection.
================================================================= */
const CADENCES={
  manual:{h:"Manual only",s:"Run on demand"},
  fast:{h:"Every 2 min",s:"Demo cadence"},
  hourly:{h:"Hourly",s:"Top of the hour"},
  daily:{h:"Daily",s:"At a set time"},
  weekly:{h:"Weekly",s:"Monday, set time"},
};
function nextDue(cid){
  const s=SCH[cid]; if(!s||s.cadence==="manual") return null;
  const last=lastRun(cid)?.finishedAt||0; const d=new Date();
  if(s.cadence==="fast") return Math.max(last,now()-1)+120000;
  if(s.cadence==="hourly"){ const n=new Date(d); n.setMinutes(0,0,0); n.setHours(d.getHours()+1); return +n; }
  const [hh,mm]=(s.atTime||"06:00").split(":").map(Number);
  const n=new Date(d); n.setHours(hh,mm,0,0);
  if(s.cadence==="daily"){ if(+n<=now()) n.setDate(n.getDate()+1); return +n; }
  if(s.cadence==="weekly"){ n.setDate(n.getDate()+((8-n.getDay())%7||7)); if(+n<=now())n.setDate(n.getDate()+7); return +n; }
  return null;
}
function tick(){
  const t=now();
  for(const c of CONNECTORS){
    const due=nextDue(c.id);
    if(due && t>=due && !LIVE[c.id]) executeRun(c.id,"scheduled");
  }
  $("#clock").textContent=new Date().toLocaleTimeString("en-US",{hour12:false});
  if(currentView==="connections") refreshTimes();
}

async function executeRunBackend(connId,trigger){
  if(LIVE[connId]?.status==="running")return;
  LIVE[connId]={status:"running",total:0}; if(currentView==="connections")render();
  let run;
  try{
    const res=await fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({connId,trigger})});
    run=await res.json();
    try{const dj=await(await fetch("/api/datasets",{cache:"no-store"})).json();Object.assign(DATASETS,dj);}catch(e){}
  }catch(e){
    run={id:"R-ERR",connId,startedAt:now(),finishedAt:now(),durationMs:0,status:"failed",trigger,total:0,extracts:[]};
  }
  RUNS.unshift(run); RUNS=RUNS.slice(0,200);
  delete LIVE[connId];
  if(["connections","jobs","explore","entities"].includes(currentView))render();
  return run;
}

}

/* live paint during a run (no full re-render) */
function paintLive(cid){
  const live=LIVE[cid]; if(!live)return;
  const el=document.querySelector(`[data-recs="${cid}"]`);
  if(el) animateText(el, live.total);
}
function animateText(el,to){
  const from=parseInt((el.textContent||"0").replace(/[^0-9]/g,""))||0;
  const t0=performance.now(),dur=420;
  (function step(t){const k=Math.min(1,(t-t0)/dur);el.textContent=fmt(from+(to-from)*(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2));if(k<1)requestAnimationFrame(step);})(t0);
}
function refreshTimes(){
  CONNECTORS.forEach(c=>{
    const r=lastRun(c.id); if(!r)return;
    const f=document.querySelector(`[data-fresh="${c.id}"]`); if(f&&!LIVE[c.id])f.textContent=ago(r.finishedAt);
    const due=nextDue(c.id); const n=document.querySelector(`[data-next="${c.id}"]`);
    if(n&&!LIVE[c.id])n.textContent=due?clockStr(due):((SCH[c.id]&&SCH[c.id].cadence!=="manual")?"—":"manual");
  });
  const fr=CONNECTORS.map(c=>lastRun(c.id)?.finishedAt).filter(Boolean).sort((a,b)=>b-a)[0];
  const lf=$("#lastFresh"); if(lf&&fr)lf.textContent=ago(fr);
}

  const nav=e.target.closest(".nav-item"); if(nav){setView(nav.dataset.view);return;}
  const tog=e.target.closest("[data-toggle]");
  if(tog){const id=tog.dataset.toggle; openConn=openConn===id?null:id;
    const card=document.querySelector(`[data-conn="${id}"]`); if(card)card.classList.toggle("open",openConn===id); return;}
  const dsp=e.target.closest("[data-ds]"); if(dsp){exDS=dsp.dataset.ds;exSearch="";render();return;}
  const cm=e.target.closest("[data-colmode]"); if(cm){exColMode=cm.dataset.colmode;render();return;}
  const ff=e.target.closest("[data-fields]"); if(ff){exFields=!exFields;render();return;}
  const ss=e.target.closest("[data-srcsort]"); if(ss){const k=ss.dataset.srcsort;if(srcSort===k)srcDir*=-1;else{srcSort=k;srcDir=-1;}render();return;}
  const sr=e.target.closest("[data-srcrow]"); if(sr){srcOpen=srcOpen===sr.dataset.srcrow?null:sr.dataset.srcrow;render();return;}
  const run=e.target.closest("[data-run]"); if(run){e.stopPropagation();executeRun(run.dataset.run,"manual");return;}
  const sch=e.target.closest("[data-sch]"); if(sch){e.stopPropagation();openSchedule(sch.dataset.sch);return;}
  if(e.target.id==="runAll"){CONNECTORS.forEach(c=>!LIVE[c.id]&&executeRun(c.id,"manual"));return;}
  if(e.target.id==="m-cancel"||e.target===$("#scrim")){closeModal();return;}
  const cad=e.target.closest("[data-cad]");
  if(cad){document.querySelectorAll("[data-cad]").forEach(b=>b.classList.remove("sel"));cad.classList.add("sel");toggleTimeRow(cad.dataset.cad);return;}
  if(e.target.id==="m-save"){
    const sel=document.querySelector("[data-cad].sel")?.dataset.cad||"manual";
    SCH[schTarget]={cadence:sel,atTime:$("#atTime").value||"06:00"};
    sSet(KEY_SCH,SCH); closeModal(); render(); return;
  }
});

  gotcha:"Cloudflare bot management, session cookies; per-platform fragility.",
  move:"Extend the Uber Eats POC (Total Wine Millenia) and UPC-join to COLA to light up item availability."},
 {id:"ecom",name:"Retailer e-commerce", auth:"ABC Fine Wine · Total Wine", domain:"item", status:"scoped", value:3,quality:4,ease:3,effort:"med",
  format:"Site GraphQL / JSON", license:"ToS-gray · scrape", cadence:"Daily", vol:"per-retailer SKUs",
  expect:"SKU-level inventory & price by store (ABC: 320k units / 210 SKUs already captured).",
  gotcha:"Per-retailer APIs; robots.txt varies; brittle to site changes.",
  move:"Proven on ABC — standardize the per-retailer adapter pattern and add stores."},
 {id:"nabca",name:"NABCA Tape Data", auth:"NABCA", domain:"deplete", status:"deal", value:5,quality:5,ease:2,effort:"med",
  format:"Licensed bulk (CSC / Tape)", license:"Commercial · paid", cadence:"Monthly", vol:"~17 control states",
  expect:"Control-state depletion volume — roughly 25% of US spirits.",
  gotcha:"Procurement, not a scrape; per-CSC or bulk Tape pricing.",
  move:"License the bulk Tape path for control-state coverage. Parallel deal track."},
 {id:"sip",name:"SipSource / WSWA", auth:"WSWA", domain:"deplete", status:"deal", value:5,quality:5,ease:1,effort:"high",
  format:"Cooperative partnership", license:"Partnership · reseller", cadence:"Monthly", vol:"~80% US W&S volume",
  expect:"Open-state depletion — the core signal of the whole platform.",
  gotcha:"A relationship and reseller agreement, not a pull.",
  move:"The cooperative-data thesis. Nielsen reseller is the credentialing step into the WSWA conversation."},
 {id:"scan",name:"Retail scan", auth:"Circana · NielsenIQ · SPINS", domain:"scan", status:"deal", value:4,quality:4,ease:2,effort:"high",
  format:"Licensed feed", license:"Commercial · reseller", cadence:"Weekly", vol:"off-premise scan",
  expect:"Off-premise scan — the channel SipSource doesn't see.",
  gotcha:"Expensive; reseller terms.",
  move:"A Nielsen reseller agreement doubles as scan access and WSWA credentialing."},
 {id:"comp",name:"Commercial compliance seed", auth:"Sovos · Avalara", domain:"comply", status:"deal", value:3,quality:4,ease:4,effort:"low",
  format:"Licensed structured DB", license:"Commercial", cadence:"Continuous", vol:"50-state rules",
  expect:"State-by-state compliance / rules as a ready seed dataset.",
  gotcha:"License cost vs. build; still want to enrich via primary-source scraping.",
  move:"License as a seed to accelerate, then own it via primary-source crawlers."},
 {id:"cann",name:"State cannabis registries", auth:"State programs · Metrc", domain:"outlet", status:"backlog", value:3,quality:3,ease:2,effort:"high",
  format:"State portals / Metrc", license:"Public / licensed", cadence:"Varies", vol:"dispensary licenses",
  expect:"Cannabis outlet licenses — the crossover option play.",
  gotcha:"Fragmented; regulatory flux around the Nov-2026 hemp cliff.",
  move:"Option-value bet; align to the hemp/cannabis crossover timing."},
];
const DOM={both:["Item+Outlet","#7B6FA0"],item:["Item","#4C6EA8"],outlet:["Outlet","#45867F"],party:["Party","#8A66A0"],avail:["Availability","#C99A2E"],deplete:["Depletion","#C26B3E"],scan:["Scan","#5B8A72"],comply:["Compliance","#6E7B8A"]};
const SST={live:["Live","st-success"],next:["Next","st-running"],scoped:["Scoped","st-idle"],deal:["Deal track","st-partial"],backlog:["Backlog","st-idle"]};
const prio=s=>s.value*2+s.quality+s.ease;
function meter(v,tone){let o="";for(let i=1;i<=5;i++)o+=`<i class="${i<=v?'f '+tone:''}"></i>`;return`<span class="meter">${o}</span>`;}
function srcChip(id){const s=SOURCES.find(x=>x.id===id);const d=DOM[s.domain];return`<span class="seqchip"><span class="sd" style="background:${d[1]}"></span>${s.name}</span>`;}
function viewSources(){
  const build=SOURCES.filter(s=>s.status!=="deal").sort((a,b)=>prio(b)-prio(a));
  const deal=SOURCES.filter(s=>s.status==="deal").sort((a,b)=>prio(b)-prio(a));
  const key=srcSort==="priority"?prio:(s=>s[srcSort]);
  const rows=[...SOURCES].sort((a,b)=>{const d=(key(a)-key(b))*srcDir;return d!==0?d:prio(b)-prio(a);});
  const arrow=c=>srcSort===c?(srcDir<0?" ▾":" ▴"):"";
  const tr=s=>{
    const d=DOM[s.domain],st=SST[s.status],op=srcOpen===s.id;
    return`<div class="srow ${op?'op':''}" data-srcrow="${s.id}">
      <div class="sc nm"><span class="chev2">▸</span><div><div class="sn">${s.name}</div><div class="sa">${s.auth}</div></div></div>
      <div class="sc"><span class="domtag"><span class="sd" style="background:${d[1]}"></span>${d[0]}</span></div>
      <div class="sc">${meter(s.value,"mv")}</div>
      <div class="sc">${meter(s.quality,"mq")}</div>
      <div class="sc">${meter(s.ease,"me")}</div>
      <div class="sc"><span class="eff eff-${s.effort}">${s.effort}</span></div>
      <div class="sc"><span class="stchip ${st[1]}"><span class="d"></span>${st[0]}</span></div>
    </div>
    <div class="sdetail ${op?'op':''}">
      <div class="sd-grid">
        <div><div class="sdh">What to expect</div><div class="sdt">${s.expect}</div></div>
        <div><div class="sdh">Format · license</div><div class="sdt">${s.format} &middot; ${s.license}</div></div>
        <div><div class="sdh">Cadence · volume</div><div class="sdt">${s.cadence} &middot; ${s.vol}</div></div>
        <div><div class="sdh">Watch out</div><div class="sdt">${s.gotcha}</div></div>
        <div class="sd-move"><div class="sdh">The move</div><div class="sdt">${s.move}</div></div>
      </div>
    </div>`;
  };
  return`
  <div class="frame-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 17l6-6 4 4 7-7"/><path d="M14 8h7v7"/></svg>
    <div><div class="t">Scored by value, data quality, and automation ease</div>
    <div class="d">Build track = public or scrapeable; knock these out by value. Deal track = licensed or partnership; run in parallel since they gate on procurement, not engineering.</div></div></div>

  <div class="seqwrap">
    <div class="seq"><div class="seql">Build track</div><div class="seqs">${build.map((s,i)=>(i?'<span class="arr">→</span>':'')+srcChip(s.id)).join("")}</div></div>
    <div class="seq"><div class="seql">Deal track</div><div class="seqs">${deal.map((s,i)=>(i?'<span class="arr">→</span>':'')+srcChip(s.id)).join("")}</div></div>
  </div>

  <div class="srctbl">
    <div class="srow hd">
      <div class="sc">Source</div><div class="sc">Domain</div>
      <div class="sc sortable" data-srcsort="value">Value${arrow("value")}</div>
      <div class="sc sortable" data-srcsort="quality">Quality${arrow("quality")}</div>
      <div class="sc sortable" data-srcsort="ease">Pull ease${arrow("ease")}</div>
      <div class="sc">Effort</div>
      <div class="sc sortable" data-srcsort="priority">Status${arrow("priority")}</div>
    </div>
    ${rows.map(tr).join("")}
  </div>
  <div class="srcfoot">Composite priority = value×2 + quality + pull-ease. Click a row for detail; click Value / Quality / Pull ease / Status to sort.</div>`;
}

/* =================================================================
   BOOT
================================================================= */
async function boot(){
  RUNS=(await sGet(KEY_RUNS))||[];
  SCH=(await sGet(KEY_SCH))||{};
  try{
    const h=await fetch("/api/health",{cache:"no-store"});
    if(h.ok){const j=await h.json(); if(j&&j.ok){ BACKEND=true;
      try{const dj=await(await fetch("/api/datasets")).json(); if(dj&&Object.keys(dj).length)Object.assign(DATASETS,dj);}catch(e){}
      try{const rj=await(await fetch("/api/runs")).json(); if(Array.isArray(rj)&&rj.length)RUNS=rj;}catch(e){}
    }}
  }catch(e){ BACKEND=false; }
  // seed one prior successful run per connection so the board isn't empty
  if(!BACKEND && !RUNS.length){
    for(const c of CONNECTORS){
      if(c.staged) continue;
      const ext=c.extracts.map(ex=>({id:ex.id,label:ex.label,role:ex.role,target:ex.target,
        rows:ex.expected||0,delta:0,status:"success"}));
      const fin=now()-(1+Math.random()*6)*3.6e6;
      RUNS.push({id:rid(),connId:c.id,startedAt:fin-2200,finishedAt:fin,durationMs:2200,
        status:"success",trigger:"scheduled",total:ext.reduce((s,e)=>s+e.rows,0),extracts:ext});
    }
    await sSet(KEY_RUNS,RUNS);
  }
  setView(EMBED?"entities":"connections");
  tick(); setInterval(tick,1000);
}
boot();
})();
</script>

<!-- ===== Hoodie Spine integration ===== -->
<script src="../spine/spine.js"></script>
<script>
(function(){
  if(typeof HoodieSpine==='undefined')return;
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  /* live shared-context chip in the control-plane header */
  var chip=document.createElement('div');
  chip.id='spineChip';
  chip.title='Shared suite context \u2014 set in the suite bar';
  chip.style.cssText='display:none;align-items:center;gap:7px;margin-right:14px;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--text-2,#5E6B68);background:rgba(80,110,130,.10);border:1px solid rgba(80,110,130,.24);border-radius:999px;padding:5px 11px;white-space:nowrap;';
  var hd=document.querySelector('header.top');
  if(hd){var sp=hd.querySelector('.spacer');hd.insertBefore(chip,sp||null);}
  function renderChip(ctx){
    var parts=[];
    if(ctx&&ctx.scope)parts.push(ctx.scope.name);
    if(ctx&&ctx.account)parts.push(ctx.account.name);
    if(!parts.length){chip.style.display='none';return;}
    chip.innerHTML='<span style="width:6px;height:6px;border-radius:50%;background:#3E7C6E;flex:0 0 auto;display:inline-block"></span>'+
      parts.map(function(t,i){return (i?'<span style="opacity:.4">\u25b8</span> ':'')+'<span>'+esc(t)+'</span>';}).join(' ');
    chip.style.display='inline-flex';
  }
  function applyContext(ctx){
    /* inbound: focus the data browser on the shared scope, via the app's own filter */
    var el=document.getElementById('dsSearch');
    if(el){var v=ctx&&ctx.scope?ctx.scope.name:'';if(el.value!==v){el.value=v;el.dispatchEvent(new Event('input'));}}
  }
  HoodieSpine.connect({name:'Hoodie Master',onContext:function(ctx){try{renderChip(ctx);}catch(e){}try{applyContext(ctx);}catch(e){}}});
})();
</script>

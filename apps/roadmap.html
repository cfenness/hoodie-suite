<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../suite.css">
<title>Hoodie · Product Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f8; --panel:#ffffff; --ink:#171a21; --muted:#6b7280; --faint:#9aa1ad;
  --line:#e6e8ee; --line2:#eff1f5; --accent:#3f3df2; --accent-ink:#2a28c4;
  --p0:#4f46e5; --p1:#0891b2; --p2:#ca8a04; --p3:#9333ea; --p4:#16a34a;
  --pri0:#dc2626; --pri1:#ea7317; --pri2:#caa204; --pri3:#94a3b8;
  --shadow:0 1px 2px rgba(20,24,33,.05),0 6px 20px rgba(20,24,33,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace}
.wrap{max-width:1280px;margin:0 auto;padding:0 22px}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:18px;padding:13px 22px;max-width:1280px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand .logo b{color:var(--accent)}
.brand .sub{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.seg{display:flex;background:#eceef3;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;font-family:inherit;font-weight:600;font-size:13px;color:var(--muted);padding:6px 15px;border-radius:8px;cursor:pointer;transition:.15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-width:220px}
.search input{border:0;outline:0;font-family:inherit;font-size:13.5px;width:100%;background:transparent;color:var(--ink)}
.search svg{flex:none;opacity:.5}

/* stats */
.stats{display:flex;align-items:center;gap:22px;padding:18px 0 6px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font-size:24px;font-weight:800;line-height:1;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-top:4px}
.prbar{flex:1;min-width:220px;margin-left:auto}
.prbar-track{display:flex;height:12px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.prbar-track span{display:block;height:100%}
.prbar-legend{display:flex;gap:14px;margin-top:7px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.prbar-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}

/* filters */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 0 6px;border-top:1px solid var(--line2);margin-top:12px}
.flabel{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-right:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.14s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:#cdd2db}
.chip .dot{width:9px;height:9px;border-radius:3px}
.chip.on{color:#fff;border-color:transparent}
.chip.lay.on{background:#2b2f3a}
.chip.pri.on{color:#fff}
.clearbtn{margin-left:auto;border:0;background:transparent;color:var(--accent);font-family:inherit;font-weight:600;font-size:12.5px;cursor:pointer}

/* roadmap */
main{padding:14px 0 60px}
.phase{margin:26px 0 8px}
.phase-h{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:2px solid var(--ph);margin-bottom:16px}
.phase-tag{font-family:'IBM Plex Mono',monospace;font-weight:600;color:#fff;background:var(--ph);border-radius:6px;padding:4px 10px;font-size:12px;letter-spacing:.04em}
.phase-name{font-weight:800;font-size:18px;letter-spacing:-.01em}
.phase-desc{font-size:12.5px;color:var(--muted);flex:1;min-width:160px}
.phase-meta{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.epics{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:13px}
.epic{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:0;box-shadow:var(--shadow);cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;overflow:hidden;display:flex;flex-direction:column}
.epic:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(20,24,33,.1);border-color:#d7dbe3}
.epic .bar{height:4px;background:var(--cc)}
.epic .body{padding:14px 15px 12px;flex:1;display:flex;flex-direction:column}
.epic .eid{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.03em}
.epic .ename{font-weight:700;font-size:15px;margin:3px 0 6px;letter-spacing:-.01em;line-height:1.25}
.epic .eobj{font-size:12.5px;color:var(--muted);line-height:1.5;flex:1}
.epic .efoot{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line2)}
.cchip{font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px}
.epic .cnt{font-size:12px;color:var(--muted);font-weight:600}
.epic .pdots{display:flex;gap:3px;margin-left:auto}
.epic .pdots i{width:8px;height:8px;border-radius:2.5px}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* backlog */
.backlog .grp{margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.grp-h{display:flex;align-items:center;gap:11px;padding:13px 16px;cursor:pointer;user-select:none}
.grp-h:hover{background:#fafbfc}
.grp-h .caret{transition:transform .18s;color:var(--faint);font-size:12px}
.grp.open .caret{transform:rotate(90deg)}
.grp-h .geid{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--faint)}
.grp-h .gname{font-weight:700;font-size:14.5px}
.grp-h .gmeta{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:10px;align-items:center}
.grp-body{display:none;border-top:1px solid var(--line2)}
.grp.open .grp-body{display:block}
.trow{padding:11px 16px 11px 40px;border-top:1px solid var(--line2);cursor:pointer}
.trow:first-child{border-top:0}
.trow:hover{background:#fafbfc}
.trow-main{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.tid{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--accent-ink)}
.ttitle{font-weight:600;font-size:13.5px;flex:1;min-width:160px}
.pri{font-size:10.5px;font-weight:800;color:#fff;border-radius:5px;padding:2px 7px;letter-spacing:.02em}
.lay{font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 7px;background:#eef0f4;color:#475063}
.pts{font-size:11px;font-weight:700;color:var(--muted);background:#f1f2f6;border-radius:999px;padding:2px 9px}
.tdetail{display:none;margin-top:9px;font-size:12.5px;color:#444b57;line-height:1.55}
.trow.open .tdetail{display:block}
.tdetail .lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-right:7px}
.tdetail .ac{background:#f8f9fb;border-left:3px solid var(--cc);border-radius:0 7px 7px 0;padding:8px 11px;margin-top:7px}

/* rank (priority list) */
.rank-bar{display:flex;align-items:center;gap:10px;padding:4px 2px 12px;flex-wrap:wrap}
.rank-bar button,.rank-bar .imp{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-family:inherit;font-weight:600;font-size:12.5px;color:var(--ink);cursor:pointer;transition:.14s}
.rank-bar button:hover,.rank-bar .imp:hover{border-color:#cdd2db}
.rank-bar .hint{font-size:12px;color:var(--muted);margin-left:auto;max-width:560px;text-align:right}
.epiclist{display:flex;flex-direction:column;gap:11px;padding-bottom:30px}
.erow{background:#eceef3;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.erow.edragging{opacity:.4}
.ehead{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:grab;user-select:none;border-left:4px solid var(--cc);background:#eceef3}
.ehead:active{cursor:grabbing}
.grip{color:var(--faint);font-size:15px;line-height:1;letter-spacing:-2px;flex:none;cursor:grab}
.erank{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;color:#fff;background:var(--cc);border-radius:6px;min-width:26px;text-align:center;padding:3px 0}
.ename2{font-weight:700;font-size:14px}
.egrip-meta{margin-left:auto;display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--muted);font-weight:600}
.caret2{transition:transform .18s;color:var(--faint);font-size:11px}
.erow.collapsed .caret2{transform:rotate(-90deg)}
.erow.collapsed .ebody{display:none}
.ebody{background:#fff;border-top:1px solid var(--line)}
.tdrow{display:flex;align-items:center;gap:10px;padding:9px 13px 9px 14px;border-top:1px solid var(--line2);cursor:grab;background:#fff}
.tdrow:first-child{border-top:0}
.tdrow:active{cursor:grabbing}
.tdrow.tdragging{opacity:.4}
.seq{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11.5px;color:var(--accent-ink);min-width:30px;text-align:right}
.tdrow .tid{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);min-width:96px}
.tdrow .ttl{font-weight:600;font-size:13px;flex:1;min-width:140px}
.crit{font-size:10px;font-weight:800;color:#fff;border-radius:5px;padding:2px 7px;letter-spacing:.02em}
.ph{height:3px;background:var(--accent);border-radius:3px;margin:1px 2px;box-shadow:0 0 0 3px rgba(63,61,242,.12)}
.eph{height:5px;background:var(--accent);border-radius:4px;margin:3px 0;box-shadow:0 0 0 3px rgba(63,61,242,.13)}

/* current build status */
.statuswrap{margin:20px 0 4px}
.status-h{display:flex;align-items:baseline;gap:12px;margin-bottom:13px;flex-wrap:wrap}
.status-h .t{font-weight:800;font-size:16px;letter-spacing:-.01em}
.status-h .s{font-size:12.5px;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(284px,1fr));gap:12px}
.statcard{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow)}
.statcard.unfinished{border:1px dashed #e0a23c;border-top:3px solid #e08a1e;background:#fffdf5}
.statcard .row1{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.statcard .nm{font-weight:700;font-size:14.5px}
.statpill{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.04em;border-radius:6px;padding:3px 8px;text-transform:uppercase}
.meter{display:flex;gap:4px;margin-bottom:9px}
.meter i{height:6px;flex:1;border-radius:3px;background:#e7e9ef}
.meter i.on{background:var(--mc)}
.statcard .note{font-size:12px;color:var(--muted);line-height:1.5}
/* sprints */
.sprint-cfg{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:4px 2px 14px}
.cfg-field{display:flex;flex-direction:column;gap:5px}
.cfg-field label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.cfg-field input{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-family:inherit;font-size:13.5px;width:150px;background:#fffefb;color:var(--ink)}
.cfg-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(63,61,242,.14)}
.sprint-sum{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600;text-align:right;line-height:1.55}
.sprint-sum b{color:var(--ink)}
.sprintlist{display:flex;flex-direction:column;gap:13px;padding-bottom:30px}
.sprint{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.sprint-h{display:flex;align-items:center;gap:12px;padding:13px 16px 10px}
.sprint-n{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;color:#fff;background:var(--accent);border-radius:7px;padding:4px 10px}
.sprint-mon{font-weight:800;font-size:15px;letter-spacing:-.01em}
.sprint-meta{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.cap-wrap{padding:0 16px 12px}
.cap-track{height:8px;border-radius:5px;background:#eceef3;overflow:hidden}
.cap-fill{height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.cap-fill.over{background:var(--pri0)}
.sprint-body{border-top:1px solid var(--line2)}
.srow{display:flex;align-items:center;gap:11px;padding:9px 16px;border-top:1px solid var(--line2);cursor:pointer}
.srow:first-child{border-top:0}
.srow:hover{background:#fafbfc}
.srow .tid{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);min-width:96px}
.srow .ttl{font-weight:600;font-size:13px;flex:1;min-width:140px}
.sprint-empty{padding:24px;text-align:center;color:var(--muted)}
.lanebar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lanebar:last-child{margin-bottom:0}
.lane-lbl{font-size:10.5px;font-weight:700;color:var(--muted);width:56px;flex:none}
.cap-fill.be{background:#0d9488}
.lanetag{font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px;letter-spacing:.02em}
.lt-app{background:#dfeaf7;color:#2563a8}.lt-be{background:#d8ecec;color:#2c7d7d}.lt-fs{background:#f4e6d4;color:#a66a2c}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,24,33,.34);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,94vw);background:#fff;box-shadow:-10px 0 40px rgba(20,24,33,.18);transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.dh .deid{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;color:var(--faint)}
.dh .dname{font-weight:800;font-size:20px;letter-spacing:-.02em;margin:4px 0 8px;line-height:1.2}
.dh .drow{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap}
.dclose{position:absolute;top:16px;right:18px;border:0;background:#f1f2f6;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px;color:var(--muted)}
.dbody{overflow:auto;padding:16px 22px 40px}
.dsec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:14px 0 8px}
.dobj{font-size:13.5px;color:#3a4150;line-height:1.6}
.dexit{font-size:13px;color:#3a4150;line-height:1.55;background:#f8f9fb;border-radius:9px;padding:11px 13px;border-left:3px solid var(--cc)}
.dtix{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.dtix .dt{border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.dtix .dt .dtt{font-weight:700;font-size:13.5px;margin-bottom:5px}
.dtix .dt .dtm{display:flex;gap:7px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.dtix .dt .dac{font-size:12px;color:#5a616d;line-height:1.5}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:640px){.stat b{font-size:20px}.search{min-width:140px;margin-left:0;order:5;width:100%}}
.estatus{margin-left:8px;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;font-weight:600;vertical-align:middle}.st-shipped{background:#e4f2ea;color:#2E7D57}.st-building{background:#f6e9cf;color:#9a7320}.st-next{background:#e7eef5;color:#3B5F86}.st-later{background:#eef1f4;color:#6b7280}
</style>
</head>
<body>
<div class="top">
  <div class="topin">
    <div class="brand"><span class="logo">Hoodie<b>.</b></span><span class="sub">Product Roadmap</span></div>
    <div class="seg" id="viewseg">
      <button data-view="roadmap" class="on">Roadmap</button>
      <button data-view="backlog">Backlog</button>
      <button data-view="board">Rank</button>
      <button data-view="sprints">Sprints</button>
    </div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Search tickets…">
    </div>
  </div>
</div>

<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters"></div>
</div>

<div class="wrap"><main id="main"></main></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script>

function matches(t){
  if(filt.comp.size&&!filt.comp.has(t.comp))return false;
  if(filt.layer.size&&!filt.layer.has(t.layer))return false;
  if(filt.pri.size&&!filt.pri.has(t.pri))return false;
  if(filt.q){const h=(t.id+" "+t.title+" "+t.desc+" "+t.ac+" "+t.epic).toLowerCase();if(!h.includes(filt.q))return false;}
  return true;
}
function ftickets(){return DATA.tickets.filter(matches);}
function ticketsByEpic(eid,list){return (list||ftickets()).filter(t=>t.epic===eid);}

function renderStats(){
  const list=ftickets();

  const segs=["P0","P1","P2","P3"].map(p=>`<span style="width:${pc[p]/tot*100}%;background:${PRI[p]}"></span>`).join("");

const collapsed=new Set();
function defaultRank(){
  const epicOrder=[...DATA.epics].sort((a,b)=>phaseRank[a.phase]-phaseRank[b.phase]).map(e=>e.id);
  const ticketOrder={};
  DATA.epics.forEach(e=>{ ticketOrder[e.id]=DATA.tickets.filter(t=>t.epic===e.id)
     .sort((a,b)=>a.pri.localeCompare(b.pri)||a.id.localeCompare(b.id)).map(t=>t.id); });
  return {epicOrder,ticketOrder};
}
function reconcileRank(v){
  if(!v||typeof v!=='object')return defaultRank();
  const epicIds=new Set(DATA.epics.map(e=>e.id));
  let eo=Array.isArray(v.epicOrder)?v.epicOrder.filter(id=>epicIds.has(id)):[];
  DATA.epics.forEach(e=>{if(!eo.includes(e.id))eo.push(e.id);});
  const to={};
  eo.forEach(eid=>{
    const valid=new Set(DATA.tickets.filter(t=>t.epic===eid).map(t=>t.id));
    let arr=(v.ticketOrder&&Array.isArray(v.ticketOrder[eid]))?v.ticketOrder[eid].filter(id=>valid.has(id)):[];
    DATA.tickets.filter(t=>t.epic===eid).forEach(t=>{if(!arr.includes(t.id))arr.push(t.id);});
    to[eid]=arr;
  });
  return {epicOrder:eo,ticketOrder:to};
}
async function loadRank(){try{if(persists){const r=await window.storage.get(STORE_KEY);if(r&&r.value)return reconcileRank(JSON.parse(r.value));}}catch(e){}return defaultRank();}
async function saveRank(){try{if(persists)await window.storage.set(STORE_KEY,JSON.stringify(rank));}catch(e){}}
function pmix(ids){return ["P0","P1","P2","P3"].flatMap(p=>ids.filter(id=>tById[id].pri===p).map(()=>`<i style="width:7px;height:7px;border-radius:2px;background:${PRI[p]};display:inline-block"></i>`)).join("");}
function renderRank(){
  if(!rank)rank=defaultRank();
  const visible=new Set(ftickets().map(t=>t.id));
  let seq=0;
  let html=`<div class="rank-bar">
     <button id="rexport">Export order</button>
     <label class="imp">Import<input type="file" id="rimport" accept=".json,application/json" hidden></label>
     <button id="rreset">Reset order</button>
     <span class="hint">${persists?'Drag epic headers to rank epics, drag rows to rank tickets within — saved automatically.':'Drag epic headers to rank epics, drag rows to rank tickets within — use Export to keep the order.'} The colored P-badge is build-criticality, separate from this sequence.</span>
   </div><div class="epiclist" id="epiclist">`;
  rank.epicOrder.forEach((eid,ei)=>{
    const e=epicById[eid],c=COMP[e.comp];
    const vids=rank.ticketOrder[eid].filter(id=>visible.has(id));
    if(!vids.length)return;
    const pts=vids.reduce((a,id)=>a+tById[id].pts,0);
    const isC=collapsed.has(eid);
    html+=`<div class="erow ${isC?'collapsed':''}" data-epic="${eid}">
      <div class="ehead" draggable="true" data-epic="${eid}" style="--cc:${c.cc}">
        <span class="grip">⠿</span><span class="erank">${ei+1}</span>
        <span class="ename2">${esc(e.name)}</span>
        <span class="egrip-meta"><span class="cchip" style="background:${c.bg};color:${c.fg}">${e.comp}</span>
          <span>${vids.length} · ${pts} pts</span><span class="pdots">${pmix(vids)}</span>
          <span class="caret2" data-toggle="${eid}">▼</span></span>
      </div>
      <div class="ebody" data-epic="${eid}">`;
    rank.ticketOrder[eid].forEach(id=>{ if(!visible.has(id))return; const t=tById[id]; seq++;
      html+=`<div class="tdrow" draggable="true" data-id="${id}" data-epic="${eid}">
        <span class="grip">⠿</span><span class="seq">${seq}</span>
        <span class="tid">${id}</span><span class="ttl">${esc(t.title)}</span>
        <span class="lay">${t.layer}</span><span class="crit" style="background:${PRI[t.pri]}" title="Build-criticality">${t.pri}</span>
        <span class="pts">${t.pts} pts</span></div>`;
    });
    html+=`</div></div>`;
  });
  html+=`</div>`;
  document.getElementById('main').innerHTML= seq? html : `<div class="empty">No tickets match these filters.</div>`;
  wireRankDnD();wireRankBar();
  document.querySelectorAll('[data-toggle]').forEach(c=>c.addEventListener('click',ev=>{ev.stopPropagation();const id=c.dataset.toggle;collapsed.has(id)?collapsed.delete(id):collapsed.add(id);renderRank();}));
}
let drag=null; // {kind:'epic'|'ticket', id, epic}
function rowsIn(container,sel){return [...container.querySelectorAll(sel)].filter(el=>!el.classList.contains('edragging')&&!el.classList.contains('tdragging'));}
function idxAt(els,y){for(let i=0;i<els.length;i++){const r=els[i].getBoundingClientRect();if(y<r.top+r.height/2)return i;}return els.length;}
function clearPH(){document.querySelectorAll('#__ph,#__eph').forEach(p=>p.remove());}
function wireRankDnD(){
  const list=document.getElementById('epiclist');
  // epic drag
  document.querySelectorAll('.ehead').forEach(h=>{
    h.addEventListener('dragstart',e=>{drag={kind:'epic',id:h.dataset.epic};h.closest('.erow').classList.add('edragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',h.dataset.epic);}catch(_){}});
    h.addEventListener('dragend',()=>{document.querySelectorAll('.edragging').forEach(x=>x.classList.remove('edragging'));clearPH();drag=null;});
  });
  // ticket drag
  document.querySelectorAll('.tdrow').forEach(row=>{
    row.addEventListener('dragstart',e=>{e.stopPropagation();drag={kind:'ticket',id:row.dataset.id,epic:row.dataset.epic};row.classList.add('tdragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',row.dataset.id);}catch(_){}});
    row.addEventListener('dragend',e=>{e.stopPropagation();document.querySelectorAll('.tdragging').forEach(x=>x.classList.remove('tdragging'));clearPH();drag=null;});
  });
  // epic-level dragover on the list
  list.addEventListener('dragover',e=>{ if(!drag||drag.kind!=='epic')return; e.preventDefault();e.dataTransfer.dropEffect='move';
    const rows=rowsIn(list,':scope > .erow'); clearPH(); const idx=idxAt(rows,e.clientY);
    const ph=document.createElement('div');ph.className='eph';ph.id='__eph'; idx>=rows.length?list.appendChild(ph):list.insertBefore(ph,rows[idx]);
  });
  list.addEventListener('drop',e=>{ if(!drag||drag.kind!=='epic')return; e.preventDefault();
    const rows=rowsIn(list,':scope > .erow'); const idx=idxAt(rows,e.clientY);
    const order=rank.epicOrder.filter(id=>id!==drag.id);
    const beforeId=idx<rows.length?rows[idx].dataset.epic:null;
    const real=beforeId?order.indexOf(beforeId):order.length;
    order.splice(real,0,drag.id); rank.epicOrder=order; saveRank();renderRank();
  });
  // ticket-level dragover within each ebody
  document.querySelectorAll('.ebody').forEach(body=>{
    body.addEventListener('dragover',e=>{ if(!drag||drag.kind!=='ticket'||drag.epic!==body.dataset.epic)return; e.preventDefault();e.dataTransfer.dropEffect='move';
      const rows=rowsIn(body,'.tdrow'); clearPH(); const idx=idxAt(rows,e.clientY);
      const ph=document.createElement('div');ph.className='ph';ph.id='__ph'; idx>=rows.length?body.appendChild(ph):body.insertBefore(ph,rows[idx]);
    });
    body.addEventListener('drop',e=>{ if(!drag||drag.kind!=='ticket'||drag.epic!==body.dataset.epic)return; e.preventDefault();
      const eid=body.dataset.epic; const visible=new Set(ftickets().map(t=>t.id));
      const rows=rowsIn(body,'.tdrow'); const idx=idxAt(rows,e.clientY);
      const arr=rank.ticketOrder[eid].filter(id=>id!==drag.id);
      const laneVisible=arr.filter(id=>visible.has(id));
      const beforeId=idx<laneVisible.length?laneVisible[idx]:(idx<rows.length?rows[idx].dataset.id:null);
      const real=beforeId?arr.indexOf(beforeId):arr.length;
      arr.splice(real,0,drag.id); rank.ticketOrder[eid]=arr; saveRank();renderRank();
    });
  });
}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function wireRankBar(){
  const ex=document.getElementById('rexport');if(ex)ex.onclick=()=>download('hoodie-rank.json',JSON.stringify(rank,null,2));
  const rs=document.getElementById('rreset');if(rs)rs.onclick=()=>{rank=defaultRank();saveRank();renderRank();};
  const im=document.getElementById('rimport');if(im)im.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{rank=reconcileRank(JSON.parse(r.result));saveRank();renderRank();}catch(_){}}; r.readAsText(f);};
}

/* ---- sprints (monthly capacity plan) ---- */
const _now=new Date();
let team={app:12,backend:12,analyst:6,startY:_now.getFullYear(),startM:_now.getMonth()};
const TEAM_KEY="hoodie-team-v1";
function saveTeam(){try{if(persists)window.storage.set(TEAM_KEY,JSON.stringify(team));}catch(e){}}
(async()=>{try{if(persists){const r=await window.storage.get(TEAM_KEY);if(r&&r.value){const v=JSON.parse(r.value);['app','backend','analyst','startY','startM'].forEach(k=>{if(typeof v[k]==='number')team[k]=v[k];});if(view==='sprints')renderSprints();}}}catch(e){}})();
function flattenRanked(){ if(!rank)rank=defaultRank(); const vis=new Set(ftickets().map(t=>t.id));
  const seq=[]; rank.epicOrder.forEach(eid=>rank.ticketOrder[eid].forEach(id=>{if(vis.has(id))seq.push(id);})); return seq; }
function buildSprints(){
  const seq=flattenRanked();
  const rankIdx=Object.fromEntries(seq.map((id,i)=>[id,i]));
  const laneOf=id=>{const L=tById[id].layer; return L==='FE'?'app':L==='Full-stack'?'fs':'be';}; // BE+Infra -> be
  const appQ=seq.filter(id=>laneOf(id)==='app');
  const beQ =seq.filter(id=>laneOf(id)==='be');
  const fsQ =seq.filter(id=>laneOf(id)==='fs');
  const appCap=Math.max(0,team.app), beCap=Math.max(0,team.backend+team.analyst);
  let ai=0,bi=0,fi=0; const sprints=[]; let guard=0;
  while((ai<appQ.length||bi<beQ.length||fi<fsQ.length) && guard++<800){
    let appRem=appCap, beRem=beCap; const ids=[]; let lA=0,lB=0,lF=0; let moved=true;
    while(moved){ moved=false; const cands=[];
      if(ai<appQ.length){const p=tById[appQ[ai]].pts; if(p<=appRem)cands.push(['app',appQ[ai],p,rankIdx[appQ[ai]]]);}
      if(bi<beQ.length){const p=tById[beQ[bi]].pts; if(p<=beRem)cands.push(['be',beQ[bi],p,rankIdx[beQ[bi]]]);}
      if(fi<fsQ.length){const p=tById[fsQ[fi]].pts; if(p<=appRem&&p<=beRem)cands.push(['fs',fsQ[fi],p,rankIdx[fsQ[fi]]]);}
      if(cands.length){ cands.sort((a,b)=>a[3]-b[3]); const [ln,id,p]=cands[0]; ids.push(id);
        if(ln==='app'){appRem-=p;lA+=p;ai++;} else if(ln==='be'){beRem-=p;lB+=p;bi++;} else {appRem-=p;beRem-=p;lF+=p;fi++;}
        moved=true; }
    }
    if(!ids.length){ // a head ticket exceeds its lane's monthly capacity — force the best-ranked one in alone
      const bl=[]; if(ai<appQ.length)bl.push(['app',appQ[ai],rankIdx[appQ[ai]]]);
      if(bi<beQ.length)bl.push(['be',beQ[bi],rankIdx[beQ[bi]]]); if(fi<fsQ.length)bl.push(['fs',fsQ[fi],rankIdx[fsQ[fi]]]);
      if(!bl.length)break; bl.sort((a,b)=>a[2]-b[2]); const [ln,id]=bl[0]; const p=tById[id].pts; ids.push(id);
      if(ln==='app'){lA+=p;ai++;} else if(ln==='be'){lB+=p;bi++;} else {lF+=p;fi++;}
    }
    sprints.push({ids,app:lA,be:lB,fs:lF});
  }
  return sprints;
}
function fmtMonthInput(){return team.startY+'-'+String(team.startM+1).padStart(2,'0');}
function monthLabel(i){return new Date(team.startY,team.startM+i,1).toLocaleString('en-US',{month:'long',year:'numeric'});}
function renderSprints(){
  const sprints=buildSprints();
  const appCap=Math.max(0,team.app), beCap=Math.max(0,team.backend+team.analyst);
  const totalTix=sprints.reduce((a,s)=>a+s.ids.length,0);
  const totalPts=sprints.reduce((a,s)=>a+s.ids.reduce((x,id)=>x+tById[id].pts,0),0);
  let html=`<div class="sprint-cfg">
     <div class="cfg-field"><label>App engineer (pts/mo)</label><input id="appIn" type="number" min="0" step="1" value="${team.app}"></div>
     <div class="cfg-field"><label>Backend engineer (pts/mo)</label><input id="beIn" type="number" min="0" step="1" value="${team.backend}"></div>
     <div class="cfg-field"><label>Analyst → data/backend (pts/mo)</label><input id="anIn" type="number" min="0" step="1" value="${team.analyst}"></div>
     <div class="cfg-field"><label>Start month</label><input id="startIn" type="month" value="${fmtMonthInput()}"></div>
     <div class="sprint-sum"><b>${totalTix}</b> tickets · <b>${totalPts}</b> pts<br>${sprints.length} month${sprints.length!==1?'s':''}${sprints.length?' · through '+monthLabel(sprints.length-1):''}</div>
   </div>`;
  if(!sprints.length){document.getElementById('main').innerHTML=html+`<div class="sprint-empty">No tickets match these filters.</div>`;wireSprintCfg();return;}
  html+=`<div class="sprintlist">`;
  sprints.forEach((s,i)=>{
    const appUsed=s.app+s.fs, beUsed=s.be+s.fs; // full-stack occupies both engineers
    const appPct=appCap?Math.min(100,Math.round(appUsed/appCap*100)):0, bePct=beCap?Math.min(100,Math.round(beUsed/beCap*100)):0;
    html+=`<div class="sprint"><div class="sprint-h"><span class="sprint-n">Month ${i+1}</span><span class="sprint-mon">${monthLabel(i)}</span>
        <span class="sprint-meta">${s.ids.length} tickets · App ${appUsed}/${appCap} · BE ${beUsed}/${beCap}${s.fs?' · FS '+s.fs:''}</span></div>
      <div class="cap-wrap">
        <div class="lanebar"><span class="lane-lbl">App</span><div class="cap-track"><div class="cap-fill ${appUsed>appCap?'over':''}" style="width:${appPct}%"></div></div></div>
        <div class="lanebar"><span class="lane-lbl">Backend</span><div class="cap-track"><div class="cap-fill be ${beUsed>beCap?'over':''}" style="width:${bePct}%"></div></div></div>
      </div>
      <div class="sprint-body">`;
    s.ids.forEach(id=>{const t=tById[id],c=COMP[t.comp]; const lt=t.layer==='FE'?['App','lt-app']:t.layer==='Full-stack'?['FS','lt-fs']:['Backend','lt-be'];
      html+=`<div class="srow" data-tid="${id}"><span class="tid">${id}</span><span class="ttl">${esc(t.title)}</span>
        <span class="lanetag ${lt[1]}">${lt[0]}</span><span class="cchip" style="background:${c.bg};color:${c.fg}">${t.comp}</span>
        <span class="crit" style="background:${PRI[t.pri]}" title="Build-criticality">${t.pri}</span><span class="pts">${t.pts} pts</span></div>`;});
    html+=`</div></div>`;
  });
  html+=`</div>`;
  document.getElementById('main').innerHTML=html;
  wireSprintCfg();
  document.querySelectorAll('.srow').forEach(r=>r.addEventListener('click',()=>openTicketDrawer(r.dataset.tid)));
}
function wireSprintCfg(){
  const bind=(id,key)=>{const el=document.getElementById(id);if(el)el.onchange=e=>{const n=parseInt(e.target.value,10);if(n>=0){team[key]=n;saveTeam();renderSprints();}};};
  bind('appIn','app');bind('beIn','backend');bind('anIn','analyst');
  const s=document.getElementById('startIn');if(s)s.onchange=e=>{const m=e.target.value.match(/^(\d{4})-(\d{2})$/);if(m){team.startY=+m[1];team.startM=+m[2]-1;saveTeam();renderSprints();}};
}
function openTicketDrawer(id){
  const t=tById[id]; if(!t)return; const e=epicById[t.epic],c=COMP[t.comp],ph=DATA.phases.find(p=>p.id===t.phase);
  document.getElementById('drawer').innerHTML=`<div class="dh" style="border-top:4px solid ${c.cc}">
      <button class="dclose" id="dclose">✕</button>
      <div class="deid">${t.id} · ${e.id}</div>
      <div class="dname">${esc(t.title)}</div>
      <div class="drow"><span class="cchip" style="background:${c.bg};color:${c.fg}">${t.comp}</span><span class="lay">${t.layer}</span><span class="pri" style="background:${PRI[t.pri]}">${t.pri}</span><span class="pts">${t.pts} pts</span></div>
     </div>
     <div class="dbody" style="--cc:${c.cc}">
      <div class="dsec">Epic</div><div class="dobj">${esc(e.name)} · ${ph.id} ${esc(ph.name)}</div>
      <div class="dsec">Acceptance criteria</div><div class="dexit">${esc(t.ac)}</div>
      ${t.deps?`<div class="dsec">Depends on</div><div class="dobj">${esc(t.deps)}</div>`:''}
     </div>`;
  document.getElementById('drawer').classList.add('on'); document.getElementById('scrim').classList.add('on');
  document.getElementById('dclose').addEventListener('click',closeDrawer);
}

/* ---- render switch ---- */
function render(){renderStats();renderFilters();view==="roadmap"?renderRoadmap():view==="backlog"?renderBacklog():view==="sprints"?renderSprints():renderRank();bindFilters();}
function bindFilters(){
  document.querySelectorAll('[data-comp]').forEach(b=>b.onclick=()=>toggle(filt.comp,b.dataset.comp));
  document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>toggle(filt.layer,b.dataset.layer));
  document.querySelectorAll('[data-pri]').forEach(b=>b.onclick=()=>toggle(filt.pri,b.dataset.pri));
  const cl=document.getElementById('clear');if(cl)cl.onclick=()=>{filt.comp.clear();filt.layer.clear();filt.pri.clear();filt.q="";document.getElementById('search').value="";render();};
}
function toggle(set,v){set.has(v)?set.delete(v):set.add(v);render();}

document.querySelectorAll('#viewseg button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#viewseg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');view=b.dataset.view;render();
}));
document.getElementById('search').addEventListener('input',e=>{filt.q=e.target.value.trim().toLowerCase();render();});
document.getElementById('scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
rank=defaultRank();
render();
(async()=>{try{rank=await loadRank();if(view==='board')renderRank();}catch(e){}})();
</script>

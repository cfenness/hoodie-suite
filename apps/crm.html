<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="../suite.css">
<title>Hoodie Relations — Deal Qualification</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 /* self-contained fallbacks so the app renders correctly standalone AND under ../suite.css —
    kept in step with suite.css's Hoodie light + teal palette (repointed off the old gold) */
 --paper:#F4F6F5; --ink:#243330; --ink-soft:#5E6B68; --hair:#D7DDDB;
 --amber:#2C8C7C; --amber-deep:#1E5F55; --slate:#2F4D49;
 /* chrome remapped onto the suite token contract */
 --brand:var(--amber); --brand-dark:var(--amber-deep); --brand-deep:var(--amber-deep); --link:var(--amber-deep);
 --bg:var(--paper); --panel:#FBFCFC; --line:var(--hair); --line2:#E4E9E8; --label:var(--ink-soft);
 --muted:var(--ink-soft); --faint:#8A928F; --hover:#EEF3F2;
 /* tier semantics (unchanged) */
 --green:#2e844a; --green-bg:#ebf7ee; --orange:#a86403; --orange-bg:#fef6e6;
 --purple:#5867e8; --purple-bg:#eef0fd; --teal:#06a59a; --teal-bg:#e3f7f5; --blue-bg:#eaf5fe;
 /* qualification semantics — the loud blanks */
 --q-solid:#0a6b2f; --q-solid-bg:#e9f6ee; --q-weak:#9a6700; --q-weak-bg:#fdf3df;
 --q-unknown:#b3261e; --q-unknown-bg:#fbe7e6;
 --radius:3px; --shadow:0 1px 2px rgba(40,30,20,.06);
 --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
/* global header */
.gheader{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;position:sticky;top:0;z-index:30}
.applauncher{display:grid;grid-template-columns:repeat(3,4px);grid-auto-rows:4px;gap:2px;padding:9px;border-radius:var(--radius);cursor:pointer}
.applauncher span{width:4px;height:4px;border-radius:1px;background:#b0adab}
.applauncher:hover{background:#f3f2f2}
.appname{font-weight:700;font-size:15px;color:#080707;letter-spacing:-.01em}
.appname b{color:var(--brand)}
.gsearch{flex:1;max-width:520px;margin:0 auto}
.gsearch input{width:100%;border:1px solid #c9c7c5;border-radius:15px;padding:7px 14px;font-size:13px;background:#fff}
.gsearch input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 3px var(--brand)}
.gutils{display:flex;align-items:center;gap:6px;margin-left:auto}
.gicon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#706e6b;font-size:15px}
.gicon:hover{background:#f3f2f2}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
/* nav */
.nav{background:#fff;border-bottom:1px solid var(--line);padding:0 14px;display:flex;gap:2px;position:sticky;top:49px;z-index:29}
.nav .tab{padding:11px 16px 9px;font-size:13px;font-weight:600;color:#3e3e3c;border:0;border-bottom:3px solid transparent;background:none}
.nav .tab:hover{background:var(--hover);color:var(--brand)}
.nav .tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.nav .tab .tabct{display:none} .nav .tab .tabct:not(:empty){display:inline-block;margin-left:5px;font-size:10.5px;font-weight:700;background:#B8791F;color:#fff;border-radius:999px;padding:1px 6px;vertical-align:1px}
.page{padding:14px;max-width:1180px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
/* list header */
.lvhead{display:flex;align-items:center;gap:12px;padding:10px 14px}
.lvicon{width:34px;height:34px;border-radius:var(--radius);background:var(--brand);display:grid;place-items:center;color:#fff;font-size:16px;flex:none}
.lvtitles .k{font-size:11px;color:var(--muted)}
.lvtitles .v{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700;color:#080707}
.lvactions{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:#fff;color:var(--brand-deep);border-radius:var(--radius);padding:6px 13px;font-weight:600;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.brand:hover{background:var(--brand-dark)}
.lvmeta{padding:0 14px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
/* table */
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:12px;color:#514f4d;font-weight:700;padding:8px 12px;border-bottom:1px solid var(--line);background:#fafaf9;white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover{background:var(--hover);cursor:pointer}
.rowname{display:flex;align-items:center;gap:9px}
.recicon{width:24px;height:24px;border-radius:var(--radius);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.lnk{font-weight:600}
.chk{width:14px;height:14px;accent-color:var(--brand)}
/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:11px;padding:2px 9px;background:#ecebea;color:#444;white-space:nowrap}
.badge .dot{width:7px;height:7px;border-radius:50%}
.tier-Supplier{background:var(--blue-bg);color:#04518c}.tier-Supplier .dot{background:#0176d3}
.tier-Wholesale{background:var(--green-bg);color:#0a6b2f}.tier-Wholesale .dot{background:#2e844a}
.tier-Retail{background:var(--orange-bg);color:#8a5103}.tier-Retail .dot{background:#dd7a01}
.tier-Policy{background:var(--purple-bg);color:#3a40b0}.tier-Policy .dot{background:#5867e8}
.tier-Adjacency{background:var(--teal-bg);color:#066} .tier-Adjacency .dot{background:#06a59a}
.stagepill{font-size:11.5px;font-weight:600;color:var(--brand)}
/* qual score chip (compact, for lists) */
.qchip{font-family:var(--mono);font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.qbar{height:5px;border-radius:3px;background:#e6e2d8;overflow:hidden;width:62px;display:inline-block;vertical-align:middle}
.qbar > i{display:block;height:100%;border-radius:3px}
.q-strong{background:var(--q-solid-bg);color:var(--q-solid)}
.q-mid{background:var(--q-weak-bg);color:var(--q-weak)}
.q-thin{background:var(--q-unknown-bg);color:var(--q-unknown)}
/* record page */
.crumb{font-size:12px;color:var(--muted);margin-bottom:8px}
.highlights{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hl-icon{width:44px;height:44px;border-radius:var(--radius);display:grid;place-items:center;color:#fff;font-size:18px;font-weight:700;flex:none}
.hl-main .k{font-size:11px;color:var(--muted)}
.hl-main .v{font-size:20px;font-weight:700;color:#080707;letter-spacing:-.01em}
.hl-spacer{flex:1}
.hl-actions{display:flex;gap:8px}
/* qual ring in highlight */
.qring{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:var(--radius);padding:8px 14px;background:#fff}
.qring .num{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1}
.qring .lab{font-size:10.5px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qring .weak{font-size:12px;font-weight:600;margin-top:2px}
/* path */
.path{display:flex;padding:14px 18px;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);background:#fbfbfb}
.pstage{position:relative;flex:1;min-width:120px;height:34px;background:#ecebea;color:#514f4d;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);margin-right:3px;cursor:pointer;white-space:nowrap;padding:0 6px}
.pstage:first-child{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
.pstage.done{background:#cfe0d3;color:#0a5230}
.pstage.cur{background:var(--brand);color:#fff}
.pstage:hover{filter:brightness(.97)}
/* body grid */
.rbody{display:grid;grid-template-columns:1.32fr 1fr;gap:14px;padding:14px 18px}
@media(max-width:860px){.rbody{grid-template-columns:1fr}}
.sect{margin-bottom:16px}
.sect h3{font-size:12px;font-weight:700;color:#080707;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line2);letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sect h3 .sub{font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11.5px}
/* the gap (Gap Selling spine) */
.gap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
@media(max-width:560px){.gap{grid-template-columns:1fr}}
.gap > div{padding:11px 13px;border-right:1px solid var(--line2)}
.gap > div:last-child{border-right:0}
.gap .gk{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.gap .gv{font-size:12.5px;line-height:1.4}
.gap .cost{background:#fffaf2}
.gap .cost .gk{color:var(--amber-deep)}
.gap .future{background:#f3f8f4}
.gap .empty{color:var(--q-unknown);font-style:italic;font-weight:500}
.gap-edit{margin-top:8px}
.gap-warn{font-size:12px;color:var(--q-unknown);background:var(--q-unknown-bg);border-left:3px solid var(--q-unknown);padding:7px 11px;margin-top:9px;border-radius:0 2px 2px 0}
/* MEDDPICC scorecard — the signature */
.scorehead{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.scorehead .big{font-family:var(--mono);font-weight:700;font-size:15px}
.medd{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.medd-row{display:grid;grid-template-columns:96px 1fr;gap:0;border-bottom:1px solid var(--line2);background:#fff}
.medd-row:last-child{border-bottom:0}
.medd-row:hover{background:var(--hover)}
.medd-status{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 6px;border-right:1px solid var(--line2);cursor:pointer;user-select:none;text-align:center}
.medd-status .pill{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:10px;padding:2px 8px;white-space:nowrap}
.st-unknown{background:var(--q-unknown-bg);color:var(--q-unknown)}
.st-weak{background:var(--q-weak-bg);color:var(--q-weak)}
.st-solid{background:var(--q-solid-bg);color:var(--q-solid)}
.medd-status .cyc{font-size:9px;color:var(--faint);font-family:var(--mono)}
.medd-body{padding:8px 12px;cursor:pointer}
.medd-body .mk{font-weight:700;font-size:12.5px;display:flex;align-items:baseline;gap:8px}
.medd-body .mk .letter{font-family:var(--mono);color:var(--amber);font-weight:700}
.medd-body .hint{font-size:11px;color:var(--faint);font-weight:400}
.medd-body .note{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4}
.medd-body .note.blank{color:var(--q-unknown);font-style:italic}
.medd.unknown-flag .st-unknown{box-shadow:inset 3px 0 0 var(--q-unknown)}
/* coach line */
.coach{font-size:12.5px;line-height:1.5;background:#fff;border:1px solid var(--line);border-left:3px solid var(--slate);border-radius:0 2px 2px 0;padding:10px 13px;margin-top:10px}
.coach .ct{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:5px}
.coach ul{margin:0;padding-left:16px}
.coach li{margin:3px 0}
/* committee / multithread */
.contact-card{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;background:#fff;cursor:pointer}
.contact-card:hover{background:var(--hover)}
.contact-card .av{width:30px;height:30px;border-radius:50%;background:var(--slate);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.contact-card .nm{font-weight:600}.contact-card .ti{font-size:12px;color:var(--muted)}
.contact-card .meta{margin-left:auto;text-align:right;font-size:12px;color:var(--muted)}
.rolepill{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:9px;padding:2px 8px;white-space:nowrap}
.role-Champion{background:var(--q-solid-bg);color:var(--q-solid)}
.role-Economic{background:#eef0fd;color:#3a40b0}
.role-Decision{background:var(--blue-bg);color:#04518c}
.role-Influencer{background:#f0eee9;color:#5b5347}
.role-Coach{background:var(--teal-bg);color:#066}
.role-Blocker{background:var(--q-unknown-bg);color:var(--q-unknown)}
.thread-warn{font-size:12px;color:var(--q-weak);background:var(--q-weak-bg);border-left:3px solid var(--q-weak);padding:7px 11px;border-radius:0 2px 2px 0;margin-bottom:9px}
.placeholder{color:#a09e9c;font-style:italic}
.notes{width:100%;min-height:80px;border:1px solid #c9c7c5;border-radius:var(--radius);padding:9px;font-family:inherit;font-size:13px;resize:vertical}
.frow{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:5px 0;font-size:13px}
.frow .fk{color:var(--muted);font-size:12px}.frow .fv{font-weight:500}
.na-box{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:9px;background:#fff}
.na-box.live{border-color:#f0c46a;background:#fffdf7}
.na-box.wait{border-color:#b9c8ef;background:#f7f9ff}
.na-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.na-row .lbl{font-size:12px;color:var(--muted)}.na-row .val{font-weight:600;font-size:13px}
.mini{border:1px solid #c9c7c5;background:#fff;color:#3e3e3c;border-radius:4px;padding:4px 9px;font-size:11.5px;font-weight:600;font-family:inherit}
.mini:hover{background:var(--hover)}
.mini.good:hover{background:var(--q-solid-bg);color:var(--q-solid);border-color:#9ed3b0}
.chip{font-size:11px;font-weight:700;border-radius:10px;padding:2px 9px;white-space:nowrap}
.chip.over{background:var(--q-unknown-bg);color:var(--q-unknown)}
.chip.due{background:var(--q-weak-bg);color:var(--q-weak)}
.chip.wait{background:#e8eefc;color:#2c4ea8}
/* ===== Home command center ===== */
.home-h{display:flex;align-items:baseline;gap:12px;margin:2px 2px 8px}
.home-h .t{font-size:20px;font-weight:700;color:#080707;letter-spacing:-.01em}
.home-h .s{font-size:12.5px;color:var(--muted)}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.rail-h{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:#fff}
.rail-h .ti{font-weight:700;font-size:14px}
.rail-h .ct{color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:1px 8px;background:#c23934}
.rail-h .ct.zero{background:#2e844a}
.rail-h .ct.risk{background:var(--amber-deep)}
.rail-h .s{margin-left:auto;font-size:12px;color:var(--muted)}
.rail-row{display:grid;grid-template-columns:32px 1fr auto auto;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line2);cursor:pointer}
.rail-row:last-child{border-bottom:0}.rail-row:hover{background:var(--hover)}
.rail-ic{width:30px;height:30px;border-radius:var(--radius);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.rail-main .nm{font-weight:600;font-size:13.5px}
.rail-main .sub{font-size:12px;color:var(--muted)}
.why{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rail-act{display:flex;gap:6px}
.rail-empty{padding:20px 16px;text-align:center;color:#7a9a82;font-size:13px}
.miniboard{display:flex;gap:10px;overflow-x:auto;padding:2px}
.mbcol{flex:0 0 176px;background:#ecebea;border-radius:var(--radius);padding:0 0 8px}
.mbcol-h{padding:8px 11px;font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#514f4d;display:flex;justify-content:space-between}
.mbcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:4px;margin:0 7px 7px;padding:7px 9px;cursor:pointer}
.mbcard:hover{background:var(--hover)}
.mbcard .nm{font-weight:600;font-size:12px}
.mbcard .fl{margin-top:5px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding:14px}
.kcol{flex:0 0 230px;background:#ecebea;border-radius:var(--radius)}
.kcol-h{padding:9px 12px;font-size:11px;font-weight:700;color:#514f4d;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between}
.kcol-h .n{color:var(--muted);font-weight:600}
.kbody{padding:0 8px 10px;display:flex;flex-direction:column;gap:8px;min-height:40px}
.kcard{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--radius);padding:9px 11px;box-shadow:var(--shadow);cursor:grab}
.kcard:active{cursor:grabbing}.kcard.drag{opacity:.4}
.kcard .nm{font-weight:600;font-size:13px;margin-bottom:6px}
.kcard .kq{display:flex;align-items:center;gap:6px;margin-top:6px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50}.scrim.on{display:block}
.modal{position:fixed;z-index:51;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,94vw);background:#fff;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.3);display:none;overflow:hidden}.modal.on{display:block}
.modal-h{background:var(--brand);color:#fff;padding:13px 18px;font-weight:700;font-size:16px;display:flex;justify-content:space-between}
.modal-h .x{cursor:pointer;font-size:18px;opacity:.9}
.modal-b{padding:16px 18px;max-height:70vh;overflow:auto}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--label);font-weight:600;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid #c9c7c5;border-radius:var(--radius);padding:7px 10px;font-family:inherit;font-size:13px}
.field textarea{min-height:64px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 3px var(--brand)}
.field .help{font-size:11px;color:var(--faint);margin-top:3px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#fafaf9}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#181818;color:#fff;padding:10px 18px;border-radius:var(--radius);font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="gheader">
  <div class="applauncher" title="App Launcher"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="appname">Hoodie <b>Relations</b></div>
  <div class="gsearch"><input id="search" placeholder="Search accounts and people..."/></div>
  <div class="gutils">
    <div class="gicon" title="Setup">⚙</div><div class="gicon" title="Help">?</div><div class="gicon" title="Notifications">🔔</div>
    <div class="avatar" title="Chris Fennessey">CF</div>
  </div>
</div>
<div class="nav" id="nav">
  <button class="tab on" data-tab="home">Home</button>
  <button class="tab" data-tab="accounts">Accounts</button>
  <button class="tab" data-tab="pipeline">Pipeline</button>
  <button class="tab" data-tab="contacts">People</button>
  <button class="tab" data-tab="service">Service <span class="tabct" id="svc-tabct"></span></button>
</div>
<div class="page" id="page"></div>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal">

  <div class="modal-b" id="modalBody"></div>

let DB=seedSignals(seed());
async function load(){ if(persists){ try{const r=await window.storage.get(KEY); if(r&&r.value){DB=JSON.parse(r.value);migrate(DB);}}catch(e){} } }
function migrate(db){ // tolerate older saves
  (db.accounts||[]).forEach(a=>{ if(!a.meddpicc)a.meddpicc=blankMedd(); MEDD.forEach(m=>{if(!a.meddpicc[m.k])a.meddpicc[m.k]={status:"unknown",note:""};});
    if(!a.gap)a.gap={current:"",cost:"",future:""}; (a.contacts||[]).forEach(c=>{if(!c.role)c.role="Influencer";});
    if(STAGES.indexOf(a.stage)<0)a.stage="Identified"; });
}
async function save(){ DB.updatedAt=Date.now(); if(persists){ try{await window.storage.set(KEY,JSON.stringify(DB));}catch(e){} } }
function acct(id){return DB.accounts.find(a=>a.id===id);}
function allContacts(){const out=[];DB.accounts.forEach(a=>(a.contacts||[]).forEach(c=>out.push({...c,account:a.name,accountId:a.id})));return out;}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function initials(n){return (n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';}
function stageIdx(s){return Math.max(0,STAGES.indexOf(s));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}

/* ---- qualification math ---- */
function qualScore(a){
  let s=0;const max=MEDD.length*2;
  MEDD.forEach(m=>{s+=STATUS_SCORE[(a.meddpicc[m.k]||{}).status||"unknown"];});
  const pct=Math.round((s/max)*100);
  // weakest link: first unknown in MEDD order, else first weak
  let weakest=MEDD.find(m=>(a.meddpicc[m.k]||{}).status==="unknown")||MEDD.find(m=>(a.meddpicc[m.k]||{}).status==="weak")||null;
  return {s,max,pct,weakest};
}
function qualClass(pct){return pct>=66?"q-strong":pct>=33?"q-mid":"q-thin";}
function qualBarColor(pct){return pct>=66?"var(--q-solid)":pct>=33?"var(--q-weak)":"var(--q-unknown)";}
function unknownCount(a){return MEDD.filter(m=>(a.meddpicc[m.k]||{}).status==="unknown").length;}
function gapDone(a){return !!(a.gap&&a.gap.current&&a.gap.cost&&a.gap.future);}
function isSingleThreaded(a){const cs=a.contacts||[];return cs.length<=1;}
function hasChampion(a){return (a.contacts||[]).some(c=>c.role==="Champion")||(a.meddpicc.champion||{}).status==="solid";}

/* the diagnostic coach — teaches back what the frameworks say about THIS deal */
function riskFlags(a){
  const f=[];const idx=stageIdx(a.stage);
  // advanced in stage but missing the qualification that stage should have
  const expect=STAGE_EXPECTS[a.stage]||[];
  const missing=expect.filter(k=>(a.meddpicc[k]||{}).status==="unknown");
  if(missing.length) f.push(`You're at <b>${esc(a.stage)}</b> but flying blind on ${missing.map(k=>MEDD_BY_KEY[k].t).join(", ")} — qualify backward before you advance.`);
  if(idx>=1 && !gapDone(a)) f.push("The Gap isn't fully built — you haven't quantified the cost of the status quo, so the problem doesn't hurt yet.");
  if(idx>=2 && isSingleThreaded(a)) f.push("Single-threaded. One contact = one point of failure. If they go quiet or leave, the deal dies. Find a second thread.");
  if(idx>=2 && !hasChampion(a)) f.push("No confirmed champion. You have contacts, but nobody is selling for you when you're not in the room.");
  if((a.meddpicc.competition||{}).status==="unknown" && idx>=2) f.push("Competition unknown — and the one that usually wins is \u201Cdo nothing.\u201D Name what they do if they don't move.");
  if((a.meddpicc.economicBuyer||{}).status==="unknown" && idx>=2) f.push("You haven't met the economic buyer. A champion who can't reach the budget is a coach, not a champion.");
  return f;
}

let tab="home", recordId=null, q="";
function go(t){tab=t;recordId=null;document.querySelectorAll('#nav .tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render();}
function today(){return new Date().toISOString().slice(0,10);}
function daysAgo(d){if(!d)return 0;return Math.round((Date.parse(today())-Date.parse(d))/86400000);}
function daysUntil(d){if(!d)return null;return Math.round((Date.parse(d)-Date.parse(today()))/86400000);}

/* ============================ RENDER ============================ */
function render(){
  const page=document.getElementById('page');
  if(recordId){const a=acct(recordId);if(!a){recordId=null;return render();}page.innerHTML=recordHTML(a);wireRecord();return;}
  if(tab==="home"){page.innerHTML=homeHTML();return;}
  if(tab==="accounts")page.innerHTML=accountsHTML();
  else if(tab==="pipeline"){page.innerHTML=pipelineHTML();wireKanban();}
  else if(tab==="service"){page.innerHTML=serviceHTML();loadService();}
  else page.innerHTML=contactsHTML();
}

/* ---- home: needs-you rail + deal-risk rail + board ---- */
function railItems(){
  const items=[];
  DB.accounts.forEach(a=>{const reasons=[];
    if(a.nextAction&&a.nextAction.date){const du=daysUntil(a.nextAction.date);
      if(du<=0)reasons.push({type:du<0?'over':'due',sort:du<0?0:1,chip:du<0?`Overdue ${-du}d`:'Due today',label:a.nextAction.note||'Follow up'});}
    if(a.waiting&&a.waiting.on)reasons.push({type:'wait',sort:2,chip:`Waiting ${daysAgo(a.waiting.since)}d`,label:a.waiting.note||'Ball in their court'});
    if(reasons.length)items.push({a,reasons});});
  return items.sort((x,y)=>Math.min(...x.reasons.map(r=>r.sort))-Math.min(...y.reasons.map(r=>r.sort)));
}
function riskItems(){
  // deals advanced past Identified that carry at least one structural risk flag
  return DB.accounts.filter(a=>stageIdx(a.stage)>=1).map(a=>({a,flags:riskFlags(a)})).filter(x=>x.flags.length)
    .sort((x,y)=>y.flags.length-x.flags.length);
}
function homeHTML(){
  const items=railItems(), risks=riskItems();
  const active=DB.accounts.filter(a=>stageIdx(a.stage)>=1);
  // needs-you rail
  let needs=`<div class="rail"><div class="rail-h"><span class="ti">Needs you</span><span class="ct ${items.length?'':'zero'}">${items.length}</span>
     <span class="s">Due follow-ups &amp; relationships waiting on them</span></div>`;
  needs += items.length? items.map(({a,reasons})=>`<div class="rail-row" onclick="openRecord('${a.id}')">
      <span class="rail-ic" style="background:${TIER_ICON_COLOR[a.tier]}">${esc(a.abbr.slice(0,3))}</span>
      <div class="rail-main"><div class="nm">${esc(a.name)}</div><div class="sub">${esc(reasons.map(r=>r.label).join(' · '))} — <span style="color:var(--faint)">${esc(a.stage)}</span></div></div>
      <div class="why">${reasons.map(r=>`<span class="chip ${r.type}">${esc(r.chip)}</span>`).join("")}</div>
      <div class="rail-act" onclick="event.stopPropagation()">
        ${reasons.some(r=>r.type==='over'||r.type==='due')?`<button class="mini good" onclick="railDone('${a.id}')">Mark done</button>`:''}
        ${reasons.some(r=>r.type==='wait')?`<button class="mini good" onclick="railReplied('${a.id}')">They replied</button>`:''}
        <button class="mini" onclick="openRecord('${a.id}')">Open</button></div></div>`).join("")
    : `<div class="rail-empty">Nothing needs you right now. Set a follow-up or flag a relationship as waiting on them from any record.</div>`;
  needs+=`</div>`;
  // deal-risk rail (the framework, made operational)
  let risk=`<div class="rail"><div class="rail-h"><span class="ti">Where you're flying blind</span><span class="ct ${risks.length?'risk':'zero'}">${risks.length}</span>
     <span class="s">Deals advanced in stage but thin on qualification — the blanks are the risk</span></div>`;
  risk += risks.length? risks.map(({a,flags})=>{const Q=qualScore(a);return `<div class="rail-row" onclick="openRecord('${a.id}')">
      <span class="rail-ic" style="background:${TIER_ICON_COLOR[a.tier]}">${esc(a.abbr.slice(0,3))}</span>
      <div class="rail-main"><div class="nm">${esc(a.name)} <span style="color:var(--faint);font-weight:500">· ${esc(a.stage)}</span></div>
        <div class="sub">${esc(flags[0].replace(/<[^>]+>/g,''))}</div></div>
      <div class="why"><span class="qchip ${qualClass(Q.pct)}">${Q.pct}%</span></div>
      <div class="rail-act" onclick="event.stopPropagation()"><button class="mini" onclick="openRecord('${a.id}')">Work it</button></div></div>`;}).join("")
    : `<div class="rail-empty">No structural gaps flagged. Every advanced deal has the qualification its stage demands.</div>`;
  risk+=`</div>`;
  // board

/* ============================ SERVICE DESK ============================ */
/* Data-quality reports raised from the suite (e.g. a "degraded" pill in Hoodie
   Pulls). Lives on the engine (/api/service/reports); tracked to resolution here. */
const SVC_TONE={open:{bg:'#FBEED0',fg:'#8a5a0f'},acknowledged:{bg:'#E3EDF6',fg:'#33597e'},
  reported:{bg:'#F3E4CE',fg:'#8a5a0f'},resolved:{bg:'#DDEEE2',fg:'#2E7D57'}};
function svcPill(st){const t=SVC_TONE[st]||SVC_TONE.open;
  return `<span class="stagepill" style="background:${t.bg};color:${t.fg};text-transform:capitalize">${esc(st||'open')}</span>`;}
function svcWhen(ms){if(!ms)return '—';const d=new Date(ms);const D=d.toISOString().slice(0,10);
  const t=d.toTimeString().slice(0,5);return `${D} · ${t}`;}
function serviceHTML(){
  return `<div class="card">
    <div class="lvhead"><div class="lvicon" style="background:#B8791F">⚑</div>
      <div class="lvtitles"><div class="k">Service</div><div class="v">Data-Quality Reports</div></div>
      <div class="lvactions"><button class="btn" onclick="loadService()">Refresh</button></div></div>
    <div class="lvmeta">Issues reported from the suite — click a <b>degraded</b> pill in Hoodie Pulls to file one. Track each to resolution.</div>
    <div id="svc-body"><div style="padding:28px;text-align:center;color:#a09e9c">Loading reports…</div></div>
  </div>`;
}
function loadService(){
  const body=document.getElementById('svc-body'); if(!body)return;
  fetch('/api/service/reports',{cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>{
      const reports=(d&&d.reports)||[], counts=(d&&d.counts)||{};
      const badge=document.getElementById('svc-tabct');
      if(badge)badge.textContent=counts.open?counts.open:'';
      if(!reports.length){
        body.innerHTML=`<div style="padding:32px;text-align:center;color:#a09e9c">
          <div style="font-size:15px;font-weight:600;color:#6b6b69">No reports yet</div>
          <div style="margin-top:6px;font-size:13px">When a scrape self-reports <b>degraded</b>, open <b>Hoodie Pulls</b> and click the pill to report it — it lands here.</div></div>`;
        return;
      }
      const cc=['open','acknowledged','reported','resolved'].filter(s=>counts[s])
        .map(s=>`${counts[s]} ${s}`).join(' · ');
      body.innerHTML=`<div class="lvmeta" style="border-top:1px solid var(--line);padding-top:10px">${reports.length} report${reports.length===1?'':'s'}${cc?' — '+cc:''}</div>
      <table><thead><tr><th>Source</th><th>Severity</th><th>What flagged</th><th>Reporter</th><th>Reported</th><th>Status</th><th style="text-align:right">Action</th></tr></thead><tbody>
      ${reports.map(r=>{
        const warnTxt=(r.warnings&&r.warnings.length)?`${r.warnings.length} warning${r.warnings.length===1?'':'s'}${r.note?' · '+esc(r.note):''}`
                    :(r.note?esc(r.note):'<span style="color:#a09e9c">self-reported</span>');
        const next = r.status==='open' ? `<button class="btn" onclick="svcSet('${r.id}','acknowledged')">Acknowledge</button>`
                   : r.status==='acknowledged' ? `<button class="btn" onclick="svcSet('${r.id}','reported')">Mark reported</button>`
                   : r.status==='reported' ? `<button class="btn brand" onclick="svcSet('${r.id}','resolved')">Resolve</button>`
                   : `<span style="color:var(--q-solid,#2E7D57);font-weight:600">✓ resolved</span>`;
        return `<tr title="${esc((r.warnings||[]).join(' • '))}">
          <td><div class="rowname"><span class="recicon" style="background:#B8791F">${esc((r.connId||r.source||'?').slice(0,2).toUpperCase())}</span><b>${esc(r.source||r.connId||'—')}</b></div></td>
          <td><span class="stagepill" style="text-transform:capitalize">${esc(r.severity||'degraded')}</span></td>
          <td style="max-width:280px">${warnTxt}</td>
          <td>${esc(r.reporter||'field')}</td>
          <td style="white-space:nowrap;color:#6b6b69">${svcWhen(r.createdAt)}</td>
          <td>${svcPill(r.status)}</td>
          <td style="text-align:right">${next}</td></tr>`;
      }).join('')}
      </tbody></table>`;
    })
    .catch(()=>{ body.innerHTML=`<div style="padding:30px;text-align:center;color:#a09e9c">
      <div style="font-size:14px">Service desk is offline.</div>
      <div style="margin-top:5px;font-size:12.5px">Reports live on the engine — start it with <code>./dev.sh</code> (or open the deployed suite), then Refresh.</div></div>`; });
}
function svcSet(id,status){
  fetch('/api/service/reports/'+encodeURIComponent(id),{method:'PATCH',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({status:status,by:'ops'})})
   .then(r=>r.ok?r.json():Promise.reject())
   .then(()=>{ loadService(); toast('Report → '+status); })
   .catch(()=>toast('Update failed — is the engine live?'));
}

async function cycleMedd(id,k){const a=acct(id);const cur=(a.meddpicc[k]||{}).status||"unknown";
  a.meddpicc[k]=a.meddpicc[k]||{};a.meddpicc[k].status=STATUS_NEXT[cur];await save();render();

function editGap(id){const a=acct(id);const g=a.gap||{current:"",cost:"",future:""};

    `<div class="field"><label>Current state</label><textarea id="g_cur" placeholder="What is true today, in their world?">${esc(g.current)}</textarea></div>
     <div class="field"><label>Cost of the status quo</label><textarea id="g_cost" placeholder="Quantify it — hours, dollars, risk, lost revenue. This is the part that creates urgency.">${esc(g.cost)}</textarea><div class="help">No cost = no gap = no budget. This is the field that does the selling.</div></div>

/* drag kanban */
let drag=null;
function wireKanban(){
  document.querySelectorAll('.kcard').forEach(c=>{
    c.addEventListener('dragstart',e=>{drag=c.dataset.id;c.classList.add('drag');e.stopPropagation();});
    c.addEventListener('dragend',()=>{document.querySelectorAll('.kcard').forEach(x=>x.classList.remove('drag'));drag=null;});});
  document.querySelectorAll('.kbody').forEach(b=>{
    b.addEventListener('dragover',e=>e.preventDefault());
    b.addEventListener('drop',async e=>{e.preventDefault();if(!drag)return;acct(drag).stage=b.dataset.stage;await save();render();wireKanban();toast('Moved to '+b.dataset.stage);});});
}

/* modal infra */
function modal(title,bodyHTML,onSave){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=bodyHTML;
  document.getElementById('scrim').classList.add('on');document.getElementById('modal').classList.add('on');
  document.getElementById('modalSave').onclick=async()=>{if(await onSave()!==false)closeModal();};}
function closeModal(){document.getElementById('scrim').classList.remove('on');document.getElementById('modal').classList.remove('on');}
document.getElementById('modalX').onclick=closeModal;document.getElementById('modalCancel').onclick=closeModal;document.getElementById('scrim').onclick=closeModal;
function field(id,label,val="",type="text"){return `<div class="field"><label>${label}</label><input id="${id}" value="${esc(val)}" type="${type}"></div>`;}
function selField(id,label,opts,val){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join("")}</select></div>`;}

function newAccount(){accForm("New deal",null);}
function editAccount(id){accForm("Edit deal",acct(id));}
function accForm(title,a){
  modal(title,
    field("f_name","Account name",a?.name)+field("f_abbr","Abbreviation",a?.abbr)+
    selField("f_tier","Tier",["Supplier","Wholesale","Retail","Policy","Adjacency"],a?.tier||"Wholesale")+
    field("f_type","Type",a?.type)+field("f_focus","Category focus",a?.focus)+
    field("f_hq","HQ",a?.hq)+field("f_web","Website",a?.web)+
    selField("f_stage","Stage",STAGES,a?.stage||"Identified")+
    field("f_role","Target role",a?.targetRole),
    async()=>{const name=document.getElementById('f_name').value.trim();if(!name){toast('Name required');return false;}
      const o={name,abbr:document.getElementById('f_abbr').value.trim()||name.slice(0,4).toUpperCase(),
        tier:document.getElementById('f_tier').value,type:document.getElementById('f_type').value.trim(),
        focus:document.getElementById('f_focus').value.trim(),hq:document.getElementById('f_hq').value.trim()||'—',
        web:document.getElementById('f_web').value.trim()||'—',stage:document.getElementById('f_stage').value,
        targetRole:document.getElementById('f_role').value.trim()};
      if(a){Object.assign(a,o);}else{o.id='a'+Date.now();o.owner="Chris Fennessey";o.notes="";o.contacts=[];o.meddpicc=blankMedd();o.gap={current:"",cost:"",future:""};DB.accounts.unshift(o);}
      await save();render();toast(a?'Deal updated':'Deal created');});
}
function newContact(accountId){
  modal("Add person",
    field("c_name","Name")+field("c_title","Title")+selField("c_role","Role on this deal",ROLES,"Influencer")+field("c_email","Email","","email")+field("c_phone","Phone","","tel"),
    async()=>{const a=acct(accountId);a.contacts=a.contacts||[];
      a.contacts.push({id:'c'+Date.now(),name:document.getElementById('c_name').value.trim(),title:document.getElementById('c_title').value.trim(),
        role:document.getElementById('c_role').value,email:document.getElementById('c_email').value.trim(),phone:document.getElementById('c_phone').value.trim()});
      await save();render();toast('Person added');});
}
function editContact(accountId,cid){const a=acct(accountId);const c=(a.contacts||[]).find(x=>x.id===cid);if(!c)return;
  modal("Edit person",
    field("c_name","Name",c.name)+field("c_title","Title",c.title)+selField("c_role","Role on this deal",ROLES,c.role||"Influencer")+field("c_email","Email",c.email,"email")+field("c_phone","Phone",c.phone,"tel")+
    `<div style="margin-top:4px"><button class="mini" style="color:var(--q-unknown);border-color:#e3b7b3" onclick="(function(){if(confirm('Remove this person?')){const a=acct('${accountId}');a.contacts=a.contacts.filter(x=>x.id!=='${cid}');save().then(()=>{closeModal();render();toast('Removed');});}})()">Remove person</button></div>`,
    async()=>{Object.assign(c,{name:document.getElementById('c_name').value.trim(),title:document.getElementById('c_title').value.trim(),
      role:document.getElementById('c_role').value,email:document.getElementById('c_email').value.trim(),phone:document.getElementById('c_phone').value.trim()});
      await save();render();toast('Person updated');});
}

/* export / import / search / nav */
function exportJSON(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const x=document.createElement('a');x.href=u;x.download='hoodie-crm.json';x.click();setTimeout(()=>URL.revokeObjectURL(u),800);}
document.getElementById('page').addEventListener('change',e=>{if(e.target.id==='imp'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{DB=JSON.parse(r.result);migrate(DB);await save();render();toast('Imported');}catch(_){toast('Bad file');}};r.readAsText(f);}});
document.getElementById('search').addEventListener('input',e=>{q=e.target.value;if(tab==='accounts'&&!recordId)render();});
document.querySelectorAll('#nav .tab').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));

load().then(render);
/* surface the open-report count on the Service tab even before it's opened */
fetch('/api/service/reports?status=open',{cache:'no-store'}).then(r=>r.ok?r.json():null)
  .then(d=>{const b=document.getElementById('svc-tabct');if(b&&d&&d.counts&&d.counts.open)b.textContent=d.counts.open;}).catch(()=>{});
</script>

<!-- ===== Hoodie Spine integration (unchanged contract) ===== -->
<script src="../spine/spine.js"></script>
<script>
(function(){
  if(typeof HoodieSpine==='undefined')return;
  var spine=null,lastAcctId=null;
  function esc2(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  var chip=document.createElement('div');chip.id='spineChip';chip.title='Shared suite context';
  chip.style.cssText='display:none;align-items:center;gap:7px;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:11px;font-weight:600;letter-spacing:.03em;color:#5b5347;background:#eef0f2;border:1px solid #d6dadf;border-radius:999px;padding:5px 11px;margin-right:10px;white-space:nowrap;';
  var host=document.querySelector('.gutils')||document.querySelector('.gheader');if(host)host.insertBefore(chip,host.firstChild);
  function renderChip(ctx){var parts=[];if(ctx&&ctx.scope)parts.push(ctx.scope.name);if(ctx&&ctx.account)parts.push(ctx.account.name);
    if(!parts.length){chip.style.display='none';return;}
    chip.innerHTML='<span style="width:6px;height:6px;border-radius:50%;background:#c98a1a;flex:0 0 auto;display:inline-block"></span>'+parts.map(function(t,i){return (i?'<span style="opacity:.4">▸</span> ':'')+'<span>'+esc2(t)+'</span>';}).join(' ');
    chip.style.display='inline-flex';}
  function applyContext(ctx){if(ctx&&ctx.account&&typeof DB!=='undefined'&&DB.accounts){var want=ctx.account.name.toLowerCase();
    var a=DB.accounts.find(function(x){return x.name.toLowerCase()===want;})||DB.accounts.find(function(x){return x.name.toLowerCase().indexOf(want)>=0||want.indexOf(x.name.toLowerCase())>=0;});
    if(a&&a.id!==recordId&&a.id!==lastAcctId){lastAcctId=a.id;openRecord(a.id);}}}
  spine=HoodieSpine.connect({name:'Hoodie Relations',onContext:function(ctx){try{renderChip(ctx);}catch(e){}try{applyContext(ctx);}catch(e){}}});
  if(typeof openRecord==='function'){var _open=openRecord;window.openRecord=function(id){_open(id);try{var a=DB.accounts.find(function(x){return x.id===id;});if(a&&spine){lastAcctId=a.id;spine.setContext({account:{id:a.id,name:a.name}});spine.setCrumb(a.abbr||a.name);}}catch(e){}};}
  if(typeof back==='function'){var _back=back;window.back=function(){_back();try{if(spine)spine.setCrumb('');}catch(e){}};}
})();
</script>

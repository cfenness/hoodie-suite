<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrape Run Tracker</title>
<style>
:root{--bg:#f7f8fa;--panel:#fff;--panel-2:#f1f3f6;--ink:#1c2330;--muted:#5b6472;--faint:#95a0b0;--line:#e3e7ee;
  --accent:#4E79A7;--accent-soft:#eaf0f7;--good:#3f9b6a;--good-soft:#e7f4ec;--bad:#c1543f;--bad-soft:#f7e9e6;
  --warn:#c98a2b;--inset:#eef1f5;--run:#4E79A7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1319;--panel:#161c25;--panel-2:#1b222d;--ink:#e7ecf3;
  --muted:#9aa6b6;--faint:#66717f;--line:#28313d;--accent:#6b97c9;--accent-soft:#1c2836;--good:#4bb97f;
  --good-soft:#152a20;--bad:#d9694f;--bad-soft:#2a1613;--warn:#d69b45;--inset:#1a212b;--run:#6b97c9}}
:root[data-theme=dark]{--bg:#0f1319;--panel:#161c25;--panel-2:#1b222d;--ink:#e7ecf3;--muted:#9aa6b6;--faint:#66717f;
  --line:#28313d;--accent:#6b97c9;--accent-soft:#1c2836;--good:#4bb97f;--good-soft:#152a20;--bad:#d9694f;
  --bad-soft:#2a1613;--warn:#d69b45;--inset:#1a212b;--run:#6b97c9}
:root[data-theme=light]{--bg:#f7f8fa;--panel:#fff;--panel-2:#f1f3f6;--ink:#1c2330;--muted:#5b6472;--faint:#95a0b0;
  --line:#e3e7ee;--accent:#4E79A7;--accent-soft:#eaf0f7;--good:#3f9b6a;--good-soft:#e7f4ec;--bad:#c1543f;
  --bad-soft:#f7e9e6;--warn:#c98a2b;--inset:#eef1f5;--run:#4E79A7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:22px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
h1{font-size:19px;margin:0;white-space:nowrap}
.live{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--run);margin-right:5px;vertical-align:middle;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sub{color:var(--muted);font-size:13px;margin:4px 0 16px}
.spacer{flex:1}
select,button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
select{min-width:260px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.meta-line{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.meta-line b{color:var(--ink);font-weight:650}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;transition:background .2s}
.stat.flash{animation:flash 900ms ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--panel-2)}}
.stat .label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .value{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.25}
.stat .delta{font-size:11px;margin-top:3px;font-variant-numeric:tabular-nums;color:var(--good)}
.stat .delta.neg{color:var(--bad)}
.progress-row{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.progress-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.progress-head .plabel{font-size:12.5px;color:var(--muted)}
.progress-head .plabel b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:650}
.progress-head .spacer{flex:1}
.progress-head .ppct{font-size:17px;font-weight:750;color:var(--run);font-variant-numeric:tabular-nums}
.bar{position:relative;height:14px;background:var(--inset);border-radius:999px;overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.09)}
.bar i{display:block;height:100%;border-radius:999px;background:var(--run);transition:width .6s ease;
  position:relative;overflow:hidden;min-width:14px}
.bar i::after{content:"";position:absolute;inset:0;background-size:220% 100%;animation:shimmer 2.2s linear infinite;
  background-image:linear-gradient(110deg, transparent 35%, rgba(255,255,255,.4) 50%, transparent 65%)}
.bar i::before{content:"";position:absolute;top:0;right:0;bottom:0;width:2px;background:rgba(255,255,255,.85)}
@keyframes shimmer{0%{background-position:140% 0}100%{background-position:-40% 0}}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.scroller{max-height:62vh;overflow:auto;position:relative}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;font-size:12.8px}
thead th{position:sticky;top:0;background:var(--panel-2);color:var(--muted);text-align:right;font-weight:650;
  padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
thead th:first-child,thead th:nth-child(2){text-align:left}
tbody td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;color:var(--ink)}
tbody td:first-child,tbody td:nth-child(2){text-align:left;color:var(--muted)}
tbody tr:hover{background:var(--accent-soft)}
tbody tr:first-child td{font-weight:650}
tbody tr.row-new{animation:rowIn 1.6s ease-out}
@keyframes rowIn{0%{background:var(--accent-soft)}100%{background:transparent}}
.foot{padding:9px 14px;font-size:12px;color:var(--faint);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.foot .spacer{flex:1}
.foot button{font-size:12px;padding:4px 10px}
.empty{color:var(--muted);text-align:center;padding:50px 0}

/* ── full-dataset panel: the cumulative read across every run ever, not this invocation's own
   in-memory counters (which reset on every process restart — see #latestCard for that). ──────── */
.premise-row{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.premise-row .stat .value{font-size:15px}
.dataset-note{font-size:11px;color:var(--faint);margin-top:8px;font-style:italic}
.map-embed{margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:380px;background:var(--panel-2)}
.map-embed iframe{width:100%;height:100%;border:0;display:block}
.dataset-offline{font-size:12px;color:var(--muted);padding:16px 0;text-align:center}
.err{color:var(--bad);padding:14px;font-size:13px}
.notes{font-size:13px;color:var(--muted);max-height:220px;overflow:auto;line-height:1.65}
.notes p{margin:0 0 8px}
.notes ul{margin:0 0 8px;padding-left:20px}
.notes li{margin:0 0 4px}
.notes ul ul{margin-top:4px}
.notes code{background:var(--inset);border-radius:4px;padding:1px 5px;font-size:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}
.notes strong{color:var(--ink);font-weight:650}
.analytics{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.analytics .aitem .label{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.analytics .aitem .value{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;font-size:14px}
.analytics .aitem .value.warn{color:var(--warn)}
.analytics .aitem .value.stale{color:var(--bad)}

/* ── data preview modal ─────────────────────────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,19,25,.45);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:24px}
.modal-panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;width:min(1100px,100%);
  max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:15px}
.modal-head .spacer{flex:1}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px}
.modal-close:hover{color:var(--ink)}
.modal-body{overflow:auto;flex:1;display:flex;flex-direction:column}

/* ── data grid — csv-previewer visual language (monospace, frozen header + row-number column,
   striped rows) reused for a live look at the FULL tick history, not just the last 250 shown
   in the main table. See apps/csv-viewer.html for the suite's canonical version of this. ──── */
.dg-toolbar{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dg-toolbar input{font:inherit;font-size:12.5px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:6px 10px;width:220px;outline:none}
.dg-toolbar input:focus{border-color:var(--accent)}
.dg-stats{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.dg-scroll{overflow:auto;flex:1}
table.dg-t{border-collapse:separate;border-spacing:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;width:100%}
.dg-t thead th{position:sticky;top:0;z-index:3;background:var(--panel-2);color:var(--muted);font-weight:650;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:7px 10px;border-bottom:1px solid var(--line);
  border-right:1px solid var(--line);white-space:nowrap;text-align:right}
.dg-t thead th:first-child{text-align:center}
.dg-t tbody td{padding:5px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
  white-space:nowrap;text-align:right;color:var(--ink);background:var(--panel)}
.dg-t tbody td:first-child{text-align:center;color:var(--faint);background:var(--inset);font-size:10px}
.dg-t tbody td.txt{text-align:left;color:var(--muted)}
.dg-t tbody tr:nth-child(even) td{background:var(--panel-2)}
.dg-t tbody tr:nth-child(even) td:first-child{background:var(--inset)}
.dg-t tbody tr:hover td{background:var(--accent-soft)}
.dg-empty{padding:40px;text-align:center;color:var(--muted)}
</style>
<div class="wrap">
  <div class="top">
    <h1>Scrape Run Tracker</h1>
    <span class="live" id="live"><span class="dot"></span>loading…</span>
    <span class="spacer"></span>
    <select id="src"></select>
    <button id="refresh" title="Refresh now">↻ Refresh</button>
  </div>
  <p class="sub">Live progress for long-running scrape jobs, parsed straight from the run doc. Updates in place — no page reload.</p>

  <div class="card" id="datasetCard">
    <h2>Full dataset</h2>
    <div class="meta-line" id="datasetMeta">Loading…</div>
    <div class="stats-grid" id="datasetGrid"></div>
    <div class="premise-row" id="premiseRow" style="display:none"></div>
    <div class="dataset-note" id="premiseNote" style="display:none"></div>
    <div class="map-embed" id="mapEmbed" style="display:none"><iframe id="mapFrame" title="Live account coverage" loading="lazy"></iframe></div>
  </div>
  <div class="card" id="latestCard">
    <h2>Latest</h2>
    <div class="meta-line empty" id="metaLine">Loading…</div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>
  <div class="card" id="notesCard" style="display:none">
    <h2>Run notes</h2>
    <div class="notes" id="notes"></div>
    <div class="analytics" id="analytics"></div>
  </div>

  <div class="tablewrap">
    <div class="scroller"><table id="tbl"><thead></thead><tbody><tr><td class="empty">Loading…</td></tr></tbody></table></div>
    <div class="foot" id="foot">
      <span id="footText"></span>
      <span class="spacer"></span>
      <button id="liveDataBtn">▤ Live data</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none">
  <div class="modal-panel">
    <div class="modal-head">
      <h3 id="modalTitle">Live data</h3>
      <span class="spacer"></span>
      <span class="live" id="modalLive"></span>
      <button class="modal-close" id="modalClose" title="Close">×</button>
    </div>
    <div class="modal-body">
      <div class="dg-toolbar">
        <input type="text" id="dgSearch" placeholder="Filter rows…">
        <span class="spacer"></span>
        <span class="dg-stats" id="dgStats"></span>
      </div>
      <div class="dg-scroll" id="dgScroll"><table class="dg-t"><thead id="dgHead"></thead><tbody id="dgBody"></tbody></table></div>
    </div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&lt;",">":"&gt;","&":"&amp;"}[c]||c));

// Known run docs. Add an entry here for every new tracked source — this is the "select the scrape
// source" seam that a future /api/runs/docs endpoint can replace with a live directory listing.
// dataTable is the WAREHOUSE table this source actually lands rows into — that's what the "Live
// data" modal shows (via /api/source), as opposed to `path`, which is just the tick-progress log.
// NOTE: must be a FLAT (non-partitioned) table — /api/source's `warehouse.query()` reads a single
// `<name>.parquet` and can't see date-partitioned tables like `ubereats_products_parts` (confirmed
// live: it 404s). Point at the consolidated table instead; it's the latest *folded-in* snapshot,
// not up-to-the-second, but /api/source has no partitioned-table path today.
const SOURCES=[
  {id:"ubereats", label:"UberEats — fresh-IP catalog run", path:"../docs/ubereats-fresh-ip-run-2026-07-30.md",
   dataTable:"ubereats_products"},
  {id:"doordash", label:"DoorDash — full-catalog chain run", path:"../docs/doordash-full-run-2026-07-30.md",
   dataTable:"doordash_stores"},
];

const sel=$("#src");
SOURCES.forEach(s=>{ const o=document.createElement("option"); o.value=s.id; o.textContent=s.label; sel.appendChild(o); });

// ── tiny markdown renderer — just enough for these docs: **bold**, `code`, and -bullets (one
// level of nesting). Wrapped bullet text (a continuation line with no leading "-") gets folded
// back onto its bullet first, so a paragraph that wraps at ~100 chars in the source doesn't
// split into a stray top-level line. ──────────────────────────────────────────────────────────
function inlineMd(s){
  return s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
}
function mdLite(md){
  const raw=md.split("\n");
  // fold true continuation lines (no leading "-", following an open bullet) onto that bullet
  const merged=[];
  for(const ln of raw){
    if(!ln.trim()) continue;
    const isBullet=/^\s*-\s+/.test(ln);
    if(!isBullet && merged.length && /^\s*-\s+/.test(merged[merged.length-1])){
      merged[merged.length-1]=merged[merged.length-1].replace(/\s+$/,"")+" "+ln.trim();
    } else {
      merged.push(ln);
    }
  }
  let html="", openLevels=0;
  for(const ln of merged){
    const m=ln.match(/^(\s*)-\s+(.*)$/);
    if(m){
      const level=m[1].length>=2 ? 1 : 0;
      while(openLevels<=level){ html+="<ul>"; openLevels++; }
      while(openLevels>level+1){ html+="</ul>"; openLevels--; }
      html+=`<li>${inlineMd(esc(m[2]))}</li>`;
    } else {
      while(openLevels>0){ html+="</ul>"; openLevels--; }
      html+=`<p>${inlineMd(esc(ln.trim()))}</p>`;
    }
  }
  while(openLevels>0){ html+="</ul>"; openLevels--; }
  return html;
}

// A cell is numeric-ish if it's a plain int, or "123/456 (78.9%)", or "78.9%" — reformat the
// integer parts with commas but leave the shape (slash/parens/percent) intact.
function fmtCell(raw){
  const s=raw.trim();
  if(/^-?\d+$/.test(s)) return Number(s).toLocaleString();
  const m=s.match(/^(\d[\d,]*)\s*\/\s*(\d[\d,]*)\s*(\(.*\))?$/);
  if(m){
    const a=Number(m[1].replace(/,/g,"")).toLocaleString();
    const b=Number(m[2].replace(/,/g,"")).toLocaleString();
    return m[3] ? `${a} / ${b} ${m[3]}` : `${a} / ${b}`;
  }
  return s;
}

function parseTable(md){
  const lines=md.split("\n");
  let headerIdx=-1;
  for(let i=lines.length-1;i>=0;i--){
    if(/^\s*\|.*\|\s*$/.test(lines[i]) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1]||"")){
      // walk backward to the FIRST such header (there's only one table in these docs, but be safe)
      headerIdx=i; break;
    }
  }
  if(headerIdx<0) return null;
  const header=lines[headerIdx].split("|").slice(1,-1).map(s=>s.trim());
  const rows=[];
  for(let i=headerIdx+2;i<lines.length;i++){
    const ln=lines[i];
    if(!/^\s*\|.*\|\s*$/.test(ln)) break;
    rows.push(ln.split("|").slice(1,-1).map(s=>s.trim()));
  }
  return {header, rows};
}

function parseNotes(md){
  const m=md.match(/##\s*Where we are\s*\n([\s\S]*?)(?:\n##\s|\n<!--)/);
  return m ? m[1].trim() : null;
}

// Columns that are timing metadata rather than a "metric" worth its own stat tile — surfaced in
// the meta line instead.
const META_COLS=new Set(["local time","run elapsed"]);

const MAX_SHOWN=250;
const POLL_MS=4000;
let state={ srcId:null, chronoRows:[], header:[] };  // what's currently rendered, for diffing

function firstNum(cell){
  const m=(cell||"").match(/^-?\d[\d,]*/);
  return m ? Number(m[0].replace(/,/g,"")) : null;
}

function buildStatTiles(header, curRow, prevRow){
  return header.map((h,i)=>{
    if(META_COLS.has(h.toLowerCase())) return null;
    const value=fmtCell(curRow[i]||"—");
    let delta="", deltaClass="";
    if(prevRow){
      const a=firstNum(curRow[i]), b=firstNum(prevRow[i]);
      if(a!=null && b!=null && a!==b){
        const d=a-b;
        delta=`${d>0?"+":""}${d.toLocaleString()} since last tick`;
        deltaClass=d<0 ? "neg" : "";
      }
    }
    return {label:h, value, delta, deltaClass};
  }).filter(Boolean);
}

function renderStatTiles(tiles){
  const grid=$("#statsGrid");
  const prevValues={};
  grid.querySelectorAll(".stat").forEach(el=>{ prevValues[el.dataset.key]=el.dataset.value; });
  grid.innerHTML=tiles.map(t=>`
    <div class="stat" data-key="${esc(t.label)}" data-value="${esc(t.value)}">
      <div class="label">${esc(t.label)}</div>
      <div class="value">${esc(t.value)}</div>
      ${t.delta?`<div class="delta ${t.deltaClass}">${esc(t.delta)}</div>`:""}
    </div>`).join("");
  grid.querySelectorAll(".stat").forEach(el=>{
    if(prevValues[el.dataset.key]!=null && prevValues[el.dataset.key]!==el.dataset.value){
      el.classList.add("flash");
    }
  });
}

// Finds the first column whose value looks like "A / B (NN%)" — returns the column label, the
// "A / B" fragment, and the percentage, so the progress block can say what it's actually counting
// instead of showing a bare, unlabeled fill.
function progressInfoFromRow(header, row){
  for(let i=0;i<header.length;i++){
    const cell=row[i]||"";
    const m=cell.match(/^(\d[\d,]*\s*\/\s*\d[\d,]*)\s*\((\d+(?:\.\d+)?)%\)/);
    if(m) return {label:header[i], fraction:fmtCell(m[1]), pct:parseFloat(m[2])};
  }
  return null;
}

function renderBar(header, row){
  const info=progressInfoFromRow(header, row);
  const existing=$("#progressRow");
  if(info){
    if(!existing){
      $("#latestCard").insertAdjacentHTML("beforeend", `<div class="progress-row" id="progressRow">
        <div class="progress-head">
          <span class="plabel" id="progressLabel"></span>
          <span class="spacer"></span>
          <span class="ppct" id="progressPct"></span>
        </div>
        <div class="bar"><i id="barI"></i></div>
      </div>`);
    }
    $("#progressLabel").innerHTML=`${esc(info.label)} — <b>${esc(info.fraction)}</b>`;
    $("#progressPct").textContent=info.pct.toFixed(2)+"%";
    $("#barI").style.width=Math.max(1,Math.min(100,info.pct))+"%";
  } else if(existing){
    existing.remove();
  }
}

// ── computed live analytics — throughput, ETA, freshness. The doc's own "Run notes" prose is
// written once at the start of a multi-day run and never updates; these numbers are derived fresh
// from the tick history on every load() so the notes card says something CURRENT, not founding. ──
function parseElapsedMinutes(cell){
  const m=(cell||"").match(/([\d.]+)/);
  return m ? parseFloat(m[1]) : null;
}
function numsFromFraction(cell){
  const m=(cell||"").match(/^(\d[\d,]*)\s*\/\s*(\d[\d,]*)/);
  return m ? {done:Number(m[1].replace(/,/g,"")), total:Number(m[2].replace(/,/g,""))} : null;
}
function fmtMin(m){
  if(m==null || !isFinite(m) || m<0) return "—";
  if(m<1) return Math.round(m*60)+"s";
  if(m<60) return m.toFixed(1)+" min";
  const h=Math.floor(m/60), mm=Math.round(m%60);
  return `${h}h ${mm}m`;
}
// "local time" is HH:MM:SS from the poller's own machine clock — same clock as the browser's, so
// diffing against `now` gives a genuine staleness signal (is this run still actually ticking?).
function secondsSinceTick(localTimeCell){
  const m=(localTimeCell||"").match(/^(\d{1,2}):(\d{2}):(\d{2})$/);
  if(!m) return null;
  const now=new Date();
  const tick=new Date(now.getFullYear(), now.getMonth(), now.getDate(), +m[1], +m[2], +m[3]);
  let diff=(now-tick)/1000;
  if(diff<-3600) diff+=86400;   // tick was just before local midnight
  return Math.max(0, diff);
}

function computeAnalytics(header, rows){
  const cur=rows[rows.length-1];
  const lookback=Math.min(10, rows.length-1);
  const past=lookback>=1 ? rows[rows.length-1-lookback] : null;
  const elapsedCur=parseElapsedMinutes(cur[1]), elapsedPast=past?parseElapsedMinutes(past[1]):null;
  const dtMin=(elapsedCur!=null && elapsedPast!=null) ? (elapsedCur-elapsedPast) : null;

  const throughput=[];
  if(dtMin>0){
    header.forEach((h,i)=>{
      if(META_COLS.has(h.toLowerCase())) return;
      const a=firstNum(cur[i]), b=past?firstNum(past[i]):null;
      if(a!=null && b!=null && a>b) throughput.push({label:h, perMin:(a-b)/dtMin});
    });
  }

  let eta=null;
  if(dtMin>0){
    for(let i=0;i<header.length;i++){
      const curF=numsFromFraction(cur[i]), pastF=past?numsFromFraction(past[i]):null;
      if(curF && pastF && curF.total===pastF.total){
        const rate=(curF.done-pastF.done)/dtMin;
        if(rate>0){ eta={label:header[i], minutes:(curF.total-curF.done)/rate, rate}; break; }
      }
    }
  }

  return {freshnessSec:secondsSinceTick(cur[0]), throughput, eta};
}

function renderAnalytics(header, rows){
  const grid=$("#analytics");
  if(rows.length<2){ grid.innerHTML=""; return; }
  const a=computeAnalytics(header, rows);
  const items=[];
  if(a.freshnessSec!=null){
    const cls=a.freshnessSec>180?"stale":(a.freshnessSec>60?"warn":"");
    items.push({label:"Last tick", value:a.freshnessSec<5?"just now":Math.round(a.freshnessSec)+"s ago", cls});
  }
  if(a.eta){
    items.push({label:`ETA — ${a.eta.label}`, value:"~"+fmtMin(a.eta.minutes)});
    items.push({label:"Current pace", value:Math.round(a.eta.rate).toLocaleString()+" / min"});
  }
  a.throughput
    .filter(t=>!(a.eta && t.label===a.eta.label))
    .slice(0,3)
    .forEach(t=>{
      items.push({label:t.label+" / min", value:(t.perMin>=10?Math.round(t.perMin):t.perMin.toFixed(1)).toLocaleString()});
    });
  grid.innerHTML = items.length
    ? items.map(it=>`<div class="aitem"><div class="label">${esc(it.label)}</div><div class="value ${it.cls||""}">${esc(it.value)}</div></div>`).join("")
    : "";
}

function rowsToTr(rowsNewestFirst){
  return rowsNewestFirst.map(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=r.map(c=>`<td>${esc(fmtCell(c))}</td>`).join("");
    return tr;
  });
}

// Rebuild the whole tbody — used on first load, a source switch, or if the doc's row count ever
// goes backward (file rotated/truncated under us).
function fullRenderTable(header, rows){
  $("#tbl thead").innerHTML="<tr>"+header.map(h=>`<th>${esc(h)}</th>`).join("")+"</tr>";
  const shown=rows.slice(-MAX_SHOWN).reverse();
  const tbody=$("#tbl tbody");
  tbody.innerHTML="";
  tbody.append(...rowsToTr(shown));
}

// Prepend only the ticks that landed since the last poll, preserving scroll position — this is
// what makes the table feel genuinely live instead of a disguised page reload.
function incrementalRenderTable(rows, newCount){
  const scroller=$(".scroller");
  const prevScrollTop=scroller.scrollTop;
  const newChrono=rows.slice(rows.length-newCount);       // oldest-of-new → newest-of-new
  const newDisplay=newChrono.slice().reverse();            // newest-of-new first
  const trs=rowsToTr(newDisplay);
  trs.forEach(tr=>tr.classList.add("row-new"));
  const tbody=$("#tbl tbody");
  tbody.prepend(...trs);
  while(tbody.children.length>MAX_SHOWN){ tbody.lastElementChild.remove(); }
  const addedHeight=trs.reduce((sum,tr)=>sum+tr.offsetHeight,0);
  if(prevScrollTop>4){ scroller.scrollTop=prevScrollTop+addedHeight; }
}

async function load(){
  const src=SOURCES.find(s=>s.id===sel.value)||SOURCES[0];
  const switchingSource=state.srcId!==src.id;
  $("#live").innerHTML=`<span class="dot"></span>${switchingSource?"loading":"tracking"} ${esc(src.label)}…`;
  let text;
  try{
    const r=await fetch(src.path+"?_="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    text=await r.text();
  }catch(e){
    $("#tbl tbody").innerHTML=`<tr><td class="err">Could not load ${esc(src.path)} — ${esc(e.message)}.
      Serve the suite over HTTP (python3 -m http.server) rather than opening via file://.</td></tr>`;
    $("#metaLine").textContent="—";
    $("#statsGrid").innerHTML="";
    $("#live").innerHTML=`<span class="dot" style="background:var(--bad);animation:none"></span>unreachable`;
    return;
  }

  const notes=parseNotes(text);
  if(notes){ $("#notesCard").style.display=""; $("#notes").innerHTML=mdLite(notes); }
  else { $("#notesCard").style.display="none"; }

  const parsed=parseTable(text);
  if(!parsed || !parsed.rows.length){
    $("#tbl tbody").innerHTML='<tr><td class="empty">No progress rows yet.</td></tr>';
    $("#footText").textContent="";
    state={ srcId:src.id, chronoRows:[], header:[] };
    return;
  }
  const {header, rows}=parsed;
  const cur=rows[rows.length-1], prev=rows.length>1?rows[rows.length-2]:null;

  $("#metaLine").className="meta-line";
  $("#metaLine").innerHTML=`<b>${esc(src.label)}</b> · tick at <b>${esc(cur[0]||"—")}</b>`
    + (cur[1]?` · <b>${esc(cur[1])}</b> elapsed`:"");
  renderStatTiles(buildStatTiles(header, cur, prev));
  renderBar(header, cur);
  if(notes) renderAnalytics(header, rows);

  const needsFullRender = switchingSource || !state.chronoRows.length || rows.length<state.chronoRows.length;
  if(needsFullRender){
    fullRenderTable(header, rows);
  } else {
    const newCount=rows.length-state.chronoRows.length;
    if(newCount>0) incrementalRenderTable(rows, newCount);
  }
  state={ srcId:src.id, chronoRows:rows, header };

  const shownCount=Math.min(rows.length, MAX_SHOWN);
  $("#footText").textContent=`Showing latest ${shownCount.toLocaleString()} of ${rows.length.toLocaleString()} logged ticks.`;
  $("#live").innerHTML=`<span class="dot"></span>${esc(src.label)} · updated ${new Date().toLocaleTimeString()}`;
}

// ── full-dataset panel: /api/scrape/dataset reads the CONSOLIDATED <source>_products table + a
// bevalc_chains join, so this is the cumulative book across every run ever — distinct from the
// stat tiles above, which are one invocation's own in-memory counters (e.g. "total rows" there
// resets to 0 on every process restart; see pace/checkpoint notes elsewhere in this run). Same
// "no backend at this origin" degrade as the Live data modal — /api/* needs unifyd/server.py.
const DATASET_POLL_MS=45000;
let datasetSeq=0;

function fmtNum(n){ return n==null ? "—" : Number(n).toLocaleString(); }

async function loadDataset(){
  const src=SOURCES.find(s=>s.id===sel.value)||SOURCES[0];
  const mySeq=++datasetSeq;
  let d;
  try{
    const r=await fetch(`/api/scrape/dataset?source=${encodeURIComponent(src.id)}`, {cache:"no-store"});
    const ct=r.headers.get("content-type")||"";
    if(!ct.includes("application/json")) throw new Error("no /api at this origin");
    d=await r.json();
    if(!r.ok || d.ok===false) throw new Error(d.error||("HTTP "+r.status));
  }catch(e){
    if(mySeq!==datasetSeq) return;
    $("#datasetMeta").textContent="—";
    $("#datasetGrid").innerHTML=`<div class="dataset-offline">Needs the backend — run "python unifyd/server.py" `+
      `from the unifyd/ folder and open this page from ITS port (or view it on the deployed Fly app) `+
      `to see the full-dataset read.</div>`;
    $("#premiseRow").style.display="none"; $("#premiseNote").style.display="none";
    $("#mapEmbed").style.display="none";
    return;
  }
  if(mySeq!==datasetSeq) return;

  $("#datasetMeta").innerHTML=`<b>${esc(src.label)}</b> · cumulative, as of ${new Date(d.as_of*1000).toLocaleTimeString()}`;
  $("#datasetGrid").innerHTML=[
    {label:"Total accounts", value:fmtNum(d.total_accounts)},
    {label:"Total rows (all-time)", value:fmtNum(d.total_rows)},
    {label:"Avg items / store", value:fmtNum(d.avg_items_per_store)},
    {label:"Accounts changed today", value:fmtNum(d.accounts_changed_today)},
  ].map(t=>`<div class="stat"><div class="label">${esc(t.label)}</div><div class="value">${esc(t.value)}</div></div>`).join("");

  if(d.premise){
    const p=d.premise;
    $("#premiseRow").style.display="";
    $("#premiseRow").innerHTML=["on","off"].map(k=>{
      const s=p[k];
      return `<div class="stat"><div class="label">${k==="on"?"On-premise (restaurant)":"Off-premise (retail/liquor)"}</div>`
        +`<div class="value">${fmtNum(s.accounts)} accts</div>`
        +`<div class="delta">${fmtNum(s.rows)} rows · ${fmtNum(s.avg_items)} avg/store</div></div>`;
    }).join("");
    $("#premiseNote").style.display="";
    $("#premiseNote").textContent=p.note;
  } else {
    $("#premiseRow").style.display="none"; $("#premiseNote").style.display="none";
  }

  // Coverage map, scoped to this source — see apps/coverage-map.html's ?source=/?embed= handling.
  const frame=$("#mapFrame");
  const wantSrc=`coverage-map.html?source=${encodeURIComponent(src.id)}&embed=1`;
  if(!frame.src.endsWith(wantSrc)){ frame.src=wantSrc; }
  $("#mapEmbed").style.display="";
}

// ── "Live data" modal — the ACTUAL scraped records (store/item rows), not the tick-progress log
// above. Fetched from /api/source?name=<dataTable>, the suite's existing raw-data-viewer endpoint
// (unifyd/server.py) that queries the warehouse directly and returns newest-first rows. This only
// works when the page is served by the real backend (`python unifyd/server.py`, or the Fly deploy)
// — a bare `python3 -m http.server` has no /api at all, so we fail loud with the exact fix. ────────
let dg={ open:false, table:null, header:[], rows:[], totalCount:0, isNum:null, search:"", timer:null, seq:0 };
const DG_MAX_ROWS=500;
const DG_POLL_MS=6000;

function dgLooksNumeric(rows, key){
  let hits=0, checked=0;
  for(let k=0; k<rows.length && checked<60; k++, checked++){
    const v=rows[k][key];
    if(v==null || typeof v==="number" || /^-?[\d,]+(\.\d+)?%?$/.test(String(v).trim())) hits++;
  }
  return checked>0 && hits/checked>0.7;
}

function dgFmtVal(v){
  if(v==null) return "—";
  if(typeof v==="number") return v.toLocaleString();
  return String(v);
}

function dgRender(){
  const table=SOURCES.find(s=>s.id===sel.value)?.dataTable;
  $("#modalTitle").textContent = table ? `Live data — ${table}` : "Live data";
  if(!dg.header.length){
    $("#dgHead").innerHTML="";
    $("#dgBody").innerHTML=`<tr><td class="dg-empty">${dg.rows.__err ? esc(dg.rows.__err) : "Loading…"}</td></tr>`;
    $("#dgStats").textContent=""; return;
  }
  const q=dg.search.trim().toLowerCase();
  const filtered = !q ? dg.rows : dg.rows.filter(r=>dg.header.some(h=>String(r[h]??"").toLowerCase().includes(q)));
  const clipped=filtered.length>DG_MAX_ROWS;
  const toRender=clipped?filtered.slice(0,DG_MAX_ROWS):filtered;

  $("#dgHead").innerHTML="<tr><th>#</th>"+dg.header.map(h=>`<th>${esc(h)}</th>`).join("")+"</tr>";
  $("#dgBody").innerHTML = toRender.length
    ? toRender.map((r,i)=>"<tr><td>"+(i+1)+"</td>"+dg.header.map(h=>{
        const raw=r[h];
        return `<td class="${dg.isNum[h]?"":"txt"}" title="${esc(raw==null?"":String(raw))}">${esc(dgFmtVal(raw))}</td>`;
      }).join("")+"</tr>").join("")
    : '<tr><td class="dg-empty" colspan="'+(dg.header.length+1)+'">No rows match.</td></tr>';

  $("#dgStats").textContent = clipped
    ? `Showing first ${DG_MAX_ROWS.toLocaleString()} of ${filtered.length.toLocaleString()} matching rows (${dg.totalCount.toLocaleString()} total in warehouse)`
    : q ? `${filtered.length.toLocaleString()} of ${dg.rows.length.toLocaleString()} fetched rows match`
        : `${dg.rows.length.toLocaleString()} fetched · ${dg.totalCount.toLocaleString()} total rows in warehouse`;
}

async function dgFetch(){
  const table=SOURCES.find(s=>s.id===sel.value)?.dataTable;
  if(!table) return;
  const mySeq=++dg.seq;
  $("#modalLive").innerHTML='<span class="dot"></span>loading…';
  const NO_BACKEND_MSG=`This page has no backend at this origin — it's a plain static file server, `+
    `so /api/source doesn't exist here. To see real scraped rows: run "python unifyd/server.py" `+
    `from the unifyd/ folder (it serves both the suite AND /api on one port) and open this page `+
    `from ITS port instead, or view this on the deployed Fly app.`;
  let d, r;
  try{
    r=await fetch(`/api/source?name=${encodeURIComponent(table)}&limit=${DG_MAX_ROWS}`, {cache:"no-store"});
  }catch(e){
    if(mySeq!==dg.seq) return;
    dg.header=[]; dg.rows=Object.assign([], {__err:NO_BACKEND_MSG});
    dgRender();
    $("#modalLive").innerHTML='<span class="dot" style="background:var(--bad);animation:none"></span>unreachable';
    return;
  }
  const ct=r.headers.get("content-type")||"";
  if(!ct.includes("application/json")){
    if(mySeq!==dg.seq) return;
    dg.header=[]; dg.rows=Object.assign([], {__err:NO_BACKEND_MSG});
    dgRender();
    $("#modalLive").innerHTML='<span class="dot" style="background:var(--bad);animation:none"></span>unreachable';
    return;
  }
  try{
    d=await r.json();
    if(!r.ok) throw new Error(d.error || ("HTTP "+r.status));
  }catch(e){
    if(mySeq!==dg.seq) return;
    dg.header=[]; dg.rows=Object.assign([], {__err:`/api/source error — ${e.message}`});
    dgRender();
    $("#modalLive").innerHTML='<span class="dot" style="background:var(--bad);animation:none"></span>unreachable';
    return;
  }
  if(mySeq!==dg.seq) return;
  if(d.error){
    dg.header=[]; dg.rows=Object.assign([], {__err:`${table}: ${d.error}`});
    dgRender();
    $("#modalLive").innerHTML='<span class="dot" style="background:var(--bad);animation:none"></span>error';
    return;
  }
  dg.table=table; dg.rows=d.rows||[]; dg.totalCount=d.count||0;
  dg.header=d.columns||(dg.rows[0]?Object.keys(dg.rows[0]):[]);
  dg.isNum=Object.fromEntries(dg.header.map(h=>[h, dgLooksNumeric(dg.rows, h)]));
  dgRender();
  $("#modalLive").innerHTML=`<span class="dot"></span>updated ${new Date().toLocaleTimeString()}`;
}

$("#dgSearch").addEventListener("input", e=>{ dg.search=e.target.value; dgRender(); });

function openModal(){
  dg.open=true;
  $("#modalOverlay").style.display="flex";
  dgFetch();
  if(dg.timer) clearInterval(dg.timer);
  dg.timer=setInterval(dgFetch, DG_POLL_MS);
  $("#dgSearch").focus();
}
function closeModal(){
  dg.open=false;
  $("#modalOverlay").style.display="none";
  if(dg.timer){ clearInterval(dg.timer); dg.timer=null; }
}
$("#liveDataBtn").addEventListener("click", openModal);
$("#modalClose").addEventListener("click", closeModal);
$("#modalOverlay").addEventListener("click", e=>{ if(e.target.id==="modalOverlay") closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });
sel.addEventListener("change", ()=>{ if(dg.open) dgFetch(); });

sel.addEventListener("change", load);
sel.addEventListener("change", loadDataset);
$("#refresh").addEventListener("click", load);
$("#refresh").addEventListener("click", loadDataset);
sel.value=SOURCES[0].id;
load();
loadDataset();
setInterval(load, POLL_MS);
setInterval(loadDataset, DATASET_POLL_MS);
</script>

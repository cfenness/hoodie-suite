<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Console — Hoodie Suite</title>
<link rel="stylesheet" href="../suite.css">
<style>
  :root{ --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper,#F4F6F5);color:var(--ink,#243330);font-family:var(--font);font-size:13px}
  a{color:var(--amber-deep,#3D6089);text-decoration:none} a:hover{text-decoration:underline}
  .ahead{background:#fff;border-bottom:1px solid var(--hair,#D7DDDB);padding:12px 20px 0}
  .ahead .t{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .ahead .mk{width:28px;height:28px;border-radius:6px;background:var(--amber,#4E79A7);color:#fff;display:grid;place-items:center;font-weight:800}
  .ahead h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
  .ahead .sub{font-size:12px;color:var(--ink-soft,#5E6B68)}
  .tabs{display:flex;gap:2px}
  .tabs button{border:0;background:none;font:inherit;font-weight:600;font-size:13px;color:var(--ink-soft,#5E6B68);padding:10px 15px 9px;border-bottom:3px solid transparent;cursor:pointer}
  .tabs button:hover{color:var(--amber,#4E79A7)}
  .tabs button.on{color:var(--amber,#4E79A7);border-bottom-color:var(--amber,#4E79A7)}
  .tabs .tbadge{display:none} .tabs .tbadge:not(:empty){display:inline-block;margin-left:5px;font-size:10px;font-weight:800;background:var(--warn,#B8791F);color:#fff;border-radius:999px;padding:0 6px;vertical-align:1px}
  .amodal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(20,30,28,.42);padding:16px}
  .amodal.show{display:flex}
  .amodal .box{background:#fff;border:1px solid var(--hair,#D7DDDB);border-radius:12px;width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:0 24px 60px -18px rgba(20,30,28,.4)}
  .amodal .bh{padding:16px 20px 4px} .amodal .bh h3{margin:0;font-size:16px;font-weight:800}
  .amodal .bb{padding:8px 20px 4px;font-size:13.5px;line-height:1.55}
  .amodal ol{margin:6px 0 4px;padding-left:20px} .amodal li{margin-bottom:10px}
  .amodal code{background:var(--panel,#EAEEED);border-radius:4px;padding:1px 6px;font-family:var(--mono);font-size:12px}
  .amodal .cmd{background:#243330;color:#EAF3F0;border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12px;margin:6px 0;overflow-x:auto;white-space:pre}
  .amodal .bf{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px}
  .amodal .note{background:var(--slate-tint,#DCE4EC);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--ink,#243330);margin-top:6px}
  .page{max-width:1180px;margin:0 auto;padding:18px 20px 50px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--hair,#D7DDDB);border-radius:10px;padding:13px 15px}
  .kpi .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft,#5E6B68);font-weight:700}
  .kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .d{font-size:11.5px;color:var(--ink-soft,#5E6B68);margin-top:2px}
  .kpi .v.ok{color:var(--good,#2E7D57)} .kpi .v.warn{color:var(--warn,#B8791F)}
  .card{background:#fff;border:1px solid var(--hair,#D7DDDB);border-radius:10px;padding:15px 16px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
  .card h2 .s{font-weight:500;font-size:12px;color:var(--ink-soft,#5E6B68)}
  .bars{display:flex;flex-direction:column;gap:7px}
  .bar{display:grid;grid-template-columns:150px 1fr 52px;align-items:center;gap:10px;font-size:12.5px}
  .bar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .tr{background:var(--panel,#EAEEED);border-radius:5px;height:16px;overflow:hidden}
  .bar .tr i{display:block;height:100%;background:var(--amber,#4E79A7);border-radius:5px}
  .bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink,#243330)}
  .days{display:flex;gap:4px} .days button{border:1px solid var(--hair,#D7DDDB);background:#fff;border-radius:6px;padding:4px 9px;font:inherit;font-size:11.5px;cursor:pointer;color:var(--ink-soft,#5E6B68)}
  .days button.on{background:var(--ink,#243330);color:#fff;border-color:var(--ink,#243330)}
  .daycols{display:flex;align-items:flex-end;gap:3px;height:90px;padding-top:6px}
  .daycols .dc{flex:1;background:var(--amber,#4E79A7);border-radius:3px 3px 0 0;min-height:2px;position:relative;opacity:.85}
  .daycols .dc:hover{opacity:1}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px} @media(max-width:820px){.row2{grid-template-columns:1fr}}
  .fld{display:flex;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--panel,#EAEEED)}
  .fld .k{width:150px;color:var(--ink-soft,#5E6B68)} .fld .v{font-weight:600}
  .pill{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid}
  .pill.on{color:var(--good,#2E7D57);border-color:var(--good,#2E7D57)} .pill.off{color:var(--ink-soft,#5E6B68);border-color:var(--hair,#D7DDDB)}
  .btn{border:1px solid var(--hair,#D7DDDB);background:#fff;color:var(--amber-deep,#3D6089);border-radius:7px;padding:7px 13px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
  .btn:hover{background:var(--panel,#EAEEED)} .btn.brand{background:var(--amber,#4E79A7);border-color:var(--amber,#4E79A7);color:#fff} .btn.brand:hover{filter:brightness(1.05)}
  .muted{color:var(--ink-soft,#5E6B68)} .chips{display:flex;flex-wrap:wrap;gap:6px}
  .em{padding:26px;text-align:center;color:var(--ink-soft,#5E6B68);font-family:var(--mono);font-size:12px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(18px);background:var(--ink,#243330);color:#fff;font-size:13px;padding:10px 16px;border-radius:8px;opacity:0;transition:all .2s;z-index:100;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  --hg-accent:var(--amber);
</style>
</head>
<body>
<div class="ahead">
  <div class="t"><span class="mk">AD</span><div><h1>Admin Console</h1><div class="sub">Usage · app registry & flags · access · data-ops — for the whole suite</div></div></div>
  <div class="tabs" id="tabs">
    <button data-t="overview" class="on">Overview</button>
    <button data-t="usage">Usage</button>
    <button data-t="apps">Apps</button>
    <button data-t="access">Access</button>
    <button data-t="service">Service <span class="tbadge" id="svc-badge"></span></button>
    <button data-t="ops">Data ops</button>
  </div>
</div>
<div class="page" id="page"></div>
<div class="toast" id="toast"></div>

<script src="../datagrid.js"></script>
<script>
(function(){
  var API="", tab="overview", usageDays=30, REG=[], FLAGS={apps:{},features:{}}, appsGrid=null;
  var byId={};
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove("show");},1900);}
  function getJSON(p){return fetch(API+p,{cache:"no-store",headers:{Accept:"application/json"}}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
  function fmt(n){return (n==null)?"—":Number(n).toLocaleString();}
  function money(n){return (n==null)?"—":"$"+(Math.abs(n)>=1e6?(n/1e6).toFixed(1)+"M":Number(n).toLocaleString());}
  function nameOf(id){return (byId[id]&&byId[id].name)||id;}

  var page=document.getElementById("page");
  document.querySelectorAll("#tabs button").forEach(function(b){ b.onclick=function(){ tab=b.dataset.t;
    document.querySelectorAll("#tabs button").forEach(function(x){x.classList.toggle("on",x===b);}); render(); }; });

  function render(){
    if(tab==="overview")return renderOverview();
    if(tab==="usage")return renderUsage();
    if(tab==="apps")return renderApps();
    if(tab==="access")return renderAccess();
    if(tab==="service")return renderService();
    if(tab==="ops")return renderOps();
  }

  /* ---------- Overview ---------- */
  function renderOverview(){
    page.innerHTML='<div class="kpis" id="kpis"></div><div class="card"><h2>Most-opened apps <span class="s">· last 30 days</span></h2><div id="ov-top" class="bars"><div class="em">Loading…</div></div></div>';
    Promise.all([getJSON("/api/admin/overview").catch(function(){return null;}),
                 getJSON("/api/usage/summary?days=30").catch(function(){return null;})])
     .then(function(res){
       var o=res[0]||{}, u=res[1]||{};
       var cards=[
         ["Opens · 7d", fmt(o.opens7d), (u.totalAllTime!=null?fmt(u.totalAllTime)+" all-time":""), ""],
         ["Active users · 7d", fmt(o.activeUsers7d), "distinct", ""],
         ["Apps live", String(REG.filter(function(a){return a.status==="live";}).length)+" / "+REG.length, "live / total", ""],
         ["Open service reports", fmt(o.openReports), "data-quality", (o.openReports>0?"warn":"")],
         ["Book value", money(o.bookValue), "synthetic", ""],
         ["API", o.apiOk?"live":"down", (o.warehouse?"warehouse on":"local"), o.apiOk?"ok":"warn"],
       ];
       document.getElementById("kpis").innerHTML=cards.map(function(c){
         return '<div class="kpi"><div class="k">'+esc(c[0])+'</div><div class="v '+(c[3]||"")+'">'+esc(c[1])+'</div><div class="d">'+esc(c[2])+'</div></div>';
       }).join("");
       var top=(u.byApp||[]).slice(0,8), max=top.length?top[0][1]:1;
       document.getElementById("ov-top").innerHTML= top.length? top.map(function(r){
         return '<div class="bar"><span class="lb">'+esc(nameOf(r[0]))+'</span><span class="tr"><i style="width:'+Math.max(3,Math.round(100*r[1]/max))+'%"></i></span><span class="n">'+fmt(r[1])+'</span></div>';
       }).join("") : '<div class="em">No usage yet — open a few apps and it lands here.</div>';
     });
  }

  /* ---------- Usage ---------- */
  function renderUsage(){
    page.innerHTML='<div class="card"><h2>Usage <span class="s">· app opens</span><span style="flex:1"></span><span class="days" id="days"></span></h2>'
      +'<div id="us-by-day"></div></div>'
      +'<div class="row2"><div class="card"><h2>Opens by app</h2><div id="us-app"></div></div>'
      +'<div class="card"><h2>Opens by user</h2><div id="us-user"></div></div></div>';
    var days=document.getElementById("days");
    [7,30,90].forEach(function(d){ var b=document.createElement("button"); b.textContent=d+"d"; b.className=(d===usageDays?"on":"");
      b.onclick=function(){usageDays=d;renderUsage();}; days.appendChild(b); });
    getJSON("/api/usage/summary?days="+usageDays).then(function(u){
      // by day columns
      var bd=u.byDay||[], mx=bd.reduce(function(m,r){return Math.max(m,r[1]);},1);
      document.getElementById("us-by-day").innerHTML= bd.length
        ? '<div class="daycols">'+bd.map(function(r){return '<div class="dc" style="height:'+Math.max(3,Math.round(100*r[1]/mx))+'%" title="'+esc(r[0])+': '+r[1]+'"></div>';}).join("")+'</div>'
          +'<div class="muted" style="font-size:11px;margin-top:6px">'+esc(bd[0][0])+' → '+esc(bd[bd.length-1][0])+' · '+fmt(u.totalOpens)+' opens</div>'
        : '<div class="em">No opens in this window.</div>';
      // by app grid
      var maxA=(u.byApp&&u.byApp[0])?u.byApp[0][1]:1;
      HoodieGrid.mount(document.getElementById("us-app"),{ idKey:"app", search:false, columnChooser:false,
        rows:(u.byApp||[]).map(function(r){return {app:nameOf(r[0]),opens:r[1]};}),
        columns:[{key:"app",label:"App",type:"text",sortable:true},{key:"opens",label:"Opens",type:"heatmap",sortable:true,heatMid:0,heatMax:maxA}],
        emptyText:"No opens yet." });
      HoodieGrid.mount(document.getElementById("us-user"),{ idKey:"user", search:false, columnChooser:false,
        rows:(u.byUser||[]).map(function(r){return {user:r[0],opens:r[1]};}),
        columns:[{key:"user",label:"User",type:"text",sortable:true},{key:"opens",label:"Opens",type:"num",sortable:true}],
        emptyText:"No users yet." });
    }).catch(function(){ page.querySelector(".card").innerHTML='<div class="em">Usage store offline — start the engine (./dev.sh).</div>'; });
  }

  /* ---------- Apps (registry + flags) ---------- */
  function renderApps(){
    page.innerHTML='<div class="card"><h2>App registry <span class="s">· edit status + visibility via the ⋯ menu (feature flags · no deploy)</span></h2><div id="apps-grid"></div></div>';
    var rows=REG.map(function(a){ var f=FLAGS.apps[a.id]||{}; var hidden=!!f.hidden;
      return {id:a.id,name:a.name,group:a.group||"—",status:(f.status||a.status),visibility:hidden?"Hidden":"Visible",_hidden:hidden}; });
    appsGrid=HoodieGrid.mount(document.getElementById("apps-grid"),{ idKey:"id", search:true, columnChooser:true,
      rows:rows,
      statusTones:{ live:"good", beta:"warn", internal:"muted", Visible:"good", Hidden:"crit" },
      columns:[
        {key:"name",label:"App",type:"text",sortable:true},
        {key:"group",label:"Group",type:"text",sortable:true},
        {key:"status",label:"Status",type:"status"},
        {key:"visibility",label:"In launcher",type:"status"},
        {key:"id",label:"ID",type:"text"},
      ],
      rowActions:[{id:"live",label:"Set status: Live"},{id:"beta",label:"Set status: Beta"},{id:"internal",label:"Set status: Internal"},
                  {id:"hide",label:"Hide from launcher"},{id:"show",label:"Show in launcher"}],
      onRowAction:function(action,row){
        var f=FLAGS.apps[row.id]=FLAGS.apps[row.id]||{};
        var msg;
        if(action==="hide"||action==="show"){ f.hidden=(action==="hide"); msg=row.name+(action==="hide"?" hidden":" shown"); }
        else { f.status=action; msg=row.name+" → "+action; }
        fetch(API+"/api/admin/flags",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({apps:FLAGS.apps})})
          .then(function(r){if(!r.ok)throw 0;return r.json();})
          .then(function(){ toast(msg+" — reload the launcher to see it"); renderApps(); })
          .catch(function(){ toast("Save failed — is the engine live?"); });
      },
      emptyText:"No apps." });
  }

  /* ---------- Access ---------- */
  function renderAccess(){
    page.innerHTML='<div class="card" id="acc"><div class="em">Loading…</div></div>';
    getJSON("/api/admin/access").then(function(a){
      var allow=a.allowlist||[], seen=a.seenUsers||[];
      document.getElementById("acc").innerHTML=
        '<h2>Access &amp; users <span style="flex:1"></span><button class="btn" id="add-user-help">＋ How to add a user</button></h2>'
        +'<div class="fld"><span class="k">Login gate</span><span class="v"><span class="pill '+(a.gated?"on":"off")+'">'+(a.gated?"active":"open (dev)")+'</span></span></div>'
        +'<div class="fld"><span class="k">You are</span><span class="v">'+esc(a.currentUser||"— (ungated)")+'</span></div>'
        +'<div class="fld" style="border:0"><span class="k">Allowlist</span><span class="v">'+(allow.length?'<span class="chips">'+allow.map(function(e){return '<span class="pill on">'+esc(e)+'</span>';}).join("")+'</span>':'<span class="muted">none set — everyone allowed. Set <code>ALLOWED_EMAILS</code> to lock it down.</span>')+'</span></div>'
        +'<h2 style="margin-top:16px">Seen users <span class="s">· from usage</span></h2>'
        +(seen.length?'<div class="chips">'+seen.map(function(u){return '<span class="pill off">'+esc(u)+'</span>';}).join("")+'</div>':'<div class="muted">No sign-ins recorded yet.</div>')
        +'<div class="muted" style="font-size:11.5px;margin-top:14px">The allowlist is set server-side via the <code>ALLOWED_EMAILS</code> secret — edit it with <code>fly secrets set</code> (kept out of the browser by design). Need the steps? Hit <b>How to add a user</b>.</div>';
      var help=document.getElementById("add-user-help"); if(help)help.onclick=function(){ showAddUser(a); };
    }).catch(function(){ document.getElementById("acc").innerHTML='<div class="em">Access store offline — start the engine.</div>'; });
  }
  function showAddUser(a){
    var cur=(a&&a.allowlist&&a.allowlist.length)?a.allowlist.join(","):"you@company.com";
    openModal(
      '<div class="bh"><h3>Add a user to the suite</h3></div>'+
      '<div class="bb"><p class="muted" style="margin:2px 0 10px">Access is a Google-login allowlist. Adding someone = adding their Google email to the <code>ALLOWED_EMAILS</code> secret, then they sign in with Google.</p>'+
      '<ol>'+
        '<li><b>Get their Google email</b> — the address they’ll sign in with (Gmail or Google Workspace).</li>'+
        '<li><b>Add it to the allowlist secret</b> — comma-separated, no spaces:'+
          '<div class="cmd">fly secrets set ALLOWED_EMAILS="'+esc(cur)+',newperson@company.com"</div>'+
          'This redeploys the app with the new allowlist.</li>'+
        '<li><b>Tell them to sign in</b> at <code>hoodie-suite.fly.dev</code> with that Google account. First visit bounces to Google; approved emails land in the suite.</li>'+
        '<li><b>2FA is automatic</b> — it rides their Google account. Ask them to have 2-Step Verification / a passkey on in Google.</li>'+
      '</ol>'+
      '<div class="note">To remove someone, re-run the command without their email. Whole-domain access isn’t supported — list emails explicitly.</div>'+
      '</div>'+
      '<div class="bf"><button class="btn brand" data-mclose>Got it</button></div>'
    );
  }

  /* ---------- Service (data-quality reports — moved here from the CRM) ---------- */
  var SVC_TONE={open:{bg:'#FBEED0',fg:'#8a5a0f'},acknowledged:{bg:'#E3EDF6',fg:'#33597e'},reported:{bg:'#F3E4CE',fg:'#8a5a0f'},resolved:{bg:'#DDEEE2',fg:'#2E7D57'}};
  function svcPill(st){var t=SVC_TONE[st]||SVC_TONE.open;return '<span class="pill" style="border:0;background:'+t.bg+';color:'+t.fg+';text-transform:capitalize">'+esc(st||'open')+'</span>';}
  function svcWhen(ms){if(!ms)return '—';var d=new Date(ms);return d.toISOString().slice(0,10)+' · '+d.toTimeString().slice(0,5);}
  function svcSet(id,status){
    fetch(API+"/api/service/reports/"+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:status,by:"ops"})})
      .then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(){ renderService(); toast("Report → "+status); }).catch(function(){ toast("Update failed — is the engine live?"); });
  }
  function renderService(){
    page.innerHTML='<div class="card"><h2>Service · data-quality reports <span class="s">· filed from the suite (a degraded pill in Hoodie Pulls)</span><span style="flex:1"></span><button class="btn" id="svc-refresh">Refresh</button></h2><div id="svc-body"><div class="em">Loading…</div></div></div>';
    document.getElementById("svc-refresh").onclick=renderService;
    getJSON("/api/service/reports").then(function(d){
      var reports=(d&&d.reports)||[], counts=(d&&d.counts)||{}, body=document.getElementById("svc-body");
      var badge=document.getElementById("svc-badge"); if(badge)badge.textContent=counts.open?counts.open:"";
      if(!reports.length){ body.innerHTML='<div class="em">No reports yet. When a scrape self-reports <b>degraded</b>, click the pill in Hoodie Pulls to file one — it lands here.</div>'; return; }
      var cc=["open","acknowledged","reported","resolved"].filter(function(s){return counts[s];}).map(function(s){return counts[s]+" "+s;}).join(" · ");
      var td='padding:8px 10px;border-bottom:1px solid var(--panel)';
      body.innerHTML='<div class="muted" style="margin-bottom:10px">'+reports.length+" report"+(reports.length===1?"":"s")+(cc?" — "+cc:"")+'</div>'
        +'<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">'
        +'<thead><tr>'+["Source","Severity","What flagged","Reporter","Reported","Status","Action"].map(function(h){return '<th style="text-align:left;font-size:11px;color:var(--ink-soft);padding:7px 10px;border-bottom:1px solid var(--hair)">'+h+'</th>';}).join("")+'</tr></thead><tbody>'
        + reports.map(function(r){
            var warn=(r.warnings&&r.warnings.length)?(r.warnings.length+" warning"+(r.warnings.length===1?"":"s")+(r.note?" · "+esc(r.note):"")):(r.note?esc(r.note):'<span class="muted">self-reported</span>');
            var nx = r.status==="open"?'<button class="btn" data-svc="'+r.id+'" data-to="acknowledged">Acknowledge</button>'
                   : r.status==="acknowledged"?'<button class="btn" data-svc="'+r.id+'" data-to="reported">Mark reported</button>'
                   : r.status==="reported"?'<button class="btn brand" data-svc="'+r.id+'" data-to="resolved">Resolve</button>'
                   : '<span style="color:var(--good);font-weight:700">✓ resolved</span>';
            return '<tr><td style="'+td+'"><b>'+esc(r.source||r.connId||"—")+'</b></td>'
              +'<td style="'+td+'"><span class="pill off" style="text-transform:capitalize">'+esc(r.severity||"degraded")+'</span></td>'
              +'<td style="'+td+';max-width:280px">'+warn+'</td>'
              +'<td style="'+td+'">'+esc(r.reporter||"field")+'</td>'
              +'<td style="'+td+';white-space:nowrap;color:var(--ink-soft)">'+svcWhen(r.createdAt)+'</td>'
              +'<td style="'+td+'">'+svcPill(r.status)+'</td>'
              +'<td style="'+td+';text-align:right">'+nx+'</td></tr>';
          }).join("") + '</tbody></table></div>';
      body.querySelectorAll("[data-svc]").forEach(function(b){ b.onclick=function(){ svcSet(b.getAttribute("data-svc"), b.getAttribute("data-to")); }; });
    }).catch(function(){ document.getElementById("svc-body").innerHTML='<div class="em">Service store offline — start the engine (./dev.sh).</div>'; });
  }

  function renderOps(){
    page.innerHTML='<div class="kpis" id="ops-kpis"></div>'
      +'<div class="card"><h2>Operations</h2>'
      +'<div class="fld"><span class="k">API</span><span class="v" id="op-api">…</span></div>'
      +'<div class="fld"><span class="k">Warehouse</span><span class="v" id="op-wh">…</span></div>'
      +'<div class="fld"><span class="k">Canonical book</span><span class="v" id="op-book">…</span></div>'
      +'<div class="fld" style="border:0"><span class="k">Quick links</span><span class="v"><a id="ql-svc" style="cursor:pointer;text-decoration:underline">Service reports</a> · <a href="../index.html#mdm">Hoodie MDM</a> · <a href="../index.html#estate3d">Estate</a></span></div>'
      +'<div style="margin-top:12px;display:flex;gap:8px"><button class="btn brand" id="op-seed">Rebuild the book</button><button class="btn" id="op-refresh">Refresh</button></div></div>';
    getJSON("/api/admin/overview").then(function(o){
      document.getElementById("ops-kpis").innerHTML=[
        ["Recent runs",fmt(o.runs),"scrape history"],
        ["Open reports",fmt(o.openReports),"service desk"],
        ["Planograms",fmt(o.planograms),"per-account"],
        ["Book value",money(o.bookValue),"synthetic"],
      ].map(function(c){return '<div class="kpi"><div class="k">'+c[0]+'</div><div class="v">'+c[1]+'</div><div class="d">'+c[2]+'</div></div>';}).join("");
      document.getElementById("op-api").innerHTML=o.apiOk?'<span class="pill on">live</span>':'<span class="pill off">down</span>';
      document.getElementById("op-wh").innerHTML=o.warehouse?'<span class="pill on">on</span>':'<span class="pill off">local disk</span>';
      document.getElementById("op-book").textContent=o.bookValue!=null?money(o.bookValue):"not built — hit Rebuild";
    }).catch(function(){ document.getElementById("op-api").innerHTML='<span class="pill off">engine offline</span>'; });
    document.getElementById("op-refresh").onclick=renderOps;
    var qs=document.getElementById("ql-svc"); if(qs)qs.onclick=function(){ tab="service"; document.querySelectorAll("#tabs button").forEach(function(x){x.classList.toggle("on",x.dataset.t==="service");}); render(); };
    document.getElementById("op-seed").onclick=function(){ var b=this; b.disabled=true; b.textContent="Rebuilding…";
      fetch(API+"/api/seed/build",{method:"POST"}).then(function(r){return r.ok?r.json():Promise.reject();})
        .then(function(){ toast("Book rebuilt"); renderOps(); })
        .catch(function(){ toast("Rebuild failed — is the engine live?"); b.disabled=false; b.textContent="Rebuild the book"; }); };
  }

  /* ---------- modal (for the "how to add a user" walkthrough) ---------- */
  var modalHost=document.createElement("div"); modalHost.className="amodal"; document.body.appendChild(modalHost);
  modalHost.addEventListener("click",function(e){ if(e.target===modalHost||e.target.closest("[data-mclose]")) closeModal(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeModal(); });
  function openModal(html){ modalHost.innerHTML='<div class="box" role="dialog" aria-modal="true">'+html+'</div>'; modalHost.classList.add("show"); }
  function closeModal(){ modalHost.classList.remove("show"); modalHost.innerHTML=""; }

  /* ---------- boot: load registry + flags, then render ---------- */
  Promise.all([
    getJSON("/api/admin/flags").catch(function(){return {flags:{apps:{},features:{}}};}),
    fetch("../apps.registry.json").then(function(r){return r.ok?r.json():{apps:[]};}).catch(function(){return {apps:[]};})
  ]).then(function(res){
    FLAGS=(res[0]&&res[0].flags)||{apps:{},features:{}}; if(!FLAGS.apps)FLAGS.apps={};
    REG=(res[1]&&res[1].apps)||[]; REG.forEach(function(a){byId[a.id]=a;});
    render();
  });
  /* surface the open service-report count on the Service tab badge */
  getJSON("/api/service/reports?status=open").then(function(d){ var b=document.getElementById("svc-badge"); if(b&&d&&d.counts&&d.counts.open)b.textContent=d.counts.open; }).catch(function(){});
})();
</script>
<script src="../suite-header.js" data-id="admin" data-mark="AD" data-name="Admin Console" data-status="internal"></script>
</body>

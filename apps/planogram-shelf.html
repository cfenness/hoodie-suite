<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planogram</title>
<style>
  :root{
    --ink:#1a2332; --paper:#ffffff; --panel:#f3f5f8; --line:#d9dee5; --muted:#6b7684; --accent:#c17a2b;
    --edge:#2b3644;
    --c-whiskey:#c3e0b5; --c-rum:#bcd6ee; --c-tequila:#f0d9c0; --c-vodka:#e0cce8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--panel);color:var(--ink);
    font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:30px 26px 72px}

  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
  .fl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper)}
  .seg button{border:0;background:var(--paper);color:var(--muted);font:inherit;font-size:13px;padding:8px 15px;cursor:pointer}
  .seg button.on{background:var(--ink);color:#fff}.seg button:not(.on):hover{background:var(--panel)}

  /* fixture: white, airy, bottles resting on dark rules — matches the mock */
  .fixture{padding:8px 2px 2px;overflow-x:auto}
  .inner{min-width:860px}
  .shelf{display:grid;grid-template-columns:110px 1fr;margin-bottom:30px}
  .shelf:last-child{margin-bottom:8px}
  .tier{grid-row:1;grid-column:1;align-self:center;font-size:17px;color:var(--ink);font-weight:400}
  .run{grid-row:1;grid-column:2;display:flex;align-items:flex-end;flex-wrap:nowrap;gap:2px;padding-bottom:2px}
  .rule{grid-row:2;grid-column:2;height:4px;background:var(--edge);border-radius:2px;margin-top:2px}
  .facing{display:inline-flex;align-items:flex-end;animation:pop .26s ease both}
  .facing svg{height:82px;width:auto;display:block}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.95)}to{opacity:1;transform:none}}

  /* summary table — under the shelves, like the mock */
  .tablewrap{margin-top:34px;max-width:760px}
  table{border-collapse:collapse;width:100%}
  th,td{border:1px solid #cfd5dd;padding:11px 16px;font-size:14px}
  thead th{background:var(--paper)}
  th.corner{background:var(--paper)}
  th.cat{text-align:left;font-weight:700;color:var(--ink)}
  th.cat .sw{display:inline-block;width:16px;height:16px;border:2px solid var(--edge);border-radius:3px;vertical-align:-3px;margin-right:8px}
  td.rowlab{text-align:left;font-weight:500;color:var(--ink)}
  td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}

  .caption{font-size:12.5px;color:var(--muted);margin-top:16px;max-width:760px}
</style>
</head>
<body>
<div class="wrap">
  <div class="filters">
    <span class="fl">Market</span>
    <div class="seg" id="market">
      <button class="on" data-k="houston">Houston, TX</button>
      <button data-k="miami">Miami, FL</button>
      <button data-k="dallas">Dallas, TX</button>
      <button data-k="chicago">Chicago, IL</button>
    </div>
  </div>

  <div class="fixture"><div class="inner" id="inner"></div></div>

  <div class="tablewrap"><table id="tbl"></table></div>
  <p class="caption" id="cap"></p>
</div>

<script>
const SHAPE={
  flask:`<rect x="20" y="6" width="8" height="4" rx="1"/><path d="M21 10 L21 15 Q21 16 20 16.5 Q15 18 15 23 L15 41 Q15 43 17 43 L31 43 Q33 43 33 41 L33 23 Q33 18 28 16.5 Q27 16 27 15 L27 10 Z"/>`,
  tall:`<rect x="20.5" y="4" width="7" height="4" rx="1"/><path d="M21 8 L21 15 Q21 17 19.5 18 Q17 19.5 17 24 L17 41 Q17 43 19 43 L29 43 Q31 43 31 41 L31 24 Q31 19.5 28.5 18 Q27 17 27 15 L27 8 Z"/><path d="M17.4 27.5 L30.6 27.5" fill="none"/>`,
  tapered:`<rect x="21" y="5" width="6" height="4" rx="1"/><path d="M21.5 9 L21.5 16 Q21.5 18 20.5 19 Q18.5 21 18 25 L16.5 41 Q16.5 43 18.5 43 L29.5 43 Q31.5 43 31.5 41 L30 25 Q29.5 21 27.5 19 Q26.5 18 26.5 16 L26.5 9 Z"/>`,
  wine:`<rect x="21.5" y="4" width="5" height="4" rx="0.5"/><path d="M22 8 L22 17 Q22 18 21 19 Q17.5 22 17.5 27 L17.5 42 Q17.5 43 18.5 43 L29.5 43 Q30.5 43 30.5 42 L30.5 27 Q30.5 22 27 19 Q26 18 26 17 L26 8 Z"/>`,
};
const CATS=['Whiskey','Rum','Tequila','Vodka'];
const CAT={
  Whiskey:{shape:'flask',  color:'var(--c-whiskey)', label:'W'},
  Rum:    {shape:'tall',   color:'var(--c-rum)',     label:'R'},
  Tequila:{shape:'tapered',color:'var(--c-tequila)', label:'T'},
  Vodka:  {shape:'wine',   color:'var(--c-vodka)',   label:'V'},
};
const TIERS=['Stretch','Eye Level','Reach'];
// Directional regional demand — encodes real bev-alc skew (illustrative, not sourced):
// Houston/Dallas index whiskey+tequila (TX + Hispanic share); Miami indexes rum+vodka
// (Caribbean/Latin + nightlife); Chicago indexes whiskey+vodka (Midwest base).
// Values are category totals across the whole fixture (all three shelves).
const MARKET={
  houston:{name:'Houston, TX', totals:{Whiskey:21, Rum:8,  Tequila:18, Vodka:13}},
  miami:  {name:'Miami, FL',   totals:{Whiskey:8,  Rum:21, Tequila:13, Vodka:18}},
  dallas: {name:'Dallas, TX',  totals:{Whiskey:27, Rum:5,  Tequila:16, Vodka:12}},
  chicago:{name:'Chicago, IL', totals:{Whiskey:21, Rum:8,  Tequila:10, Vodka:21}},
};
// Shelf-tier profile: how each category distributes up the fixture [Stretch, Eye Level, Reach].
// Eye level is the strike zone (prime real estate) — premium/high-velocity categories
// concentrate there; value/mixer categories carry more weight down at Reach.
const TIER_PROFILE={
  Whiskey:[0.28,0.44,0.28],  // premium bourbon strike-zone heavy, some well whiskey low
  Tequila:[0.34,0.42,0.24],  // premium añejo/repo skews up, little value
  Vodka:  [0.24,0.34,0.42],  // broad base, big value handles ride the bottom
  Rum:    [0.24,0.30,0.46],  // mixer/value leaning, weighted low
};
let market='houston';

// per-shape horizontal crop [xmin, width] so each bottle's box hugs its silhouette
const XB={flask:[14,20], tall:[16,16], tapered:[15.5,17], wine:[16.5,15]};
function bottle(cat){
  const s=CAT[cat]; const [x,w]=XB[s.shape];
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x} 2 ${w} 45" fill="${s.color}" stroke="#2b3644" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${SHAPE[s.shape]}<text x="24" y="35" text-anchor="middle" font-size="8" font-weight="700" fill="#2b3644" stroke="none" style="font-family:Inter,system-ui,sans-serif">${s.label}</text></svg>`;
}
// largest-remainder split of a category total across the 3 tiers by its profile
function splitByProfile(total, profile){
  const raw=profile.map(p=>total*p), fl=raw.map(Math.floor);
  let rem=total-fl.reduce((a,b)=>a+b,0);
  const ord=raw.map((r,i)=>[r-Math.floor(r),i]).sort((a,b)=>b[0]-a[0]);
  const out=fl.slice(); for(let k=0;k<rem&&k<ord.length;k++) out[ord[k][1]]++;
  return out; // [Stretch, Eye Level, Reach]
}
function render(){
  const m=MARKET[market];

  // SINGLE SOURCE OF TRUTH: counts[tier][cat], built from regional totals × shelf profile.
  // Each tier now differs; columns still sum to the market total. Shelf + table both read this.
  const counts = TIERS.map(()=>CATS.map(()=>0));
  CATS.forEach((c,ci)=>{
    const parts = splitByProfile(m.totals[c], TIER_PROFILE[c]);
    TIERS.forEach((t,ti)=> counts[ti][ci]=parts[ti]);
  });

  // shelf renders from counts
  let html='';
  TIERS.forEach((t,ti)=>{
    let run='';
    CATS.forEach((c,ci)=>{ for(let k=0;k<counts[ti][ci];k++) run+=`<span class="facing" style="animation-delay:${Math.min(k*7,150)}ms">${bottle(c)}</span>`; });
    html+=`<div class="shelf"><div class="tier">${t}</div><div class="run">${run}</div><div class="rule"></div></div>`;
  });
  document.getElementById('inner').innerHTML=html;

  // table renders from the SAME counts matrix — cannot show a number the shelf didn't draw
  let th=`<thead><tr><th class="corner"></th>`+CATS.map(c=>`<th class="cat"><span class="sw" style="background:${CAT[c].color}"></span>${c}</th>`).join('')+`</tr></thead>`;
  let tb='<tbody>'+TIERS.map((t,ti)=>`<tr><td class="rowlab">${t}</td>`+CATS.map((c,ci)=>`<td class="num">${counts[ti][ci]}</td>`).join('')+`</tr>`).join('')
    +`<tr><td class="rowlab" style="font-weight:600">Total</td>`+CATS.map((c,ci)=>{const s=TIERS.reduce((a,_,ti)=>a+counts[ti][ci],0);return `<td class="num" style="font-weight:600">${s}</td>`;}).join('')+`</tr>`
    +'</tbody>';
  document.getElementById('tbl').innerHTML=th+tb;

  document.getElementById('cap').textContent=`${m.name} · typical set for this market. Eye level is the strike zone — premium categories concentrate there; value rides the lower shelf. Reps orient to it and read the oversized categories against it. (Directional model — the real build sources these from space-to-sales by market.)`;
}
render();
document.getElementById('market').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#market button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');market=b.dataset.k;render();
});
</script>
</body>
</html>

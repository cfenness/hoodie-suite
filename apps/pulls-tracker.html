<!DOCTYPE html>
<!-- Hoodie Suite · Pulls — Source Tracker -->
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoodie · Pulls Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#4E79A7;--purple-d:#3D6089;--purple-soft:#E8EEF5;
  --ink:#243330;--ink2:#3A4A47;--muted:#5E6B68;--muted2:#8A928F;
  --line:#D7DDDB;--line2:#E4E9E8;--paper:#F4F6F5;--surface:#fff;
  --good:#15803d;--good-soft:#e7f3ec;--warn:#b45309;--warn-soft:#fbeede;
  --bad:#b4232a;--bad-soft:#f8e6e7;--blue:#2563b8;--blue-soft:#e8f0fb;--gray-soft:#E9EEED;
  --r:14px;--r-sm:9px;--display:'Fraunces',Georgia,serif;--body:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.45}
.hero{background:linear-gradient(120deg,#3D6089,#4E79A7 58%,#257A6C);color:#fff;padding:30px 34px 26px}
/* embedded as the MDM Pulls tab (?embed=1): drop the brand hero, the rail already names it */
html.embed .hero{display:none}
.hero .ey{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#9FD3C7;margin-bottom:8px}
.hero h1{font-family:var(--display);font-size:34px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.hero p{font-size:14px;color:#e4dbf7;margin:0 0 20px;max-width:64ch}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 14px;display:flex;align-items:center;gap:7px}
.chip b{font-family:var(--display);font-size:17px;font-weight:600}.chip span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#9FD3C7}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.toolbar{position:sticky;top:0;z-index:30;background:rgba(250,249,251,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:14px 0;flex-wrap:wrap;margin-bottom:8px}
.search{flex:1;min-width:180px;max-width:300px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-family:var(--body);font-size:13px;background:var(--surface);outline:none}
.search:focus{border-color:var(--purple)}
select.flt{font-family:var(--body);font-size:12.5px;color:var(--ink2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:var(--surface);cursor:pointer}
.tb-sp{flex:1}
.btn{font-family:var(--body);font-size:13px;font-weight:600;border-radius:var(--r-sm);padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink2);white-space:nowrap}
.btn:hover{border-color:var(--purple);color:var(--purple-d)}
.btn.solid{background:var(--purple);color:#fff;border-color:var(--purple)}.btn.solid:hover{background:var(--purple-d);color:#fff}
.tier{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.tier h2{font-family:var(--display);font-size:19px;font-weight:600;margin:0}
.tier .ct{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.tier .ln{flex:1;height:1px;background:var(--line)}
.card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;margin-bottom:9px;transition:.12s}
.card:hover{border-color:#d9cef0;box-shadow:0 2px 12px rgba(76,29,149,.06)}
.ic{width:40px;height:40px;border-radius:9px;background:var(--purple-soft);color:var(--purple-d);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;flex-shrink:0}
.mid{flex:1;min-width:0}
.nm{font-family:var(--display);font-size:15.5px;font-weight:600;margin-bottom:2px}
.meta{font-size:12px;color:var(--muted);margin-bottom:7px}
.meta b{color:var(--ink2);font-weight:600}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;padding:2px 7px;border-radius:5px;background:var(--gray-soft);color:var(--muted)}
.tag.fld{background:var(--purple-soft);color:var(--purple-d);cursor:pointer;border:1px solid transparent}
.tag.fld:hover{border-color:#cdbcf0}
.tag.fld.off{background:var(--gray-soft);color:var(--muted2);text-decoration:line-through;opacity:.7}
.tag.fldn{background:transparent;color:var(--purple-d);border:1px dashed #cdbcf0}
.pill{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pri{cursor:pointer;border:1px solid transparent}
.p0{background:var(--bad-soft);color:var(--bad)}.p1{background:var(--warn-soft);color:var(--warn)}.p2{background:var(--blue-soft);color:var(--blue)}.p3{background:var(--gray-soft);color:var(--muted)}
.st{cursor:pointer}
.st-planned{background:var(--gray-soft);color:var(--muted)}.st-building{background:var(--blue-soft);color:var(--blue)}
.st-ready{background:var(--purple-soft);color:var(--purple-d)}.st-live{background:var(--good-soft);color:var(--good)}
.st-blocked{background:var(--bad-soft);color:var(--bad)}.st-paused{background:var(--gray-soft);color:var(--muted2)}
.tos-clean{background:var(--good-soft);color:var(--good)}.tos-gray{background:var(--warn-soft);color:var(--warn)}.tos-hostile{background:var(--bad-soft);color:var(--bad)}
.gran{background:#eef0fb;color:#4b3fae}
.own{background:#e8f0fb;color:#2563b8}
.own.own-hoodie{background:var(--purple-soft);color:var(--purple-d)}
.proj{background:#eaf7ea;color:#2f7d32;border:1px solid #cfe8cf}
.rc{cursor:default}
.rc-proven{background:var(--good-soft);color:var(--good)}.rc-candidate{background:var(--blue-soft);color:var(--blue)}
.rc-drifting{background:var(--warn-soft);color:var(--warn)}.rc-broken{background:var(--bad-soft);color:var(--bad)}
.tag.noscrape{background:var(--bad-soft);color:var(--bad)}
.iconbtn{width:28px;height:28px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer;color:var(--muted);font-size:13px;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--purple);color:var(--purple-d)}
.iconbtn.run{border-color:var(--purple);color:var(--purple-d);font-size:12px}
.iconbtn.run:hover{background:var(--purple);color:#fff}
.iconbtn.run:disabled{opacity:.4;cursor:default}
.runout{margin:-3px 0 11px 56px}
.runout .rr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.runout .rr b{color:var(--ink)}
.runout .rspin{width:13px;height:13px;border:2px solid var(--line2);border-top-color:var(--purple);border-radius:50%;animation:rspin .7s linear infinite;display:inline-block;flex:0 0 auto}
@keyframes rspin{to{transform:rotate(360deg)}}
/* Ingest modal — the ingestion QA console opened for one pull */
.ingov{position:fixed;inset:0;background:rgba(29,27,34,.5);display:flex;align-items:center;justify-content:center;padding:24px;z-index:120}
.ingbox{background:var(--surface);border-radius:14px;width:min(1200px,96vw);height:min(90vh,920px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(29,27,34,.42)}
.inghd{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.inghd .t{font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink)}
.inghd .t small{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.ingx{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px;color:var(--muted)}
.ingx:hover{border-color:var(--purple);color:var(--purple-d)}
.ingfr{flex:1;border:0;width:100%}
.empty{text-align:center;color:var(--muted);padding:40px;font-size:13.5px}
.foot{text-align:center;color:var(--muted2);font-size:11px;padding:30px 0 50px;font-family:var(--mono);letter-spacing:.04em}
/* modal */
.ov{position:fixed;inset:0;background:rgba(29,27,34,.45);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:80;overflow:auto}
.ov[hidden]{display:none}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-width:560px;padding:24px 26px;box-shadow:0 24px 60px rgba(29,27,34,.3)}
.modal h3{font-family:var(--display);font-size:20px;font-weight:600;margin:0 0 18px}
.fg{margin-bottom:13px}.fg>label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;font-family:var(--body);font-size:13.5px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--purple)}
.frow{display:flex;gap:11px}.frow .fg{flex:1}
.fldcheck{display:flex;flex-wrap:wrap;gap:6px}
.fldcheck label{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;color:var(--muted);user-select:none}
.fldcheck label.on{background:var(--purple-soft);border-color:#cdbcf0;color:var(--purple-d)}
.fldcheck input{display:none}
.mact{display:flex;gap:10px;align-items:center;margin-top:8px}.mact .sp{flex:1}
.del-link{color:var(--bad);font-size:12px;cursor:pointer;background:none;border:none;font-family:var(--body)}
.del-link:hover{text-decoration:underline}
</style>
<script>if(location.search.indexOf("embed")>=0)document.documentElement.classList.add("embed");</script>
</head><body>

<div class="hero">
  <div class="wrap" style="padding:0">
    <div class="ey">Hoodie Suite · Pulls</div>
    <h1>Source Tracker</h1>
    <p>Every scrape target in one place — what it yields, how clean it is, and where it stands. The pulls are the sell-out half; reconciling them to depletion is the whole game.</p>
    <div class="chips" id="chips"></div>
  </div>
</div>

<div class="wrap">
  <div class="toolbar">
    <input class="search" id="q" placeholder="Search sources…" autocomplete="off">
    <select class="flt" id="fTier"><option value="">All tiers</option></select>
    <select class="flt" id="fStatus"><option value="">All status</option><option>Planned</option><option>Building</option><option>Ready</option><option>Live</option><option>Blocked</option><option>Paused</option></select>
    <select class="flt" id="fTos"><option value="">All ToS</option><option>Clean</option><option>Gray</option><option>Hostile</option></select>
    <select class="flt" id="fPri"><option value="">All priority</option><option>P0</option><option>P1</option><option>P2</option><option>P3</option></select>
    <select class="flt" id="fOwner"><option value="">All owners</option><option>Hoodie</option><option>Grepsr</option><option>Hoodie + Grepsr</option><option>External</option></select>
    <select class="flt" id="fProject"><option value="">All projects</option></select>
    <span class="tb-sp"></span>
    <button class="btn solid" id="addBtn">＋ Source</button>
    <button class="btn" id="runAllBtn" title="Run every source in view — recipe-first, one after another">▸ Run all</button>
    <button class="btn" id="expBtn">Export CSV</button>
  </div>
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</div>

<div class="ov" id="ov" hidden><div class="modal">
  <h3 id="mTitle">New source</h3>
  <div class="fg"><label>Source name</label><input id="mName" placeholder="e.g. Total Wine & More"></div>
  <div class="frow">
    <div class="fg"><label>Tier</label><select id="mTier"></select></div>
    <div class="fg"><label>Granularity</label><select id="mGran"><option>Store</option><option>Zone</option><option>State</option><option>Chain</option></select></div>
    <div class="fg"><label>Pulled by</label><select id="mOwner"></select></div>
    <div class="fg"><label>Project</label><input id="mProject" placeholder="e.g. Hemp" list="projList"><datalist id="projList"></datalist></div>
  </div>
  <div class="fg"><label>Footprint / coverage</label><input id="mFoot" placeholder="e.g. National · 285 stores"></div>
  <div class="fg"><label>Website URL</label><input id="mUrl" placeholder="https://… (the Analyzer pulls this to scrape)"></div>
  <div class="fg"><label>Fields available</label><div class="fldcheck" id="mFields"></div></div>
  <div class="frow">
    <div class="fg"><label>Platform</label><input id="mPlat" placeholder="e.g. Algolia feed"></div>
    <div class="fg"><label>Protection</label><select id="mProt"><option>None</option><option>Low</option><option>Medium</option><option>High</option></select></div>
  </div>
  <div class="frow">
    <div class="fg"><label>ToS risk</label><select id="mTos"><option>Clean</option><option>Gray</option><option>Hostile</option></select></div>
    <div class="fg"><label>Priority</label><select id="mPri"><option>P0</option><option>P1</option><option>P2</option><option>P3</option></select></div>
    <div class="fg"><label>Status</label><select id="mStatus"><option>Planned</option><option>Building</option><option>Ready</option><option>Live</option><option>Blocked</option><option>Paused</option></select></div>
  </div>
  <div class="fg"><label>Notes</label><textarea id="mNotes" rows="2" placeholder="Anything worth remembering…"></textarea></div>
  <div class="mact">
    <button class="del-link" id="mDel" hidden>Delete source</button>
    <span class="sp"></span>
    <button class="btn" id="mCancel">Cancel</button>
    <button class="btn solid" id="mSave">Save</button>
  </div>
</div></div>

<script>
const KEY="hoodie.pulls.tracker.v2";
const TIERS=["Spine & Master","Control States","Specialty Bev-Alc","Grocery & Mass","Delivery & Marketplace","On-Premise Accounts","Long-Tail & Platform","Hemp & THC"];
// Availability = inventory (the single best data point); Auth type = authorization/permit type (the close second).
const FIELDS=["Availability","Auth type","Price","Promo","Units","UPC","Ratings"];
// Who actually runs the pull. Grepsr is an external vendor delivering a daily hemp-beverage feed to S3.
const OWNERS=["Hoodie","Grepsr","Hoodie + Grepsr","External","—"];
const STATUSES=["Planned","Building","Ready","Live"]; // click-cycle set
// Provenance tag: these accounts landed on the tracker via the hemp-beverage project.
// The tag marks WHERE they came from — the intent is still the FULL store, not only hemp.
const HEMP=["ABC FWS — Inventory","Spec's — Inventory","Binny's — Inventory","Total Wine & More","BevMo","Top Ten Liquors","Liquor Barn","Goody Goody","Haskell's","Bottle King","Circle K","Target"];
function seedProject(s){ return HEMP.indexOf(s.nm)>=0?"Hemp":""; }
// Website URLs — the Source Analyzer pulls these to point a scrape at a tracked source.
const URLS={
 "TTB — COLA Labels":"https://ttbonline.gov/colasonline/publicSearchColasBasic.do",
 "ABC FWS — Inventory":"https://abcfws.com","Spec's — Inventory":"https://specsonline.com","Binny's — Inventory":"https://www.binnys.com",
 "Total Wine & More":"https://www.totalwine.com","BevMo":"https://www.bevmo.com","Top Ten Liquors":"https://toptenliquors.com",
 "Liquor Barn":"https://www.liquorbarn.com","Goody Goody":"https://goodygoody.com","Haskell's":"https://www.haskells.com","Bottle King":"https://www.bottleking.com",
 "Circle K":"https://www.circlek.com","Target":"https://www.target.com","Kroger (+ banners)":"https://www.kroger.com","Publix":"https://www.publix.com",
 "H-E-B":"https://www.heb.com","Walmart":"https://www.walmart.com","Costco":"https://www.costco.com","Instacart — Store-level":"https://www.instacart.com",
 "Uber Eats":"https://www.ubereats.com","Vivino / Wine-Searcher":"https://www.vivino.com","PA Fine Wine & Good Spirits":"https://www.finewineandgoodspirits.com"
};
function seedUrl(s){ return URLS[s.nm]||""; }
// backfill the owned-connector id from SEED by name, so sources saved before connId existed still run
function seedConn(s){ var m=SEED.find(function(x){return x.nm===s.nm;}); return (m&&m.connId)||""; }
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>s.replace(/[^A-Za-z]/g,"").slice(0,2).toUpperCase();

const SEED=[
 {nm:"Florida — Items",connId:"fl-items",tier:"Spine & Master",foot:"FL · DBPR/ABT registry",fields:["UPC"],gran:"State",plat:"gov CSV",prot:"None",tos:"Clean",pri:"P0",status:"Ready",notes:"Item master seed — authoritative government CSV."},
 {nm:"Florida — Outlets",connId:"fl-outlets",tier:"Spine & Master",foot:"FL · DBPR/ABT licensees",fields:[],gran:"State",plat:"gov CSV",prot:"None",tos:"Clean",pri:"P0",status:"Ready",notes:"Outlet master — the load-bearing spine. FL-only; must expand to TX + IL to resolve Spec's/Binny's."},
 {nm:"TTB — COLA Labels",connId:"ttb-cola",tier:"Spine & Master",foot:"National · TTB public registry",fields:["UPC"],gran:"Chain",plat:"Custom scraper",prot:"Low",tos:"Clean",pri:"P1",status:"Ready",notes:"Label / product-identity enrichment on top of item master."},

 {nm:"PA Fine Wine & Good Spirits",tier:"Control States",foot:"PA · 568 stores",fields:["Price"],gran:"State",plat:"gov price book",prot:"None",tos:"Clean",pri:"P0",status:"Planned",notes:"Quarterly price listing, statewide-uniform. Biggest clean miss — fetch & parse, not a scrape."},
 {nm:"Virginia ABC",tier:"Control States",foot:"VA · 395 stores",fields:["Price"],gran:"State",plat:"gov price book",prot:"None",tos:"Clean",pri:"P0",status:"Planned",notes:"Statewide-uniform pricing; published list."},
 {nm:"North Carolina ABC",tier:"Control States",foot:"NC · statewide",fields:["Price","Promo"],gran:"State",plat:"gov price list",prot:"None",tos:"Clean",pri:"P1",status:"Planned",notes:"Quarterly list + monthly sales, uniform across all ABC stores."},
 {nm:"Idaho State Liquor",tier:"Control States",foot:"ID · monthly files",fields:["Price"],gran:"State",plat:"gov price files",prot:"None",tos:"Clean",pri:"P1",status:"Planned",notes:"Monthly alphabetical + by-category pricing, floor prices & tiers."},
 {nm:"Remaining control states (13)",tier:"Control States",foot:"OH, OR, MI, UT, AL, IA, ME, MS, MT, NH, VT, WV, WY",fields:["Price"],gran:"State",plat:"gov files",prot:"None",tos:"Clean",pri:"P2",status:"Planned",notes:"Same fetch-and-parse pattern; clone per state. ~23% of US spirits volume across the set."},

 {nm:"ABC FWS — Inventory",connId:"abc-fws",tier:"Specialty Bev-Alc",foot:"FL · 133 stores",fields:["Availability","Price"],gran:"Store",plat:"BigCommerce options",prot:"Medium",tos:"Gray",pri:"P0",status:"Ready",owner:"Hoodie + Grepsr",notes:"STORE-LEVEL in/out + price. Polite 10s. Home turf. Grepsr also lands a daily hemp-bev cut to S3 (count-alert restored after a low-row day)."},
 {nm:"Spec's — Inventory",connId:"specs",tier:"Specialty Bev-Alc",foot:"TX · 100+ stores",fields:["Availability","Price","Promo"],gran:"Store",plat:"Embedded variants (direct)",prot:"Medium",tos:"Gray",pri:"P0",status:"Ready",owner:"Hoodie + Grepsr",notes:"Direct, no Bright Data. TX outlets can't resolve to the spine yet (outlet master is FL-only). Grepsr 'Spec's Online' hemp-bev feed is daily; promo now pulled from PDP."},
 {nm:"Binny's — Inventory",tier:"Specialty Bev-Alc",foot:"IL · 45 stores",fields:["Availability","Price","Units"],gran:"Store",plat:"Algolia feed",prot:"Medium",tos:"Gray",pri:"P0",status:"Ready",owner:"Hoodie + Grepsr",notes:"CROWN JEWEL — unit inventory → directional units sold. Grepsr hemp-bev feed is daily; store IDs 6 & 80 have blank names (80 = 'Ship to Me', 6 = deactivated store). Validate deltas before trusting downstream."},
 {nm:"Total Wine & More",tier:"Specialty Bev-Alc",foot:"National · 285 stores",fields:["Availability","Price","Promo","Ratings"],gran:"Store",plat:"Custom (Algolia-style)",prot:"High",tos:"Gray",pri:"P0",status:"Live",owner:"Grepsr",notes:"Market leader, >50% of sector by store count. We can't scrape it directly (heavily protected) — Grepsr delivers a daily hemp-bev cut to S3; promo capture added. Our own pull is still the biggest competitive gap."},
 {nm:"BevMo",tier:"Specialty Bev-Alc",foot:"CA/AZ · 160 stores",fields:["Availability","Price"],gran:"Store",plat:"Custom (Elasticsearch)",prot:"High",tos:"Gray",pri:"P2",status:"Building",owner:"Grepsr",notes:"Grepsr daily hemp-bev feed, but >95% alcohol bleed — no THC category page, Elasticsearch fuzzy-matches 'THC'. Filtering on 'Government Issued ID Required' attribute; anti-bot has blocked them intermittently. Gopuff-owned."},
 {nm:"Top Ten Liquors",tier:"Specialty Bev-Alc",foot:"MN · multi-store",fields:["Availability","Price","Promo"],gran:"Store",plat:"Custom (Grepsr)",prot:"Medium",tos:"Gray",pri:"P1",status:"Live",owner:"Grepsr",notes:"Hemp-bev daily feed → S3. Promo now pulled from the PDP (was 0% off the listing page). All locations MN/US."},

var SOURCES=[];
var STATE={q:"",tier:"",status:"",tos:"",pri:"",owner:"",project:""};
var editId=null;
// Scrape-recipe status per host, from the Source Analyzer's self-reinforcing store (/api/recipes).
var REC={};
function recHost(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; } }
function recStatus(u){ var h=recHost(u); return h?REC[h]:""; }

// Run a source right here — recipe-first (use the proven config) then extract. Result shows
// inline under the card and folds back into the recipe (updates its status pill).
var RUNSTATE={};
var DEFAULT_PROMPT="First, check the source's robots.txt and Terms of Service — confirm this path isn't disallowed for our user-agent and that scraping is permitted; if it's disallowed or the ToS forbids it, STOP and report that instead of extracting. Only if permitted, then: extract every product/item on the page as an object with its key fields — name, price, size, availability.";
// Per-pull field selection: s.fields is what the source CAN yield; s.pick narrows it to
// what THIS pull captures. No s.pick (or empty) means "all available fields". Never let a
// pull go to zero fields — a narrowed-to-nothing pull is meaningless, so the last one stays.
function picked(s){ var all=s.fields||[]; return (s.pick&&s.pick.length)?all.filter(function(f){return s.pick.indexOf(f)>=0;}):all.slice(); }
function isNarrowed(s){ var all=(s.fields||[]).length; return all>1 && picked(s).length<all; }
function toggleFld(id,f){
  var s=SOURCES.find(function(x){return x.id===id;}); if(!s) return;
  var cur=picked(s); var i=cur.indexOf(f);
  if(i>=0){ if(cur.length<=1) return; cur.splice(i,1); } else { cur.push(f); }
  // store the intent; drop s.pick entirely when everything's back on so default stays clean
  s.pick=(cur.length>=(s.fields||[]).length)?null:cur; save(); render();
}
function runSource(id){
  var s=SOURCES.find(function(x){return x.id===id;}); if(!s) return Promise.resolve();
  if(s.connId) return runConn(id);        // owned connector → the engine's pull pipeline (/api/run)
  if(!s.url) return Promise.resolve();
  RUNSTATE[id]={state:"running"}; render();
  var flds=picked(s);
  return fetch("/api/scraper/recipe?url="+encodeURIComponent(s.url)).then(function(r){return r.ok?r.json():{};})
    .then(function(rd){
      var cfg=(rd&&rd.recipe&&rd.recipe.config)||{};
      var target=(cfg.data_api&&cfg.data_api.url)||s.url;
      var prompt=cfg.scrape_prompt||DEFAULT_PROMPT;
      // If the user narrowed the pull, constrain extraction to just those fields (plus identity).
      if(isNarrowed(s)) prompt+=" For each item capture ONLY these fields (plus the product name/identifier): "+flds.join(", ")+". Omit all other fields.";
      return fetch("/api/scraper/extract",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({url:target,prompt:prompt,pages:3,limit:50,fields:flds,api:cfg.data_api})});
    })
    .then(function(r){return r.json();})
    .then(function(d){
      var v=d.recipe||{}; if(v.host) REC[v.host]=v.status;
      RUNSTATE[id]={state:"done",rows:(d.rows||[]).length,engine:d.engine,error:d.error,recipe:v,attempts:d.attempts||[]};
      render();
    })
    .catch(function(){ RUNSTATE[id]={state:"error",error:"couldn't reach the engine — start it (./dev.sh) or open the deployed suite"}; render(); });
}
// Owned connector → run the engine's real pull pipeline (/api/run) and show the record count.
function runConn(id){
  var s=SOURCES.find(function(x){return x.id===id;}); if(!s||!s.connId) return Promise.resolve();
  RUNSTATE[id]={state:"running",conn:true}; render();
  return fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({connId:s.connId,trigger:"manual"})})
    .then(function(r){ return r.ok?r.json():Promise.reject(r.status); })
    .then(function(rec){
      var st=(rec&&rec.status)||"success", bad=(st==="degraded"||st==="partial"||st==="failed");
      RUNSTATE[id]={state:"done",conn:true,rows:(rec&&rec.total)||0,status:st,reportable:bad};
      render();
    })
    .catch(function(){ RUNSTATE[id]={state:"error",conn:true,error:"couldn't reach the engine — start it (./dev.sh) or open the deployed suite",reportable:true}; render(); });
}
// A failed / degraded pull is a data-quality signal — log it to the admin service desk.
function openReport(id){
  var s=SOURCES.find(function(x){return x.id===id;}); if(!s) return;
  var r=RUNSTATE[id]||{}, st=r.error?"failed":(r.status||"degraded");
  var ov=document.createElement("div"); ov.className="ingov";
  ov.innerHTML='<div class="ingbox" style="width:min(520px,96vw);height:auto;max-height:90vh">'
    +'<div class="inghd"><div class="t">Report pull issue <small>'+esc(s.nm)+'</small></div><button class="ingx">✕</button></div>'
    +'<div style="padding:16px 18px">'
    +'<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Logs a ticket in Admin · Service desk with the pull, status (<b>'+esc(st)+'</b>) and your note.</div>'
    +'<textarea id="rpnote" rows="4" placeholder="What looked wrong? (optional)" style="width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none"></textarea>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">'
    +'<button class="btn" id="rpcancel">Cancel</button><button class="btn" id="rpsend" style="background:var(--purple);color:#fff;border-color:var(--purple)">Send report</button></div></div></div>';
  document.body.appendChild(ov);
  function close(){ ov.remove(); }
  ov.querySelector(".ingx").onclick=close; ov.querySelector("#rpcancel").onclick=close;
  ov.addEventListener("click",function(e){ if(e.target===ov) close(); });
  ov.querySelector("#rpsend").onclick=function(){
    var btn=this; btn.disabled=true; btn.textContent="Sending…";
    fetch("/api/service/reports",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({connId:s.connId||s.id,source:s.nm,kind:"data-quality",severity:st,
        note:(ov.querySelector("#rpnote").value||"").trim(),reporter:"tracker"})})
      .then(function(){ RUNSTATE[id]=Object.assign({},RUNSTATE[id],{reported:true}); close(); render(); })
      .catch(function(){ btn.disabled=false; btn.textContent="Send report"; alert("Couldn't reach the service desk — is the engine live?"); });
  };
}
// Ingest a pull — open the ingestion QA console (suite-themed) as a modal for this source.
function openIngest(id){
  var s=SOURCES.find(function(x){return x.id===id;}); if(!s) return;
  var ov=document.createElement("div"); ov.className="ingov";
  var flds=picked(s); var q=isNarrowed(s)?("&fields="+encodeURIComponent(flds.join(","))):"";
  ov.innerHTML='<div class="ingbox"><div class="inghd"><div class="t">Ingest <small>'+esc(s.nm)+(isNarrowed(s)?(" · "+flds.length+" fields"):"")+'</small></div>'
    +'<button class="ingx" title="Close">✕</button></div>'
    +'<iframe class="ingfr" src="ttb-ingestion.html?embed=1'+q+'" title="Ingestion QA"></iframe></div>';
  document.body.appendChild(ov);
  ov.querySelector(".ingx").onclick=function(){ ov.remove(); };
  ov.addEventListener("click",function(e){ if(e.target===ov) ov.remove(); });
  document.addEventListener("keydown",function esc(e){ if(e.key==="Escape"){ ov.remove(); document.removeEventListener("keydown",esc); } });
}
function runoutHtml(id){
  var r=RUNSTATE[id]; if(!r) return "";
  var body;
  if(r.state==="running"){ body='<span class="rspin"></span> running…'; }
  else if(r.state==="error"||r.error){
    body='<span style="color:var(--bad)">✗ '+esc(r.error||"no rows extracted")+'</span>';
    if(r.attempts&&r.attempts.length){ var last=r.attempts[r.attempts.length-1]; body+=' <span style="color:var(--muted2)">· '+esc(last.step)+(last.status!=null?(" ["+last.status+"]"):"")+": "+esc(last.note||"")+'</span>'; }
  } else if(r.conn){
    var okc=(r.status==="success"||r.status==="ok");
    var col=okc?"var(--good)":(r.status==="failed"?"var(--bad)":"var(--warn)");
    body='<span style="color:'+col+'">'+(okc?"✓":(r.status==="failed"?"✗":"○"))+' <b>'+(r.rows||0)+'</b> records</span>'
       +' · <span class="pill" style="padding:1px 8px;background:var(--gray-soft);color:var(--muted)">'+esc(r.status||"")+'</span>'
       +' · <span style="color:var(--muted2)">owned pull</span>';
  } else {
    var v=r.recipe||{}, good=r.rows>0;
    body='<span style="color:'+(good?"var(--good)":"var(--warn)")+'">'+(good?"✓":"○")+' <b>'+r.rows+'</b> rows</span> · <span style="color:var(--muted)">'+esc(r.engine||"?")+'</span>'
       +(v.run?(' · <span class="pill rc rc-'+(v.status||"candidate")+'" style="padding:1px 7px">recipe: '+esc(v.status)+(v.promoted?" ✦":"")+'</span>'):'');
  }
  if(r.reportable){ body+= r.reported ? ' · <span style="color:var(--good)">⚑ reported ✓</span>' : ' · <a data-report="'+id+'" style="cursor:pointer;color:var(--bad)">⚑ report issue</a>'; }
  return '<div class="runout"><div class="rr">'+body+'</div></div>';
}
function runAll(){
  var ids=SOURCES.filter(passes).filter(function(s){return s.url||s.connId;}).map(function(s){return s.id;});
  var btn=$("runAllBtn"); if(btn){ btn.disabled=true; btn.textContent="Running… 0/"+ids.length; }
  (function next(i){
    if(i>=ids.length){ if(btn){ btn.disabled=false; btn.textContent="▸ Run all"; } return; }
    if(btn) btn.textContent="Running… "+(i+1)+"/"+ids.length;
    runSource(ids[i]).then(function(){ setTimeout(function(){ next(i+1); }, 400); });
  })(0);
}
function fetchRecipes(){
  fetch("/api/recipes").then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d||!d.recipes) return; REC={}; d.recipes.forEach(function(x){ if(x.host) REC[x.host]=x.status; }); render();
  }).catch(function(){});
}

function load(){ try{ const r=JSON.parse(localStorage.getItem(KEY)||"null"); if(r&&r.length){ SOURCES=r.map(s=>Object.assign({owner:"Hoodie",project:seedProject(s),url:seedUrl(s),connId:seedConn(s)},s)); return; } }catch(e){} SOURCES=SEED.map((s,i)=>Object.assign({id:"s"+i,owner:"Hoodie",project:seedProject(s),url:seedUrl(s)},s)); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(SOURCES)); }catch(e){} }

function passes(s){
  if(STATE.tier&&s.tier!==STATE.tier)return false;
  if(STATE.status&&s.status!==STATE.status)return false;
  if(STATE.tos&&s.tos!==STATE.tos)return false;
  if(STATE.pri&&s.pri!==STATE.pri)return false;
  if(STATE.owner&&(s.owner||"Hoodie")!==STATE.owner)return false;
  if(STATE.project&&(s.project||"")!==STATE.project)return false;
  if(STATE.q){ const q=STATE.q.toLowerCase(); if(!(s.nm+" "+s.foot+" "+s.plat+" "+(s.owner||"")+" "+(s.project||"")+" "+(s.notes||"")).toLowerCase().includes(q))return false; }
  return true;
}
function render(){
  const list=$("list"); const shown=SOURCES.filter(passes);
  let html="";
  TIERS.forEach(t=>{
    const rows=shown.filter(s=>s.tier===t); if(!rows.length)return;
    const live=rows.filter(s=>s.status==="Live").length;
    html+='<div class="tier"><h2>'+esc(t)+'</h2><span class="ct">'+rows.length+' source'+(rows.length>1?'s':'')+' · '+live+' live</span><span class="ln"></span></div>';
    rows.forEach(s=>{ html+=cardHTML(s); });
  });
  list.innerHTML=html||'<div class="empty">No sources match these filters.</div>';
  list.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openModal(b.dataset.edit));
  list.querySelectorAll("[data-cyc]").forEach(b=>b.onclick=()=>cycleStatus(b.dataset.cyc));
  list.querySelectorAll("[data-pri]").forEach(b=>b.onclick=()=>cyclePri(b.dataset.pri));
  list.querySelectorAll("[data-run]").forEach(b=>b.onclick=()=>runSource(b.dataset.run));
  list.querySelectorAll("[data-ingest]").forEach(b=>b.onclick=()=>openIngest(b.dataset.ingest));
  list.querySelectorAll("[data-fld]").forEach(b=>b.onclick=()=>{ const p=b.dataset.fld.split("::"); toggleFld(p[0],p[1]); });
  list.querySelectorAll("[data-report]").forEach(b=>b.onclick=()=>openReport(b.dataset.report));
  renderChips(); syncProjects();
  $("foot").textContent=SOURCES.length+" sources tracked · "+SOURCES.filter(s=>s.status==="Live").length+" live · saved to this device";
}
function cardHTML(s){
  const on=picked(s);
  const flds=(s.fields||[]).map(f=>{ const sel=on.indexOf(f)>=0;
    return '<span class="tag fld'+(sel?'':' off')+'" data-fld="'+s.id+'::'+esc(f)+'" title="'+(sel?'Included in the pull — click to drop':'Excluded — click to include')+'">'+esc(f)+'</span>'; }).join('')
    +(isNarrowed(s)?'<span class="tag fldn" title="This pull is narrowed to the selected fields">'+on.length+'/'+(s.fields||[]).length+' fields</span>':'');
  return '<div class="card">'
    +'<div class="ic">'+esc(slug(s.nm))+'</div>'
    +'<div class="mid"><div class="nm">'+esc(s.nm)+'</div>'
    +'<div class="meta"><b>'+esc(s.foot||"—")+'</b> · '+esc(s.plat||"—")+(s.url?(' · <a href="'+esc(s.url)+'" target="_blank" rel="noopener" style="color:var(--purple-d);text-decoration:none">site ↗</a>'):'')+'</div>'
    +'<div class="tags">'+flds
      +'<span class="pill gran">'+esc(s.gran)+'</span>'
      +((s.owner&&s.owner!=="Hoodie"&&s.owner!=="—")?'<span class="pill own" title="Who runs this pull">'+esc(s.owner)+'</span>':'')
      +(s.project?'<span class="pill proj" title="On the tracker via the '+esc(s.project)+' project — scope is the full store, not only '+esc(s.project)+'">'+esc(s.project)+'</span>':'')
      +(function(){ var st=recStatus(s.url); return st?'<span class="pill rc rc-'+st+'" title="Scrape recipe (Source Analyzer) — '+st+'">recipe: '+st+'</span>':''; })()
      +'<span class="pill tos-'+s.tos.toLowerCase()+'">'+esc(s.tos)+'</span>'
      +'<span class="tag">'+esc(s.prot)+' protection</span>'
      +(s.notes?'<span class="tag" title="'+esc(s.notes)+'">ⓘ notes</span>':'')
    +'</div></div>'
    +'<div class="right">'
      +'<span class="pill pri '+s.pri.toLowerCase()+'" data-pri="'+s.id+'" title="Click to change priority">'+esc(s.pri)+'</span>'
      +'<span class="pill st st-'+s.status.toLowerCase()+'" data-cyc="'+s.id+'" title="Click to advance status">'+esc(s.status)+'</span>'
      +((s.url||s.connId)?'<button class="iconbtn run" data-run="'+s.id+'" title="'+(s.connId?'Run the owned pull now (engine pipeline)':'Run this source now (recipe-first)')+'"'+(RUNSTATE[s.id]&&RUNSTATE[s.id].state==="running"?" disabled":"")+'>▸</button>':'')
      +((s.url||s.connId)?'<button class="iconbtn" data-ingest="'+s.id+'" title="Ingest this pull — QA + commit to master">⤓</button>':'')
      +'<button class="iconbtn" data-edit="'+s.id+'" title="Edit">✎</button>'
    +'</div></div>'
    +((s.url||s.connId)?runoutHtml(s.id):'');
}
function renderChips(){

  $("chips").innerHTML=
    chip(SOURCES.length,"sources")+chip(c("Live"),"live")+chip(c("Ready"),"ready")+chip(c("Planned"),"planned")
    +chip(vendor,"vendor feed")+chip(tos("Clean"),"clean")+chip(tos("Hostile"),"hostile");
}
function chip(n,l){return '<div class="chip"><b>'+n+'</b><span>'+l+'</span></div>';}

function cycleStatus(id){ const s=SOURCES.find(x=>x.id===id); if(!s)return; const i=STATUSES.indexOf(s.status); s.status=(i<0||i===STATUSES.length-1)?STATUSES[0]:STATUSES[i+1]; save(); render(); }
function cyclePri(id){ const s=SOURCES.find(x=>x.id===id); if(!s)return; const P=["P0","P1","P2","P3"]; s.pri=P[(P.indexOf(s.pri)+1)%4]; save(); render(); }

  $("mName").value=s?s.nm:""; $("mFoot").value=s?s.foot:""; $("mPlat").value=s?s.plat:""; $("mNotes").value=s?s.notes:""; $("mUrl").value=s?(s.url||""):"";
  $("mTier").value=s?s.tier:TIERS[2]; $("mGran").value=s?s.gran:"Store"; $("mProt").value=s?s.prot:"Medium";
  $("mOwner").value=s?(s.owner||"Hoodie"):"Hoodie";
  $("mProject").value=s?(s.project||""):"";
  $("mTos").value=s?s.tos:"Gray"; $("mPri").value=s?s.pri:"P2"; $("mStatus").value=s?s.status:"Planned";
  fillFieldChecks(s?s.fields:["Price"]);
  $("mDel").hidden=!s;
  $("ov").hidden=false;
}
function closeModal(){ $("ov").hidden=true; editId=null; }
function saveModal(){
  const nm=$("mName").value.trim(); if(!nm){ $("mName").focus(); return; }
  const fields=[...$("mFields").querySelectorAll("label.on")].map(l=>l.dataset.f);
  const data={nm,foot:$("mFoot").value.trim(),plat:$("mPlat").value.trim(),notes:$("mNotes").value.trim(),url:$("mUrl").value.trim(),
    tier:$("mTier").value,gran:$("mGran").value,prot:$("mProt").value,tos:$("mTos").value,pri:$("mPri").value,status:$("mStatus").value,owner:$("mOwner").value,project:$("mProject").value.trim(),fields};
  if(editId){ const s=SOURCES.find(x=>x.id===editId); Object.assign(s,data); }
  else { data.id="s"+Date.now().toString(36); SOURCES.push(data); }
  save(); closeModal(); render();
}
function delSource(){ if(!editId)return; if(!confirm("Delete this source?"))return; SOURCES=SOURCES.filter(x=>x.id!==editId); save(); closeModal(); render(); }

function exportCSV(){
  const cols=["nm","tier","foot","url","fields","gran","owner","plat","prot","tos","pri","status","notes"];
  const head=["Source","Tier","Footprint","URL","Fields","Granularity","Pulled by","Platform","Protection","ToS","Priority","Status","Notes"];
  const rows=SOURCES.map(s=>cols.map(c=>{ let v=c==="fields"?(s.fields||[]).join("; "):(s[c]||""); v=String(v).replace(/"/g,'""'); return '"'+v+'"'; }).join(","));
  const csv=head.join(",")+"\n"+rows.join("\n");
  const blob=new Blob([csv],{type:"text/csv"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="hoodie-pulls-sources.csv"; a.click();
}

/* wiring */
function setup(){
  $("fTier").innerHTML='<option value="">All tiers</option>'+TIERS.map(t=>'<option>'+t+'</option>').join('');
  $("mTier").innerHTML=TIERS.map(t=>'<option>'+t+'</option>').join('');
  $("mOwner").innerHTML=OWNERS.map(o=>'<option>'+o+'</option>').join('');
  $("q").addEventListener("input",e=>{STATE.q=e.target.value;render();});
  $("fTier").onchange=e=>{STATE.tier=e.target.value;render();};
  $("fStatus").onchange=e=>{STATE.status=e.target.value;render();};
  $("fTos").onchange=e=>{STATE.tos=e.target.value;render();};
  $("fPri").onchange=e=>{STATE.pri=e.target.value;render();};
  $("fOwner").onchange=e=>{STATE.owner=e.target.value;render();};
  $("fProject").onchange=e=>{STATE.project=e.target.value;render();};
  syncProjects();
  // Inside the Sources shell, "+ Source" jumps to the Analyze tab (analyze a new source, then Save it here);
  // standalone, it opens the manual add-source modal.
  var inShell=/[?&]shell=1/.test(location.search);
  $("addBtn").onclick=()=>{ if(inShell){ try{ parent.postMessage({type:"hoodie:sources:tab",tab:"analyze"},"*"); }catch(e){ openModal(null); } } else openModal(null); };
  if(inShell){ $("addBtn").title="Analyze a new source"; }
  $("expBtn").onclick=exportCSV;
  $("runAllBtn").onclick=runAll;
  $("mCancel").onclick=closeModal; $("mSave").onclick=saveModal; $("mDel").onclick=delSource;
  $("ov").addEventListener("click",e=>{ if(e.target.id==="ov") closeModal(); });
}
load(); save(); setup(); render();  // persist the owner/project/url backfill so the Analyzer (same-origin) can read URLs
fetchRecipes();                     // overlay scrape-recipe status per source (best-effort; needs the engine)
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<script src="../spine/session-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coverage · Accounts — Hoodie Suite</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{ --accent:#4E79A7; --accent-2:#6f9bc9; --ink:#0e1613; --panel:#121c19; --paper:#e9f2ef; --muted:#8aa39d;
         --line:#22322e; --good:#5bb86e; --warn:#d99a3f;
         --disp:"Fraunces",Georgia,serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--body)}
  #map{position:fixed;inset:0;background:#0e1613;z-index:1}
  .leaflet-container{background:#0e1613;font-family:var(--mono)}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--paper);border:1px solid var(--line)}
  .leaflet-popup-content{font-family:var(--mono);font-size:11.5px;margin:9px 12px}
  .leaflet-bar a{background:var(--panel);color:var(--paper);border-color:var(--line)}
  .leaflet-bar a:hover{background:#1a2622}
  .covtip{background:var(--panel)!important;border:1px solid var(--line)!important;color:#eafaf5!important;font-family:var(--mono);font-size:11px}
  .covtip:before{display:none}
  .hud{position:fixed;z-index:5;pointer-events:none}
  .top{top:0;left:0;right:0;padding:16px 20px;display:flex;align-items:flex-start;gap:14px;background:linear-gradient(180deg,rgba(14,22,19,.9),rgba(14,22,19,0))}
  .brand .ey{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#6f938a}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:19px;margin:3px 0 0;color:#eafaf5}
  .brand .tot{font-family:var(--mono);font-size:11px;color:var(--accent-2);margin-top:3px}
  .brand .tot b{color:#eafaf5}
  .panel{position:fixed;left:16px;top:74px;bottom:16px;width:280px;z-index:6;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
  .card{background:rgba(18,28,25,.94);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px)}
  .sbox{padding:11px 13px}
  .sbox input{width:100%;background:#0e1613;border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:#dcefe9;font-family:var(--mono);font-size:12px;outline:none}
  .sbox input:focus{border-color:var(--accent)}
  .srcwrap{padding:11px 13px;overflow:auto;flex:0 0 auto;max-height:38%}
  .srch{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#6f938a;margin-bottom:9px;display:flex;justify-content:space-between}
  .srch a{color:var(--accent-2);cursor:pointer;text-decoration:none;pointer-events:auto}
  .src{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;cursor:pointer;color:#cfe6df}
  .src .sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
  .src .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:#8aa39d;font-variant-numeric:tabular-nums}
  .src.off{opacity:.34}
  .src.off .sw{background:#3a4a45 !important}
  .accwrap{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
  .acch{padding:10px 13px 8px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#6f938a;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
  .acch .clr{margin-left:auto;color:var(--accent-2);cursor:pointer;text-transform:none;letter-spacing:0;font-size:10px}
  .acclist{overflow:auto;flex:1 1 auto}
  .acc{padding:8px 13px;border-bottom:1px solid rgba(34,50,46,.5);cursor:pointer;font-size:12px}
  .acc:hover{background:rgba(78,121,167,.14)}
  .acc.on{background:rgba(78,121,167,.22)}
  .acc .nm{color:#eafaf5;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acc .sub{font-family:var(--mono);font-size:10px;color:#8aa39d;margin-top:1px;display:flex;gap:6px;align-items:center}
  .acc .dot{width:7px;height:7px;border-radius:2px;flex:0 0 auto}
  .acc .none{color:#6f938a;font-style:italic;padding:14px 0;text-align:center}
  .detail{position:fixed;right:16px;top:74px;width:300px;max-height:calc(100vh - 90px);overflow:auto;z-index:6;background:rgba(18,28,25,.96);border:1px solid var(--line);border-radius:13px;padding:16px 17px;backdrop-filter:blur(7px);transform:translateX(14px);opacity:0;transition:.2s;pointer-events:none}
  .detail.show{transform:none;opacity:1;pointer-events:auto}
  .detail .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#6f938a}
  .detail .nm{font-family:var(--disp);font-weight:600;font-size:19px;margin:3px 0 3px;color:#eafaf5;line-height:1.2}
  .detail .badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:#cfe6df;background:rgba(78,121,167,.16);border:1px solid var(--line);border-radius:20px;padding:2px 9px;margin-bottom:11px}
  .detail .badge .dot{width:7px;height:7px;border-radius:2px}
  .detail .row{display:flex;gap:9px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
  .detail .row .lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:#6f938a;flex:0 0 84px;padding-top:1px}
  .detail .row .val{color:#dcefe9;word-break:break-word}
  .detail .row .val.mono{font-family:var(--mono);font-size:11px;color:var(--accent-2)}
  .detail .x{position:absolute;top:12px;right:13px;font-family:var(--mono);font-size:12px;color:#a9c9c0;background:none;border:1px solid var(--line);border-radius:7px;padding:3px 9px;cursor:pointer}
  .detail .x:hover{border-color:var(--accent);color:#eafaf5}
  .detail .nogeo{margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--warn)}
  .detail .fchips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
  .fchip{font-family:var(--mono);font-size:10px;color:#dcefe9;background:rgba(89,161,79,.16);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
  .fchip.rtd{color:#0e1613;background:var(--warn);font-weight:600}
  .fchip.err{color:#0e1613;background:#d9584f;font-weight:600}
  .fbasis{width:100%;font-family:var(--mono);font-size:9.5px;color:#6f938a;margin-top:2px}
  .sells{display:flex;gap:5px;flex-wrap:wrap;padding:0 13px 11px}
  .sells button{flex:1 1 auto;background:#0e1613;border:1px solid var(--line);border-radius:7px;padding:5px 4px;color:#a9c9c0;font-family:var(--mono);font-size:10px;cursor:pointer;white-space:nowrap}
  .sells button:hover{border-color:var(--accent);color:#eafaf5}
  .sells button.on{background:var(--accent);color:#0e1613;border-color:var(--accent);font-weight:700}
  .sells button.rtd.on{background:var(--warn);border-color:var(--warn)}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;font-family:var(--mono);font-size:12px;color:#6f938a;background:var(--ink)}
  .legend{position:fixed;right:16px;bottom:16px;z-index:5;font-family:var(--mono);font-size:10px;color:#6f938a;text-align:right;line-height:1.8;pointer-events:none;background:rgba(14,22,19,.6);padding:7px 11px;border-radius:9px}
  .legend b{color:#a9c9c0}
  @media (max-width:760px){ .panel{width:210px} .detail{width:210px} }
</style>
</head>
<body>
  <div id="map"></div>
  <div class="loading" id="loading">reading the book of accounts…</div>
  <div class="hud top">
    <div class="brand">
      <div class="ey">Hoodie MDM · Coverage</div>
      <h1>The book of accounts</h1>
      <div class="tot" id="tot">—</div>
    </div>
  </div>
  <div class="panel">
    <div class="card sbox"><input id="q" placeholder="🔍 search accounts by name / city…" autocomplete="off" spellcheck="false">
      <div class="sells" id="sells">
        <button data-f="beer">🍺</button><button data-f="wine">🍷</button><button data-f="spirits">🥃</button>
        <button data-f="hemp">🌿</button><button data-f="rtd_spirits" class="rtd" title="beer/wine outlets that can sell spirit-RTDs but not spirits">RTD</button>
      </div>
      <div class="sells" id="corrob" style="padding-top:0">
        <button id="multiBtn" style="flex:1 1 100%" title="Only accounts corroborated by 2+ sources at the same spot (cross-source geo-match, ~110m margin). High-confidence outlets; single-source dots = unconfirmed / possible gaps.">✓ confirmed by 2+ sources</button>
      </div>
    </div>
    <div class="card srcwrap">
      <div class="srch"><span>Sources</span><span><a id="allon">all</a> · <a id="alloff">none</a></span></div>
      <div id="srclist"></div>
    </div>
    <div class="card accwrap">
      <div class="acch"><span id="acctitle">Accounts</span><span class="clr" id="accclr" style="display:none">✕ clear</span></div>
      <div class="acclist" id="acclist"><div class="acc"><div class="none">Click a state, a pin, or search to list accounts.</div></div></div>
    </div>
  </div>
  <div class="detail" id="detail"></div>
  <div class="legend"><b>one dot = one outlet</b> · zoom out to see coverage density<br>coloured by source · click a dot or result for the account</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// US state centroids (approx) — ungeocoded accounts roll up to their state bubble so the full book shows
const STC={AL:[32.8,-86.8],AK:[64.2,-150],AZ:[34.2,-111.7],AR:[34.9,-92.4],CA:[37.2,-119.5],CO:[39,-105.5],
CT:[41.6,-72.7],DE:[39,-75.5],DC:[38.9,-77],FL:[28.6,-82.4],GA:[32.7,-83.4],HI:[20.3,-156.4],ID:[44.4,-114.6],
IL:[40,-89.2],IN:[39.9,-86.3],IA:[42,-93.5],KS:[38.5,-98.4],KY:[37.5,-85.3],LA:[31,-92],ME:[45.4,-69.2],
MD:[39,-76.8],MA:[42.3,-71.8],MI:[44.3,-85.4],MN:[46.3,-94.3],MS:[32.7,-89.7],MO:[38.4,-92.5],MT:[47,-109.6],
NE:[41.5,-99.8],NV:[39.3,-116.6],NH:[43.7,-71.6],NJ:[40.2,-74.7],NM:[34.4,-106.1],NY:[42.9,-75.5],NC:[35.6,-79.4],
ND:[47.4,-100.5],OH:[40.3,-82.8],OK:[35.6,-97.5],OR:[43.9,-120.6],PA:[40.9,-77.8],RI:[41.7,-71.5],SC:[33.9,-80.9],
SD:[44.4,-100.2],TN:[35.9,-86.4],TX:[31.5,-99.3],UT:[39.3,-111.7],VT:[44,-72.7],VA:[37.5,-78.9],WA:[47.4,-120.5],
WV:[38.6,-80.6],WI:[44.6,-89.9],WY:[43,-107.5],PR:[18.2,-66.5]};
const PAL=['#4E79A7','#F28E2B','#59A14F','#B07AA1','#76B7B2','#E15759','#EDC948','#9C755F','#FF9DA7','#8CD17D',
'#499894','#D37295','#B6992D','#86BCB6','#D4A6C8','#79706E','#A0CBE8','#F1CE63','#FABFD2','#BAB0AC','#D7B5A6'];
// wheelPxPerZoomLevel raised (default 60) + zoomSnap .5 so a trackpad flick steps ~one level, not three
const map=L.map('map',{zoomControl:true,attributionControl:false,minZoom:3,maxZoom:16,worldCopyJump:true,
  preferCanvas:true,wheelPxPerZoomLevel:140,wheelDebounceTime:60,zoomSnap:.5,zoomDelta:.5}).setView([39.5,-98.5],4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(map);
L.control.attribution({prefix:false}).addAttribution('© OpenStreetMap · © CARTO').addTo(map);

let DATA=null, srcColor={}, active=new Set();
let ALLPTS=[], DOTSRC=[];   // every geocoded outlet [lat,lng,srcIdx] + the source-name index
function fmt(n){ return (n||0).toLocaleString(); }
function colOf(s){ return srcColor[s]||'#8aa39d'; }

// ONE POINT PER OUTLET — a single canvas draws every geocoded outlet in one pass, so zoomed out the points
// fill into a coverage/density picture and zoomed in they're distinct + clickable (cell-coverage style).
const DotLayer=L.Layer.extend({
  onAdd(map){ this._map=map; const c=this._c=L.DomUtil.create('canvas','leaflet-zoom-hide');
    c.style.cssText='position:absolute;top:0;left:0;pointer-events:none';
    map.getPanes().overlayPane.appendChild(c);
    map.on('moveend zoomend viewreset', this._draw, this); this._draw(); },
  onRemove(map){ L.DomUtil.remove(this._c); map.off('moveend zoomend viewreset', this._draw, this); },
  _draw(){ const m=this._map; if(!m) return; const size=m.getSize(), dpr=Math.min(2,window.devicePixelRatio||1);
    this._c.width=size.x*dpr; this._c.height=size.y*dpr; this._c.style.width=size.x+'px'; this._c.style.height=size.y+'px';
    L.DomUtil.setPosition(this._c, m.containerPointToLayerPoint([0,0]));
    const ctx=this._c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,size.x,size.y);
    const z=m.getZoom(), w=size.x, h=size.y;
    const rad = z>=9?3 : z>=7?2.2 : z>=5?1.5 : 1.1;         // dots grow a touch as you zoom in
    ctx.globalAlpha = z>=6?0.92:0.72;
    for(let i=0;i<ALLPTS.length;i++){ const p=ALLPTS[i];
      if(!active.has(DOTSRC[p[2]])) continue;                // source filter (client-side, per draw)
      const cp=m.latLngToContainerPoint([p[0],p[1]]);
      if(cp.x<-2||cp.y<-2||cp.x>w+2||cp.y>h+2) continue;
      ctx.fillStyle=colOf(DOTSRC[p[2]]); ctx.fillRect(cp.x-rad/2, cp.y-rad/2, rad, rad); }
    ctx.globalAlpha=1; }
});
const dots=new DotLayer().addTo(map);
function redrawDots(){ dots._draw(); }

async function load(){
  const d=await fetch('/api/coverage',{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
  const L0=document.getElementById('loading');
  if(!d||!d.ok||!d.by_source){ if(L0)L0.textContent='engine offline — coverage needs the backend'; return; }
  DATA=d;
  (d.by_source||[]).forEach((s,i)=>{ srcColor[s.source]=PAL[i%PAL.length]; active.add(s.source); });
  document.getElementById('tot').innerHTML='<b>'+fmt(d.total)+'</b> accounts · '+(d.by_source||[]).length+' sources · '+fmt(d.geocoded||0)+' geocoded';
  renderSources(); loadDots();
  if(L0)L0.remove();
}
function renderSources(){
  const el=document.getElementById('srclist');
  el.innerHTML=(DATA.by_source||[]).map(s=>
    '<div class="src'+(active.has(s.source)?'':' off')+'" data-s="'+esc(s.source)+'">'
    +'<span class="sw" style="background:'+colOf(s.source)+'"></span>'+esc(s.source)
    +'<span class="cnt">'+fmt(s.n)+'</span></div>').join('');
  el.querySelectorAll('.src').forEach(x=>x.onclick=()=>{ const s=x.getAttribute('data-s');
    if(active.has(s))active.delete(s); else active.add(s); renderSources(); redrawDots(); });
}
let dotReq=0;
async function loadDots(){
  const my=++dotReq;
  const params=new URLSearchParams(); if(sellFlag) params.set('sells',sellFlag); if(multiOnly) params.set('multi','1');
  const d=await fetch('/api/coverage/dots?'+params,{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
  if(my!==dotReq || !d || !d.points) return;
  ALLPTS=d.points; DOTSRC=d.sources||[];
  redrawDots();
}
// click the map → the nearest account to that point (server-side), then its detail
map.on('click', async e=>{
  const z=map.getZoom(), r = z>=11?0.008 : z>=8?0.03 : z>=6?0.09 : 0.25;
  const d=await fetch('/api/coverage/at?lat='+e.latlng.lat+'&lng='+e.latlng.lng+'&r='+r,{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
  if(d && d.account && active.has(d.account.source)) showDetail(d.account);
});
let listReq=0;
async function loadAccounts(filter){
  const my=++listReq;
  const params=new URLSearchParams();
  if(filter.state) params.set('state',filter.state);
  if(filter.source) params.set('source',filter.source);
  if(filter.q) params.set('q',filter.q);
  if(sellFlag) params.set('sells',sellFlag);
  params.set('limit','400');
  const title=filter.q?('“'+filter.q+'”'):(filter.state?('State · '+filter.state):(filter.source||'Accounts'));
  document.getElementById('acctitle').textContent=title;
  document.getElementById('accclr').style.display='inline';
  const box=document.getElementById('acclist'); box.innerHTML='<div class="acc"><div class="none">loading…</div></div>';
  const d=await fetch('/api/coverage/accounts?'+params,{cache:'no-store'}).then(r=>r.json()).catch(()=>null);
  if(my!==listReq) return;
  if(!d||!d.accounts||!d.accounts.length){ box.innerHTML='<div class="acc"><div class="none">no accounts</div></div>'; return; }
  const acc=d.accounts.filter(a=>active.has(a.source));
  box.innerHTML=acc.map((a,i)=>
    '<div class="acc" data-i="'+i+'"><div class="nm">'+esc(a.store_name||'(unnamed)')+'</div>'
    +'<div class="sub"><span class="dot" style="background:'+colOf(a.source)+'"></span>'+esc(a.source)
    +(a.chain?(' · 🔗'+esc(a.chain)):'')+(a.city?(' · '+esc(a.city)):'')+(a.state?(' '+esc(a.state)):'')+(a.lat!=null?' · 📍':'')+'</div></div>').join('')
    +(d.count>=400?'<div class="acc"><div class="none">showing first 400</div></div>':'');
  box.querySelectorAll('.acc[data-i]').forEach(el=>el.onclick=()=>{
    box.querySelectorAll('.acc').forEach(x=>x.classList.remove('on')); el.classList.add('on');
    showDetail(acc[+el.dataset.i]); });
}
function clearList(){ listReq++; document.getElementById('acctitle').textContent='Accounts';
  document.getElementById('accclr').style.display='none';
  document.getElementById('acclist').innerHTML='<div class="acc"><div class="none">Click a state, a pin, or search to list accounts.</div></div>'; }
document.getElementById('accclr').onclick=clearList;
function showDetail(a){
  const el=document.getElementById('detail');
  const rows=[['source',a.source,'mono'],['chain',a.chain],['hoodie id',a.hoodie_outlet,'mono'],['store id',a.store_id,'mono'],
    ['address',[a.address,a.city,[a.state,a.zip].filter(Boolean).join(' ')].filter(Boolean).join(', ')],
    ['phone',a.phone],['geo',(a.lat!=null&&a.lng!=null)?(a.lat+', '+a.lng):null,'mono']]
    .filter(r=>r[1]!=null&&String(r[1]).trim()!=='');
  const F=[['f_beer','🍺 Beer'],['f_wine','🍷 Wine'],['f_spirits','🥃 Spirits'],['f_hemp','🌿 Hemp'],['f_cannabis','🍁 Cannabis']];
  const BASIS={product:'✓ grounded in products carried',license:'⚖ license-permitted',source:'~ source estimate'};
  let chips=F.filter(f=>a[f[0]]).map(f=>'<span class="fchip on">'+f[1]+'</span>').join('')
    + (a.f_rtd_spirits?'<span class="fchip rtd">spirits-RTD ok · no spirits</span>':'');
  if(chips && a.flag_basis && BASIS[a.flag_basis]) chips+='<span class="fbasis">'+BASIS[a.flag_basis]+'</span>';
  if(a.license_conflict) chips+='<span class="fchip err">⚠ sells beyond its license</span>';
  el.innerHTML='<button class="x" id="dx">✕</button>'
    +'<div class="k">Account</div><div class="nm">'+esc(a.store_name||'(unnamed)')+'</div>'
    +'<div class="badge"><span class="dot" style="background:'+colOf(a.source)+'"></span>'+esc(a.source)+'</div>'
    +(chips?'<div class="fchips">'+chips+'</div>':'')
    +rows.map(r=>'<div class="row"><span class="lab">'+esc(r[0])+'</span><span class="val'+(r[2]?' '+r[2]:'')+'">'+esc(r[1])+'</span></div>').join('')
    +((a.lat==null)?'<div class="nogeo">⚑ not geocoded — shown via its state bubble</div>':'');
  el.classList.add('show'); document.getElementById('dx').onclick=()=>el.classList.remove('show');
  if(a.lat!=null&&a.lng!=null){ map.flyTo([a.lat,a.lng],11,{duration:.8}); }
  else if(a.state&&STC[a.state]){ map.flyTo(STC[a.state],6,{duration:.8}); }
}
let qt=null;
document.getElementById('q').addEventListener('input',e=>{ clearTimeout(qt); const v=e.target.value.trim();
  qt=setTimeout(()=>{ if(v.length>=2) loadAccounts({q:v}); else clearList(); },260); });
document.getElementById('allon').onclick=()=>{ (DATA.by_source||[]).forEach(s=>active.add(s.source)); renderSources(); redrawDots(); };
document.getElementById('alloff').onclick=()=>{ active.clear(); renderSources(); redrawDots(); };
// sell-flag filter — beer/wine/spirits/hemp + the spirits-RTD-but-not-spirits class
let multiOnly=false;
document.getElementById('multiBtn').onclick=(e)=>{ multiOnly=!multiOnly; e.currentTarget.classList.toggle('on',multiOnly); loadDots(); };
let sellFlag='';
document.querySelectorAll('#sells button').forEach(b=>b.onclick=()=>{
  const f=b.getAttribute('data-f'); sellFlag=(sellFlag===f)?'':f;
  document.querySelectorAll('#sells button').forEach(x=>x.classList.toggle('on', x.getAttribute('data-f')===sellFlag));
  loadDots();
  const q=document.getElementById('q').value.trim();
  if(q.length>=2) loadAccounts({q}); else if(sellFlag) loadAccounts({}); else clearList();
});
load();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<script src="../spine/session-guard.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Match Review</title>
<style>
  :root{
    --paper:#FBFAF8; --card:#FFFFFF; --ink:#1E262E; --ink-2:#3A4650; --mut:#63727F;
    --slate:#4E79A7; --master:#8A5FB0; --line:#E2E6EC; --line-2:#EEF1F5; --rail:#F4F6F9;
    --good:#3F8F6E; --good-bg:#E7F3ED; --warn:#B6822C; --warn-bg:#F6EEDC; --bad:#C0574A; --bad-bg:#F6E5E2;
    --chip:#EEF2F7; --shadow:0 1px 2px rgba(30,38,46,.06),0 10px 26px rgba(30,38,46,.06);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#12161B; --card:#1A2027; --ink:#E7ECF1; --ink-2:#C4CDD6; --mut:#8A98A5;
    --slate:#6E9BCB; --master:#A986C8; --line:#28313A; --line-2:#20272E; --rail:#161B21;
    --chip:#232C35; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.34);
    --good:#5FB58E; --good-bg:#1A2C25; --warn:#D0A14A; --warn-bg:#2C2618; --bad:#DB7C6E; --bad-bg:#2E1F1D;
  }}
  :root[data-theme="dark"]{
    --paper:#12161B; --card:#1A2027; --ink:#E7ECF1; --ink-2:#C4CDD6; --mut:#8A98A5;
    --slate:#6E9BCB; --master:#A986C8; --line:#28313A; --line-2:#20272E; --rail:#161B21;
    --chip:#232C35; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.34);
    --good:#5FB58E; --good-bg:#1A2C25; --warn:#D0A14A; --warn-bg:#2C2618; --bad:#DB7C6E; --bad-bg:#2E1F1D;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  .mono,code{font-family:var(--mono)}

  /* header */
  .hd{flex:none;padding:16px 22px 0;border-bottom:1px solid var(--line);background:var(--card)}
  .hd .row1{display:flex;align-items:center;gap:12px}
  .hd .mk{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--master);width:30px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px}
  .hd h1{font-size:19px;margin:0;font-weight:720;letter-spacing:-.01em}
  .hd .sub{color:var(--mut);font-size:12.5px}
  .hd .spacer{flex:1}
  .fresh{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
  .fresh .led{width:7px;height:7px;border-radius:50%}
  .fresh.ok{background:var(--good-bg);color:var(--good)}.fresh.ok .led{background:var(--good)}
  .fresh.dim{background:var(--chip);color:var(--mut)}.fresh.dim .led{background:var(--mut)}

  /* funnel */
  .funnel{display:flex;gap:8px;margin:14px 0 12px;flex-wrap:wrap}
  .fstage{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:7px 12px;display:flex;flex-direction:column;gap:1px;min-width:88px}
  .fstage b{font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .fstage small{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
  .fstage.hot{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:var(--warn-bg)}
  .fstage.hot b{color:var(--warn)}
  .fstage.good b{color:var(--good)}
  .farrow{align-self:center;color:var(--mut);font-size:13px}

  /* tabs */
  .tabs{display:flex;gap:2px;margin-top:2px}
  .tab{padding:9px 15px;font-size:13.5px;color:var(--mut);border:0;background:none;border-bottom:2px solid transparent;font-weight:600}
  .tab.on{color:var(--ink);border-bottom-color:var(--master)}
  .tab .n{font-family:var(--mono);font-size:11px;color:var(--mut);margin-left:5px}
  .tab.on .n{color:var(--master)}

  /* body */
  main{flex:1;overflow:auto;padding:18px 22px 40px}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .toolbar input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13.5px;width:260px;outline:none}
  .toolbar input:focus{border-color:var(--master)}
  .toolbar .hint{color:var(--mut);font-size:12.5px;margin-left:auto}

  /* needs-you cards */
  .qlist{display:flex;flex-direction:column;gap:9px;max-width:940px}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}
  .qtop{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
  .qname{font-weight:650;font-size:15px}
  .qmeta{font-size:12px;color:var(--mut);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .src{font-family:var(--mono);font-size:10.5px;color:var(--mut);background:var(--chip);padding:1px 6px;border-radius:4px}
  .conf{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;font-weight:600}
  .conf.hi{background:var(--good-bg);color:var(--good)} .conf.lo{background:var(--warn-bg);color:var(--warn)} .conf.new{background:var(--chip);color:var(--mut)}
  .tier{font-family:var(--mono);font-size:10px;color:var(--master);background:color-mix(in srgb,var(--master) 12%,transparent);padding:1px 6px;border-radius:4px}
  .qright{margin-left:auto;display:flex;align-items:center;gap:8px}
  .chev{color:var(--mut);font-size:12px;transition:transform .15s}
  .qcard.open .chev{transform:rotate(90deg)}
  .qbody{display:none;margin-top:12px;border-top:1px solid var(--line-2);padding-top:12px}
  .qcard.open .qbody{display:block}
  .cand{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line-2);border-radius:8px;padding:8px 11px;margin-bottom:6px}
  .cand .cw{flex:1}
  .cand .why{font-size:11.5px;color:var(--mut);margin-top:2px}
  .cand.win{border-color:color-mix(in srgb,var(--master) 40%,var(--line))}
  .keys{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
  .keys span{font-family:var(--mono);font-size:10px;color:var(--mut);background:var(--chip);padding:1px 5px;border-radius:4px}
  .qact{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
  .btn{font-size:12.5px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink-2)}
  .btn:hover{border-color:var(--mut)}
  .btn.good{background:var(--good-bg);color:var(--good);border-color:transparent}
  .btn.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
  .btn.pri{background:var(--master);color:#fff;border-color:var(--master)}
  .btn:disabled{opacity:.5;cursor:default}

  /* automatched table */
  table.mt{width:100%;border-collapse:collapse;font-size:13.5px;max-width:1040px}
  table.mt th{text-align:left;font-weight:600;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:9px 11px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper)}
  table.mt td{padding:10px 11px;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
  table.mt tr:hover td{background:var(--card)}
  .undo{font-family:var(--mono);font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:none}
  .undo:hover{color:var(--bad);border-color:var(--bad)}

  .empty{max-width:520px;margin:48px auto;text-align:center;color:var(--mut)}
  .empty .big{font-size:34px;margin-bottom:8px}
  .empty h3{color:var(--ink);font-size:17px;margin:0 0 6px}
  .empty p{font-size:13.5px;line-height:1.6;margin:0}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:13px;padding:9px 16px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--master);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="hd">
  <div class="row1">
    <span class="mk">MR</span>
    <div>
      <h1>Match Review</h1>
      <div class="sub">One place — automatched items, and the human-in-the-loop queue for unknown matches.</div>
    </div>
    <div class="spacer"></div>
    <span class="fresh dim" id="fresh"><span class="led"></span>loading…</span>
  </div>
  <div class="funnel" id="funnel"></div>
  <div class="tabs">
    <button class="tab on" data-tab="review" id="tabReview">Needs you<span class="n" id="cReview">·</span></button>
    <button class="tab" data-tab="merges" id="tabMerges">Duplicates<span class="n" id="cMerges">·</span></button>
    <button class="tab" data-tab="master" id="tabMaster">Automatched<span class="n" id="cMaster">·</span></button>
  </div>
</div>

<main id="main"></main>
<div class="toast" id="toast"></div>

<script src="../spine/spine.js"></script>
<script>
(function(){
  "use strict";
  var API = "";
  var TAB = "review";
  var reviewItems = null, masterItems = null, mergeItems = null, mergeTotal = null, SUMMARY = null, LIVE = null;
  var main = document.getElementById("main");

  function api(path, opts){ return fetch(API+path, opts).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }
  function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("show");},2200); }
  function nfmt(n){ return (n==null)?"—":Number(n).toLocaleString(); }

  /* ---------- funnel + freshness ---------- */
  function renderFunnel(){
    var f=document.getElementById("funnel");
    if(!SUMMARY){ f.innerHTML=""; return; }
    var s=SUMMARY.stages||{};
    var stages=[
      {k:"candidates",label:"candidates",v:s.candidates},
      {k:"auto",label:"auto-matched",v:s.auto,cls:"good"},
      {k:"claude",label:"claude",v:s.claude},
      {k:"analyst",label:"needs you",v:s.analyst,cls:"hot"},
      {k:"confirmed",label:"in master",v:s.confirmed,cls:"good"}
    ];
    f.innerHTML = stages.map(function(st,i){
      return (i?'<span class="farrow">→</span>':'')+
        '<div class="fstage '+(st.cls||"")+'"><b>'+nfmt(st.v)+'</b><small>'+st.label+'</small></div>';
    }).join("");
  }
  function renderFresh(){
    var el=document.getElementById("fresh");
    if(LIVE===false){ el.className="fresh dim"; el.innerHTML='<span class="led"></span>warehouse offline'; return; }
    if(SUMMARY){ el.className="fresh ok"; el.innerHTML='<span class="led"></span>master build · '+nfmt(SUMMARY.master)+' SKUs corroborated'; }
  }
  function setCounts(){
    var rTotal = (SUMMARY && SUMMARY.stages && SUMMARY.stages.analyst);
    document.getElementById("cReview").textContent = rTotal!=null ? nfmt(rTotal) : (reviewItems?nfmt(reviewItems.length):"·");
    var mTotal = (SUMMARY && SUMMARY.stages && SUMMARY.stages.auto);
    document.getElementById("cMaster").textContent = mTotal!=null ? nfmt(mTotal) : (masterItems?nfmt(masterItems.length):"·");
    document.getElementById("cMerges").textContent = (mergeTotal!=null) ? nfmt(mergeTotal) : (mergeItems?nfmt(mergeItems.length):"·");
  }

  /* ---------- data ---------- */
  function load(){
    api("/api/master/workbench/summary").then(function(d){ SUMMARY=d; LIVE=true; renderFunnel(); renderFresh(); setCounts(); if(TAB==="review"&&reviewItems)render(); })
      .catch(function(){ LIVE=false; renderFresh(); render(); });
    reload();
  }
  function reload(){
    if(TAB==="review"){
      if(reviewItems){ render(); return; }
      main.innerHTML=loadingHtml("Loading the review queue…");
      api("/api/master/workbench/review").then(function(d){ reviewItems=d.items||[]; setCounts(); render(); })
        .catch(function(){ LIVE=false; renderFresh(); render(); });
    }else if(TAB==="merges"){
      if(mergeItems){ render(); return; }
      main.innerHTML=loadingHtml("Loading duplicate groups…");
      api("/api/master/workbench/merges").then(function(d){ mergeItems=d.merges||[]; mergeTotal=(typeof d.count==="number"?d.count:mergeItems.length); setCounts(); render(); })
        .catch(function(){ LIVE=false; renderFresh(); render(); });
    }else{
      if(masterItems){ render(); return; }
      main.innerHTML=loadingHtml("Loading automatched items…");
      api("/api/master/workbench/master").then(function(d){ masterItems=d.items||[]; setCounts(); render(); })
        .catch(function(){ LIVE=false; renderFresh(); render(); });
    }
  }
  function loadingHtml(t){ return '<div class="empty"><div class="spin"></div><p style="margin-top:12px">'+t+'</p></div>'; }

  /* ---------- render ---------- */
  function render(){
    if(LIVE===false){ main.innerHTML = offlineHtml(); return; }
    if(TAB==="review") renderReview(); else if(TAB==="merges") renderMerges(); else renderMaster();
  }
  function offlineHtml(){
    return '<div class="empty"><div class="big">◍</div><h3>The warehouse agent isn’t reachable</h3>'+
      '<p>Match Review reads live from the master build (<code>/api/master/workbench/*</code>). '+
      'Start the local agent (<code>python unifyd/server.py</code>) or open this on the deployed suite, '+
      'and the queue + automatched items appear. Nothing is shown that the warehouse can’t back.</p></div>';
  }

  function confBadge(c){
    var v=(c==null)?null:Number(c);
    if(v==null) return '<span class="conf new">no score</span>';
    var cls = v>=0.85?"hi":(v>=0.6?"lo":"new");
    return '<span class="conf '+cls+'">'+Math.round(v*100)+'%</span>';
  }

  function renderReview(){
    var items=reviewItems||[];
    if(!items.length){
      main.innerHTML='<div class="empty"><div class="big">✓</div><h3>Queue clear</h3><p>No unknown or low-confidence matches are waiting. New single-source items land here when the next master build runs.</p></div>';
      return;
    }
    var total = (SUMMARY && SUMMARY.stages && SUMMARY.stages.analyst) || items.length;
    var capNote = (total > items.length) ? ('showing the top '+nfmt(items.length)+' of '+nfmt(total)+' · ranked by how many source rows collapse into each')
                                         : (items.length+' items');
    var html='<div class="toolbar"><input id="qf" placeholder="Filter this queue…"/>'+
      '<span class="hint">'+capNote+' · single-source, needs an independent corroboration or your call</span></div>'+
      '<div class="qlist" id="qlist"></div>';
    main.innerHTML=html;
    drawReviewList(items);
    document.getElementById("qf").addEventListener("input", function(){
      var q=this.value.toLowerCase().trim();
      drawReviewList(items.filter(function(it){ return ((it.candidate_name||"")+" "+(it.brand||"")+" "+(it.upc||"")).toLowerCase().indexOf(q)>=0; }));
    });
  }
  function drawReviewList(items){
    var box=document.getElementById("qlist"); if(!box) return;
    box.innerHTML = items.slice(0,300).map(function(it){
      var cid=it.cluster_id;
      var srcs=(it.corroborated_by||"").split(",").map(function(s){return s.trim();}).filter(Boolean);
      var srcHtml=srcs.length?srcs.map(function(s){return '<span class="src">'+s+'</span>';}).join(""):'<span class="src">single source</span>';
      return '<div class="qcard" data-cid="'+cid+'">'+
        '<div class="qtop">'+
          '<div><div class="qname">'+(it.candidate_name||"(unnamed)")+'</div>'+
          '<div class="qmeta">'+srcHtml+
            (it.upc?'<span>UPC '+it.upc+'</span>':'<span>no UPC</span>')+
            (it.source_rows?'<span>'+it.source_rows+' rows</span>':'')+
            (it.review_tier?'<span class="tier">'+it.review_tier+'</span>':'')+
          '</div></div>'+
          '<div class="qright">'+confBadge(it.confidence)+'<span class="chev">▸</span></div>'+
        '</div>'+
        '<div class="qbody" id="body-'+cid+'"><div class="spin"></div></div>'+
      '</div>';
    }).join("");
    box.querySelectorAll(".qcard").forEach(function(card){
      card.querySelector(".qtop").addEventListener("click", function(){ toggleCard(card); });
    });
  }
  function toggleCard(card){
    var open=card.classList.toggle("open");
    if(!open) return;
    var cid=card.dataset.cid, body=document.getElementById("body-"+cid);
    if(body.dataset.loaded){ return; }
    api("/api/master/workbench/candidates/"+encodeURIComponent(cid)).then(function(d){
      body.dataset.loaded="1";
      var cands=(d.candidates||[]);
      var chosen = cands[0] ? cands[0].name : "";
      body.innerHTML =
        (cands.length?cands.map(function(c){
          return '<div class="cand'+(c.win?' win':'')+'"><div class="cw"><div>'+(c.win?'★ ':'')+c.name+' '+confBadge(c.conf)+'</div>'+
            '<div class="why">'+(c.why||"")+'</div>'+
            (c.keys&&c.keys.length?'<div class="keys">'+c.keys.map(function(k){return '<span>'+k+'</span>';}).join("")+'</div>':'')+
          '</div></div>';
        }).join(""):'<div class="cand"><div class="cw">No candidate found — this may be a genuinely new master item.</div></div>')+
        '<div class="qact">'+
          '<button class="btn good" data-act="confirm">✓ Confirm match</button>'+
          '<button class="btn" data-act="new">＋ New master item</button>'+
          '<button class="btn bad" data-act="reject">✕ Not a match</button>'+
          '<button class="btn" data-act="escalate">↑ Escalate</button>'+
        '</div>';
      body.querySelectorAll(".btn").forEach(function(b){
        b.addEventListener("click", function(){ decide(cid, b.dataset.act, chosen, body); });
      });
    }).catch(function(){ body.innerHTML='<div class="cand"><div class="cw">Couldn’t load candidates.</div></div>'; });
  }

  function decide(cid, act, chosen, body){
    var map={confirm:"confirm", reject:"reject", escalate:"escalate", "new":"confirm"};
    var action=map[act]||act;
    var payload={cluster_id:cid, action:action};
    if(act==="confirm") payload.matched_name=chosen;
    if(act==="new"){ payload.matched_name=""; payload.note="new master item"; }
    if(act==="escalate") payload.tier="senior";
    body.querySelectorAll(".btn").forEach(function(b){ b.disabled=true; });
    api("/api/master/workbench/match", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)})
      .then(function(){
        // optimistic: remove from the queue, bump counts
        reviewItems = (reviewItems||[]).filter(function(x){ return String(x.cluster_id)!==String(cid); });
        var card=body.closest(".qcard"); if(card){ card.style.transition="opacity .2s"; card.style.opacity="0"; setTimeout(function(){ card.remove(); },200); }
        setCounts();
        var msg={confirm:"Confirmed → master",reject:"Rejected",escalate:"Escalated to senior","new":"Created new master item"}[act]||"Recorded";
        toast(msg);
        masterItems=null;  // automatched changed — refetch next time it's opened
      })
      .catch(function(){ toast("Couldn’t record — is the agent up?"); body.querySelectorAll(".btn").forEach(function(b){ b.disabled=false; }); });
  }

  function renderMaster(){
    var items=masterItems||[];
    if(!items.length){
      main.innerHTML='<div class="empty"><div class="big">◱</div><h3>No automatched items yet</h3><p>Items corroborated by two or more independent sources appear here once the master build has run.</p></div>';
      return;
    }
    var html='<div class="toolbar"><input id="mf" placeholder="Search automatched…"/>'+
      '<span class="hint">'+nfmt(items.length)+' loaded · corroborated by 2+ sources · every match keeps its provenance</span></div>'+
      '<div style="overflow:auto"><table class="mt" id="mt"><thead><tr>'+
      '<th>Item</th><th>Brand</th><th>Corroborated by</th><th>UPC</th><th>Conf.</th><th></th></tr></thead><tbody id="mtb"></tbody></table></div>';
    main.innerHTML=html;
    drawMaster(items);
    document.getElementById("mf").addEventListener("input", function(){
      var q=this.value.toLowerCase().trim();
      drawMaster(items.filter(function(it){ return ((it.candidate_name||"")+" "+(it.brand||"")+" "+(it.upc||"")).toLowerCase().indexOf(q)>=0; }));
    });
  }
  function drawMaster(items){
    var tb=document.getElementById("mtb"); if(!tb) return;
    tb.innerHTML = items.slice(0,400).map(function(it){
      var srcs=(it.corroborated_by||"").split(",").map(function(s){return s.trim();}).filter(Boolean);
      return '<tr data-cid="'+it.cluster_id+'">'+
        '<td style="color:var(--ink);font-weight:500">'+(it.candidate_name||"(unnamed)")+'</td>'+
        '<td>'+(it.brand||"—")+'</td>'+
        '<td>'+(srcs.length?srcs.map(function(s){return '<span class="src">'+s+'</span>';}).join(" "):'<span class="src">—</span>')+'</td>'+
        '<td class="mono" style="font-size:12px">'+(it.upc||"—")+'</td>'+
        '<td>'+confBadge(it.confidence)+'</td>'+
        '<td style="text-align:right"><button class="undo" data-cid="'+it.cluster_id+'">↺ undo</button></td>'+
      '</tr>';
    }).join("");
    tb.querySelectorAll(".undo").forEach(function(b){
      b.addEventListener("click", function(){
        var cid=b.dataset.cid;
        b.disabled=true;
        api("/api/master/workbench/match",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cluster_id:cid,action:"reject",note:"undo automatch"})})
          .then(function(){ masterItems=(masterItems||[]).filter(function(x){return String(x.cluster_id)!==String(cid);}); reviewItems=null; setCounts(); drawMaster(masterItems); toast("Automatch reversed — back to the queue"); })
          .catch(function(){ toast("Couldn’t reverse — is the agent up?"); b.disabled=false; });
      });
    });
  }

  /* ---------- duplicates (merge groups) ---------- */
  function renderMerges(){
    var items=mergeItems||[];
    if(!items.length){
      main.innerHTML='<div class="empty"><div class="big">≣</div><h3>No duplicate groups</h3><p>When the master build finds the same product+size split across different or missing UPCs, the merge calls land here. Nothing pending.</p></div>';
      return;
    }
    var capNote = (mergeTotal!=null && mergeTotal>items.length) ? ('showing the top '+nfmt(items.length)+' of '+nfmt(mergeTotal))
                                                               : (items.length+' groups');
    var html='<div class="toolbar"><input id="gf" placeholder="Filter duplicates…"/>'+
      '<span class="hint">'+capNote+' · same product+size fractured across UPCs · highest-impact first</span></div>'+
      '<div class="qlist" id="glist"></div>';
    main.innerHTML=html;
    drawMergeList(items);
    document.getElementById("gf").addEventListener("input", function(){
      var q=this.value.toLowerCase().trim();
      drawMergeList(items.filter(function(g){ return ((g.name||"")+" "+(g.brand||"")).toLowerCase().indexOf(q)>=0; }));
    });
  }
  function drawMergeList(items){
    var box=document.getElementById("glist"); if(!box) return;
    box.innerHTML = items.slice(0,300).map(function(g){
      var mid=g.merge_id;
      return '<div class="qcard" data-mid="'+mid+'">'+
        '<div class="qtop">'+
          '<div><div class="qname">'+(g.name||"(unnamed)")+'</div>'+
          '<div class="qmeta">'+(g.brand?'<span class="src">'+g.brand+'</span>':'')+
            '<span>'+g.n_skus+' SKUs</span><span>'+g.distinct_upc+' distinct UPC'+(g.distinct_upc===1?'':'s')+'</span>'+
            (g.total_rows?'<span>'+g.total_rows+' rows</span>':'')+
          '</div></div>'+
          '<div class="qright"><span class="conf lo">merge?</span><span class="chev">▸</span></div>'+
        '</div>'+
        '<div class="qbody" id="mbody-'+mid+'"><div class="spin"></div></div>'+
      '</div>';
    }).join("");
    box.querySelectorAll(".qcard").forEach(function(card){
      card.querySelector(".qtop").addEventListener("click", function(){ toggleMerge(card); });
    });
  }
  function toggleMerge(card){
    var open=card.classList.toggle("open");
    if(!open) return;
    var mid=card.dataset.mid, body=document.getElementById("mbody-"+mid);
    if(body.dataset.loaded){ return; }
    api("/api/master/workbench/merge-detail/"+encodeURIComponent(mid)).then(function(d){
      body.dataset.loaded="1";
      var mems=(d.members||[]);
      body.innerHTML =
        '<div style="font-size:12px;color:var(--mut);margin-bottom:8px">'+(d.reason||"")+'</div>'+
        mems.map(function(m){
          var srcs=(m.source_list||[]).map(function(s){return '<span class="src">'+s+'</span>';}).join("");
          var attrs=[m.size_ml?_sz(m.size_ml):"", m.pack?("×"+m.pack):"", m.abv?(m.abv+"% ABV"):"", m.container||""].filter(Boolean).join(" · ");
          return '<div class="cand"><div class="cw"><div>'+(m.variant||d.name||"member")+
            (attrs?' <span style="color:var(--mut)">'+attrs+'</span>':'')+'</div>'+
            '<div class="keys"><span>'+(m.upc?("upc:"+m.upc):"no-upc")+'</span>'+srcs+'</div>'+
          '</div></div>';
        }).join("")+
        '<div class="qact">'+
          '<button class="btn pri" data-act="merge">⣿ Merge — one SKU</button>'+
          '<button class="btn" data-act="keep_separate">Keep separate</button>'+
        '</div>';
      body.querySelectorAll(".btn").forEach(function(b){
        b.addEventListener("click", function(){ decideMerge(mid, b.dataset.act, d.name, body); });
      });
    }).catch(function(){ body.innerHTML='<div class="cand"><div class="cw">Couldn’t load the group.</div></div>'; });
  }
  function _sz(ml){ ml=Number(ml); if(!ml) return ""; return ml>=1000?((ml/1000)+"L"):(ml+"ml"); }
  function decideMerge(mid, action, name, body){
    body.querySelectorAll(".btn").forEach(function(b){ b.disabled=true; });
    api("/api/master/workbench/merge", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({merge_id:mid, action:action, name:name})})
      .then(function(){
        mergeItems=(mergeItems||[]).filter(function(x){ return String(x.merge_id)!==String(mid); });
        var card=body.closest(".qcard"); if(card){ card.style.transition="opacity .2s"; card.style.opacity="0"; setTimeout(function(){ card.remove(); },200); }
        setCounts();
        toast(action==="merge"?"Merged into one SKU":"Kept separate");
      })
      .catch(function(){ toast("Couldn’t record — is the agent up?"); body.querySelectorAll(".btn").forEach(function(b){ b.disabled=false; }); });
  }

  /* ---------- tabs ---------- */
  document.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){
      document.querySelectorAll(".tab").forEach(function(x){ x.classList.remove("on"); });
      t.classList.add("on"); TAB=t.dataset.tab; reload();
    });
  });

  /* ---------- spine ---------- */
  try{
    window._spine = HoodieSpine.connect({name:"Match Review", onContext:function(){}});
  }catch(e){}

  load();
})();
</script>
<script src="../suite-header.js" data-id="match-review" data-mark="MR" data-name="Match Review" data-status="beta"></script>
</body>
</html>

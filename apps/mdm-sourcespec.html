<script src="../spine/session-guard.js"></script>
<title>Hoodie MDM · Source Spec</title>
<style>
:root{--bg:#0f1714;--card:#131f1b;--ink:#e9f2ef;--mut:#8aa39d;--ln:#233731;--teal:#3fb8a3;--hi:#5bb86e;--mid:#d9a13f;--der:#4E79A7;--miss:#2a3a34}
@media(prefers-color-scheme:light){:root{--bg:#f2f6f4;--card:#fff;--ink:#12201b;--mut:#5a6f68;--ln:#dde7e3;--miss:#e4ece8}}
:root[data-theme=dark]{--bg:#0f1714;--card:#131f1b;--ink:#e9f2ef;--mut:#8aa39d;--ln:#233731;--miss:#2a3a34}
:root[data-theme=light]{--bg:#f2f6f4;--card:#fff;--ink:#12201b;--mut:#5a6f68;--ln:#dde7e3;--miss:#e4ece8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 60px}
h1{font-size:22px;margin:0 0 3px;letter-spacing:-.01em}.sub{color:var(--mut);font-size:13px;margin:0 0 6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:11.5px;margin:12px 0 26px;font-family:ui-monospace,monospace}
.legend b{color:var(--ink)}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:middle;margin-right:4px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);border-bottom:1px solid var(--ln);padding-bottom:7px;margin:30px 0 14px}
h2 b{color:var(--mut);font-weight:400;margin-left:5px}
.src{background:var(--card);border:1px solid var(--ln);border-radius:11px;padding:13px 15px;margin-bottom:11px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
.snm{font-weight:650;font-size:15px}.sk{font-family:ui-monospace,monospace;font-size:11px;color:var(--mut);font-weight:400;margin-left:5px}
.srn{font-family:ui-monospace,monospace;font-size:12px;color:var(--mut);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.ch{font-family:ui-monospace,monospace;font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--miss);color:var(--mut);border:1px solid transparent}
.ch b{margin-left:5px;font-weight:700}
.ch.hi{background:color-mix(in srgb,var(--hi) 20%,transparent);color:var(--hi);border-color:color-mix(in srgb,var(--hi) 35%,transparent)}
.ch.mid{background:color-mix(in srgb,var(--mid) 18%,transparent);color:var(--mid)}
.ch.miss{opacity:.5}.ch.der{outline:1px dashed var(--der);opacity:.8}
.exwrap{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--ln);padding-top:9px}
.ex{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--mut)}
.state{padding:40px 6px;color:var(--mut);font-size:13px}
</style>
<div class="wrap">
<h1>Source Spec &mdash; what every source gives us</h1>
<p class="sub">Per source: rows, the fields we capture (% populated), and sample product names. <b>Live</b> from <code style="color:var(--teal)">_stage_product</code> &mdash; updates every rebuild.</p>
<div class="legend"><span><span class="dot" style="background:var(--hi)"></span><b>80%+</b></span><span><span class="dot" style="background:var(--mid)"></span>30&ndash;79%</span><span><span class="dot" style="background:var(--mut)"></span>&lt;30%</span><span><span class="dot" style="background:var(--miss)"></span>absent</span><span><span class="dot" style="outline:1px dashed var(--der);background:transparent"></span>derivable from name</span></div>
<div id="spec"><div class="state">Loading the source spec…</div></div>
</div>
<script>
const LABEL={ttb_products:"TTB · COLA registry",offprem_products:"Off-premise · Shopify/Woo/Wix",cityhive_products:"City Hive",binnys_products:"Binny's",specs_products:"Spec's",abc_products:"ABC Fine Wine (FL) · facets",abc_catalog:"ABC Fine Wine (FL)",kroger_products:"Kroger",walmart_products:"Walmart",total_wine_products:"Total Wine",target_products:"Target",or_pricing:"Oregon OLCC",ut_pricing:"Utah DABS",bc_liquor:"BC Liquor",mont_catalog:"Montgomery County MD",me_pricing:"Maine",nc_pricing:"North Carolina",id_products:"Idaho"};
const CAT=s=>s==="ttb_products"?"Registry":/offprem|cityhive/.test(s)?"Off-premise":/pricing|bc_liquor|mont_catalog|id_products/.test(s)?"Control state":"Retail chain";
const DERIV=new Set(["class_type","varietal","flavor"]);
const ORDER=["Registry","Retail chain","Off-premise","Control state"];
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function chip(f,pct){
  if(pct==null){const der=DERIV.has(f)?" der":"";return '<span class="ch miss'+der+'">'+f+'</span>';}
  const cls=pct>=80?"hi":pct>=30?"mid":"lo";
  return '<span class="ch '+cls+'">'+f+'<b>'+pct+'%</b></span>';
}
function render(d){
  const el=document.getElementById("spec");
  if(!d||!d.ok){el.innerHTML='<div class="state">Couldn\'t load the spec'+(d&&d.error?' — '+esc(d.error):'')+'. Is the agent running + master built?</div>';return;}
  const F=d.all_fields||[], groups={};
  (d.sources||[]).forEach(s=>{(groups[CAT(s.source)]=groups[CAT(s.source)]||[]).push(s);});
  let html="";
  ORDER.forEach(c=>{const g=(groups[c]||[]).sort((a,b)=>b.rows-a.rows);if(!g.length)return;
    html+='<section><h2>'+c+' <b>'+g.length+'</b></h2>';
    g.forEach(s=>{
      const chips=F.map(f=>chip(f, s.fields_pct[f]!=null?s.fields_pct[f]:null)).join("");
      const ex=(s.examples||[]).map(e=>'<div class="ex">'+esc(e)+'</div>').join("");
      html+='<div class="src"><div class="sh"><div class="snm">'+esc(LABEL[s.source]||s.source)+' <span class="sk">'+esc(s.source)+'</span></div>'
        +'<div class="srn">'+Number(s.rows).toLocaleString()+' rows</div></div>'
        +'<div class="chips">'+chips+'</div><div class="exwrap">'+ex+'</div></div>';
    });
    html+='</section>';
  });
  el.innerHTML=html||'<div class="state">No sources yet.</div>';
}
fetch("/api/master/source-spec",{cache:"no-store"}).then(r=>r.json()).then(render)
  .catch(e=>document.getElementById("spec").innerHTML='<div class="state">The agent isn\'t reachable — start it to see the live spec.</div>');
</script>

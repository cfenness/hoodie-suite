<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Active Runs</title>
<style>
:root{--bg:#f7f8fa;--panel:#fff;--panel-2:#f1f3f6;--ink:#1c2330;--muted:#5b6472;--faint:#95a0b0;--line:#e3e7ee;
  --accent:#4E79A7;--accent-soft:#eaf0f7;--good:#3f9b6a;--good-soft:#e7f4ec;--bad:#c1543f;--bad-soft:#f7e9e6;
  --warn:#c98a2b;--inset:#eef1f5;--run:#4E79A7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1319;--panel:#161c25;--panel-2:#1b222d;--ink:#e7ecf3;
  --muted:#9aa6b6;--faint:#66717f;--line:#28313d;--accent:#6b97c9;--accent-soft:#1c2836;--good:#4bb97f;
  --good-soft:#152a20;--bad:#d9694f;--bad-soft:#2a1613;--warn:#d69b45;--inset:#1a212b;--run:#6b97c9}}
:root[data-theme=dark]{--bg:#0f1319;--panel:#161c25;--panel-2:#1b222d;--ink:#e7ecf3;--muted:#9aa6b6;--faint:#66717f;
  --line:#28313d;--accent:#6b97c9;--accent-soft:#1c2836;--good:#4bb97f;--good-soft:#152a20;--bad:#d9694f;
  --bad-soft:#2a1613;--warn:#d69b45;--inset:#1a212b;--run:#6b97c9}
:root[data-theme=light]{--bg:#f7f8fa;--panel:#fff;--panel-2:#f1f3f6;--ink:#1c2330;--muted:#5b6472;--faint:#95a0b0;
  --line:#e3e7ee;--accent:#4E79A7;--accent-soft:#eaf0f7;--good:#3f9b6a;--good-soft:#e7f4ec;--bad:#c1543f;
  --bad-soft:#f7e9e6;--warn:#c98a2b;--inset:#eef1f5;--run:#4E79A7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:22px}
.top{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
h1{font-size:19px;margin:0} .live{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:middle}
.dot.on{background:var(--run);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.job{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:10px}
.job.running{border-color:var(--run);box-shadow:0 0 0 3px var(--accent-soft)}
.jr1{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.conn{font-weight:680;font-size:14.5px} .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em}
.pill.running{background:var(--accent-soft);color:var(--run)} .pill.success{background:var(--good-soft);color:var(--good)}
.pill.error,.pill.degraded{background:var(--bad-soft);color:var(--bad)}
.pill.paced,.pill.stalled{background:rgba(201,138,43,.14);color:var(--warn)}
.job.paced{border-color:var(--warn);box-shadow:0 0 0 3px rgba(201,138,43,.12)}
.spacer{flex:1} .el{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--inset);border-radius:5px;overflow:hidden;margin:9px 0 7px}
.bar i{display:block;height:100%;background:var(--run);border-radius:5px;transition:width .5s}
.bar.indet i{width:35% !important;animation:slide 1.3s infinite ease-in-out}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:650}
.stage{font-size:12px;color:var(--faint);margin-top:7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err{color:var(--bad);font-size:12.5px;margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:50px 0}
</style>
<div class="wrap">
  <div class="top"><h1>Active Runs</h1><span class="live" id="live"></span></div>
  <p class="sub">Every pull in flight — live progress, throughput and ETA, not just last-run status. Refreshes every 2s.</p>
  <div id="list"><div class="empty">Loading…</div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function dur(ms){ if(ms==null)return "—"; const s=Math.round(ms/1000); if(s<60)return s+"s"; const m=Math.floor(s/60); return m+"m "+(s%60)+"s"; }
function fmt(n){ return n==null?"—":Number(n).toLocaleString(); }

async function tick(){
  let d; try{ d=await fetch("/api/jobs").then(r=>r.json()); }catch(e){ $("#live").textContent="engine unreachable"; return; }
  if(!d||!d.ok){ $("#list").innerHTML='<div class="empty">No run data.</div>'; return; }
  $("#live").innerHTML=`<span class="dot ${d.active?'on':''}"></span>${d.active} running · ${d.jobs.length} recent`;
  if(!d.jobs.length){ $("#list").innerHTML='<div class="empty">No runs yet. Kick one off from Pulls.</div>'; return; }
  $("#list").innerHTML=d.jobs.map(j=>{
    const paced=j.status==="paced";
    const run=(j.status==="running"||paced);
    const known=j.pct!=null;
    const spin=j.status==="running"&&!known;           // spinner only when actively moving (not paced)
    const bar= spin ? '<div class="bar indet"><i></i></div>'
             : `<div class="bar"><i style="width:${j.pct!=null?j.pct:(run?15:100)}%"></i></div>`;
    const rt=j.ratePerSec||j.rate; const rate=rt?`<span><b>${rt.toLocaleString()}</b>/s</span>`:"";
    const eta=(run&&j.etaMs!=null)?`<span>ETA <b>${dur(j.etaMs)}</b></span>`:"";
    const cur=(j.current!=null)?j.current:j.done;
    const prog=known?`<span><b>${fmt(cur)}</b> / ${fmt(j.total)}${j.pct!=null?` · ${j.pct}%`:""}</span>`
             :(j.landed!=null?`<span><b>${fmt(j.landed)}</b> landed</span>`:"");
    return `<div class="job ${run?'running':''}${paced?' paced':''}">
      <div class="jr1"><span class="conn">${esc(j.connId)}</span>
        <span class="pill ${j.status}">${paced?'polite pace':esc(j.status)}</span>
        <span class="spacer"></span><span class="el">${dur(j.elapsedMs)}</span></div>
      ${bar}
      <div class="stats">${prog}${rate}${eta}</div>
      ${paced?'<div class="stage">▸ politely rate-limited — alive, just pacing to stay under the crawl limit</div>'
             :(run&&j.lastMsg?`<div class="stage">▸ ${esc(j.lastMsg)}</div>`:"")}
      ${j.error?`<div class="err">✕ ${esc(j.error)}</div>`:""}
    </div>`;
  }).join("");
}
tick(); setInterval(tick, 2000);
</script>

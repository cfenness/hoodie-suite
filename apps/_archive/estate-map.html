<!DOCTYPE html>
<html lang="en">
<head>
<script src="../spine/session-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estate Map — the data & model layer</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --teal:#3fb8a3; --ink:#0e1613; --paper:#e9f2ef; --muted:#8aa39d; --line:#22322e;
         --disp:"Fraunces",Georgia,serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",monospace; }
  *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--body)}
  #wrap{position:fixed;inset:0}
  svg{display:block;width:100%;height:100%}
  .hud{position:fixed;pointer-events:none;z-index:5}
  .top{top:0;left:0;right:0;padding:16px 20px;display:flex;align-items:flex-start;gap:14px;background:linear-gradient(180deg,rgba(14,22,19,.85),rgba(14,22,19,0))}
  .brand .ey{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#6f938a}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:19px;margin:3px 0 0;color:#eafaf5}
  .hint{margin-left:auto;font-family:var(--mono);font-size:10px;color:#6f938a;text-align:right;line-height:1.7}
  .hint b{color:#a9c9c0;font-weight:600}
  .live{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;color:#a9c9c0;background:rgba(18,28,25,.8);border:1px solid var(--line);border-radius:20px;padding:5px 13px;cursor:pointer}
  .live:hover{border-color:var(--teal)}
  .live .dot{width:7px;height:7px;border-radius:50%;background:#5bb86e;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,184,110,.5)}70%{box-shadow:0 0 0 7px rgba(91,184,110,0)}100%{box-shadow:0 0 0 0 rgba(91,184,110,0)}}
  .live.off .dot{background:#6f7f7a;animation:none} .live.warn{border-color:#d9584f;color:#e79a92} .live.warn .dot{background:#d9584f}
  .node{cursor:pointer}
  .node .lbl{font-family:var(--mono);font-size:10px;fill:#cfe6df;pointer-events:none}
  .node.ent .lbl{font-family:var(--body);font-weight:700;font-size:11.5px;fill:#eafaf5}
  .node.dim{opacity:.12;transition:opacity .3s}
  .edge{stroke-width:1.4;fill:none;transition:opacity .3s}
  .node.src .lbl{opacity:0;transition:opacity .18s}
  .node.src:hover .lbl,.node.src.foc .lbl{opacity:1}
  .node.src:hover circle{stroke:#eafaf5}
  .cluster{cursor:pointer}
  .cluster .clbl{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em;pointer-events:none}
  .cluster .ccount{font-family:var(--mono);font-size:9px;pointer-events:none}
  .cluster circle{transition:fill-opacity .2s}
  .cluster:hover circle{fill-opacity:.13}
  .node.dim,.cluster.dim{opacity:.12;transition:opacity .3s}
  .legend{position:fixed;right:20px;bottom:18px;z-index:5;font-family:var(--mono);font-size:10px;color:#6f938a;text-align:right;line-height:1.9;pointer-events:none}
  .legend .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:7px;vertical-align:middle}
  .sel{position:fixed;left:20px;bottom:18px;width:280px;max-height:60vh;overflow:auto;background:rgba(18,28,25,.93);border:1px solid var(--line);border-radius:12px;padding:14px 16px;z-index:6;backdrop-filter:blur(6px);transform:translateY(12px);opacity:0;transition:.25s;pointer-events:auto}
  .sel.show{transform:none;opacity:1}
  .sel .k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#6f938a}
  .sel .nm{font-family:var(--disp);font-weight:600;font-size:18px;margin:2px 0 3px;color:#eafaf5}
  .sel .meta{font-size:12px;color:var(--muted);margin-bottom:9px}
  .sel .cxh{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#6f938a;margin:8px 0 6px}
  .sel .cxrow{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:5px}
  .sel .road{font-family:var(--mono);font-size:8.5px;color:#0e1613;background:var(--teal);padding:1px 6px;border-radius:20px;font-weight:600}
  .sel .reset{margin-top:11px;font-family:var(--mono);font-size:11px;color:#a9c9c0;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
  .sel .reset:hover{border-color:var(--teal)}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;font-family:var(--mono);font-size:12px;color:#6f938a;background:var(--ink)}
</style>
</head>
<body>
  <div id="wrap"><svg id="svg" viewBox="0 0 1000 680" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div class="loading" id="loading">reading the estate…</div>
  <div class="live off" id="live" title="Live read from the engine · click to refresh"><span class="dot"></span><span id="livetx">connecting…</span></div>
  <div class="hud top">
    <div class="brand"><div class="ey">Hoodie Suite · Estate</div><h1>Estate Map — live data layer</h1></div>
    <div class="hint"><b>click a family</b> to focus · <b>a node</b> for one source · hover for labels<br>grouped by source family · updates as pulls land</div>
  </div>
  <div class="sel" id="sel"></div>
  <div class="legend">entity ●<span class="sw" style="background:#3fb8a3"></span> · feed ●<span class="sw" style="background:#5bb86e"></span><br>planned<span class="sw" style="background:#5f7a72"></span> · drifting<span class="sw" style="background:#d99a3f"></span> · broke<span class="sw" style="background:#d9584f"></span></div>

<script>
const SVGNS="http://www.w3.org/2000/svg";
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// canonical entities — fixed 2D geography (the spine)
const ENT=[ {id:'supplier',label:'Supplier',p:[130,90]}, {id:'brand',label:'Brand',p:[310,180]},
  {id:'product',label:'Product',p:[490,150]}, {id:'item',label:'Item',p:[650,260]},
  {id:'sku',label:'SKU',p:[440,410]}, {id:'outlet',label:'Outlet',p:[840,300]},
  {id:'inventory',label:'Inventory',p:[680,440]}, {id:'pricing',label:'Pricing',p:[520,560]} ];
const ENT_POS={}; ENT.forEach(e=>ENT_POS[e.id]=e.p);
const CANON=[['supplier','brand'],['brand','product'],['product','item'],['item','sku'],
  ['sku','inventory'],['outlet','inventory'],['sku','pricing'],['outlet','pricing']];
const ROADCOL={ upc:'#3fb8a3', variant:'#57c9b3', brand:'#3fb8a3', price:'#4a90d9', availability:'#4a90d9',
  'license#':'#d99a3f', owner:'#d9b03f', address:'#5bb86e', depletion:'#8a6fd0', name:'#7a7f9a', 'is-a':'#3fb8a3' };
const STCOL={ proven:'#5bb86e', live:'#5bb86e', candidate:'#3fb8a3', ready:'#3fb8a3', drifting:'#d99a3f',
  building:'#4a90d9', broken:'#d9584f', data:'#5bb86e', planned:'#5f7a72', paused:'#6f7f7a' };
function dsName(k){ const M={bd4008lic:'FL · Item master',bd4011lic:'FL · Registrants',abtbrands:'FL · Brand renewals',bd4006lic:'FL · Retail outlets',bd4005lic:'FL · Wholesale',bd400revok:'FL · Revoked',bd4002lic:'FL · Permits',abc_store_cells:'ABC · store cells',census_demographic:'Census · Demographic',census_economic:'Census · Economic',census_housing:'Census · Housing',outlets_census:'Outlets × census',tx_outlets:'TX · Retail outlets',tx_companies:'TX · Companies',il_outlets:'Chicago · Liquor outlets',il_companies:'Chicago · Companies',ct_outlets:'CT · Premises',ct_brands:'CT · Brands',ct_companies:'CT · Companies',outlets_master:'Outlet master'}; return M[k]||('dataset · '+k); }
function friendly(nm){ return String(nm||'source').replace(/\s*—.*$/,'').replace(/\s*\([^)]*\)\s*$/,'').slice(0,24); }
function hostOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
// map real columns → (entity, road)
function roadsFromCols(cols, hints){
  const c=(cols||[]).map(x=>String(x).toLowerCase()), any=re=>c.some(x=>re.test(x)), es=[];
  if(any(/(^|_| )upc($|_| )|gtin|barcode/)) es.push(['sku','upc']);
  if(any(/vintage|\byear\b|edition/)) es.push(['sku','vintage']);
  if(any(/sku|variant|\bpack\b/)) es.push(['sku','variant']);
  if(any(/itemsize|\bsize\b|\bml\b|container|bottle/)) es.push(['item','variant']);
  if(any(/flavor|\bvariety\b|varietal/)) es.push(['product','flavor']);
  if(any(/brand/)) es.push(['brand','brand']);
  if(any(/supplier|producer|importer|winery|distiller|manufactur|applicant/)) es.push(['supplier','supplies']);
  if(any(/price|amount|\bcost\b|promo/)) es.push(['pricing','price']);
  if(any(/avail|stock|inventory|instock|units|on.?hand|deplet|movement/)) es.push(['inventory','availability']);
  if(any(/licens|permit|\babt\b|dbpr|trade_name|owner|licensee/)) es.push(['outlet','license#']);
  if(any(/address|\bcity\b|\bzip\b|county|\bstate\b|\blat\b|\blng\b|premise|location|store|\bdba\b/)) es.push(['outlet','address']);
  const h=(hints||'').toLowerCase();
  if(!es.length && /census|demograph|econom|housing|population|income/.test(h)) es.push(['outlet','address']);
  if(!es.length && /outlet|licens|account/.test(h)) es.push(['outlet','license#']);
  if(!es.length && /pric/.test(h)) es.push(['pricing','price']);
  if(!es.length) es.push(['product','name']);
  const seen=new Set(); return es.filter(e=> !seen.has(e[0]) && seen.add(e[0]));
}
// ---- clustering: group sources into families, each gets its own zone ----
const CLUSTER_DEF=[
  {key:'fl',     label:'Florida',      col:'#5bb86e', t:n=>/^d:(bd4|abt|abc_)/.test(n.id)||/(^|·\s*)FL\b|florida/i.test(n.full||'')},
  {key:'tx',     label:'Texas',        col:'#4a90d9', t:n=>/^d:tx_/.test(n.id)||/\bTX\b|texas/i.test(n.full||'')},
  {key:'il',     label:'Chicago',      col:'#3fb8a3', t:n=>/^d:il_/.test(n.id)||/chicago/i.test(n.full||'')},
  {key:'census', label:'Census',       col:'#8a6fd0', t:n=>/^d:(census_|outlets_census)/.test(n.id)||/census|demograph|econom|housing/i.test(n.full||'')},
  {key:'master', label:'Master',       col:'#d9b03f', t:n=>/master/i.test((n.full||'')+n.id)},
  {key:'retail', label:'Retail & DTC', col:'#57c9b3', t:n=>!!n.host||/spec|binny|instacart|shopify|kroger|total\s*wine|drizly|hemp|dtc|store/i.test((n.full||'')+n.id)},
];
const CLUSTER_FALL={key:'other',label:'Other sources',col:'#6f8a83',t:()=>true};
function clusterOf(n){ for(const c of CLUSTER_DEF){ try{ if(c.t(n)) return c; }catch(e){} } return CLUSTER_FALL; }
// place each non-empty cluster around the entity spine; pack members inside via golden-angle
function layoutClusters(m){
  const groups={};
  m.nodes.forEach(n=>{ if(n.kind!=='src')return; const c=clusterOf(n); (groups[c.key]=groups[c.key]||{def:c,nodes:[]}).nodes.push(n); n._ck=c.key; });
  const order=CLUSTER_DEF.concat([CLUSTER_FALL]).filter(c=>groups[c.key]);
  const N=order.length||1, cx=500, cy=350, Rx=372, Ry=246, metas=[];
  order.forEach((cdef,i)=>{
    const g=groups[cdef.key], M=g.nodes.length;
    const a=(-Math.PI/2)+(i/N)*Math.PI*2, zx=cx+Math.cos(a)*Rx, zy=cy+Math.sin(a)*Ry;
    const rad=Math.min(118, 24+Math.sqrt(M)*11);
    g.nodes.forEach((n,j)=>{ const rr=rad*Math.sqrt((j+0.5)/M), th=j*2.399963;
      n.x=Math.max(74,Math.min(926, zx+Math.cos(th)*rr));
      n.y=Math.max(150,Math.min(648, zy+Math.sin(th)*rr*0.82)); });
    const ents=new Set(); g.nodes.forEach(n=>m.edges.forEach(e=>{ if(e.a===n.id&&(m.byId[e.b]||{}).kind==='ent')ents.add(e.b); if(e.b===n.id&&(m.byId[e.a]||{}).kind==='ent')ents.add(e.a); }));
    metas.push({key:cdef.key,label:cdef.label,col:cdef.col,cx:zx,cy:zy,r:rad,count:M,ents:[...ents],nodes:g.nodes});
  });
  m.clusters=metas; return m;
}

async function loadLive(){
  const get=u=>fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
  const [recs,dsets,hls]=await Promise.all([get('/api/recipes'),get('/api/datasets'),get('/api/highlights')]);
  return { recipes:(recs&&recs.recipes)||[], datasets:dsets||{}, highlights:(hls&&hls.highlights)||[], online:!!(recs||dsets) };
}
function buildModel(live){
  const nodes=[], edges=[], byId={}, seen={};
  ENT.forEach(e=>{ const n={id:e.id,label:e.label,kind:'ent',x:e.p[0],y:e.p[1]}; nodes.push(n); byId[e.id]=n; });
  CANON.forEach(([a,b])=>edges.push({a,b,road:'is-a'}));
  function addSource(key,disp,status,sub,cols,hints,liveFlag,dataset,host){
    const dn=disp.toLowerCase(); if(seen[dn]) return; seen[dn]=1;
    const rs=roadsFromCols(cols,hints);
    const n={id:key,label:friendly(disp),full:disp,kind:'src',status:(status||'planned').toLowerCase(),
             sub:sub,live:liveFlag,dataset:dataset||null,host:host||null,x:500,y:350};
    nodes.push(n); byId[key]=n; rs.forEach(([e,road])=>edges.push({a:key,b:e,road}));
  }
  let cat=[]; try{ cat=JSON.parse(localStorage.getItem('hoodie.pulls.tracker.v2')||'[]')||[]; }catch(e){}
  const recByHost={}; (live.recipes||[]).forEach(r=>{ recByHost[r.host]=r; });
  cat.forEach((s,i)=>{ const rec=recByHost[hostOf(s.url)];
    const cols=rec?Object.keys((rec.config&&rec.config.field_map)||{}).concat((rec.config&&rec.config.fields)||[]):(s.fields||[]);
    addSource('c'+i, s.nm||('source '+i), rec?rec.status:(s.status||'Planned'), (s.tier||'')+(s.foot?(' · '+s.foot):''),
      cols, (s.tier||'')+' '+(s.nm||''), !!rec||/live/i.test(s.status||''), null, hostOf(s.url)); });
  Object.entries(live.datasets||{}).forEach(([k,v])=>{ const cols=(v&&v.header)||[]; const rows=(v&&(v.total||(v.rows&&v.rows.length)))||'';
    addSource('d:'+k, dsName(k), 'data', 'owned dataset'+(rows?(' · '+rows+' rows'):''), cols, k, true, k); });
  (live.recipes||[]).forEach((r,i)=>{ const cols=Object.keys((r.config&&r.config.field_map)||{}).concat((r.config&&r.config.fields)||[]);
    addSource('r'+i, r.host, r.status, 'recipe · '+(r.platform||'')+' · '+r.status, cols, r.host, true, null, r.host); });
  const adj={}; nodes.forEach(n=>adj[n.id]=new Set());
  edges.forEach(e=>{ if(byId[e.a]&&byId[e.b]){ adj[e.a].add(e.b); adj[e.b].add(e.a); } });
  return {nodes,edges:edges.filter(e=>byId[e.a]&&byId[e.b]),byId,adj};
}

const svg=document.getElementById('svg'), selEl=document.getElementById('sel');
let MODEL={nodes:[],edges:[],byId:{},adj:{}}, selected=null, elByEdge=[], elByNode={};
function render(m){
  MODEL=m; svg.innerHTML=''; elByEdge=[]; elByNode={};
  // 1) cluster halos (behind everything) — the readable grouping
  (m.clusters||[]).forEach(cl=>{
    const g=document.createElementNS(SVGNS,'g'); g.setAttribute('class','cluster'); g.dataset.ck=cl.key;
    const c=document.createElementNS(SVGNS,'circle'); c.setAttribute('cx',cl.cx);c.setAttribute('cy',cl.cy);c.setAttribute('r',cl.r+20);
    c.setAttribute('fill',cl.col);c.setAttribute('fill-opacity',0.06);c.setAttribute('stroke',cl.col);
    c.setAttribute('stroke-opacity',0.3);c.setAttribute('stroke-width',1.1);c.setAttribute('stroke-dasharray','2 5'); g.appendChild(c);
    const t=document.createElementNS(SVGNS,'text');t.setAttribute('class','clbl');t.setAttribute('x',cl.cx);t.setAttribute('y',cl.cy-cl.r-25);t.setAttribute('text-anchor','middle');t.setAttribute('fill',cl.col);t.textContent=cl.label;g.appendChild(t);
    const ct=document.createElementNS(SVGNS,'text');ct.setAttribute('class','ccount');ct.setAttribute('x',cl.cx);ct.setAttribute('y',cl.cy-cl.r-13);ct.setAttribute('text-anchor','middle');ct.setAttribute('fill',cl.col);ct.setAttribute('fill-opacity',0.7);ct.textContent=cl.count+(cl.count===1?' source':' sources');g.appendChild(ct);
    g.addEventListener('click',ev=>{ ev.stopPropagation(); focusCluster(cl); });
    svg.appendChild(g); cl._el=g; cl._c=c;
  });
  // 2) edges — 'is-a' spine + status roads stay visible; source→entity roads go quiet (declutter)
  m.edges.forEach(e=>{ const a=m.byId[e.a], b=m.byId[e.b]; const isa=e.road==='is-a';
    const src=a.kind==='src'?a:(b.kind==='src'?b:null), st=src?src.status:'';
    const broke=/broke|fail|block/.test(st), warn=/drift|degrad|partial/.test(st);
    const col=broke?'#d9584f':(warn?'#d99a3f':(ROADCOL[e.road]||'#2a3a36'));
    const base=isa?0.5:(broke?0.7:(warn?0.5:0.1));
    const ln=document.createElementNS(SVGNS,'line'); ln.setAttribute('x1',a.x);ln.setAttribute('y1',a.y);ln.setAttribute('x2',b.x);ln.setAttribute('y2',b.y);
    ln.setAttribute('class','edge'); ln.setAttribute('stroke',col); ln.setAttribute('stroke-opacity',base);
    svg.appendChild(ln); e._el=ln; e._base=base; elByEdge.push(e); });
  // 3) nodes — entities labelled always; source dots compact, labels on hover/focus only
  m.nodes.forEach(n=>{
    const ent=n.kind==='ent'; const col=ent?'#3fb8a3':(STCOL[n.status]||(n.live?'#5bb86e':'#5f7a72'));
    const g=document.createElementNS(SVGNS,'g'); g.setAttribute('class','node'+(ent?' ent':' src')); g.setAttribute('transform','translate('+n.x+','+n.y+')');
    const c=document.createElementNS(SVGNS,'circle'); c.setAttribute('r',ent?12:5.5); c.setAttribute('fill',col);
    c.setAttribute('stroke','#0e1613'); c.setAttribute('stroke-width',1.5); g.appendChild(c);
    const t=document.createElementNS(SVGNS,'text'); t.setAttribute('class','lbl'); t.setAttribute('x',ent?0:9);
    t.setAttribute('y',ent?-16:3.5); t.setAttribute('text-anchor',ent?'middle':'start'); t.textContent=n.label; g.appendChild(t);
    g.addEventListener('click',ev=>{ ev.stopPropagation(); setFocus(n); });
    svg.appendChild(g); n._el=g; n._c=c; elByNode[n.id]=g;
  });
}
function clearFoc(){ MODEL.nodes.forEach(x=>x._el&&x._el.classList.remove('dim','foc'));
  (MODEL.clusters||[]).forEach(cl=>cl._el&&cl._el.classList.remove('dim'));
  MODEL.edges.forEach(e=>e._el.setAttribute('stroke-opacity',e._base)); }
function setFocus(n){
  selected=n;
  if(!n){ clearFoc(); selEl.classList.remove('show'); return; }
  const keep=new Set([n.id,...MODEL.adj[n.id]]);
  MODEL.nodes.forEach(x=>{ x._el.classList.toggle('dim',!keep.has(x.id)); x._el.classList.toggle('foc',keep.has(x.id)&&x.kind==='src'); });
  (MODEL.clusters||[]).forEach(cl=>cl._el&&cl._el.classList.add('dim'));
  MODEL.edges.forEach(e=>e._el.setAttribute('stroke-opacity',(e.a===n.id||e.b===n.id)?0.95:0.03));
  const conns=MODEL.edges.filter(e=>e.a===n.id||e.b===n.id).map(e=>{ const o=MODEL.byId[e.a===n.id?e.b:e.a]; return {to:o.label,road:e.road}; });
  selEl.innerHTML='<div class="k">'+(n.kind==='ent'?'Canonical entity':((n.live?'Live source · ':'Planned · ')+(n.status||'')))+'</div>'
    +'<div class="nm">'+esc(n.full||n.label)+'</div>'+(n.sub?'<div class="meta">'+esc(n.sub)+'</div>':'')
    +'<div class="cxh">Connects to</div>'
    +(conns.length?conns.map(c=>'<div class="cxrow"><span class="road">'+esc(c.road)+'</span><span>'+esc(c.to)+'</span></div>').join(''):'<div class="meta">an orphan — a road worth building</div>')
    +'<button class="reset" id="rst">✕ clear focus</button>';
  selEl.classList.add('show'); document.getElementById('rst').onclick=()=>setFocus(null);
}
function focusCluster(cl){
  selected=null;
  const ids=new Set(cl.nodes.map(n=>n.id).concat(cl.ents));
  MODEL.nodes.forEach(x=>{ x._el.classList.toggle('dim',!ids.has(x.id)); x._el.classList.toggle('foc',x.kind==='src'&&x._ck===cl.key); });
  (MODEL.clusters||[]).forEach(c=>c._el&&c._el.classList.toggle('dim',c.key!==cl.key));
  MODEL.edges.forEach(e=>{ const inv=ids.has(e.a)&&ids.has(e.b); e._el.setAttribute('stroke-opacity', inv?0.6:0.03); });
  selEl.innerHTML='<div class="k">Cluster · '+cl.count+' source'+(cl.count===1?'':'s')+'</div>'
    +'<div class="nm">'+esc(cl.label)+'</div>'
    +'<div class="meta">feeds '+(cl.ents.length?cl.ents.map(e=>esc((MODEL.byId[e]||{}).label||e)).join(' · '):'—')+'</div>'
    +'<div class="cxh">Sources</div>'
    +cl.nodes.slice(0,14).map(n=>'<div class="cxrow"><span class="road">'+esc(n.status||'')+'</span><span>'+esc(n.full||n.label)+'</span></div>').join('')
    +(cl.count>14?'<div class="meta">+'+(cl.count-14)+' more</div>':'')
    +'<button class="reset" id="rst">✕ clear focus</button>';
  selEl.classList.add('show'); document.getElementById('rst').onclick=()=>{ clearFoc(); selEl.classList.remove('show'); };
}
svg.addEventListener('click',()=>setFocus(null));

// pulse a node (flash its ring + roads) when a pull lands
function pulse(n){ if(!n||!n._c) return; let t=0; const base=+n._c.getAttribute('r');
  const iv=setInterval(()=>{ t+=0.09; if(t>=1){ n._c.setAttribute('r',base); n._c.setAttribute('stroke','#0e1613'); clearInterval(iv); return; }
    n._c.setAttribute('r', base+6*Math.sin(t*Math.PI)); n._c.setAttribute('stroke','#eafaf5'); }, 30);
  MODEL.edges.filter(e=>e.a===n.id||e.b===n.id).forEach(e=>{ let s=0; const fl=setInterval(()=>{ s+=0.08; if(s>=1){ e._el.setAttribute('stroke-opacity',e._base); clearInterval(fl); return; } e._el.setAttribute('stroke-opacity',0.4+0.55*Math.sin(s*Math.PI)); },30); });
}

const liveEl=document.getElementById('live'), liveTx=document.getElementById('livetx');
let lastSig='', seenTs=0;
async function refresh(){
  const live=await loadLive();
  const m=layoutClusters(buildModel(live));
  const sig=m.nodes.map(n=>n.id+':'+n.status).sort().join('|');
  if(sig!==lastSig){ const selId=selected&&selected.id; render(m); lastSig=sig; if(selId&&m.byId[selId]) setFocus(m.byId[selId]); }
  const hs=live.highlights||[], mx=hs.reduce((a,h)=>Math.max(a,h.ts||0),0);
  if(!seenTs){ seenTs=mx; } else { hs.forEach(h=>{ if((h.ts||0)>seenTs){ const nd=m.nodes.find(n=>n.kind==='src'&&((h.dataset&&n.dataset===h.dataset)||(h.host&&n.host&&n.host===h.host))); if(nd) pulse(nd); } }); seenTs=Math.max(seenTs,mx); }
  const issues=m.nodes.filter(n=>n.kind==='src'&&/broke|fail|block|drift|degrad|partial/.test(n.status)).length;
  liveEl.className='live'+(live.online?'':' off')+(issues?' warn':'');
  liveTx.textContent=live.online?('live · '+m.nodes.filter(n=>n.kind==='src'&&n.live).length+' connected'+(issues?(' · ⚠ '+issues):'')):'offline · catalog view';
  const L=document.getElementById('loading'); if(L)L.remove();
}
liveEl.onclick=refresh;
refresh(); setInterval(refresh,60000);
</script>

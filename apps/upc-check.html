<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../suite.css">
<title>UPC Check — Hoodie Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F3F5; --surface:#FFFFFF; --panel:#E8EBEE; --panel-2:#DEE3E7;
    --ink:#2B3138; --ink-soft:#7A828B; --hair:#DDE2E6; --hair-2:#EAEDF0;
    --accent:#4E79A7; --accent-d:#3D6089; --accent-soft:#E5EDF5;
    --good:#2E7D57; --good-soft:#E4F0EA; --warn:#B8791F; --warn-soft:#F6EDDD; --bad:#B8402B; --bad-soft:#F6E4E0;
    --disp:"Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:var(--paper); color:var(--ink); font-family:var(--disp); font-size:13px; -webkit-font-smoothing:antialiased;}
  #app{display:flex; flex-direction:column; height:100vh;}
  .tb{display:flex; align-items:center; gap:10px; padding:11px 16px; background:var(--surface); border-bottom:1px solid var(--hair); flex:0 0 auto;}
  .brand{display:flex; align-items:center; gap:9px; font-weight:600; font-size:15px; letter-spacing:-.01em;}
  .brand .logo{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; background:var(--accent); color:#fff; border-radius:6px; font-size:13px; font-weight:700;}
  .brand .sub{font:500 11px/1 var(--mono); color:var(--ink-soft); letter-spacing:.04em; text-transform:uppercase; margin-top:2px;}
  .xw{margin-left:auto; font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  .xw .d{width:8px; height:8px; border-radius:50%; background:var(--ink-soft);}
  .xw.on .d{background:var(--good);} .xw.on{color:var(--good);}

  .wrap{flex:1 1 auto; display:grid; grid-template-columns:340px 1fr; min-height:0;}
  .left{border-right:1px solid var(--hair); background:var(--surface); display:flex; flex-direction:column; padding:16px; gap:12px; min-height:0;}
  .lh{font:600 13px/1.3 var(--disp);}
  .lhelp{font-size:12px; color:var(--ink-soft); line-height:1.5;}
  .lhelp code{font-family:var(--mono); font-size:11px; background:var(--panel); padding:1px 5px; border-radius:4px;}
  textarea{flex:1 1 auto; min-height:120px; resize:none; font-family:var(--mono); font-size:12.5px; line-height:1.6; color:var(--ink); background:var(--paper); border:1px solid var(--hair); border-radius:8px; padding:11px 12px; outline:none;}
  textarea:focus{border-color:var(--accent);}
  .go{display:flex; gap:8px;}
  .btn{font-family:var(--disp); font-size:13px; font-weight:600; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:7px; padding:9px 16px; cursor:pointer; transition:background .12s;}
  .btn:hover{background:var(--accent-d);} .btn:disabled{opacity:.5; cursor:default;}
  .btn.ghost{background:var(--surface); color:var(--ink); border-color:var(--hair);}
  .btn.ghost:hover{border-color:var(--accent); color:var(--accent-d); background:var(--surface);}

  .right{display:flex; flex-direction:column; min-height:0; min-width:0;}
  .summary{display:flex; gap:8px; flex-wrap:wrap; padding:13px 16px; border-bottom:1px solid var(--hair); background:var(--panel); flex:0 0 auto;}
  .chip{font-family:var(--mono); font-size:11px; padding:4px 10px; border-radius:999px; background:var(--surface); border:1px solid var(--hair); color:var(--ink-soft); display:flex; gap:6px; align-items:center;}
  .chip b{color:var(--ink); font-weight:600;} .chip.hide{display:none;}
  .chip.valid b{color:var(--good);} .chip.bad b{color:var(--bad);} .chip.warn b{color:var(--warn);} .chip.flag b{color:var(--bad);}
  .scroll{flex:1 1 auto; overflow:auto;}
  table{border-collapse:collapse; width:100%; font-size:12px;}
  thead th{position:sticky; top:0; background:var(--panel-2); font-family:var(--mono); font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink); text-align:left; padding:8px 11px; border-bottom:1px solid var(--hair); white-space:nowrap;}
  tbody td{padding:7px 11px; border-bottom:1px solid var(--hair-2); font-family:var(--mono); font-size:12px; white-space:nowrap;}
  tbody tr:hover td{background:var(--accent-soft);}
  td.mono{color:var(--ink);} td.dim{color:var(--ink-soft);}
  .pill{font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; padding:2px 8px; border-radius:999px;}
  .pill.valid{background:var(--good-soft); color:var(--good);}
  .pill.placeholder,.pill.restricted,.pill.coupon{background:var(--warn-soft); color:var(--warn);}
  .pill.bad_check,.pill.malformed,.pill.empty,.pill.none{background:var(--bad-soft); color:var(--bad);}
  .agree{font-weight:600;} .agree.yes{color:var(--good);} .agree.no{color:var(--bad);} .agree.na{color:var(--ink-soft);}
  .conf{font-variant-numeric:tabular-nums;}
  .emptystate{padding:60px 20px; text-align:center; color:var(--ink-soft);}
  .emptystate .big{font-size:40px; margin-bottom:14px;}
  .flagrow td{background:var(--bad-soft) !important;}
</style>
</head>
<body>
<div id="app">
  <header class="tb">
    <div class="brand"><span class="logo">▮▮</span><div><div>UPC Check</div><div class="sub">validate · classify · owner match</div></div></div>
    <div class="xw" id="xw"><span class="d"></span><span id="xwtxt">crosswalk —</span></div>
  </header>
  <div class="wrap">
    <div class="left">
      <div class="lh">Paste UPC / EAN codes</div>
      <div class="lhelp">One per line. Add a company after a comma to check owner match:<br><code>036000291452, Acme Wine Co</code></div>
      <textarea id="in" placeholder="036000291452, Six and Twenty Distillery&#10;000000000000&#10;123456789012, River Oak Winery"></textarea>
      <div class="go">
        <button class="btn" id="run">Check</button>
        <button class="btn ghost" id="sample">Sample</button>
      </div>
    </div>
    <div class="right">
      <div class="summary" id="summary" style="display:none"></div>
      <div class="scroll" id="scroll">
        <div class="emptystate" id="empty"><div class="big">▮▮</div>Paste codes on the left and hit <b>Check</b>.<br>Deterministic QC runs always; owner-match activates when the crosswalk is loaded.</div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const inEl=$("#in"), scroll=$("#scroll"), summ=$("#summary"), empty=$("#empty"), xwEl=$("#xw"), xwTxt=$("#xwtxt");

  $("#sample").addEventListener("click", ()=>{
    inEl.value = "036000291452, Six and Twenty Distillery\n000000000000, River Oak Winery\n123456789012\n036000291452, Impostor Cellars\n04900000000, Store Brand\nnot-a-upc";
  });

  function parseLines(){
    return inEl.value.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
      const i=l.indexOf(",");
      return i<0 ? {upc:l, applicant:""} : {upc:l.slice(0,i).trim(), applicant:l.slice(i+1).trim()};
    });
  }

  $("#run").addEventListener("click", run);
  async function run(){
    const items=parseLines();
    if(!items.length) return;
    $("#run").disabled=true; $("#run").textContent="Checking…";
    try{
      const r=await fetch("/api/upc",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items})});
      const j=await r.json();
      render(j);
    }catch(e){ scroll.innerHTML='<div class="emptystate">Request failed: '+e.message+'</div>'; }
    $("#run").disabled=false; $("#run").textContent="Check";
  }

  function render(j){
    empty.style.display="none";
    xwEl.classList.toggle("on", !!j.crosswalk_loaded);
    xwTxt.textContent = j.crosswalk_loaded ? "crosswalk loaded" : "crosswalk not loaded";
    const res=j.results||[];
    const c={valid:0,placeholder:0,restricted:0,coupon:0,bad_check:0,malformed:0,empty:0,none:0};
    let flags=0;
    res.forEach(a=>{ c[a.status]=(c[a.status]||0)+1; if(a.owner_agrees===false) flags++; });
    summ.style.display="flex";
    summ.innerHTML =
      chip("valid", c.valid, "valid")
      + chip("warn", c.placeholder+c.restricted+c.coupon, "placeholder/restricted")
      + chip("bad", c.bad_check+c.malformed+c.empty, "invalid")
      + (j.crosswalk_loaded ? chip("flag", flags, "owner mismatch") : "");
    let h='<table><thead><tr><th>Input</th><th>UPC</th><th>Status</th><th>Prefix owner</th><th>Owner match</th><th>Conf</th></tr></thead><tbody>';
    res.forEach(a=>{
      const flag = a.owner_agrees===false;
      const ag = a.owner_agrees===true?'<span class="agree yes">✓ agrees</span>'
               : a.owner_agrees===false?'<span class="agree no">✗ mismatch</span>'
               : '<span class="agree na">—</span>';
      h+='<tr'+(flag?' class="flagrow"':'')+'>'
        +'<td class="dim">'+esc(a.input)+'</td>'
        +'<td class="mono">'+(a.upc||'<span class="dim">—</span>')+'</td>'
        +'<td><span class="pill '+a.status+'">'+a.status.replace("_"," ")+'</span></td>'
        +'<td class="dim">'+(esc(a.prefix_owner)||'—')+'</td>'
        +'<td>'+ag+'</td>'
        +'<td class="conf">'+(a.confidence?a.confidence.toFixed(2):'—')+'</td>'
        +'</tr>';
    });
    scroll.innerHTML=h+'</tbody></table>';
  }
  function chip(cls,n,label){ return '<span class="chip '+cls+(n?'':' hide')+'"><b>'+n+'</b> '+label+'</span>'; }
  function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

  // ctrl/cmd+enter runs
  inEl.addEventListener("keydown", e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter") run(); });
})();
</script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retail Intelligence</title>
<style>
  :root{
    --ink:#2B3138; --paper:#F1F3F5; --panel:#fff; --muted:#7A828B; --line:#E4E7EB;
    --accent:#4E79A7; --accent-soft:#EAF0F6; --good:#3f9668; --gold:#9a7100; --bad:#c0563e;
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --r:12px; --r-sm:8px;
  }
  @media (prefers-color-scheme:dark){:root{--ink:#E6E9EC;--paper:#15181C;--panel:#1E2227;--muted:#8A929B;--line:#2C323A;--accent:#7BA7D0;--accent-soft:#212B36;--panel2:#242A31}}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
  header h1{font-size:21px;margin:0 0 3px}
  header .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .tab{padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--accent);border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;cursor:pointer;transition:.12s}
  .card:hover{border-color:var(--accent);box-shadow:0 3px 14px rgba(78,121,167,.10)}
  .card .nm{font-size:15.5px;font-weight:700;margin-bottom:2px}
  .card .foot{color:var(--muted);font-size:12px}
  .stat{display:flex;gap:20px;margin:12px 0 10px}
  .stat b{font-size:22px;font-weight:700;display:block;line-height:1}
  .stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .prange{height:6px;border-radius:3px;background:var(--accent-soft);position:relative;margin-top:9px}
  .prange i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
  .prange .lbl{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:7px;font-family:var(--mono)}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .back{cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
  .search{flex:1;min-width:200px;max-width:420px;border:1px solid var(--line);border-radius:999px;padding:9px 15px;font:inherit;font-size:13.5px;background:var(--panel);color:var(--ink);outline:none}
  .search:focus{border-color:var(--accent)}
  .pill{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent);margin-right:5px}
  .hemp{background:#e8f4ea;color:var(--good)}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
  .prod{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px;display:flex;flex-direction:column}
  .prod img{width:100%;height:120px;object-fit:contain;background:#fff;border-radius:6px;margin-bottom:8px}
  .prod .pn{font-size:12.5px;font-weight:600;line-height:1.3;flex:1;margin-bottom:6px}
  .prod .pp{font-size:16px;font-weight:700;color:var(--accent)}
  .prod .ps{font-size:10.5px;color:var(--muted);margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  .low{color:var(--good);font-weight:700}
  .chip{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px}
  .money{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);text-align:center;padding:44px;grid-column:1/-1}
  .count{color:var(--muted);font-size:12.5px}
</style></head>
<body><div class="wrap">
<header>
  <h1>Retail Intelligence</h1>
  <div class="sub">Per-store beverage-alcohol assortment &amp; price across the chains we track — pulled from DoorDash.</div>
</header>
<div class="tabs">
  <div class="tab on" data-v="chains">Chains</div>
  <div class="tab" data-v="compare">Compare prices</div>
</div>
<div id="view"></div>
</div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>n==null?'—':'$'+Number(n).toFixed(2);
let CHAINS=[], VIEW='chains';
async function api(p){ const r=await fetch(p,{cache:'no-store'}); if(!r.ok) throw 0; return r.json(); }

function setTab(v){ VIEW=v; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v)); render(); }
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setTab(t.dataset.v));

async function render(){
  if(VIEW==='chains') return renderChains();
  if(VIEW==='compare') return renderCompare();
}
function offline(){ $('#view').innerHTML='<div class="empty">Couldn’t reach the engine. Start it (<code>./dev.sh</code>) or open the deployed suite.</div>'; }

async function renderChains(){
  $('#view').innerHTML='<div class="empty">Loading chains…</div>';
  let d; try{ d=await api('/api/retail/chains'); }catch(e){ return offline(); }
  CHAINS=d.chains||[];
  if(!CHAINS.length) return $('#view').innerHTML='<div class="empty">No chain data landed yet.</div>';
  $('#view').innerHTML='<div class="grid">'+CHAINS.map(c=>{
    const lo=c.price_min||0, hi=c.price_max||0, md=c.price_median||0;
    const pos=hi>lo?((md-lo)/(hi-lo)*100):50;
    return '<div class="card" data-ch="'+c.chain+'">'
      +'<div class="nm">'+esc(c.name)+'</div><div class="foot">'+esc(c.dataset.replace(/_/g,' '))+'</div>'
      +'<div class="stat"><div><b>'+c.skus.toLocaleString()+'</b><span>SKUs</span></div>'
      +'<div><b>'+c.stores+'</b><span>store'+(c.stores==1?'':'s')+'</span></div>'
      +'<div><b class="money">'+money(md)+'</b><span>median</span></div></div>'
      +'<div class="prange"><i style="left:'+pos+'%"></i></div>'
      +'<div class="lbl" style="display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:7px;font-family:var(--mono)"><span>'+money(lo)+'</span><span>'+money(hi)+'</span></div>'
    +'</div>';
  }).join('')+'</div>';
  document.querySelectorAll('[data-ch]').forEach(c=>c.onclick=()=>renderAssortment(c.dataset.ch));
}

async function renderAssortment(ch, q){
  const c=CHAINS.find(x=>x.chain===ch)||{name:ch};
  $('#view').innerHTML='<div class="empty">Loading '+esc(c.name)+' assortment…</div>';
  let d; try{ d=await api('/api/retail/chain/'+ch+(q?('?q='+encodeURIComponent(q)):'')); }catch(e){ return offline(); }
  const ps=d.products||[];
  $('#view').innerHTML=
    '<div class="toolbar"><span class="back" id="bk">← Chains</span>'
    +'<input class="search" id="af" placeholder="Filter '+esc(d.name)+' products…" value="'+esc(q||'')+'">'
    +'<span class="count">'+d.count.toLocaleString()+' products · sorted by price</span></div>'
    +(ps.length?'<div class="pgrid">'+ps.map(p=>{
        const sz=(p.unit_size?(p.unit_size+' '+(p.size_uom||'')):'')+(p.pack_count>1?(' ×'+p.pack_count):'');
        return '<div class="prod">'+(p.image_url?'<img src="'+esc(p.image_url)+'" loading="lazy" onerror="this.style.display=\'none\'">':'')
          +'<div class="pn">'+esc(p.name)+'</div>'
          +'<div class="pp money">'+money(p.price_value)+'</div>'
          +'<div class="ps">'+(p.container?'<span class="pill">'+esc(p.container)+'</span>':'')+esc(sz)+(p.is_hemp?' <span class="pill hemp">hemp</span>':'')+'</div>'
        +'</div>';
      }).join('')+'</div>':'<div class="empty">No products match.</div>');
  $('#bk').onclick=renderChains;
  let t; $('#af').oninput=e=>{ clearTimeout(t); const v=e.target.value.trim(); t=setTimeout(()=>renderAssortment(ch, v||undefined), 350); };
  $('#af').focus();
}

function renderCompare(){
  $('#view').innerHTML='<div class="toolbar"><input class="search" id="cq" placeholder="Search a product or brand — e.g. Tito’s, Modelo, Cabernet…"></div><div id="cres"><div class="empty">Type a product or brand to compare its price across chains.</div></div>';
  let t; $('#cq').oninput=e=>{ clearTimeout(t); const q=e.target.value.trim(); t=setTimeout(()=>doCompare(q), 380); };
  $('#cq').focus();
}
async function doCompare(q){
  if(q.length<2) return;
  $('#cres').innerHTML='<div class="empty">Searching…</div>';
  let d; try{ d=await api('/api/retail/search?q='+encodeURIComponent(q)); }catch(e){ return offline(); }
  const rs=d.results||[];
  if(!rs.length) return $('#cres').innerHTML='<div class="empty">No matches for “'+esc(q)+'”. (We only carry a few DoorDash chains so far.)</div>';
  const lo=Math.min(...rs.map(r=>r.pmin));
  $('#cres').innerHTML='<table><thead><tr><th></th><th>Product</th><th>Chain</th><th>Price</th><th>Stores</th></tr></thead><tbody>'
    +rs.map(r=>'<tr>'+(r.img?'<td><img src="'+esc(r.img)+'" style="width:34px;height:34px;object-fit:contain" onerror="this.style.display=\'none\'"></td>':'<td></td>')
      +'<td>'+esc(r.name)+'</td><td><span class="chip">'+esc(r.chain_name)+'</span></td>'
      +'<td class="money '+(r.pmin===lo?'low':'')+'">'+money(r.pmin)+(r.pmax>r.pmin?('<span style="color:var(--muted);font-weight:400"> – '+money(r.pmax)+'</span>'):'')+'</td>'
      +'<td class="count">'+(r.stores||1)+'</td></tr>').join('')+'</tbody></table>';
}
render();
</script>
<!-- shared-subject adoption: a global subject (e.g. "Tito's") from the Retail Intelligence workspace filters this app -->
<script src="../spine/spine.js"></script>
<script>
try{ HoodieSpine.connect({name:"Retail Intelligence", onContext:function(c){
  var n = c && c.scope && c.scope.name; if(!n) return;
  try{ if(typeof setTab==="function") setTab("compare"); }catch(e){}
  var el=document.getElementById("cq"); if(el) el.value=n;
  try{ if(typeof doCompare==="function") doCompare(n); }catch(e){}
}}); }catch(e){}
</script>
</body></html>

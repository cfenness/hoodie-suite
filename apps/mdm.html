<!DOCTYPE html>
<!-- Hoodie Suite · MDM — one console: Master · Catalog · Pulls · Ingestion -->
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoodie · MDM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--teal:#2C8C7C;--teal-d:#1E5F55;--ink:#243330;--muted:#5E6B68;--line:#D7DDDB;--paper:#F4F6F5}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;flex-direction:column;font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
  .bar{display:flex;align-items:center;gap:14px;padding:0 16px;height:52px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
  .brand{line-height:1.05;white-space:nowrap}
  .brand .ey{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block;font-weight:500}
  .brand .nm{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:16px;letter-spacing:-.01em;color:var(--teal-d)}
  .tabs{display:flex;gap:2px;flex-wrap:wrap}
  .tab{appearance:none;border:none;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);padding:8px 13px;border-radius:8px;cursor:pointer;position:relative}
  .tab:hover{color:var(--ink);background:#f0f4f3}
  .tab.on{color:var(--teal-d)}
  .tab.on::after{content:"";position:absolute;left:13px;right:13px;bottom:-8px;height:2px;background:var(--teal);border-radius:2px}
  .sp{flex:1}
  .hint{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  @media(max-width:620px){.hint{display:none}.bar{gap:8px;height:auto;padding:8px 12px;flex-wrap:wrap}}
  .stage{flex:1;position:relative;min-height:0}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  .stage iframe[hidden]{display:none}
</style></head><body>
  <div class="bar">
    <div class="brand"><span class="ey">Hoodie Suite · Master Data</span><span class="nm">MDM</span></div>
    <div class="tabs">
      <button class="tab" data-tab="master">Master</button>
      <button class="tab" data-tab="catalog">Catalog</button>
      <button class="tab" data-tab="pulls">Pulls</button>
      <button class="tab" data-tab="ingestion">Ingestion</button>
    </div>
    <span class="sp"></span>
    <span class="hint" id="tabhint"></span>
  </div>
  <div class="stage">
    <iframe id="f-master"    title="Master-data control plane" data-src="mdm-master.html"></iframe>
    <iframe id="f-catalog"   title="Product Catalog"           data-src="catalog.html"></iframe>
    <iframe id="f-pulls"     title="Hoodie Pulls"              data-src="pulls.html"></iframe>
    <iframe id="f-ingestion" title="Hoodie Ingestion"          data-src="ttb-ingestion.html"></iframe>
  </div>
<script>
(function(){
  "use strict";
  var TABS={
    master:   {f:"f-master",    hint:"Master-data control plane · /api"},
    catalog:  {f:"f-catalog",   hint:"Product master · lifecycle, completeness, channels"},
    pulls:    {f:"f-pulls",     hint:"Run & evaluate each scrape"},
    ingestion:{f:"f-ingestion", hint:"COLA label pipeline · Unifyd engine"}
  };
  function show(t){
    if(!TABS[t]) t="master";
    var btns=document.querySelectorAll(".tab");
    for(var i=0;i<btns.length;i++) btns[i].classList.toggle("on", btns[i].getAttribute("data-tab")===t);
    for(var k in TABS){ document.getElementById(TABS[k].f).hidden = (k!==t); }
    var f=document.getElementById(TABS[t].f);
    if(f.getAttribute("data-src") && !f.getAttribute("src")) f.setAttribute("src", f.getAttribute("data-src")); // lazy mount
    document.getElementById("tabhint").textContent = TABS[t].hint;
    if(("#"+t)!==location.hash){ try{ history.replaceState(null,"","#"+t); }catch(e){} }
  }
  var b=document.querySelectorAll(".tab");
  for(var i=0;i<b.length;i++) b[i].onclick=(function(el){ return function(){ show(el.getAttribute("data-tab")); }; })(b[i]);
  window.addEventListener("message", function(e){ var d=e.data; if(d && d.type==="hoodie:mdm:tab" && d.tab) show(d.tab); });
  show((location.hash||"#master").slice(1));
})();
</script>
</body></html>

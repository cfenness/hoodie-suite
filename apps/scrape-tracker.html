<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrape Tracker — Hoodie</title>
<style>
  :root{
    --ink:#2B3138; --paper:#F1F3F5; --panel:#fff; --muted:#7A828B; --line:#E4E7EB;
    --accent:#4E79A7; --accent-soft:#EAF0F6; --good:#3f9668; --gold:#9a7100; --bad:#c0563e;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace; --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px}
  body{padding:22px 26px 60px}
  .embed body{padding-top:14px}
  .wrap{max-width:1160px;margin:0 auto}
  .pagehead h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .pagehead .sub{color:var(--muted);font-size:13px;margin-top:3px;max-width:700px;line-height:1.5}
  .embed .pagehead{display:none}

  .scrapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:18px 0 6px}
  .scard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;cursor:pointer;transition:.14s}
  .scard:hover{border-color:var(--accent)}
  .scard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .scard .top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .scard .sd{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .sd.active{background:var(--good);box-shadow:0 0 0 3px #d9efe3} .sd.idle{background:var(--gold)} .sd.empty{background:var(--line)}
  .scard .nm{font-weight:700;font-size:13.5px;letter-spacing:-.01em;flex:1}
  .scard .kind{font-family:var(--mono);font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:5px}
  .scard .rows{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .scard .meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
  .scard .cbadge{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px}
  .cbadge.warn{background:#FBEEE0;color:#8a5a12} .cbadge.clean{background:#E4F1EA;color:#256b47}

  .status-pill{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 11px;border-radius:999px}
  .status-pill.ok{background:#E4F1EA;color:#256b47} .status-pill.degraded{background:#FBEEE0;color:#8a5a12}

  .section{margin-top:20px}
  .section-h{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}
  .section-h h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .section-h .desc{font-size:12px;color:var(--muted)}

  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 15px;min-width:120px}
  .chip .n{font-family:var(--mono);font-weight:700;font-size:21px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .chip .n.accent{color:var(--accent)} .chip .n.good{color:var(--good)} .chip .n.gold{color:var(--gold)} .chip .n.bad{color:var(--bad)}
  .chip .l{font-size:11px;color:var(--muted);margin-top:4px}

  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:14px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px}
  .card h3{font-size:13px;font-weight:800;letter-spacing:-.01em;margin-bottom:2px}
  .card .cs{font-size:11.5px;color:var(--muted);margin-bottom:12px}

  .concern{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #F2F4F6}
  .concern:last-child{border-bottom:none}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 auto}
  .dot.high{background:var(--bad)} .dot.med{background:var(--gold)} .dot.low{background:var(--accent)}
  .concern .ct{flex:1} .concern .ck{font-weight:700;font-size:13px}
  .concern .cm{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.4}
  .concern .cn{font-family:var(--mono);font-weight:700;font-size:15px}
  .concern .cn.high{color:var(--bad)} .concern .cn.med{color:var(--gold)} .concern .cn.low{color:var(--accent)}
  .clean{padding:16px 0;color:var(--good);font-size:13px;font-weight:600}

  .fill{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px}
  .fill .fl{width:76px;color:var(--muted);font-family:var(--mono);font-size:11px}
  .fill .bar{flex:1;height:7px;background:#EEF1F4;border-radius:5px;overflow:hidden}
  .fill .bar i{display:block;height:100%;border-radius:5px;background:var(--good)}
  .fill .bar i.warn{background:var(--gold)} .fill .bar i.bad{background:var(--bad)}
  .fill .fv{width:44px;text-align:right;font-family:var(--mono);font-size:11.5px}

  .tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:16px}
  .tbl-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}
  .tbl-head h3{font-size:13px;font-weight:800}
  .tscroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{background:#F7F9FA;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-size:9px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  td{padding:9px 12px;border-bottom:1px solid #F2F4F6;white-space:nowrap}
  tbody tr{cursor:pointer} tbody tr:hover td{background:#FAFBFC}
  td.prod{white-space:normal;max-width:280px}
  .b{font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:5px}
  .b.oos{background:#FBEEE0;color:#8a5a12} .b.instock{background:#E4F1EA;color:#256b47}
  .b.promo{background:var(--accent-soft);color:#2E4C6D} .b.flag{background:#F8E3DD;color:#a0402b}
  .miss{color:var(--bad);font-family:var(--mono);font-size:11px}
  tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
  .empty{padding:30px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12.5px;line-height:1.7}
  .refresh{font-family:var(--font);font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:8px;padding:6px 13px;cursor:pointer;background:var(--panel);color:var(--ink)}
  .refresh:hover{border-color:var(--accent)}

  /* drill-down drawer */
  .scrim{position:fixed;inset:0;background:rgba(20,28,38,.28);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,94vw);background:var(--panel);border-left:1px solid var(--line);
          box-shadow:-16px 0 40px rgba(20,28,38,.14);transform:translateX(100%);transition:.24s;z-index:41;overflow:auto;padding:20px 22px}
  .drawer.open{transform:translateX(0)}
  .drawer .dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .drawer .dh h3{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
  .drawer .dh .x{border:none;background:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
  .drawer .kv{display:grid;grid-template-columns:110px 1fr;gap:5px 12px;margin:14px 0;font-size:12.5px}
  .drawer .kv .k{color:var(--muted);font-family:var(--mono);font-size:11px}
  .drawer .kv .v{font-weight:600}
  .drawer .mh{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
  .match{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#FAFBFC}
  .match .msrc{font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
  .match .mn{font-weight:700;font-size:13px;margin-top:2px}
  .match .mm{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
  .drawer .none{color:var(--muted);font-size:12.5px;padding:8px 0}
  /* label image in drawer + full-size modal */
  .lblwrap{margin:4px 0 14px}
  .lblimg{width:100%;max-height:260px;object-fit:contain;background:#F4F5F7;border:1px solid var(--line);border-radius:9px;cursor:zoom-in;display:block}
  .lblmiss{color:var(--muted);font-size:12.5px;padding:14px;border:1px dashed var(--line);border-radius:9px;background:#FAFBFC}
  .lblbtns{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:11.5px}
  .lbllinks a{color:var(--accent);text-decoration:none} .lbllinks a:hover{text-decoration:underline}
  .dlbtn{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:11.5px;padding:6px 12px;border-radius:7px;text-decoration:none}
  .dlbtn:hover{filter:brightness(1.08)}
  .imgmodal{position:fixed;inset:0;background:rgba(15,20,28,.82);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
  .imgmodal.open{display:flex}
  .imgbox{background:var(--panel);border-radius:12px;max-width:min(900px,94vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
  .imghd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .imghd h3{font-size:14px;font-weight:800}
  .imghd>div{display:flex;align-items:center;gap:10px}
  .imgbox figure{margin:0;overflow:auto;background:#F4F5F7;display:flex;align-items:center;justify-content:center}
  .imgbox figure img{max-width:100%;max-height:78vh;object-fit:contain;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="pagehead"><h1>Scrape Tracker</h1>
    <div class="sub">Every active scrape &amp; crawl landing in the warehouse — rows, freshness, and data-quality
      concerns. Click a source to inspect it; click any item to see all its data and potential matches from other sources.</div></div>

  <div class="scrapes" id="scrapes"><div class="empty" style="grid-column:1/-1">loading scrapes…</div></div>

  <div class="section" id="detail" style="display:none">
    <div class="section-h">
      <div><h2 id="dtitle"></h2><div class="desc" id="ddesc"></div></div>
      <span class="status-pill" id="dpill"></span>
    </div>
    <div id="dbody"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="dh"><h3 id="drTitle"></h3><button class="x" id="drClose">×</button></div>
  <div id="drBody"></div>
</div>

<div class="imgmodal" id="imgModal">
  <div class="imgbox">
    <div class="imghd"><h3 id="imgTitle"></h3>
      <div><a class="dlbtn" id="imgDl" download>⬇ Download</a>
      <button class="x" id="imgClose">×</button></div></div>
    <figure id="imgFig"></figure>
  </div>
</div>

<script>
if(new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n==null||n==='')?'':Number(n).toLocaleString();
const money=n=>(n==null||n==='')?'':'$'+Number(n).toFixed(2);
const ago=s=>{ if(s==null)return'never'; if(s<90)return'just now'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; };
let SCRAPES=[], SEL=null;

async function loadScrapes(){
  let j; try{ j=await (await fetch('/api/scrapes',{cache:'no-store'})).json(); }catch(e){ $('#scrapes').innerHTML='<div class="empty" style="grid-column:1/-1">Could not reach the tracker API.</div>'; return; }
  SCRAPES=j.scrapes||[];
  $('#scrapes').innerHTML=SCRAPES.map(s=>{
    const cc = s.concerns? '<span class="cbadge warn">'+s.concerns+' concern'+(s.concerns===1?'':'s')+'</span>' : (s.rows? '<span class="cbadge clean">no flags</span>':'');
    return '<div class="scard'+(SEL===s.id?' on':'')+'" data-id="'+s.id+'">'+
      '<div class="top"><span class="sd '+s.status+'"></span><span class="nm">'+esc(s.name)+'</span><span class="kind">'+esc(s.kind)+'</span></div>'+
      '<div class="rows">'+fmt(s.rows)+' <span style="font-size:12px;color:var(--muted);font-weight:600">rows</span></div>'+
      '<div class="meta">'+esc(s.source)+'<br>'+(s.status==='active'?'● landing · ':'')+'updated '+ago(s.fresh_secs)+' · feeds '+esc(s.feeds)+'</div>'+
      cc+'</div>';
  }).join('');
  document.querySelectorAll('#scrapes .scard').forEach(el=>el.onclick=()=>select(el.dataset.id));
  if(!SEL){ const w=SCRAPES.find(s=>s.detail); if(w) select(w.id); }
  // live-refresh the open detail for an ACTIVE scrape (counts climb as rows land), preserving the filter
  const sel=SCRAPES.find(s=>s.id===SEL);
  if(sel && sel.status==='active'){
    $('#ddesc').textContent=sel.source+' · '+fmt(sel.rows)+' rows · updated '+ago(sel.fresh_secs)+' · feeds '+esc(sel.feeds);
    if(sel.detail!=='walmart' && document.getElementById('grtable')){   // walmart has its own refresh button
      loadRows(sel.id, ($('#grq')?$('#grq').value.trim():''));
    }
  }
}
function select(id){
  SEL=id; document.querySelectorAll('#scrapes .scard').forEach(el=>el.classList.toggle('on',el.dataset.id===id));
  const s=SCRAPES.find(x=>x.id===id); if(!s) return;
  $('#detail').style.display='';
  $('#dtitle').textContent=s.name; $('#ddesc').textContent=s.source+' · '+fmt(s.rows)+' rows · updated '+ago(s.fresh_secs)+' · feeds '+esc(s.feeds);
  if(s.detail==='walmart') loadWalmart(); else renderGeneric(s);
}
function renderGeneric(s){
  $('#dpill').textContent=s.status==='active'?'active':(s.rows?'idle':'empty'); $('#dpill').className='status-pill '+(s.status==='active'?'ok':'degraded');
  $('#dbody').innerHTML='<div class="chips">'+
    chip(fmt(s.rows),'rows in warehouse','accent')+chip(ago(s.fresh_secs),'last landed')+chip(esc(s.kind),'kind')+chip(esc(s.feeds),'feeds')+
    '</div>'+
    '<div class="tbl-wrap" style="margin-top:14px"><div class="tbl-head">'+
      '<h3>Data landing in <code>'+esc(s.table)+'</code> <span id="grc" style="color:var(--muted);font-weight:600;font-size:11.5px"></span></h3>'+
      '<input id="grq" class="refresh" style="cursor:text;min-width:150px" placeholder="filter rows…"></div>'+
      '<div id="grtable" class="tscroll"><div class="empty">loading…</div></div></div>';
  const run=()=>loadRows(s.id, $('#grq').value.trim());
  let t; $('#grq').oninput=()=>{ clearTimeout(t); t=setTimeout(run,300); };
  run();
}
let GROWS=[], GCOLS=[];
async function loadRows(id, q){
  let j; try{ j=await (await fetch('/api/scrape/'+id+'/rows?limit=200'+(q?('&q='+encodeURIComponent(q)):''),{cache:'no-store'})).json(); }
  catch(e){ $('#grtable').innerHTML='<div class="empty">Could not load rows.</div>'; return; }
  if(!j.landed){ $('#grtable').innerHTML='<div class="empty">Not in the warehouse yet — this source hasn’t landed data.</div>'; return; }
  GCOLS=j.columns||[]; GROWS=j.rows||[];
  // keep the table readable: drop always-empty + noisy blob columns
  const noisy={other_json:1,label_image_url:1};
  const cols=GCOLS.filter(c=>!noisy[c] && GROWS.some(r=>r[c]!=null && String(r[c]).trim()!==''));
  $('#grc').textContent=GROWS.length?('· showing '+GROWS.length+(j.filtered?' matched':'')):'';
  if(!GROWS.length){ $('#grtable').innerHTML='<div class="empty">'+(j.filtered?'No rows match “'+esc(q)+'”.':'No rows yet.')+'</div>'; return; }
  const cell=v=>{ v=(v==null?'':String(v)); return v.length>60?esc(v.slice(0,60))+'…':esc(v); };
  $('#grtable').innerHTML='<table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+
    GROWS.map((r,i)=>'<tr data-i="'+i+'">'+cols.map(c=>'<td>'+cell(r[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
  document.querySelectorAll('#grtable tr[data-i]').forEach(tr=>tr.onclick=()=>openRowDrawer(GROWS[+tr.dataset.i]));
}
function openRowDrawer(r){
  const title=r.product_name||r.name||r.brand_name||r.brand||r.chain||r.ttb_id||'Row';
  $('#drTitle').textContent=title;
  const isLabel = r.ttb_id && ('front_label_url' in r || 'back_label_url' in r || 'label_urls' in r);
  const hide={other_json:1,front_label_url:1,back_label_url:1,label_urls:1,image_file:1};
  const kv=GCOLS.filter(c=>r[c]!=null && String(r[c]).trim()!=='' && !(isLabel&&hide[c]));
  let head='';
  if(isLabel){
    // Show OUR stored copy — the raw TTB attachment URLs are F5-gated and just render a TTB error page.
    const img='/api/ttb-label/'+encodeURIComponent(r.ttb_id);
    head='<div class="lblwrap">'+
      '<img class="lblimg" src="'+img+'" alt="label" '+
        'onclick="openImg(\''+esc(r.ttb_id)+'\',\''+esc(title).replace(/\\\\/g,"")+'\')" '+
        'onerror="this.closest(\'.lblwrap\').querySelector(\'.lblmiss\').style.display=\'block\';this.style.display=\'none\'">'+
      '<div class="lblmiss" style="display:none">Label image not captured yet — this filing hasn’t been OCR’d.</div>'+
      '<div class="lblbtns"><a class="dlbtn" href="'+img+'?download=1" download>⬇ Download label</a>'+
        '<span class="lbllinks" style="color:var(--muted)">click image to enlarge</span></div></div>';
  }
  $('#drBody').innerHTML=head+'<div class="kv">'+kv.map(c=>'<div class="k">'+esc(c)+'</div><div class="v">'+esc(String(r[c]))+'</div>').join('')+'</div>';
  $('#scrim').classList.add('open'); $('#drawer').classList.add('open');
}
// full-size label modal with a download button
function openImg(ttbid, title){
  const img='/api/ttb-label/'+encodeURIComponent(ttbid);
  $('#imgTitle').textContent=title||ttbid;
  $('#imgFig').innerHTML='<img src="'+img+'" alt="label">';
  $('#imgDl').href=img+'?download=1';
  $('#imgModal').classList.add('open');
}
function chip(n,l,c){ return '<div class="chip"><div class="n '+(c||'')+'">'+(n||'0')+'</div><div class="l">'+l+'</div></div>'; }

// ---- Walmart detail ----
const SEVRANK={high:0,med:1,low:2};
async function loadWalmart(){
  $('#dbody').innerHTML='<div class="empty">loading…</div>';
  let meta, prod;
  try{ [meta,prod]=await Promise.all([fetch('/api/walmart/runs',{cache:'no-store'}).then(r=>r.json()), fetch('/api/walmart/products',{cache:'no-store'}).then(r=>r.json())]); }
  catch(e){ $('#dbody').innerHTML='<div class="empty">Could not load Walmart data.</div>'; return; }
  if(!meta.landed){ $('#dbody').innerHTML='<div class="empty">No Walmart pull yet. Run <code>python unifyd/walmart_scraper.py</code>.</div>'; $('#dpill').textContent='no data'; $('#dpill').className='status-pill degraded'; return; }
  const latest=(meta.runs&&meta.runs[0])||{}; const st=latest.status||'ok';
  $('#dpill').textContent=st; $('#dpill').className='status-pill '+(st==='ok'?'ok':'degraded');
  const ps=prod.products||[], oos=ps.filter(p=>!p.in_stock).length, nc=(meta.concerns||[]).reduce((a,c)=>a+c.count,0);
  $('#dbody').innerHTML=
    '<div class="chips">'+chip(fmt(meta.total),'products','accent')+chip(fmt((meta.total||0)-oos),'in stock','good')+
      chip(fmt(nc),nc?'flagged data points':'clean',nc?'gold':'good')+chip(latest.at?ago(Math.floor(Date.now()/1000-latest.at)):'—','last pull')+'</div>'+
    '<div class="grid">'+
      '<div class="card"><h3>Concerns</h3><div class="cs">Data-quality flags — highest severity first.</div><div id="wconcerns"></div></div>'+
      '<div class="card"><h3>Field coverage</h3><div class="cs">How completely each field came back.</div><div id="wfills"></div></div>'+
    '</div>'+
    '<div class="tbl-wrap"><div class="tbl-head"><h3>Products being pulled <span id="wpc" style="color:var(--muted);font-weight:600;font-size:11.5px"></span></h3>'+
      '<button class="refresh" id="wrefresh">↻ Refresh</button></div>'+
      '<div class="tscroll"><table><thead><tr><th>Brand</th><th>Product</th><th>Category</th><th class="num">Size</th><th class="num">ABV</th><th class="num">Price</th><th>Availability</th><th>UPC</th></tr></thead>'+
      '<tbody id="wrows"></tbody></table></div></div>';
  renderConcerns(meta.concerns||[]); renderFills(meta.fills||{}); renderProducts(ps);
  $('#wrefresh').onclick=loadWalmart;
}
function renderConcerns(cs){
  if(!cs.length){ $('#wconcerns').innerHTML='<div class="clean">✓ No data-quality concerns.</div>'; return; }
  cs=cs.slice().sort((a,b)=>(SEVRANK[a.severity]-SEVRANK[b.severity])||b.count-a.count);
  $('#wconcerns').innerHTML=cs.map(c=>'<div class="concern"><span class="dot '+c.severity+'"></span><div class="ct"><div class="ck">'+esc(c.key.replace(/_/g,' '))+'</div><div class="cm">'+esc(c.message)+'</div></div><div class="cn '+c.severity+'">'+c.count+'</div></div>').join('');
}
function renderFills(f){
  const order=['brand','category','size_ml','abv','upc','price'];
  $('#wfills').innerHTML=order.filter(k=>f[k]!=null).map(k=>{ const v=f[k], cls=v>=90?'':(v>=70?'warn':'bad');
    return '<div class="fill"><span class="fl">'+esc(k)+'</span><div class="bar"><i class="'+cls+'" style="width:'+v+'%"></i></div><span class="fv">'+v+'%</span></div>'; }).join('');
}
let WPRODUCTS=[];
function renderProducts(ps){
  WPRODUCTS=ps; $('#wpc').textContent=ps.length?('· '+ps.length):'';
  $('#wrows').innerHTML=ps.map((p,i)=>{
    const flag=!p.is_alcohol||p.price==null;
    const avail=p.in_stock?'<span class="b instock">in stock</span>':'<span class="b oos">out of stock</span>';
    const promo=p.on_promo?' <span class="b promo">promo</span>':''; const notalc=!p.is_alcohol?' <span class="b flag">not bev</span>':'';
    return '<tr class="'+(flag?'flag':'')+'" data-i="'+i+'"><td>'+esc(p.brand||'—')+'</td>'+
      '<td class="prod">'+esc(p.product_name||'')+notalc+'</td><td>'+esc(p.category||'—')+'</td>'+
      '<td class="num">'+(p.size_ml||'<span class="miss">—</span>')+'</td>'+
      '<td class="num">'+(p.abv!=null?p.abv+'%':'<span class="miss">—</span>')+'</td>'+
      '<td class="num">'+(p.price!=null?money(p.price):'<span class="miss">—</span>')+promo+'</td>'+
      '<td>'+avail+'</td>'+
      '<td>'+(p.upc?('<span style="font-family:var(--mono);font-size:11px">'+esc(p.upc)+'</span>'):'<span class="miss">—</span>')+'</td></tr>';
  }).join('')||'<tr><td colspan="8" class="empty">no products</td></tr>';
  document.querySelectorAll('#wrows tr[data-i]').forEach(tr=>tr.onclick=()=>openDrawer(WPRODUCTS[+tr.dataset.i]));
}

// ---- drill-down drawer: all the item's data + cross-source matches ----
async function openDrawer(p){
  $('#drTitle').textContent=p.product_name||'Product';
  const kv=[['brand',p.brand],['category',p.category],['size',p.size_ml?p.size_ml+' mL':'—'],['abv',p.abv!=null?p.abv+'%':'—'],
    ['price',p.price!=null?money(p.price):'—'],['list',p.list_price!=null?money(p.list_price):'—'],
    ['availability',p.in_stock?'in stock':'out of stock'],['store',p.store_loc||p.store||'—'],['upc',p.upc||'—'],
    ['is bev-alc',p.is_alcohol?'yes':'⚠ NO — flagged']];
  $('#drBody').innerHTML='<div class="kv">'+kv.map(r=>'<div class="k">'+esc(r[0])+'</div><div class="v">'+esc(r[1])+'</div>').join('')+'</div>'+
    '<div class="mh">Potential matches in other sources</div><div id="drMatch"><div class="none">searching…</div></div>'+
    (p.url?'<div style="margin-top:16px"><a href="'+esc(p.url)+'" target="_blank" style="color:var(--accent);font-size:12.5px">Open on walmart.com →</a></div>':'');
  $('#scrim').classList.add('open'); $('#drawer').classList.add('open');
  try{
    const j=await (await fetch('/api/walmart/match?brand='+encodeURIComponent(p.brand||''),{cache:'no-store'})).json();
    const ms=j.matches||[];
    $('#drMatch').innerHTML=ms.length? ms.map(m=>
      '<div class="match"><div class="msrc">'+esc(m.source)+' · '+esc(m.how)+'</div>'+
      '<div class="mn">'+esc(m.brand_name)+'</div>'+
      '<div class="mm">'+esc(m.class_type||'')+(m.net_contents?(' · '+esc(m.net_contents)):'')+(m.approval_date?(' · '+esc(m.approval_date)):'')+' · ttbid '+esc(m.ttb_id)+'</div></div>').join('')
      : '<div class="none">No matching filings found in other sources for “'+esc(p.brand||'')+'”.</div>';
  }catch(e){ $('#drMatch').innerHTML='<div class="none">Match lookup failed.</div>'; }
}
$('#drClose').onclick=$('#scrim').onclick=()=>{ $('#scrim').classList.remove('open'); $('#drawer').classList.remove('open'); };
$('#imgClose').onclick=()=>$('#imgModal').classList.remove('open');
$('#imgModal').onclick=e=>{ if(e.target.id==='imgModal') $('#imgModal').classList.remove('open'); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#imgModal').classList.remove('open'); });

loadScrapes();
setInterval(loadScrapes, 60000);   // refresh the scrape statuses each minute
</script>

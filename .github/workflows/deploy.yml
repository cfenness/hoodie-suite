name: Deploy Hoodie Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger a deploy manually from the Actions tab

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync files to S3
        run: |
          # IMPORTANT: keep this exclude list in sync with deploy.sh. The engine
          # (unifyd/, *.py), internal docs, and dev tooling must NEVER ship.
          aws s3 sync . "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".claude/*" \
            --exclude "cloudfront/*" \
            --exclude "unifyd/*" \
            --exclude "api/*" \
            --exclude "scripts/*" \
            --exclude "*.py" \
            --exclude "README.md" \
            --exclude "CLAUDE.md" \
            --exclude "SPINE.md" \
            --exclude "FULLREAD.md" \
            --exclude "deploy.sh" \
            --exclude "dev.sh" \
            --exclude ".gitignore" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "*.test.js" \
            --cache-control "public,max-age=300"

      - name: Invalidate CloudFront cache
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

# Warehouse compatibility gate (NRT-PLAN.md §8e): warehouse.py is a de-facto cross-repo API
# (hoodie-backend sys.path-imports it), and every merge is in the nightly launchd write path the
# same day — so layout/engine changes must prove v1/v2 parity before they land.
name: tests

on:
  pull_request:
    paths:
      - "unifyd/warehouse.py"
      - "unifyd/warehouse_compat_test.py"
      - "unifyd/run_sources.py"
      - "unifyd/run_sources_due_test.py"
      - "unifyd/source_registry.py"
      - "unifyd/server.py"
      - "unifyd/dispatch_guard_test.py"
      - "unifyd/sipsource_*.py"
      - "unifyd/cost_ledger*.py"
      - "unifyd/obs_quality*.py"
      - "unifyd/velocity*.py"
  workflow_dispatch:

jobs:
  warehouse-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyarrow duckdb numpy
      - run: python unifyd/warehouse_compat_test.py
      - run: python unifyd/run_sources_due_test.py
      - run: python unifyd/sipsource_test.py
      - run: python unifyd/cost_ledger_test.py
      - run: python unifyd/obs_quality_test.py
      - run: python unifyd/velocity_test.py

  # Anti-regression: the app's /api/run must dispatch through source_registry, never a drifted *_pull copy.
  dispatch-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r unifyd/requirements.txt
      - run: python unifyd/dispatch_guard_test.py

name: cloud-sources

# Land the cloud-runnable (no-Mac) sources on a schedule, straight to the Tigris warehouse.
#   • Registry "headless"/"creds" sources (Binny's, Spec's, ABC ×3, Haskell's, Socrata state license
#     data, Census/reference) via run_sources.py --headless-only — pure HTTP, no browser.
#   • UberEats sitemap (account universe, direct) + geofill (map coords) through the flat-rate ISP pool.
# Anything needing a real browser (Total Wine, Publix, UberEats/Target catalogs, TTB's TSPD warm) is NOT
# here — those still run on the Mac. Creds sources auto-skip ("no-creds") if their secret isn't set.
#
# Repo secrets used (already present in this repo):
#   AWS_ENDPOINT_URL_S3       https://fly.storage.tigris.dev       (turns on warehouse remote mode)
#   TIGRIS_ACCESS_KEY_ID      Tigris access key   → mapped to AWS_ACCESS_KEY_ID below
#   TIGRIS_SECRET_ACCESS_KEY  Tigris secret key   → mapped to AWS_SECRET_ACCESS_KEY below
#   ISP_PROXIES               IPRoyal ISP list, comma-separated host:port:user:pass  (geofill only)
# BUCKET_NAME is not sensitive, so it's set inline below (no secret needed).
# OPTIONAL (skipped honestly if absent): CENSUS_API_KEY → reference data.

# SCHEDULE REMOVED — scheduling lives on Fly, not here. The hourly Fly dispatcher
# (unifyd/dispatch_ephemeral.py, machine role=dispatcher) reads the same registry and spawns an
# ephemeral machine per due source, so this cron was both redundant and a standing red X: the repo
# has no Actions minutes, so every nightly run failed. Kept dispatch-only as a manual escape hatch.
on:
  workflow_dispatch:
    inputs:
      geofill_limit:
        description: "Max UberEats outlets to geofill this run (resumable across runs)"
        default: "20000"

concurrency:
  group: cloud-sources
  cancel-in-progress: false       # let a run finish rather than clobber a partial landing

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      BUCKET_NAME: hoodie-suite-warehouse
      AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      ISP_PROXIES: ${{ secrets.ISP_PROXIES }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet curl_cffi requests beautifulsoup4 lxml duckdb pyarrow

      - name: Preflight — confirm warehouse is reachable
        working-directory: unifyd
        run: |
          python -c "import warehouse; assert warehouse.remote(), 'warehouse not in remote mode — set AWS_ENDPOINT_URL_S3 + BUCKET_NAME'; print('warehouse remote OK:', __import__('os').environ.get('BUCKET_NAME'))"

      - name: Headless sources (registry, pure-HTTP only)
        working-directory: unifyd
        continue-on-error: true
        # Exclude target + publix: they flip to a local-browser path when ISP_PROXIES is set, and this
        # runner has no Chrome. They stay on the Mac / BD. Everything else here is pure HTTP.
        # Exclude abc-fws: abcfws.com 403s GitHub's datacenter IPs (breaker tripped 3 days straight,
        # 07-19..07-21) while the same scraper runs clean from the Mac — Mac-only until proxied.
        # Exclude offprem-census: needs the Bright Data CLI credential file, which this runner
        # doesn't have (failed FileNotFoundError ~/.../brightdata-cli/credentials.json) — Mac-only.
        # -u = unbuffered (progress is visible even if a source is killed); --workers 3 keeps RAM in
        # bounds on the 7GB runner (6-wide + DuckDB + pyarrow OOM'd the first run).
        run: python -u run_sources.py --headless-only --cadence daily --exclude target,publix,abc-fws,offprem-census --workers 3

      - name: UberEats account universe (sitemap, direct)
        working-directory: unifyd
        continue-on-error: true
        run: python -c "import ue_sitemap; ue_sitemap.pull('ubereats'); ue_sitemap.sitemap_to_src_outlets('ubereats')"

      - name: UberEats geofill (map coords, via ISP pool)
        if: ${{ env.ISP_PROXIES != '' }}
        working-directory: unifyd
        continue-on-error: true
        run: python -c "import ue_geofill; ue_geofill.geofill('ubereats', limit=int('${{ github.event.inputs.geofill_limit || 20000 }}'), workers=10, preflight=False)"

      - name: Run summary
        if: always()
        working-directory: unifyd
        run: |
          python -c "import warehouse; [print('  %-22s %s rows' % (t, warehouse.row_count(t))) for t in ['binnys_products','specs_products','abc_products','ubereats_sitemap','ubereats_geo']]" || true

name: instacart-free-verify

# Does the FREE Instacart connector (no Bright Data, no proxy) actually LAND data end-to-end?
# Drives the real Instacart class against a scratch LOCAL warehouse on a bare datacenter runner and
# reports the row counts it lands. Two modes so we KNOW (not assume) which browser shape the Fly image
# needs: headful-under-Xvfb (proven) vs headless-no-Xvfb (a far lighter image if it also lands data).
on:
  push:
    paths:
      - unifyd/instacart.py
      - unifyd/instacart_free_verify.py
      - .github/workflows/instacart-free-verify.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [headful-xvfb, headless-nox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: system deps — real Chrome (+ Xvfb only for the headful mode)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget
          [ "${{ matrix.mode }}" = "headful-xvfb" ] && sudo apt-get install -y -qq xvfb || true
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y -qq ./google-chrome-stable_current_amd64.deb
      - name: python deps
        run: pip install --quiet playwright pyarrow duckdb
      - name: verify free Instacart connector (no proxy, no bd) — ${{ matrix.mode }}
        working-directory: unifyd
        env:
          FETCH_POLICY: free
        run: |
          if [ "${{ matrix.mode }}" = "headful-xvfb" ]; then
            BROWSER_HEADFUL=1 xvfb-run -a python -u instacart_free_verify.py
          else
            BROWSER_HEADFUL=0 python -u instacart_free_verify.py
          fi

name: target-warehouse-probe

# The real bar: run the actual target_scraper against the real Tigris warehouse, FETCH_POLICY=free (no
# proxy), and show target_products row count BEFORE -> AFTER. Data in the warehouse = done, not a 200.
on:
  push:
    paths:
      - unifyd/target_warehouse_probe.py
      - unifyd/target_scraper.py
      - .github/workflows/target-warehouse-probe.yml
  workflow_dispatch:

env:
  AWS_ENDPOINT_URL_S3: https://fly.storage.tigris.dev
  BUCKET_NAME: hoodie-suite-warehouse
  AWS_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
  FETCH_POLICY: free

jobs:
  warehouse-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: guard — Tigris creds present (else the count means nothing)
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Tigris creds missing (TIGRIS_ACCESS_KEY_ID / TIGRIS_SECRET_ACCESS_KEY). Writes would be local/ephemeral."
            exit 1
          fi
      - name: system deps — real Chrome + Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y -qq ./google-chrome-stable_current_amd64.deb
      - name: python deps
        run: pip install --quiet playwright curl_cffi duckdb pyarrow requests beautifulsoup4
      - name: run target_scraper → Tigris warehouse (FETCH_POLICY=free, no proxy)
        working-directory: unifyd
        run: xvfb-run -a python -u target_warehouse_probe.py

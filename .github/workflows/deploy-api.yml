name: Deploy Unifyd API

# Builds the unifyd/ agent image, pushes it to ECR, and deploys it on Amazon ECS
# Express Mode (the App Runner successor). Runs only once the backend is provisioned
# (the ECS_EXEC_ROLE_ARN repo variable is set by scripts/provision-ecs-express.sh) —
# until then this is a no-op, so it's safe to have on main.

on:
  push:
    branches: [ main ]
    paths:
      - 'unifyd/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    if: ${{ vars.ECS_EXEC_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION:     ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'hoodie-unifyd' }}
      SERVICE_NAME:   ${{ vars.ECS_SERVICE_NAME || 'hoodie-unifyd' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" \
                 --image-scanning-configuration scanOnPush=true >/dev/null

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::7}"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" unifyd
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to ECS Express Mode
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE }}
          container-port: '8080'
          health-check-path: /api/health
          cpu: '1024'
          memory: '2048'
          # state is in-process — pin to ONE task so it stays coherent (see unifyd/README)
          min-task-count: '1'
          max-task-count: '1'
          execution-role-arn: ${{ vars.ECS_EXEC_ROLE_ARN }}
          infrastructure-role-arn: ${{ vars.ECS_INFRA_ROLE_ARN }}
          # Durable state (Step 5): uncomment once you've run provision-state.sh and
          # created a task role with S3 access to the state bucket.
          # task-role-arn: ${{ vars.ECS_TASK_ROLE_ARN }}
          # environment-variables: '[{"name":"STATE_BUCKET","value":"hoodie-suite-state"}]'

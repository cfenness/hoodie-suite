name: scrape-runner

# The production scheduled cloud runner — replaces the nohup loops on the Mac for every connector that
# can run from the cloud (Bright Data retail pulls, official APIs, Socrata state data). Each run lands
# straight into the warehouse (Parquet on Tigris) that the suite already reads. TTB (F5 anti-bot + a
# broken TLS chain from cloud sandboxes) still runs on the Mac for now — see unifyd/ttb_cola_*.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TIGRIS_ACCESS_KEY_ID / TIGRIS_SECRET_ACCESS_KEY   the Tigris keys (tid_/tsec_) for the warehouse
#   BRIGHTDATA_API_KEY                                 for bdata (retail pulls); optional for API/Socrata jobs
#   KROGER_CLIENT_ID / KROGER_CLIENT_SECRET            when the Kroger connector lands (optional until then)

on:
  schedule:
    - cron: "0 */12 * * *"      # every 12 hours
  workflow_dispatch:
    inputs:
      connector:
        description: "Which connector to run (all | walmart | chains | kroger)"
        default: "all"

concurrency:
  group: scrape-runner
  cancel-in-progress: false

env:
  AWS_ENDPOINT_URL_S3: https://fly.storage.tigris.dev
  BUCKET_NAME: hoodie-suite-warehouse
  AWS_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python deps
        run: pip install --quiet pyarrow duckdb requests

      - name: Guard — warehouse creds present
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Tigris creds missing. Add TIGRIS_ACCESS_KEY_ID / TIGRIS_SECRET_ACCESS_KEY as repo secrets."
            exit 1
          fi

      # Bright Data CLI for the retail pulls (Walmart, later Target/Instacart via Scraper Studio)
      - name: Bright Data CLI
        if: ${{ github.event.inputs.connector == '' || contains('all walmart', github.event.inputs.connector) }}
        run: |
          npm install -g @brightdata/cli
          if [ -n "${{ secrets.BRIGHTDATA_API_KEY }}" ]; then
            bdata login --api-key "${{ secrets.BRIGHTDATA_API_KEY }}" || echo "bdata login skipped"
          fi

      # Refresh the chains registry (feasibility catalog) — cheap, no external creds
      - name: Chains registry
        if: ${{ github.event.inputs.connector == '' || contains('all chains', github.event.inputs.connector) }}
        run: python unifyd/chains.py

      # Walmart bev-alc pull → walmart_products / walmart_runs
      - name: Walmart
        if: ${{ github.event.inputs.connector == '' || contains('all walmart', github.event.inputs.connector) }}
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: python unifyd/walmart_scraper.py --per 3 --note "cloud runner"

      # Kroger official API (store-level price + availability). No-op until the connector + creds exist.
      - name: Kroger
        if: ${{ (github.event.inputs.connector == '' || contains('all kroger', github.event.inputs.connector)) && env.KROGER_CLIENT_ID != '' }}
        env:
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
        run: |
          if [ -f unifyd/kroger_api.py ]; then python unifyd/kroger_api.py; else echo "kroger connector not built yet — skipping"; fi

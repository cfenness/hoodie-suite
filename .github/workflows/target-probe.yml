name: target-probe

# GROUNDED cost test: can we read Target's RedSky API from a FREE datacenter runner with NO proxy?
# Runs on push (so it fires without default-branch registration). Tiny + fast so it finishes before any
# runner cap. No secrets, no proxy — just curl_cffi from GitHub's Azure IP hitting Target's public key.
on:
  push:
    paths:
      - unifyd/target_redsky_probe.py
      - .github/workflows/target-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install curl_cffi
        run: pip install --quiet curl_cffi
      - name: probe Target RedSky (no proxy, datacenter IP)
        working-directory: unifyd
        run: python -u target_redsky_probe.py

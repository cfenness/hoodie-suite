name: target-browser-probe

# Decisive free-cloud test: a REAL Chrome (headful under Xvfb) on GitHub's datacenter IP, NO proxy,
# does the RedSky call in-page. Probe #1 showed curl gets a captcha (not a ban) — a browser clears that.
on:
  push:
    paths:
      - unifyd/target_redsky_browser_probe.py
      - .github/workflows/target-browser-probe.yml
  workflow_dispatch:

jobs:
  browser-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: system deps — real Chrome + Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y -qq ./google-chrome-stable_current_amd64.deb
          google-chrome --version
      - name: playwright
        run: pip install --quiet playwright
      - name: probe RedSky via real browser (no proxy, datacenter IP)
        working-directory: unifyd
        run: xvfb-run -a python -u target_redsky_browser_probe.py

name: dispatch-pulls

# The pull scheduler. Every 30 minutes, spawn an EPHEMERAL Fly machine for each source whose interval has
# lapsed (unifyd/dispatch_ephemeral.py → run_sources.due_sources → flyctl machine run --rm per due source).
# Each pull is isolated on its own throwaway machine; adding a source just makes it "due" next tick, and app
# deploys never touch a running crawl. This replaces the Mac launchd tick as the always-on trigger.
#
# Required repo secrets (already present):
#   FLY_API_TOKEN                                    flyctl auth (also used by deploy-fly.yml)
#   TIGRIS_ACCESS_KEY_ID / TIGRIS_SECRET_ACCESS_KEY  read the source_runs ledger to compute due-ness

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 minutes
  workflow_dispatch:
    inputs:
      max:
        description: "Max ephemeral machines to spawn this tick"
        default: "6"

concurrency:
  group: dispatch-pulls
  cancel-in-progress: false      # never cut a tick short mid-spawn

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      AWS_ENDPOINT_URL_S3: https://fly.storage.tigris.dev
      BUCKET_NAME: hoodie-suite-warehouse
      AWS_ACCESS_KEY_ID: ${{ secrets.TIGRIS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TIGRIS_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      DISPATCH_MAX: ${{ github.event.inputs.max || '6' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyarrow duckdb
      - name: Preflight — warehouse + fly reachable
        working-directory: unifyd
        run: |
          python -c "import warehouse; assert warehouse.remote(), 'warehouse not remote'; print('warehouse OK')"
          flyctl version
      - name: Dispatch due sources as ephemeral machines
        working-directory: unifyd
        run: python dispatch_ephemeral.py

# App Runner source-config for the Unifyd /api/* backend.
#
# The lowest-ceremony "container, auto-deploy" path: in the App Runner console,
# create a service → Source = this GitHub repo, branch main, **Source directory =
# unifyd**, deployment trigger = Automatic. App Runner reads this file, builds, and
# RE-DEPLOYS on every push to main. No Docker, no ECR, no CI step.
#
# (Prefer a real container image instead — Lightsail/ECS, or App Runner image mode?
#  Use the Dockerfile next to this file.)
version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
      - pip install gunicorn
run:
  # ONE worker on purpose: the agent holds state in-process and persists it on write.
  # A single worker keeps that state coherent. server:app = the Flask app in server.py.
  command: gunicorn -w 1 -b 0.0.0.0:8080 server:app
  network:
    port: 8080
  env:
    - name: PORT
      value: "8080"
    # For durable state across redeploys, set STATE_BUCKET (and optionally STATE_PREFIX)
    # in the App Runner service's environment variables (console), and give the service
    # an instance role with s3:GetObject/PutObject on that bucket. See unifyd/README.md.
    # Also set the service to min=max=1 instance (state is per-instance).

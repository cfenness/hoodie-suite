# Separate Fly app for the no-BD browser scrapers — production (hoodie-suite) is untouched.
# A worker (no http service): run one-off via `flyctl machine run` or on a schedule. Xvfb-headful real Chrome.
app = 'hoodie-scraper'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile.scraper'

[env]
  BROWSER_CHANNEL = 'chrome'
  BROWSER_HEADFUL = '1'
  BROWSER_PROFILE_DIR = '/data/profiles'

# persistent profile (zone + accumulated trust cookies) survives across runs
[[mounts]]
  source = 'scraper_profiles'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2048'

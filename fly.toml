# Fly.io — all-in-one Hoodie Suite (static launcher + apps + /api backend) on one app/origin.
# Sidesteps the AWS new-account gate; the same-origin /api/* design needs no CORS.
#
# First deploy:
#   fly launch --no-deploy            # creates the app from this Dockerfile (pick a unique name)
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-...     # enables the AI features (overlay read, planogram vision/pitch)
#   fly secrets set AGENT_TOKEN=$(openssl rand -hex 24)   # optional — gates /api/* for non-browser callers
#   fly deploy
#   fly open                          # the live suite
#
# Durable pull state (optional): fly secrets set STATE_BUCKET=... (needs S3 creds on the machine).
# State is in-process, so this app is pinned to ONE machine.

app = "hoodie-suite"                  # must be globally unique on Fly — `fly launch` will prompt if taken
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SUITE_ROOT = "/app"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"          # in-process state — keep the single machine warm
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

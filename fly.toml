# fly.toml app configuration file generated for hoodie-suite on 2026-07-02T12:02:33-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hoodie-suite'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  SUITE_ROOT = '/app'
  # Cap DuckDB so a big master query spills to disk instead of OOM-killing the worker (see warehouse.connect).
  DUCKDB_MEMORY_LIMIT = '1200MB'
  DUCKDB_THREADS = '2'
  # Chrome runs as root inside the container → it needs --no-sandbox, and containers have a tiny /dev/shm
  # → --disable-dev-shm-usage (else Chrome crashes). browser_warm reads this and adds those two args ONLY
  # (no other overrides, so patchright's stealth is preserved). Harmless for the app group (never launches Chrome).
  BROWSER_NO_SANDBOX = '1'

# Two process groups from ONE image, so data pulls never run on the box that serves the site:
#   app    — serves the public suite + /api (small, always-on, public).
#   runner — runs the scrapers/pulls OFF the serving worker. On 2026-07-22 three concurrent
#            catalog crawls held ~3.8gb RSS and OOM-killed the 4gb serving worker TWICE, taking
#            the live site down briefly. The runner is the same app image on its own 8gb machine
#            with no public route, so a heavy crawl can't touch the site. Trigger pulls against
#            it via the app's own /api/run (reached over Fly private networking / flyctl proxy).
[processes]
  app = "gunicorn -w 1 --threads 24 --timeout 120 -b 0.0.0.0:8080 server:app"
  # runner: start a virtual display FIRST (headful Chrome for the anti-bot sources needs one), then gunicorn.
  # --timeout 0: the runner's worker does long single-threaded crawls; never let the arbiter kill a busy worker.
  # DISPLAY is exported so the scraper subprocesses (run_one) inherit it and Chrome renders to Xvfb.
  runner = "sh -c 'Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & export DISPLAY=:99; exec gunicorn -w 1 --threads 8 --timeout 0 -b 0.0.0.0:8080 server:app'"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  # 4 vCPU: 1 shared vCPU couldn't run the warehouse footer scans (list_datasets over 170+ Tigris files)
  # without pegging the CPU and starving request/health threads — the machine crash-looped ("site stuck").
  # 4 cores give the background DuckDB scans room while the worker keeps serving.
  size = 'shared-cpu-4x'
  # 4gb: the master data outgrew 2gb as the warehouse ballooned; DuckDB queries need headroom.
  memory = '4gb'
  processes = ['app']

[[vm]]
  # runner: heavy catalog crawls held ~3.8gb RSS and OOM-killed the 4gb serving worker — 8gb gives headroom.
  size = 'shared-cpu-4x'
  memory = '8gb'
  processes = ['runner']

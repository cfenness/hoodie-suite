# fly.toml app configuration file generated for hoodie-suite on 2026-07-02T12:02:33-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hoodie-suite'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  SUITE_ROOT = '/app'
  # Cap DuckDB so a big master query spills to disk instead of OOM-killing the worker (see warehouse.connect).
  DUCKDB_MEMORY_LIMIT = '1200MB'
  DUCKDB_THREADS = '2'
  # For EPHEMERAL pull machines that launch headful Chrome — Chrome runs as root in a container and needs
  # --no-sandbox --disable-dev-shm-usage (browser_warm reads this). Harmless on the serving app (never launches Chrome).
  BROWSER_NO_SANDBOX = '1'

# ── ONE process: the serving app. Data pulls DO NOT run here (they OOM-crashed the serving worker, and
# every deploy killed in-flight crawls). Pulls now run as EPHEMERAL one-shot Fly Machines — `flyctl machine
# run --rm <image> --command "bash /app/unifyd/run_ephemeral.sh <source>"` — each isolated on its own machine
# that self-destroys when done. That gives: (1) a crashing/OOMing pull can't touch another pull, (2) adding a
# source never disturbs a running one, (3) app deploys leave running crawls alone (ephemeral machines aren't a
# process group, so `fly deploy` doesn't reconcile/restart them). The image still ships Chrome+Xvfb so those
# ephemeral machines can drive the headful anti-bot sources.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  # 4 vCPU: the warehouse footer scans (list_datasets over 200+ Tigris files) peg 1 shared vCPU and starve
  # the request/health threads (the machine crash-looped). 4 cores give the background DuckDB scans room.
  size = 'shared-cpu-4x'
  # 4gb: the master data outgrew 2gb as the warehouse ballooned; DuckDB queries need headroom.
  memory = '4gb'

# fly.toml app configuration file generated for hoodie-suite on 2026-07-02T12:02:33-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hoodie-suite'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  SUITE_ROOT = '/app'
  # Cap DuckDB so a big master query spills to disk instead of OOM-killing the worker (see warehouse.connect).
  DUCKDB_MEMORY_LIMIT = '1200MB'
  DUCKDB_THREADS = '2'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  # 4 vCPU: 1 shared vCPU couldn't run the warehouse footer scans (list_datasets over 170+ Tigris files)
  # without pegging the CPU and starving request/health threads — the machine crash-looped ("site stuck").
  # 4 cores give the background DuckDB scans room while the worker keeps serving.
  size = 'shared-cpu-4x'
  # 4gb: the master data outgrew 2gb as the warehouse ballooned; DuckDB queries need headroom.
  memory = '4gb'

<!doctype html>
<html lang="en">
<head>
<script src="spine/session-guard.js"></script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Hoodie Suite · Hub</title>
<link rel="icon" href="favicon.ico"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root{
    --paper:#F1F3F5; --card:#FFFFFF; --ink:#2B3138; --ink-2:#4A535C; --mut:#7A828B;
    --slate:#4E79A7; --slate-ink:#3D6089; --line:#DDE2E6; --line-2:#E8EBEE; --rail:#E9ECEF;
    --good:#3F8F6E; --good-bg:#E4F1EA; --warn:#B6822C; --warn-bg:#F4ECD9; --bad:#C0574A; --bad-bg:#F4E2DF;
    --chip:#E8EBEE; --shadow:0 1px 2px rgba(27,30,36,.05),0 10px 22px -16px rgba(27,30,36,.5);
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --disp:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
    --sans:var(--disp);
    --bk-intel:#C2622C; --bk-retail:#2F4A7A; --bk-ops:#2FA24C; --bk-master:#8A5FB0; --bk-comm:#8A3345;
    --bk-collect:#4B9CD3;   /* Carolina blue — Hoodie Collect's section colour */
    --bk-cockpit:#B8860B;   /* gold — Hoodie Cockpit's own section colour, distinct from every other bucket */
    --rail-w:250px;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#12161B; --card:#1A2027; --ink:#E7ECF1; --ink-2:#C4CDD6; --mut:#8A98A5;
    --slate:#6E9BCB; --slate-ink:#8CB2DA; --line:#28313A; --line-2:#20272E; --rail:#161B21;
    --chip:#232C35; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.34);
    --good:#5FB58E; --good-bg:#1A2C25; --warn:#D0A14A; --warn-bg:#2C2618; --bad:#DB7C6E; --bad-bg:#2E1F1D;
    --bk-intel:#D8814A; --bk-retail:#6E90CC; --bk-ops:#4CBE6C; --bk-master:#A986C8; --bk-comm:#CB7185;
    --bk-collect:#6FB3DE;   /* Carolina blue, lifted for the dark palette */
    --bk-cockpit:#D4AF37;   /* gold, lifted for the dark palette */
  }}
  :root[data-theme="dark"]{
    --paper:#12161B; --card:#1A2027; --ink:#E7ECF1; --ink-2:#C4CDD6; --mut:#8A98A5;
    --slate:#6E9BCB; --slate-ink:#8CB2DA; --line:#28313A; --line-2:#20272E; --rail:#161B21;
    --chip:#232C35; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.34);
    --good:#5FB58E; --good-bg:#1A2C25; --warn:#D0A14A; --warn-bg:#2C2618; --bad:#DB7C6E; --bad-bg:#2E1F1D;
    --bk-intel:#D8814A; --bk-retail:#6E90CC; --bk-ops:#4CBE6C; --bk-master:#A986C8; --bk-comm:#CB7185;
    --bk-collect:#6FB3DE;   /* Carolina blue, lifted for the dark palette */
    --bk-cockpit:#D4AF37;   /* gold, lifted for the dark palette */
  }
  :root[data-theme="light"]{
    --paper:#F1F3F5; --card:#FFFFFF; --ink:#2B3138; --ink-2:#4A535C; --mut:#7A828B;
    --slate:#4E79A7; --slate-ink:#3D6089; --line:#DDE2E6; --line-2:#E8EBEE; --rail:#E9ECEF;
    --good:#3F8F6E; --good-bg:#E4F1EA; --warn:#B6822C; --warn-bg:#F4ECD9; --bad:#C0574A; --bad-bg:#F4E2DF;
    --chip:#E8EBEE; --shadow:0 1px 2px rgba(27,30,36,.05),0 10px 22px -16px rgba(27,30,36,.5);
    --bk-master:#8A5FB0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  .mono,code{font-family:var(--mono)}

  /* top bar */
  header{height:52px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);z-index:30}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .brand .dot{width:11px;height:11px;border-radius:3px;background:var(--slate);box-shadow:0 0 0 4px color-mix(in srgb,var(--slate) 18%,transparent)}
  .brand b{font-weight:700;letter-spacing:.02em;font-size:14.5px}
  .brand .sub{color:var(--mut);font-size:12.5px}
  .crumb{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:7px}
  .crumb b{color:var(--ink)}
  .spacer{flex:1}
  .kbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);color:var(--mut);border-radius:8px;padding:6px 11px;font-size:13px}
  .kbtn kbd{font-family:var(--mono);font-size:11px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .pulse{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px}
  .pulse .led{width:7px;height:7px;border-radius:50%}
  .pulse.ok{background:var(--good-bg);color:var(--good)}.pulse.ok .led{background:var(--good)}
  .pulse.warn{background:var(--warn-bg);color:var(--warn)}.pulse.warn .led{background:var(--warn)}
  .pulse.bad{background:var(--bad-bg);color:var(--bad)}.pulse.bad .led{background:var(--bad)}
  .pulse.dim{background:var(--chip);color:var(--mut)}.pulse.dim .led{background:var(--mut)}
  .ext{color:var(--mut);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:none}
  .ext.show{display:inline-block}
  .tgl{border:1px solid var(--line);background:var(--paper);color:var(--mut);border-radius:8px;padding:6px 9px;font-size:12px;font-family:var(--mono)}
  .acctav{width:30px;height:30px;padding:0;flex:0 0 auto;display:none;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.02em;border:1px solid var(--line);background:var(--slate);color:#fff;border-radius:50%;cursor:pointer;transition:transform .12s,box-shadow .12s}
  .acctav:hover{transform:scale(1.06);box-shadow:0 2px 8px rgba(20,28,38,.18)}
  .acctmenu{position:fixed;z-index:9999;min-width:212px;background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:8px;font-family:var(--disp);font-size:13px;color:var(--ink)}
  .acctmenu .who{padding:6px 9px 9px;color:var(--mut);font-size:11.5px;line-height:1.4}
  .acctmenu .who b{color:var(--ink);font-weight:600}
  .acctmenu .so{display:block;width:100%;text-align:left;padding:9px;border:none;background:none;border-radius:8px;cursor:pointer;font:inherit;color:var(--bad);font-weight:600}
  .acctmenu .so:hover{background:var(--chip)}

  /* layout */
  .body{flex:1;display:flex;min-height:0}
  nav.rail{width:var(--rail-w);flex:none;background:var(--rail);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px 20px}
  .rail .grp{margin-bottom:6px}
  .rail .ghead{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--ink-2);cursor:pointer}
  .rail .ghead:hover{background:var(--card)}
  .rail .ghead .bar{width:4px;height:16px;border-radius:2px;background:var(--gc,var(--slate));flex:none}
  .rail .ghead .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mut)}
  .rail .ghead .chev{color:var(--mut);font-size:10px;transition:transform .15s}
  .rail .grp.open .chev{transform:rotate(90deg)}
  .rail .items{display:none;flex-direction:column;gap:1px;padding:2px 0 6px 6px}
  .rail .grp.open .items{display:flex}
  .rail .item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer;border:1px solid transparent}
  .rail .item:hover{background:var(--card)}
  .rail .item.active{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}
  .rail .item .mk{font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff;background:var(--gc,var(--slate));width:24px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;flex:none}
  .rail .item.star .mk{box-shadow:0 0 0 2px color-mix(in srgb,var(--gc) 34%,transparent)}
  .rail .item .st{margin-left:auto;width:7px;height:7px;border-radius:50%;flex:none}
  .st.ok{background:var(--good)}.st.warn{background:var(--warn)}.st.bad{background:var(--bad)}.st.none{background:transparent}
  .rail .drawer{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
  .rail .drawer .dh{font-size:11.5px;color:var(--mut);padding:4px 9px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:7px}
  .rail .drawer.open .items{display:flex}
  /* app-nav mode — an opened app's own tabs/sections drive the rail */
  .rail .navback{display:flex;align-items:center;gap:6px;padding:7px 9px;margin-bottom:4px;font-size:12.5px;color:var(--mut);cursor:pointer;border-radius:8px}
  .rail .navback:hover{background:var(--card);color:var(--ink)}
  .rail .apphdr{display:flex;align-items:center;gap:9px;padding:5px 9px 11px;font-size:14px;font-weight:700;border-bottom:1px solid var(--line);margin-bottom:6px}
  .rail .apphdr .mk{font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff;width:24px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;flex:none}
  .rail .secgrp{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:10px 9px 4px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .rail .secgrp .cv{margin-left:auto;font-size:9px;transition:transform .15s}
  .rail .secgrp.collapsed .cv{transform:rotate(-90deg)}
  .rail .secitem{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:13px;color:var(--ink-2);cursor:pointer;border:1px solid transparent}
  .rail .secitem:hover{background:var(--card)}
  .rail .secitem.active{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600}
  .rail .secitem .ic{width:18px;text-align:center;flex:none;color:var(--mut);font-size:12px}
  .rail .secload{font-family:var(--mono);font-size:11px;color:var(--mut);padding:10px 9px;letter-spacing:.04em;opacity:.7;animation:secpulse 1.1s ease-in-out infinite}
  @keyframes secpulse{0%,100%{opacity:.4}50%{opacity:.85}}
  @media(prefers-reduced-motion:reduce){.rail .secload{animation:none}}

  /* stage */
  main{flex:1;position:relative;min-width:0;background:var(--paper);overflow:auto}
  iframe#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--card);display:none}
  iframe#frame.show{display:block}
  #home{padding:0;display:block}
  #frameload{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--paper);z-index:5}
  #frameload.show{display:flex}
  #frameload .fm{font-family:var(--mono);font-weight:700;color:#fff;background:var(--slate);width:44px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px}
  #frameload .ft{color:var(--mut);font-size:13px}

  /* home — Hoodie identity: Space Grotesk display, Source Serif body, mono labels, slate accent, card grid */
  .canvas{max-width:1180px;margin:0 auto;padding:20px 24px 56px}
  .hero{margin-bottom:14px}
  .hero .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate);font-weight:600}
  .hero h1{font-family:var(--disp);font-weight:700;font-size:clamp(24px,2.8vw,30px);letter-spacing:-.02em;margin:8px 0 0;line-height:1.05;color:var(--ink)}
  .hero h1 .thin{font-weight:400;color:var(--mut)}
  .hero .sub{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:9px 0 0;max-width:58ch;line-height:1.45}
  .hero .statline{display:flex;align-items:center;gap:13px;margin-top:13px;font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.03em;flex-wrap:wrap}
  .hero .statline b{color:var(--ink);font-weight:600}
  .hero .statline .sep{color:var(--line)}

  .bsec{margin-top:20px}
  .bsec:first-of-type{margin-top:0}
  .bsec .bhead{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .bsec .bhead .glabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--dc);cursor:pointer}
  .bsec .bhead .glabel:hover{text-decoration:underline}
  .bsec .bhead .role{font-family:var(--serif);font-size:13px;color:var(--mut)}
  .bsec .bhead .cnt{font-family:var(--mono);font-size:10.5px;color:var(--mut)}
  .bsec .bhead .stat{margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(244px,1fr));gap:11px}
  .app{display:flex;flex-direction:column;border:1px solid var(--line);border-left:3px solid var(--dc);background:var(--card);padding:13px 15px;cursor:pointer;transition:transform .13s,box-shadow .13s,border-color .13s;min-height:112px;border-radius:3px}
  .app:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .app .top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .app .ic{width:27px;height:27px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--dc);color:#fff;font-family:var(--disp);font-weight:600;font-size:11px;border-radius:3px}
  .app .nm{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--ink);line-height:1.15}
  .app .star{margin-left:auto;color:var(--dc);font-size:12px;flex:none}
  .app .stled{width:7px;height:7px;border-radius:50%;flex:none;margin-left:auto}
  .app.star .star+.stled{margin-left:6px}
  .app .ds{font-family:var(--serif);font-size:12.5px;color:var(--ink-2);line-height:1.4}
  .app .foot{margin-top:auto;padding-top:11px;display:flex;align-items:center;justify-content:space-between}
  .app .cat{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
  .app .open{font-family:var(--mono);font-size:11px;color:var(--dc);font-weight:600;display:flex;align-items:center;gap:5px}
  .app:hover .open .a{transform:translateX(3px)}
  .app .open .a{transition:transform .14s}

  .drawer-panel{margin-top:26px;border-top:1px dashed var(--line);padding-top:14px}
  .drawer-panel .dph{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);cursor:pointer;font-weight:600}
  .drawer-panel .dchev{transition:transform .15s}
  .drawer-panel.open .dchev{transform:rotate(90deg)}
  .drawer-panel .ditems{display:none;flex-wrap:wrap;gap:7px;margin-top:12px}
  .drawer-panel.open .ditems{display:flex}
  .dpill{font-family:var(--disp);font-size:12.5px;font-weight:500;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:6px 11px;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:7px}
  .dpill:hover{border-color:var(--slate);color:var(--ink)}
  .dpill .mk{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--mut)}
  .fresh{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 9px;border-radius:3px}
  .fresh .led{width:7px;height:7px;border-radius:50%}
  .fresh.ok{background:var(--good-bg);color:var(--good)}.fresh.ok .led{background:var(--good)}
  .fresh.warn{background:var(--warn-bg);color:var(--warn)}.fresh.warn .led{background:var(--warn)}
  .fresh.bad{background:var(--bad-bg);color:var(--bad)}.fresh.bad .led{background:var(--bad)}
  .fresh.dim{background:var(--chip);color:var(--mut)}.fresh.dim .led{background:var(--mut)}

  /* bucket hub (level 1) */
  .hubhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .hubhead .bar{width:5px;height:26px;border-radius:3px;background:var(--dc)}
  .hubhead h1{font-size:24px;font-weight:730;letter-spacing:-.015em;margin:0}
  .hubhead .back{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:8px;padding:6px 11px;font-size:13px}
  .hubsub{color:var(--ink-2);margin:0 0 22px;font-size:14.5px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative}
  .tile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--dc) 45%,var(--line))}
  .tile h3{font-size:15px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
  .tile .mk{font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff;background:var(--dc);width:24px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;flex:none}
  .tile p{margin:0;font-size:12.5px;color:var(--mut);line-height:1.5}
  .tile .star-badge{position:absolute;top:13px;right:13px;font-size:11px;color:var(--dc);font-weight:700}
  .tile .tf{margin-top:11px}

  /* command palette */
  .pk-scrim{position:fixed;inset:0;background:rgba(20,26,32,.4);display:none;z-index:50}
  .pk-scrim.show{display:block}
  .pk{position:fixed;left:50%;top:14%;transform:translateX(-50%);width:min(560px,92vw);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);z-index:51;display:none;overflow:hidden}
  .pk.show{display:block}
  .pk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:15px 18px;font-size:16px;background:transparent;color:var(--ink);outline:none}
  .pk .res{max-height:52vh;overflow-y:auto;padding:6px}
  .pk .r{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;cursor:pointer}
  .pk .r.sel,.pk .r:hover{background:var(--chip)}
  .pk .r .mk{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;width:26px;height:20px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;flex:none}
  .pk .r .nm{font-size:14px;font-weight:600}
  .pk .r .bk{margin-left:auto;font-size:11px;color:var(--mut);font-family:var(--mono)}
  .pk .r .ds{font-size:12px;color:var(--mut)}

  @media(max-width:820px){
    .doors{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}
    nav.rail{position:absolute;z-index:20;height:100%;box-shadow:var(--shadow);transform:translateX(-100%);transition:transform .2s}
    body.nav-open nav.rail{transform:none}
  }
  @media(max-width:560px){.tiles{grid-template-columns:1fr}}

  /* ===== console mode (/home): Salesforce-style app launcher + favorites dock ===== */
  .applauncher{display:none;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:8px;cursor:pointer;flex:none}
  .applauncher:hover{border-color:var(--slate);color:var(--slate)}
  body.console .applauncher{display:inline-flex}
  body.console main{padding-bottom:56px}                     /* room for the fav dock */

  /* Claude-style homepage (console landing) — calm, centered, a composer that feeds Hoodie Intelligence */
  .askhome{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:40px 24px 90px;text-align:center}
  .askhome .amark{width:40px;height:40px;border-radius:11px;background:var(--bk-intel);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 20px;font-family:var(--disp);font-weight:700;font-size:16px;box-shadow:0 6px 18px -8px var(--bk-intel)}
  .askhome h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,38px);letter-spacing:-.01em;color:var(--ink);margin:0;line-height:1.1}
  .askhome h1 b{font-weight:600}
  .askhome .asub{font-family:var(--serif);font-size:16px;color:var(--mut);margin:12px 0 30px}
  .composer{display:flex;align-items:flex-end;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 18px;box-shadow:0 2px 4px rgba(27,30,36,.04),0 16px 40px -22px rgba(27,30,36,.5);transition:border-color .14s,box-shadow .14s}

  .askmeta{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--mut)}

  .suggests{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px}
  .sugg{font-family:var(--serif);font-size:14px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer;transition:border-color .12s,color .12s}
  .sugg:hover{border-color:var(--bk-intel);color:var(--ink)}
  .sugg .sp{color:var(--bk-intel);margin-right:6px}

  .lx-scrim{position:fixed;inset:0;background:rgba(20,26,32,.42);display:none;z-index:60}
  .lx-scrim.show{display:block}
  .lx{position:fixed;left:50%;top:56px;transform:translateX(-50%);width:min(1100px,94vw);max-height:82vh;background:var(--paper);
      border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.34);z-index:61;display:none;flex-direction:column;overflow:hidden}
  .lx.show{display:flex}
  .lx-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card)}
  .lx-head .lx-ttl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
  .lx-head .lx-search{flex:1;max-width:420px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;font-size:14px;color:var(--ink);outline:none;font-family:var(--disp)}
  .lx-head .lx-search:focus{border-color:var(--slate)}
  .lx-head .lx-x{margin-left:auto;border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer;line-height:1}
  .lx-body{overflow:auto;padding:18px 20px 24px}
  .lx-body .bsec{margin-top:18px}.lx-body .bsec:first-child{margin-top:0}
  .lx-body .app{min-height:96px}
  .app{position:relative}
  .app .pin{position:absolute;top:9px;right:9px;border:0;background:none;cursor:pointer;font-size:15px;line-height:1;color:var(--line);padding:2px;z-index:2}
  .app .pin:hover{color:var(--dc)}
  .app .pin.on{color:var(--dc)}

  .favdock{position:fixed;left:0;right:0;bottom:0;height:48px;display:none;align-items:center;gap:8px;padding:0 14px;
      background:var(--card);border-top:1px solid var(--line);z-index:40;overflow-x:auto}
  body.console .favdock{display:flex}
  .favdock .fdlabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);flex:none;margin-right:2px}
  .favchip{display:flex;align-items:center;gap:7px;flex:none;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
  .favchip:hover{border-color:var(--dc);color:var(--ink)}
  .favchip.on{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 8%,var(--card))}
  .favchip .mk{font-family:var(--mono);font-size:9px;font-weight:700;color:#fff;background:var(--dc);width:20px;height:15px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px}

  .favdock .fdempty{font-family:var(--serif);font-size:13px;color:var(--mut)}

<body>

    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="currentColor"><circle cx="5" cy="5" r="1.7"/><circle cx="12" cy="5" r="1.7"/><circle cx="19" cy="5" r="1.7"/><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/><circle cx="5" cy="19" r="1.7"/><circle cx="12" cy="19" r="1.7"/><circle cx="19" cy="19" r="1.7"/></g></svg>

</div>

<!-- console mode: app-launcher overlay + favorites dock -->

<div class="lx" id="lxOverlay" role="dialog" aria-label="App launcher">
  <div class="lx-head">
    <span class="lx-ttl">All surfaces</span>
    <input class="lx-search" id="lxSearch" placeholder="Search surfaces…" autocomplete="off"/>

<script src="spine/spine.js"></script>
<script>
(function(){
  "use strict";
  // console mode (served at /home): AI landing + Salesforce-style app launcher + favorites dock
  var CONSOLE = /\/home\/?$/.test(location.pathname);
  if(CONSOLE) document.body.classList.add("console");

  /* ============================ the registry ============================ */
  /* Parallel to index.html's APPS — this shell owns its own bucket map.
     bucket ∈ intel | retail | ops | master | commercial | utility. star = bucket front door. */
  var BUCKETS = [
    {id:"cockpit",   name:"Hoodie Cockpit",      role:"Where you stand, what needs you, one place to act", color:"var(--bk-cockpit)"},
    {id:"intel",     name:"Hoodie Intelligence", role:"Report & present — QBRs, decks, the signal read", color:"var(--bk-intel)"},
    {id:"retail",    name:"Retail Intelligence", role:"One subject, every instrument — menu · price · shelf · market", color:"var(--bk-retail)"},
    {id:"collect",   name:"Hoodie Collect",     role:"Run & prove every scrape — one workbench", color:"var(--bk-collect)"},
    {id:"ops",       name:"Data Operations",     role:"Run the machine — acquisition & health",     color:"var(--bk-ops)"},
    {id:"master",    name:"Master Data",         role:"Own the master — matching & review",          color:"var(--bk-master)"},
    {id:"commercial",name:"Commercial Apps",     role:"Act on it — the tools you work in",           color:"var(--bk-comm)"}
  ];
  var UTIL = {id:"utility", name:"Utility", role:"Present, learn, admin", color:"var(--mut)"};

  var APPS = [
    // Hoodie Cockpit — the personal ops home base: model routing, the fact store, one place to act
    {id:"cockpit",    bucket:"cockpit", star:1, nav:1, mark:"CP", name:"Hoodie Cockpit", desc:"Where you stand, what needs you, and one place to act.", file:"apps/cockpit.html"},

    // Hoodie Intelligence
    {id:"dashboard",  bucket:"intel", star:1, nav:1, mark:"HI", name:"Hoodie Intelligence", desc:"Market intelligence & QBR briefs.", file:"apps/dashboard.html"},
    {id:"signal-stack",bucket:"intel",         mark:"SS", name:"Signal Stack", desc:"Menu → Basket → Store → Price on one subject, with a cross-signal verdict.", file:"apps/signal-stack.html"},
    {id:"planogram",  bucket:"intel",          mark:"PG", name:"Planogram", desc:"Facings (or a photo) vs the market benchmark — voids & over-space.", file:"apps/planogram-repcount.html"},

    // Retail Intelligence — one subject, every instrument (the multi-tab workspace + its instruments)
    {id:"retail-suite",bucket:"retail", star:1, nav:1, mark:"RX", name:"Retail Intelligence", desc:"One subject across every instrument — search a brand once, menu · price · shelf · market all filter together.", file:"apps/retail-intelligence.html"},
    {id:"retail",     bucket:"retail",         mark:"RI", name:"Retail Intelligence · Store", desc:"Per-store assortment & price across the chains — cross-chain compare.", file:"apps/retail.html"},
    {id:"retail-analytics",bucket:"retail",    mark:"RA", name:"Retail Analytics", desc:"Price/promo, reverse planogram, on-prem recipes by brand & retailer.", file:"apps/retail-analytics.html"},
    {id:"menu-analytics",bucket:"retail",      mark:"MA", name:"Menu Analytics", desc:"Brand-call rates & cocktail trends by region, from menu scrapes.", file:"apps/menu-analytics.html"},
    {id:"price-index",bucket:"retail",         mark:"PI", name:"Price Index", desc:"A bev-alc CPI from shelf prices — dispersion, promo intensity, premiumization.", file:"apps/price-index.html"},
    {id:"market",     bucket:"retail",         mark:"MI", name:"Market Intelligence", desc:"The outlet landscape of a metro vs Google coverage.", file:"apps/market.html"},

    // Data Operations
    // Hoodie Collect — the scrape workbench (deprecates the older per-source tracking surfaces)
    {id:"collect",    bucket:"collect", star:1, nav:1, mark:"HC", name:"Hoodie Collect", desc:"Inspect every source, run it on demand, and watch the console, record counts & percent-collected as it lands.", file:"apps/collect.html", healthSource:1},

    {id:"pipeline-stages",bucket:"ops", mark:"PS", name:"Pipeline Stages", desc:"Where the data is, how much is waiting, and whether the number can be trusted — measured, never modelled.", file:"apps/pipeline-stages.html"},
    {id:"data-console",bucket:"ops",  star:1,  mark:"DC", name:"Data Console", desc:"Every source, account & master dim with real counts, freshness & health — live from the warehouse.", file:"apps/data-console.html", healthSource:1},
    {id:"sql-workbench",bucket:"ops", star:1,  mark:"SQL",name:"Hoodie SQL", desc:"Read-only SQL straight at the warehouse Parquet — every table binds by name, no setup. For checking the data yourself instead of taking a screen's word for it.", file:"apps/sql-workbench.html"},
    {id:"connectors", bucket:"ops",            mark:"PU", name:"Pulls", desc:"Every source that feeds the master — running, last-run, on/off, pull now.", file:"apps/connectors.html"},
    {id:"sources",    bucket:"ops",            mark:"SR", name:"Sources", desc:"Discover & add new sources — a URL becomes data + a reusable recipe.", file:"apps/sources.html"},
    {id:"chains",     bucket:"ops",            mark:"CH", name:"Bev-Alc Chains", desc:"Top retail & on-premise chains scored for reachability & method.", file:"apps/chains.html"},
    {id:"estate3d",   bucket:"ops",            mark:"3D", name:"Estate", desc:"The data estate as a 3D object — spin, fly, focus a node.", file:"apps/estate-3d.html"},
    {id:"csv",        bucket:"ops",            mark:"CV", name:"CSV Viewer", desc:"Excel-style grid for any CSV — sort, filter, freeze; watch a file grow live.", file:"apps/csv-viewer.html"},
    {id:"scrape-tracker",bucket:"ops",          mark:"RT", name:"Scrape Run Tracker", desc:"Live progress for long-running scrape jobs — throughput, ETA to completion, and a live look at the actual landed rows.", file:"apps/scrape-run-tracker.html"},

    // Master Data
    {id:"mdm",        bucket:"master", star:1, nav:1, mark:"HM", name:"Hoodie MDM", desc:"The master console — sources, catalog, outlets, registrations, dictionary.", file:"apps/mdm.html"},
    {id:"match-review",bucket:"master", star:1, mark:"MR", name:"Match Review", desc:"The one place — automatched items and the human-in-the-loop queue for unknown matches.", file:"apps/match-review.html", reviewSource:1},
    {id:"match-trainer",bucket:"master",     mark:"MT", name:"Match Trainer", desc:"Teach the matcher one pair at a time \u2014 it shows its reasoning, groups your answers by cause, and turns a run of consistent calls into a rule.", file:"apps/match-trainer.html"},
    {id:"workbench",  bucket:"master",         mark:"MW", name:"Matching Workbench", desc:"The deep multi-enterprise matching bench (merge groups, image matches, stewardship).", file:"apps/master-workbench.html"},
    {id:"upc",        bucket:"master",         mark:"UP", name:"UPC Check", desc:"Validate & classify UPC/EAN codes and check the prefix against the brand owner.", file:"apps/upc-check.html"},

    // Commercial
    {id:"crm",        bucket:"commercial", star:1, mark:"HR", name:"Hoodie Relations", desc:"Industry-associations CRM.", file:"apps/crm.html"},
    {id:"order-hub",  bucket:"commercial",     mark:"OH", name:"Order Hub", desc:"Inbound supplier menus → one order page → refill each file & stage to send.", file:"apps/order-hub.html"},
    {id:"locator",    bucket:"commercial",     mark:"PL", name:"Product Locator", desc:"Every account carrying a brand near a location — bars, restaurants, stores.", file:"apps/product-locator.html"},
    {id:"territory",  bucket:"commercial",     mark:"TB", name:"Territory Builder", desc:"Named account groups — powers target-vs-competition comparisons.", file:"apps/territory.html"},
    {id:"breakeven",  bucket:"commercial",     mark:"BE", name:"Deal Break-Even", desc:"Enter a deal — get break-even, margin & profit.", file:"apps/breakeven.html"},
    {id:"overlay",    bucket:"commercial",     mark:"OV", name:"Overlay Your Data", desc:"Drop a CSV — Claude reads it and surfaces what's worth pulling.", file:"apps/overlay.html"},

    // Utility drawer
    {id:"presenter",  bucket:"utility", mark:"PR", name:"Presenter", desc:"Speaker's workbench · run a demo.", file:"apps/presenter.html"},
    {id:"training",   bucket:"utility", mark:"BN", name:"The Bench", desc:"Training — tasting, catman, perceptual & sales.", file:"apps/training-suite.html"},
    {id:"prism",      bucket:"utility", mark:"PM", name:"Prism", desc:"Mobile — every cut of your book + the pulse feed.", file:"apps/prism.html"},
    {id:"roadmap",    bucket:"utility", mark:"RM", name:"Product Roadmap", desc:"What's shipping & when.", file:"apps/roadmap.html"},
    {id:"kb",         bucket:"utility", mark:"PA", name:"Principles & Architecture", desc:"The thinking behind the platform.", file:"apps/principles-hub.html"},
    {id:"device-preview",bucket:"utility",mark:"DP",name:"Device Preview", desc:"Render any app in phone/tablet frames.", file:"apps/device-preview.html"},
    {id:"admin",      bucket:"utility", mark:"AD", name:"Admin Console", desc:"Usage · app registry & flags · access · data-ops.", file:"apps/admin.html"},
    {id:"cockpit",    bucket:"utility", mark:"CP", name:"Hoodie Cockpit", desc:"Route work to the right model, run role crews, track tickets & epics end to end.", file:"apps/cockpit.html"},
    {id:"relay",      bucket:"utility", mark:"RL", name:"Relay", desc:"Product-dev control plane — a Slack ask becomes an initiative that accretes requirements through staged gates.", file:"apps/dev-workflow.html"}
  ];
  var byId = {}; APPS.forEach(function(a){ byId[a.id]=a; });
  function bucketDef(id){ return BUCKETS.concat([UTIL]).find(function(b){return b.id===id;}); }
  function appsIn(bid){ return APPS.filter(function(a){return a.bucket===bid;}); }
  function bcolor(bid){ var b=bucketDef(bid); return b?b.color:"var(--slate)"; }

  /* ============================ freshness (live, never mocked) ============================ */
  var STATE = { live:false, health:null, review:null };
  function fetchMonitor(){
    return fetch("/api/monitor").then(function(r){return r.ok?r.json():null;}).then(function(m){
      if(m && m.live!==false){ STATE.live=true; STATE.health=m.health||rollup(m.sources); }
      else STATE.live=false;
    }).catch(function(){ STATE.live=false; });
  }
  function rollup(sources){
    var h={ok:0,degraded:0,error:0,stale:0,unknown:0};
    (sources||[]).forEach(function(s){ if(s.status && h[s.status]!=null) h[s.status]++; });
    return h;
  }
  function fetchReview(){
    // the true "to review" depth = the analyst funnel stage (single-source, pending corroboration),
    // matching Match Review's own funnel — not the capped queue-page length.
    return fetch("/api/master/workbench/summary").then(function(r){return r.ok?r.json():null;}).then(function(d){
      if(d && d.stages && typeof d.stages.analyst==="number") STATE.review = d.stages.analyst;
    }).catch(function(){});
  }
  function opsVerdict(){
    if(!STATE.live||!STATE.health) return null;
    var h=STATE.health, total=(h.ok||0)+(h.stale||0)+(h.error||0)+(h.degraded||0);
    if(total===0) return null;                                   // health not populated yet — no false green
    if((h.error||0)>0) return {cls:"bad",  txt:(h.error)+" failed"};
    if((h.stale||0)>0||(h.degraded||0)>0) return {cls:"warn", txt:((h.stale||0)+(h.degraded||0))+" need attention"};
    return {cls:"ok", txt:(h.ok||0)+" sources fresh"};
  }
  function globalPulse(){
    var p=document.getElementById("pulse");
    if(!STATE.live){ p.className="pulse dim"; p.innerHTML='<span class="led"></span>warehouse offline'; return; }
    var v=opsVerdict();
    if(!v){ p.className="pulse dim"; p.innerHTML='<span class="led"></span>reading health…'; return; }
    p.className="pulse "+v.cls;
    p.innerHTML='<span class="led"></span>'+(v.cls==="ok"?"ALL FRESH · ":"")+v.txt;
  }

  /* ============================ spine host ============================ */
  var HIER = {id:"root",level:"root",name:"All Portfolios",children:[]};
  var spine = HoodieSpine.host({hierarchy:HIER});
  var okJson=function(r){return r.ok?r.json():Promise.reject();};
  fetch("/api/hierarchy").then(okJson)
    .catch(function(){return fetch("spine/hierarchy.sample.json").then(okJson);})
    .then(function(h){ if(h){HIER=h;spine.setHierarchy(h);} }).catch(function(){});
  spine.on("nav", function(p){ if(p&&p.app&&byId[p.app]){ if(p.scope)spine.setContext({scope:p.scope}); location.hash="#"+p.app; } });
  spine.on("crumb", function(t){ var c=document.getElementById("appcrumbx"); if(c) c.textContent = t?(" › "+t):""; });

  /* An opened app can PUBLISH its own tabs/sections into the shared rail (postMessage) — so nested
     tabs (Hoodie Intelligence, MDM) are reachable from the shell. Apps opt in; nothing changes here for
     apps that don't. Contract mirrors the production launcher: {__hoodie:'nav'|'section', ...}. */
  var navCache={};                                            // appId -> {sections, active, collapsed} — instant on return
  window.addEventListener("message", function(ev){
    var d=ev.data; if(!d || (d.__hoodie!=="nav" && d.__hoodie!=="section")) return;
    var curId=(location.hash||"").replace("#","");
    if(!byId[curId]) return;                                  // only while an app is open
    if(d.__hoodie==="nav"){
      var collapsed={}; (d.collapsedGroups||[]).forEach(function(g){ collapsed[g]=true; });   // deep groups start nested
      navCache[curId]={sections:d.sections||[], active:d.active, collapsed:collapsed};
      appNav={app:curId, sections:d.sections||[], active:d.active, collapsed:Object.assign({},collapsed)};
      renderRail();
    }else if(d.__hoodie==="section" && appNav){                // app switched section internally → follow it
      appNav.active=d.id; if(navCache[curId]) navCache[curId].active=d.id;
      var ag=""; appNav.sections.forEach(function(s){ if(s.id===d.id) ag=s.group||""; });
      if(ag){ appNav.collapsed[ag]=false; }                    // expand the group holding the now-active view
      updateSectionActive(d.id);                               // cheap: just move the highlight, no full rebuild
    }
  });
  function updateSectionActive(id){
    var items=document.querySelectorAll(".rail .secitem");
    if(!items.length){ renderRail(); return; }
    items.forEach(function(x){ x.classList.toggle("active", x.dataset.sec===id); });
  }

  /* ============================ rail ============================ */
  // appNav = the opened app's own tabs/sections, published over postMessage. While set,
  // the rail shows that nav (so nested tabs like Hoodie Intelligence's or MDM's are reachable).
  var appNav = null;
  function renderRail(){
    var rail=document.getElementById("rail"); rail.innerHTML="";
    if(appNav){ renderAppNavRail(rail); return; }             // app drives the rail (sections, or a loading shell)
    BUCKETS.forEach(function(b){
      rail.appendChild(railGroup(b, false));
    });
    var d=railGroup(UTIL, true); d.classList.add("drawer"); rail.appendChild(d);
  }
  function renderAppNavRail(rail){
    var a = byId[appNav.app] || {}, col = bcolor(a.bucket);
    var back=document.createElement("div"); back.className="navback"; back.innerHTML="‹ All surfaces";
    back.onclick=function(){ location.hash=""; };
    rail.appendChild(back);
    var hdr=document.createElement("div"); hdr.className="apphdr";
    hdr.innerHTML='<span class="mk" style="background:'+col+'">'+(a.mark||"")+'</span>'+(a.name||"App");
    rail.appendChild(hdr);
    if(!appNav.sections.length){                              // loading shell — tabs not published yet
      var ld=document.createElement("div"); ld.className="secload"; ld.textContent="loading tabs…";
      rail.appendChild(ld); return;
    }
    var groups={}, order=[];
    appNav.sections.forEach(function(s){ var g=s.group||""; if(!(g in groups)){groups[g]=[];order.push(g);} groups[g].push(s); });
    var activeGroup=""; appNav.sections.forEach(function(s){ if(s.id===appNav.active) activeGroup=s.group||""; });
    order.forEach(function(g){
      if(g){
        var collapsed = !!appNav.collapsed[g] && g!==activeGroup;
        var gh=document.createElement("div"); gh.className="secgrp"+(collapsed?" collapsed":""); gh.innerHTML=g+'<span class="cv">▾</span>';
        gh.onclick=function(){ appNav.collapsed[g]=!appNav.collapsed[g]; renderRail(); };
        rail.appendChild(gh);
        if(collapsed) return;
      }
      groups[g].forEach(function(s){
        var el=document.createElement("div"); el.className="secitem"+(s.id===appNav.active?" active":""); el.dataset.sec=s.id; el.title=s.desc||s.label||"";
        el.innerHTML='<span class="ic">'+(s.icon||s.mark||"•")+'</span><span class="nm">'+(s.label||s.id)+'</span>';
        el.onclick=function(){ selectSection(s.id); };
        rail.appendChild(el);
      });
    });
  }
  function selectSection(id){
    appNav.active=id;
    try{ frame.contentWindow.postMessage({__hoodie:"section",id:id},"*"); }catch(e){}
    document.querySelectorAll(".rail .secitem").forEach(function(x){ x.classList.toggle("active", x.dataset.sec===id); });
  }
  function railGroup(b, isDrawer){
    var open = openGroups[b.id] || false;
    var g=document.createElement("div"); g.className="grp"+(open?" open":""); g.style.setProperty("--gc", b.color);
    var head=document.createElement("div"); head.className= isDrawer?"dh":"ghead";
    if(isDrawer){
      head.innerHTML='<span class="chev">▸</span> '+b.name.toUpperCase()+' drawer';
    }else{
      head.innerHTML='<span class="bar"></span><span>'+b.name+'</span><span class="cnt">'+appsIn(b.id).length+'</span><span class="chev">▸</span>';
    }
    head.onclick=function(){ openGroups[b.id]=!open; renderRail(); };
    g.appendChild(head);
    var items=document.createElement("div"); items.className="items";
    appsIn(b.id).forEach(function(a){
      var el=document.createElement("div"); el.className="item"+(a.star?" star":""); el.dataset.id=a.id; el.style.setProperty("--gc", b.color);
      el.innerHTML='<span class="mk">'+a.mark+'</span><span>'+a.name+'</span><span class="st '+dotFor(a)+'"></span>';
      el.onclick=function(){ location.hash="#"+a.id; };
      items.appendChild(el);
    });
    g.appendChild(items);
    return g;
  }
  function dotFor(a){
    if(a.healthSource){ var v=opsVerdict(); return v?v.cls==="warn"?"warn":v.cls==="bad"?"bad":"ok":"none"; }
    if(a.reviewSource){ return (STATE.review>0)?"warn":(STATE.review===0?"ok":"none"); }
    return "none";
  }
  var openGroups={};

  /* ============================ home (level 0) — hero + grouped card grid ============================ */
  function cardHTML(a,b,pins){
    var dot = dotFor(a);
    return '<div class="app'+(a.star&&!pins?" star":"")+'" data-id="'+a.id+'" style="--dc:'+b.color+'">'+
      (pins?'<button class="pin'+(isFav(a.id)?" on":"")+'" data-fav="'+a.id+'" title="'+(isFav(a.id)?"Unpin from favorites":"Pin to favorites")+'">'+(isFav(a.id)?"★":"☆")+'</button>':'')+
      '<div class="top"><span class="ic">'+a.mark+'</span><span class="nm">'+a.name+'</span>'+
        (!pins&&a.star?'<span class="star">★</span>':'')+
        (!pins&&dot!=="none"?'<span class="stled" style="background:var(--'+(dot==="ok"?"good":dot==="warn"?"warn":"bad")+')"></span>':'')+
      '</div>'+
      '<div class="ds">'+a.desc+'</div>'+
      '<div class="foot"><span class="cat">'+b.name+'</span><span class="open">Open <span class="a">→</span></span></div>'+
    '</div>';
  }
  function sectionsHTML(pins){
    return BUCKETS.map(function(b){
      var cards = appsIn(b.id).map(function(a){ return cardHTML(a,b,pins); }).join("");
      return '<div class="bsec" style="--dc:'+b.color+'">'+
        '<div class="bhead"><span class="glabel" data-bucket="'+b.id+'" title="Focus this bucket">'+b.name+'</span>'+
          '<span class="role">'+b.role+'</span><span class="cnt">'+appsIn(b.id).length+'</span>'+
          '<span class="stat">'+bucketStat(b.id)+'</span></div>'+
        '<div class="grid">'+cards+'</div>'+
      '</div>';
    }).join("");
  }
  function drawerHTML(){
    var util = appsIn("utility");
    return '<div class="drawer-panel'+(openGroups.utility?" open":"")+'" id="homeDrawer">'+
      '<div class="dph" id="homeDrawerH"><span class="dchev">▸</span> Utility · present, learn, admin &nbsp;·&nbsp; '+util.length+'</div>'+
      '<div class="ditems">'+util.map(function(a){
        return '<span class="dpill" data-id="'+a.id+'"><span class="mk">'+a.mark+'</span>'+a.name+'</span>';
      }).join("")+
      '<a class="dpill dlink" href="/classic" title="The previous flat-grid launcher"><span class="mk">◱</span>Classic launcher ↗</a>'+
      '</div></div>';
  }
  function wireGrid(el, inLauncher){
    el.querySelectorAll(".app,.dpill:not(.dlink)").forEach(function(r){
      r.onclick=function(ev){ if(ev.target.closest(".pin")) return; location.hash="#"+r.dataset.id; if(inLauncher) closeLauncher(); };
    });
    el.querySelectorAll(".glabel").forEach(function(h){ h.onclick=function(){ location.hash="#b/"+h.dataset.bucket; if(inLauncher) closeLauncher(); }; });
    el.querySelectorAll(".pin").forEach(function(p){ p.onclick=function(ev){ ev.stopPropagation(); toggleFav(p.dataset.fav); p.classList.toggle("on"); p.textContent=isFav(p.dataset.fav)?"★":"☆"; }; });
    var dh=el.querySelector("#homeDrawerH");
    if(dh) dh.onclick=function(){ openGroups.utility=!openGroups.utility; el.querySelector("#homeDrawer").classList.toggle("open"); };
  }
  function renderHome(){
    var el=document.getElementById("home");
    el.innerHTML =
      '<div class="canvas">'+
        '<div class="hero">'+
          '<div class="eyebrow">Hoodie · Unifyd</div>'+
          '<h1>The suite, <span class="thin">by how you work.</span></h1>'+
          '<p class="sub">Each area is a way into the surfaces inside; scope and date set once above carry into every one.</p>'+
          '<div class="statline">'+heroStat()+'</div>'+
        '</div>'+
        sectionsHTML(false)+drawerHTML()+
      '</div>';
    wireGrid(el, false);
  }

  /* ============================ favorites + app launcher (console mode) ============================ */
  var FAV_KEY="hoodie.hub.favs", DEFAULT_FAVS=["dashboard","retail-suite","data-console","match-review","crm"];
  function loadFavs(){ try{ var v=JSON.parse(localStorage.getItem(FAV_KEY)); return Array.isArray(v)?v:DEFAULT_FAVS.slice(); }catch(e){ return DEFAULT_FAVS.slice(); } }
  var FAVS=loadFavs();
  function saveFavs(){ try{ localStorage.setItem(FAV_KEY, JSON.stringify(FAVS)); }catch(e){} }
  function isFav(id){ return FAVS.indexOf(id)>=0; }
  function toggleFav(id){ var i=FAVS.indexOf(id); if(i>=0)FAVS.splice(i,1); else FAVS.push(id); saveFavs(); renderDock(); }
  function renderDock(){
    var d=document.getElementById("favdock"); if(!d) return;
    var favs=FAVS.map(function(id){return byId[id];}).filter(Boolean);
    var cur=(location.hash||"").replace("#","");
    var html='<span class="fdlabel">Pinned</span>';
    if(!favs.length){ html+='<span class="fdempty">No favorites yet — open the app launcher and pin a few.</span>'; }
    else html+=favs.map(function(a){ var col=bcolor(a.bucket);
      return '<span class="favchip'+(a.id===cur?" on":"")+'" data-id="'+a.id+'" style="--dc:'+col+'" title="'+a.name+'"><span class="mk">'+a.mark+'</span>'+a.name+'</span>';
    }).join("");
    html+='<button class="fdmore" id="fdMore" title="App launcher">▦ all surfaces</button>';
    d.innerHTML=html;
    d.querySelectorAll(".favchip").forEach(function(c){ c.onclick=function(){ location.hash="#"+c.dataset.id; }; });
    var m=document.getElementById("fdMore"); if(m) m.onclick=openLauncher;
  }
  function openLauncher(){
    var body=document.getElementById("lxBody");
    body.innerHTML=sectionsHTML(true)+drawerHTML();
    wireGrid(body, true);
    document.getElementById("lxOverlay").classList.add("show");
    document.getElementById("lxScrim").classList.add("show");
    var s=document.getElementById("lxSearch"); if(s){ s.value=""; setTimeout(function(){s.focus();},30); }
  }
  function closeLauncher(){ document.getElementById("lxOverlay").classList.remove("show"); document.getElementById("lxScrim").classList.remove("show"); }
  function filterLauncher(q){
    q=(q||"").toLowerCase().trim();
    document.querySelectorAll("#lxBody .bsec").forEach(function(sec){
      var any=false;
      sec.querySelectorAll(".app").forEach(function(c){
        var a=byId[c.dataset.id]; var hit=!q||((a.name+" "+a.desc).toLowerCase().indexOf(q)>=0);
        c.style.display=hit?"":"none"; if(hit)any=true;
      });
      sec.style.display=any?"":"none";
    });
  }

  /* ============================ Claude-style homepage (console landing) → feeds Hoodie Intelligence ============================ */
  var pendingAsk=null;
  var SUGGESTS=[
    "Where is Tito’s gaining distribution?",
    "Which chains am I under-shelved in?",
    "RTD vs Tequila — who’s accelerating?",
    "Who’s winning in Florida this quarter?"
  ];
  function greeting(){ var h=new Date().getHours(); return h<12?"Good morning":(h<18?"Good afternoon":"Good evening"); }
  function renderConsoleHome(){
    var el=document.getElementById("home");
    el.innerHTML =
      '<div class="askhome">'+
        '<div class="amark">HI</div>'+
        '<h1>'+greeting()+'. <b>What do you want to know?</b></h1>'+
        '<p class="asub">Ask Hoodie Intelligence about your book — a brand, a chain, a state, a trend.</p>'+
        '<div class="composer">'+
          '<textarea id="askInput" rows="1" placeholder="Ask about your book…" autocomplete="off"></textarea>'+
          '<button class="ask-send" id="askSend" title="Ask Hoodie Intelligence" disabled>↑</button>'+
        '</div>'+
        '<div class="askmeta">'+(STATE.live?'<span class="led"></span>book synced · answers grounded in your warehouse':'Hoodie Intelligence · answers grounded in your warehouse')+'</div>'+
        '<div class="suggests">'+SUGGESTS.map(function(s){ return '<button class="sugg" data-q="'+s.replace(/"/g,"&quot;")+'"><span class="sp">✦</span>'+s+'</button>'; }).join("")+'</div>'+
      '</div>';
    var ta=el.querySelector("#askInput"), send=el.querySelector("#askSend");
    function sync(){ send.disabled=!ta.value.trim(); ta.style.height="auto"; ta.style.height=Math.min(ta.scrollHeight,160)+"px"; }
    ta.addEventListener("input", sync);
    ta.addEventListener("keydown", function(e){ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submitAsk(ta.value); } });
    send.onclick=function(){ submitAsk(ta.value); };
    el.querySelectorAll(".sugg").forEach(function(b){ b.onclick=function(){ submitAsk(b.dataset.q); }; });
    setTimeout(function(){ try{ ta.focus(); }catch(e){} }, 50);
  }
  function submitAsk(q){ q=(q||"").trim(); if(!q) return; pendingAsk=q;
    if((location.hash||"")==="#dashboard"){ feedHI(); } else { location.hash="#dashboard"; }   // route() loads HI, then feeds it
  }
  function feedHI(){
    if(!pendingAsk) return;
    var q=pendingAsk, tries=0;
    (function attempt(){
      tries++;
      try{ var w=frame.contentWindow; if(w && typeof w.hiRun==="function"){ w.hiRun(q); pendingAsk=null; return; } }catch(e){}
      if(tries<50) setTimeout(attempt, 150);   // wait for the heavy HI app to define hiRun
    })();
  }
  function heroStat(){
    var nApps = APPS.filter(function(a){return a.bucket!=="utility";}).length;
    var live = STATE.live ? '<span class="chip"><span class="led" style="width:6px;height:6px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px"></span>warehouse live</span>'
                          : '<span style="color:var(--mut)">warehouse offline</span>';
    var v=STATE.live?opsVerdict():null;
    var fr=v?('<span class="sep">·</span><span class="fresh '+v.cls+'"><span class="led"></span>'+v.txt+'</span>'):"";
    return live+'<span class="sep">·</span><b>'+nApps+'</b> surfaces<span class="sep">·</span><b>'+BUCKETS.length+'</b> areas'+fr;
  }
  function bucketStat(bid){
    if(bid==="ops"){ var v=opsVerdict(); return v?'<span class="fresh '+v.cls+'"><span class="led"></span>'+v.txt+'</span>':'<span class="fresh dim"><span class="led"></span>offline</span>'; }
    if(bid==="master"){ if(STATE.review>0) return '<span class="fresh warn"><span class="led"></span>'+nfmtK(STATE.review)+' in review</span>';
      if(STATE.review===0) return '<span class="fresh ok"><span class="led"></span>queue clear</span>';
      return ''; }
    if(bid==="intel"){ if(STATE.live&&STATE.health) return '<span class="fresh ok"><span class="led"></span>'+(STATE.health.ok||0)+' fresh</span>';
      return ''; }
    return '';
  }
  function nfmtK(n){ n=Number(n)||0; if(n>=1e6) return (n/1e6).toFixed(1)+"M"; return n>=1000?(Math.round(n/1000)+"k"):String(n); }

  /* ============================ bucket hub (level 1) ============================ */
  function renderHub(bid){
    var b=bucketDef(bid); if(!b){ location.hash=""; return; }
    var el=document.getElementById("home");
    var tiles = appsIn(bid).map(function(a){
      return '<div class="tile" data-id="'+a.id+'" style="--dc:'+b.color+'">'+
        (a.star?'<span class="star-badge">★</span>':'')+
        '<h3><span class="mk">'+a.mark+'</span>'+a.name+'</h3>'+
        '<p>'+a.desc+'</p>'+
        '<div class="tf">'+tileBadge(a)+'</div>'+
      '</div>';
    }).join("");
    el.innerHTML =
      '<div class="canvas" style="--dc:'+b.color+'">'+
        '<div class="hubhead"><span class="bar"></span><h1>'+b.name+'</h1>'+
          '<button class="back" id="hubBack">← All buckets</button></div>'+
        '<p class="hubsub">'+b.role+'.</p>'+
        '<div class="tiles">'+tiles+'</div>'+
      '</div>';
    el.querySelector("#hubBack").onclick=function(){ location.hash=""; };
    el.querySelectorAll(".tile").forEach(function(t){ t.onclick=function(){ location.hash="#"+t.dataset.id; }; });
  }
  function tileBadge(a){
    if(a.healthSource){ var v=opsVerdict(); return v?'<span class="fresh '+v.cls+'"><span class="led"></span>'+v.txt+'</span>':""; }
    if(a.reviewSource){ if(STATE.review>0) return '<span class="fresh warn"><span class="led"></span>'+STATE.review+' need you</span>';
      if(STATE.review===0) return '<span class="fresh ok"><span class="led"></span>queue clear</span>'; return ""; }
    return "";
  }

  /* ============================ router ============================ */
  var frame=document.getElementById("frame"), home=document.getElementById("home");
  var ext=document.getElementById("ext"), crumb=document.getElementById("crumb");
  var frameload=document.getElementById("frameload"), flMark=document.getElementById("flMark"), flTxt=document.getElementById("flTxt");
  function setCrumb(html){ crumb.innerHTML = html || ""; }
  function logUsage(id){ try{ fetch("/api/usage/event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({app:id}),keepalive:true}).catch(function(){}); }catch(e){} }

  function route(){
    var h = location.hash || "";
    var isBucket = h.indexOf("#b/")===0;
    var id = isBucket ? "" : h.replace("#","");
    var curApp = byId[id] || null;
    if(appNav && (!curApp || appNav.app!==curApp.id)){ appNav=null; renderRail(); }   // left/switched app → rail back to buckets
    if(CONSOLE) renderDock();                                                          // keep the pinned-dock highlight in sync
    // #b/<bucket> → level-1 hub
    if(isBucket){
      var bid=h.slice(3); frame.classList.remove("show"); frame.removeAttribute("src");
      ext.classList.remove("show"); frameload.classList.remove("show"); home.style.display="block";
      renderHub(bid); var bd=bucketDef(bid);
      setCrumb(bd?('<b>'+bd.name+'</b>'):''); markActive(""); return;
    }
    var app=byId[id];
    if(app){
      logUsage(id); markActive(id);
      var bd=bucketDef(app.bucket);
      setCrumb((bd?('<span>'+bd.name+'</span> › '):'')+'<b>'+app.name+'</b><span id="appcrumbx"></span>');
      // apps that drive their own nav: swap the rail IMMEDIATELY (cached sections, or a "loading" shell)
      // so selecting them feels instant instead of waiting ~700ms for the heavy iframe to publish its nav.
      if(app.nav){
        var c=navCache[id];
        appNav = c ? {app:id, sections:c.sections, active:c.active, collapsed:Object.assign({},c.collapsed)}
                   : {app:id, sections:[], active:null, collapsed:{}, loading:true};
        renderRail();
      }
      if(frame.getAttribute("src")!==app.file){
        flMark.textContent=app.mark||""; flTxt.textContent="Loading "+app.name+"…"; frameload.classList.add("show");
        frame.setAttribute("src", app.file);
        frame.onload=function(){ frameload.classList.remove("show"); try{ spine.pushTo(frame.contentWindow); }catch(e){} if(id==="dashboard" && pendingAsk) feedHI(); };
      } else { try{ spine.pushTo(frame.contentWindow); }catch(e){} if(id==="dashboard" && pendingAsk) feedHI(); }
      frame.classList.add("show"); home.style.display="none";
      ext.href=app.file; ext.classList.add("show");
      if(!appNav && app.bucket && !openGroups[app.bucket]){ openGroups[app.bucket]=true; renderRail(); markActive(id); }
    } else {
      frame.classList.remove("show"); frame.removeAttribute("src"); home.style.display="block";
      ext.classList.remove("show"); frameload.classList.remove("show");
      setCrumb(""); if(CONSOLE) renderConsoleHome(); else renderHome(); markActive("");
    }
    document.body.classList.remove("nav-open");
  }
  function markActive(id){ document.querySelectorAll(".rail .item").forEach(function(x){ x.classList.toggle("active", x.dataset.id===id); }); }

  document.getElementById("brand").onclick=function(){ location.hash=""; };

  /* ============================ command palette ============================ */
  var pk=document.getElementById("pk"), pkScrim=document.getElementById("pkScrim"), pkIn=document.getElementById("pkIn"), pkRes=document.getElementById("pkRes");
  var pkSel=0, pkList=[];
  function openPk(){ pk.classList.add("show"); pkScrim.classList.add("show"); pkIn.value=""; drawPk(""); pkIn.focus(); }
  function closePk(){ pk.classList.remove("show"); pkScrim.classList.remove("show"); }
  function drawPk(q){
    q=(q||"").toLowerCase().trim();
    var buckets = BUCKETS.map(function(b){ return {kind:"bucket", id:b.id, name:b.name, desc:b.role, mark:"▦", color:b.color}; });
    var apps = APPS.map(function(a){ var bd=bucketDef(a.bucket); return {kind:"app", id:a.id, name:a.name, desc:a.desc, mark:a.mark, color:bd?bd.color:"var(--slate)", bk:bd?bd.name:""}; });
    var all = buckets.concat(apps);
    pkList = q ? all.filter(function(r){ return (r.name+" "+r.desc+" "+(r.bk||"")).toLowerCase().indexOf(q)>=0; }) : all;
    pkSel=0;
    pkRes.innerHTML = pkList.map(function(r,i){
      return '<div class="r'+(i===0?" sel":"")+'" data-i="'+i+'" style="--dc:'+r.color+'">'+
        '<span class="mk" style="background:'+r.color+'">'+r.mark+'</span>'+
        '<span class="nm">'+r.name+'</span>'+
        (r.bk?'<span class="bk">'+r.bk+'</span>':(r.kind==="bucket"?'<span class="bk">bucket</span>':''))+
      '</div>';
    }).join("") || '<div class="r"><span class="ds">No matches.</span></div>';
    pkRes.querySelectorAll(".r[data-i]").forEach(function(el){ el.onclick=function(){ pick(+el.dataset.i); }; });
  }
  function pick(i){ var r=pkList[i]; if(!r) return; closePk(); location.hash = r.kind==="bucket" ? "#b/"+r.id : "#"+r.id; }
  pkIn.addEventListener("input", function(){ drawPk(pkIn.value); });
  pkIn.addEventListener("keydown", function(e){
    if(e.key==="ArrowDown"){ e.preventDefault(); pkSel=Math.min(pkSel+1,pkList.length-1); syncSel(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); pkSel=Math.max(pkSel-1,0); syncSel(); }
    else if(e.key==="Enter"){ e.preventDefault(); pick(pkSel); }
    else if(e.key==="Escape"){ closePk(); }
  });
  function syncSel(){ pkRes.querySelectorAll(".r[data-i]").forEach(function(el){ el.classList.toggle("sel", +el.dataset.i===pkSel); }); var s=pkRes.querySelector(".r.sel"); if(s)s.scrollIntoView({block:"nearest"}); }
  document.getElementById("kbtn").onclick=openPk;
  pkScrim.onclick=closePk;
  window.addEventListener("keydown", function(e){
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); pk.classList.contains("show")?closePk():openPk(); }
  });

  /* ============================ theme ============================ */
  document.getElementById("tgl").onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var next=cur==="dark"?"light":(cur==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark"));
    document.documentElement.setAttribute("data-theme",next);
  };

  /* ============ account avatar — suite-level identity + sign out (login gate active) ============ */
  function acctInitials(email){
    var lp=(email||'').split('@')[0], parts=lp.split(/[.\-_+]/).filter(Boolean);
    var s=parts.length>=2 ? (parts[0][0]+parts[1][0]) : lp.slice(0,2);
    return (s||'··').toUpperCase();
  }
  function closeAcct(){ var m=document.getElementById('acctMenu'); if(m) m.remove(); document.removeEventListener('click',acctDoc,true); }
  function acctDoc(e){ var m=document.getElementById('acctMenu'), b=document.getElementById('acctBtn'); if(m && !m.contains(e.target) && e.target!==b) closeAcct(); }
  function openAcct(email){
    if(document.getElementById('acctMenu')){ closeAcct(); return; }
    var b=document.getElementById('acctBtn'), r=b.getBoundingClientRect();
    var m=document.createElement('div'); m.id='acctMenu'; m.className='acctmenu';
    m.style.top=(r.bottom+8)+'px'; m.style.right=Math.max(8,(window.innerWidth-r.right))+'px';
    m.innerHTML='<div class="who">'+(email?('Signed in as<br><b>'+email.replace(/[<>&]/g,'')+'</b>'):'Signed in')+'</div><button class="so" id="acctSo">Sign out</button>';
    document.body.appendChild(m);
    m.querySelector('#acctSo').onclick=function(){ location.href='/auth/logout'; };
    setTimeout(function(){ document.addEventListener('click',acctDoc,true); },0);
  }
  fetch('/auth/me').then(function(r){return r.json();}).then(function(m){
    if(m && m.gated && m.email){
      var b=document.getElementById('acctBtn');
      b.textContent=acctInitials(m.email); b.style.display='inline-flex'; b.title='Signed in as '+m.email;
      b.onclick=function(e){ e.stopPropagation(); openAcct(m.email); };
      document.getElementById('signout').style.display='none';   // the avatar replaces the text link
    }
  }).catch(function(){});

  /* ============================ app launcher + dock wiring (console) ============================ */
  document.getElementById("applauncher").onclick=openLauncher;
  document.getElementById("lxClose").onclick=closeLauncher;
  document.getElementById("lxScrim").onclick=closeLauncher;
  document.getElementById("lxSearch").addEventListener("input", function(){ filterLauncher(this.value); });
  window.addEventListener("keydown", function(e){ if(e.key==="Escape" && document.getElementById("lxOverlay").classList.contains("show")) closeLauncher(); });

  /* ============================ boot ============================ */
  function refreshDynamic(){
    renderRail();
    if(!location.hash){ if(!CONSOLE) renderHome(); } else if(location.hash.indexOf("#b/")===0){ renderHub(location.hash.slice(3)); }
    if(CONSOLE) renderDock();
    globalPulse();
  }
  if(CONSOLE) renderDock();
  renderRail(); route();
  Promise.all([fetchMonitor(), fetchReview()]).then(refreshDynamic);
  window.addEventListener("hashchange", route);
  // keep freshness current without hammering — poll every 90s
  setInterval(function(){ Promise.all([fetchMonitor(), fetchReview()]).then(refreshDynamic); }, 90000);
})();
</script>
</body>
</html>
